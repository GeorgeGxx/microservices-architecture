image: maven:3.10.0-eclipse-temurin-21

options:
  max-time: 45
  size: 2x

definitions:
  services:
    docker:
      memory: 4096
  caches:
    maven: ~/.m2/repository
    npm: ~/.npm
    sonar: ~/.sonar/cache
  steps:
    - step: &unit-tests
        name: '1. Unit tests and coverage'
        caches: [maven, npm, sonar]
        services: [docker]
        script:
          - |
            set -euo pipefail
            SERVICE_NAME="${SERVICE_NAME:-products-service}"
            if [ "$SERVICE_NAME" = "frontend" ]; then
              cd frontend
              npm ci --no-audit
              npm run test:coverage
              npm run build
              if [ -n "${SONAR_TOKEN:-}" ]; then
                : "${SONAR_ORGANIZATION:?Set SONAR_ORGANIZATION to the SonarQube Cloud organization key}"
                SONAR_HOST_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
                npx --yes sonarqube-scanner \
                  -Dsonar.projectKey=msa-frontend \
                  -Dsonar.projectName="Novashop Storefront" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="$SONAR_HOST_URL" \
                  -Dsonar.sources=src \
                  -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx \
                  -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
                  -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"
              else
                echo "SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
              fi
            elif [ "$SERVICE_NAME" = "demand-forecast" ] || [ "$SERVICE_NAME" = "mlops-training" ] || [ "${SERVICE_DIR:-}" = "mlops" ]; then
              echo "Executing Python MLOps Unit Tests with Coverage..."
              OMIT="*/generate_sample_sales.py,*/test_tdd.py,*/patch_spark_jars.py,*/tests/*,*/.venv*/*"
              EXCLUSIONS="mlops/tests/**,mlops/data/**,mlops/*.sh,mlops/.venv*/**,mlops/generate_sample_sales.py,mlops/test_tdd.py,mlops/patch_spark_jars.py"
              COVERAGE_EXCLUSIONS="generate_sample_sales.py,test_tdd.py,patch_spark_jars.py"
              if [ "$SERVICE_NAME" = "demand-forecast" ]; then
                OMIT="$OMIT,*/capture_orders.py,*/train_demand_model.py,*/feature_engineering.py"
                EXCLUSIONS="$EXCLUSIONS,mlops/Dockerfile.training,mlops/Dockerfile.capture,mlops/capture_orders.py,mlops/train_demand_model.py,mlops/feature_engineering.py"
                COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,capture_orders.py,train_demand_model.py,feature_engineering.py"
              elif [ "$SERVICE_NAME" = "mlops-training" ]; then
                OMIT="$OMIT,*/forecast_api.py"
                EXCLUSIONS="$EXCLUSIONS,mlops/Dockerfile.forecast,mlops/forecast_api.py"
                COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,forecast_api.py"
              elif [ "$SERVICE_NAME" = "mlflow" ]; then
                OMIT="$OMIT,*/capture_orders.py,*/train_demand_model.py,*/feature_engineering.py,*/forecast_api.py"
                EXCLUSIONS="$EXCLUSIONS,mlops/Dockerfile.forecast,mlops/Dockerfile.training,mlops/forecast_api.py,mlops/capture_orders.py,mlops/train_demand_model.py,mlops/feature_engineering.py"
                COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,forecast_api.py,capture_orders.py,train_demand_model.py,feature_engineering.py"
              fi
              docker run --rm -v "$PWD:/workspace" -w /workspace -e PYTHONPATH=/workspace/mlops python:3.12-slim bash -c "pip install --no-cache-dir -r mlops/requirements.txt coverage && coverage run --source=mlops --omit=\"$OMIT\" -m unittest discover -s mlops/tests -v && coverage xml -o mlops/coverage.xml"
              if [ -n "${SONAR_TOKEN:-}" ]; then
                : "${SONAR_ORGANIZATION:?Set SONAR_ORGANIZATION to the SonarQube Cloud organization key}"
                SONAR_HOST_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
                npx --yes sonarqube-scanner \
                  -Dsonar.projectKey="msa-${SERVICE_NAME}" \
                  -Dsonar.projectName="MSA ${SERVICE_NAME}" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="$SONAR_HOST_URL" \
                  -Dsonar.sources=mlops \
                  -Dsonar.tests=mlops/tests \
                  -Dsonar.exclusions="$EXCLUSIONS" \
                  -Dsonar.coverage.exclusions="$COVERAGE_EXCLUSIONS" \
                  -Dsonar.python.version=3.12 \
                  -Dsonar.python.coverage.reportPaths=mlops/coverage.xml \
                  -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"
              else
                echo "SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
              fi
            elif [ "$SERVICE_NAME" = "payments-service" ]; then
              docker run --rm -v "$PWD/payments-service:/workspace" -w /workspace golang:1.26-alpine sh -c "apk add --no-cache git && go test -v -coverprofile=coverage.out ./..."
            elif [ "$SERVICE_NAME" = "fulfillment-service" ]; then
              docker run --rm -v "$PWD/fulfillment-service:/workspace" -w /workspace node:24-alpine sh -c "npm ci && npm run test:cov && npm run build"
            elif [ "$SERVICE_NAME" = "analytics-service" ]; then
              docker run --rm -v "$PWD/analytics-service:/workspace" -w /workspace -e PYTHONPATH=/workspace python:3.12-slim bash -c "pip install --no-cache-dir -r requirements.txt pytest pytest-cov pytest-asyncio && pytest --cov=app --cov-report=xml:coverage.xml tests/ -v"
            else
              SERVICE_DIR="${SERVICE_DIR:-$SERVICE_NAME}"
              test -f "$SERVICE_DIR/pom.xml" || { echo "Unknown Spring service: $SERVICE_DIR"; exit 1; }
              cd "$SERVICE_DIR"
              mvn -B -T 1C clean verify jacoco:report -Dspring.profiles.active=test
              if [ -n "${SONAR_TOKEN:-}" ]; then
                : "${SONAR_ORGANIZATION:?Set SONAR_ORGANIZATION to the SonarQube Cloud organization key}"
                SONAR_HOST_URL="${SONAR_HOST_URL:-https://sonarcloud.io}"
                mvn -B -T 1C org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
                  -Dsonar.projectKey="msa-${SERVICE_NAME}" \
                  -Dsonar.projectName="MSA ${SERVICE_NAME}" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="$SONAR_HOST_URL" \
                  -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
                  -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"
              else
                echo "SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
              fi
            fi
    - step: &sast
        name: '2. SAST, secrets and Trivy IaC scan'
        image: python:3.12-slim
        script:
          - apt-get update && apt-get install -y --no-install-recommends curl tar && rm -rf /var/lib/apt/lists/*
          - curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          - gitleaks detect --source . --config devsecops/sast/gitleaks/.gitleaks.toml --no-git
          - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.1/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.1
          - trivy config --config devsecops/compliance/trivy/trivy.yaml --ignorefile devsecops/compliance/trivy/.trivyignore "${SERVICE_DIR:-${SERVICE_NAME:-products-service}}"
    - step: &build-sbom
        name: '3. Build immutable image and CycloneDX SBOM'
        services: [docker]
        script:
          - |
            set -euo pipefail
            SERVICE_NAME="${SERVICE_NAME:-products-service}"
            SERVICE_DIR="${SERVICE_DIR:-$SERVICE_NAME}"
            IMAGE_TAG="${BITBUCKET_COMMIT:0:12}"
            mkdir -p artifacts/images artifacts/sbom
            if [ "$SERVICE_NAME" = "frontend" ] || [ "$SERVICE_NAME" = "payments-service" ] || [ "$SERVICE_NAME" = "fulfillment-service" ] || [ "$SERVICE_NAME" = "analytics-service" ]; then
              docker build --pull -t "local/${SERVICE_NAME}:${IMAGE_TAG}" -f "${SERVICE_NAME}/Dockerfile" "${SERVICE_NAME}"
            elif [ "$SERVICE_NAME" = "demand-forecast" ]; then
              docker build --pull -t "local/${SERVICE_NAME}:${IMAGE_TAG}" -f mlops/Dockerfile.forecast mlops
            elif [ "$SERVICE_NAME" = "mlops-training" ]; then
              docker build --pull -t "local/${SERVICE_NAME}:${IMAGE_TAG}" -f mlops/Dockerfile.training mlops
            elif [ "$SERVICE_NAME" = "mlflow" ]; then
              docker build --pull -t "local/${SERVICE_NAME}:${IMAGE_TAG}" -f mlops/Dockerfile mlops
            else
              test -f "$SERVICE_DIR/Dockerfile" || { echo "Missing Dockerfile: $SERVICE_DIR"; exit 1; }
              docker build --pull -t "local/${SERVICE_NAME}:${IMAGE_TAG}" -f "$SERVICE_DIR/Dockerfile" .
            fi
            docker save "local/${SERVICE_NAME}:${IMAGE_TAG}" -o "artifacts/images/${SERVICE_NAME}.tar"
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.1/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.1
            trivy image --input "artifacts/images/${SERVICE_NAME}.tar" --format cyclonedx --output "artifacts/sbom/${SERVICE_NAME}.cdx.json"
        artifacts:
          - artifacts/images/**
          - artifacts/sbom/**
    - step: &container-scan
        name: '4. Container vulnerability scan'
        image: aquasec/trivy:0.76.1
        services: [docker]
        script:
          - set -euo pipefail
          - test -s "artifacts/images/${SERVICE_NAME:-products-service}.tar"
          - trivy image --input "artifacts/images/${SERVICE_NAME:-products-service}.tar" --config devsecops/compliance/trivy/trivy.yaml --ignorefile devsecops/compliance/trivy/.trivyignore --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
    - step: &policy-gate
        name: '5. Helm, OpenCost and OPA policy gate'
        image: alpine/helm:4.3.1
        script:
          - apk add --no-cache bash curl tar nodejs npm
          - npx --yes wgc@0.133.3 router compose --input cosmo-router/supergraph.yaml --out cosmo-router/execution-config.json
          - mkdir -p helm/charts/cosmo-router/files
          - cp cosmo-router/execution-config.json helm/charts/cosmo-router/files/execution-config.json
          - bash scripts/validate-opencost.sh
          - curl -sSfL https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin conftest
          - helm dependency update helm/microservices-umbrella
          - |
            HELM_SET_KEY="${SERVICE_NAME:-products-service}"
            if [ "$HELM_SET_KEY" = "demand-forecast" ]; then
              HELM_SET_KEY="mlops.forecast"
            elif [ "$HELM_SET_KEY" = "mlops-training" ]; then
              HELM_SET_KEY="mlops.training"
            fi
            helm template microservices ./helm/microservices-umbrella --set "${HELM_SET_KEY}.image.tag=${BITBUCKET_COMMIT:0:12}" > /tmp/rendered.yaml
          - conftest test /tmp/rendered.yaml --policy devsecops/policies/conftest/
        artifacts:
          - helm/charts/cosmo-router/files/**
    - step: &terraform-validate
        name: '6. GCP Terraform format and validation (no backend/apply)'
        image: hashicorp/terraform:1.16.2
        script:
          - set -euo pipefail
          - terraform fmt -check -recursive terraform/
          - cd terraform/environments/gcp
          - terraform init -backend=false -input=false
          - |
            for ws in dev staging prod; do
              terraform workspace select "$ws" 2>/dev/null || terraform workspace new "$ws"
              terraform validate -no-color
            done
          - echo 'Offline validation passed for dev, staging, and prod (including dual-dataplane gke + gke_dp2).'
    - step: &publish-candidate
        name: '7. Publish immutable image to GAR'
        image: google/cloud-sdk:alpine
        oidc: true
        services: [docker]
        script:
          - |
            set -euo pipefail
            : "${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in the deployment environment}"
            : "${GCP_REGION:?Set GCP_REGION in the deployment environment}"
            : "${GAR_REPOSITORY:?Set GAR_REPOSITORY from the matching Terraform workspace}"
            SERVICE_NAME="${SERVICE_NAME:-products-service}"
            IMAGE_TAG="${BITBUCKET_COMMIT:0:12}"
            if [ -n "${BITBUCKET_STEP_OIDC_TOKEN:-}" ] && [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT_EMAIL:-}" ]; then
              printf '%s' "$BITBUCKET_STEP_OIDC_TOKEN" > /tmp/oidc-token.jwt
              gcloud iam workload-identity-pools create-cred-config "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
                --service-account="$GCP_SERVICE_ACCOUNT_EMAIL" \
                --credential-source-file=/tmp/oidc-token.jwt \
                --output-file=/tmp/gcp-cred-config.json
              trap 'rm -f /tmp/oidc-token.jwt /tmp/gcp-cred-config.json' EXIT
              gcloud auth login --cred-file=/tmp/gcp-cred-config.json --project="$GCP_PROJECT_ID"
            else
              : "${GCP_SA_KEY:?Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT_EMAIL (OIDC) or GCP_SA_KEY}"
              printf '%s' "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json
              trap 'rm -f /tmp/gcp-key.json' EXIT
              gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --project="$GCP_PROJECT_ID"
            fi
            gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
            IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${SERVICE_NAME}:${IMAGE_TAG}"
            EXISTING_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)' 2>/dev/null || true)"
            if [[ "$EXISTING_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Immutable image already exists in GAR ($EXISTING_DIGEST); reusing without overwriting."
              printf '%s' "$EXISTING_DIGEST" > "artifacts/images/${SERVICE_NAME}.digest"
            else
              docker load -i "artifacts/images/${SERVICE_NAME}.tar"
              docker tag "local/${SERVICE_NAME}:${IMAGE_TAG}" "$IMAGE"
              docker push "$IMAGE"
              PUSHED_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)' 2>/dev/null || true)"
              printf '%s' "$PUSHED_DIGEST" > "artifacts/images/${SERVICE_NAME}.digest"
            fi
        artifacts:
          - artifacts/images/**
    - step: &deploy-gke
        name: '8. Deploy Helm release to GKE (Single Dataplane in Dev/Staging; Dual Dataplane DP1 + DP2 in Production)'
        image: google/cloud-sdk:alpine
        oidc: true
        script:
          - |
            set -Eeuo pipefail
            : "${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in the deployment environment}"
            : "${GCP_REGION:?Set GCP_REGION in the deployment environment}"
            : "${GKE_CLUSTER_NAME:?Set GKE_CLUSTER_NAME to the Terraform output for this environment}"
            : "${GAR_REPOSITORY:?Set GAR_REPOSITORY from the matching Terraform workspace}"
            : "${GHCR_USERNAME:?Set GHCR_USERNAME as a read-only GHCR package account}"
            : "${GHCR_TOKEN:?Set GHCR_TOKEN as a secured variable with read:packages access}"
            SERVICE_NAME="${SERVICE_NAME:-products-service}"
            IMAGE_TAG="${BITBUCKET_COMMIT:0:12}"
            case "${BITBUCKET_DEPLOYMENT_ENVIRONMENT:?Deployment environment must be configured}" in
              dev|test) NAMESPACE=dev; SPRING_PROFILE=dev ;;
              staging) NAMESPACE=staging; SPRING_PROFILE=staging ;;
              production) NAMESPACE=production; SPRING_PROFILE=prod ;;
              *) echo "Unsupported Bitbucket deployment environment: ${BITBUCKET_DEPLOYMENT_ENVIRONMENT}"; exit 2 ;;
            esac
            if [ -n "${BITBUCKET_STEP_OIDC_TOKEN:-}" ] && [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT_EMAIL:-}" ]; then
              printf '%s' "$BITBUCKET_STEP_OIDC_TOKEN" > /tmp/oidc-token.jwt
              gcloud iam workload-identity-pools create-cred-config "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
                --service-account="$GCP_SERVICE_ACCOUNT_EMAIL" \
                --credential-source-file=/tmp/oidc-token.jwt \
                --output-file=/tmp/gcp-cred-config.json
              trap 'rm -f /tmp/oidc-token.jwt /tmp/gcp-cred-config.json' EXIT
              gcloud auth login --cred-file=/tmp/gcp-cred-config.json --project="$GCP_PROJECT_ID"
            else
              : "${GCP_SA_KEY:?Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT_EMAIL (OIDC) or GCP_SA_KEY}"
              printf '%s' "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json
              trap 'rm -f /tmp/gcp-key.json' EXIT
              gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --project="$GCP_PROJECT_ID"
            fi
            bash scripts/install-helm4.sh v4.3.1
            bash scripts/install-yq.sh v4.44.3
            CHART_VERSION="$(yq '.version' helm/microservices-umbrella/Chart.yaml)"
            CHART_REPOSITORY="$(yq '.metadata.annotations["microservices-architecture.io/helm-oci-repository"] // ""' helm/microservices-umbrella/Chart.yaml)"
            [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$CHART_REPOSITORY" == oci://ghcr.io/*/microservices-umbrella ]]
            printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            HELM_SET_KEY="${SERVICE_NAME}"
            DEPLOYMENT_NAME="${SERVICE_NAME}"
            if [ "$SERVICE_NAME" = "demand-forecast" ]; then
              HELM_SET_KEY="mlops.forecast"
              DEPLOYMENT_NAME="demand-forecast-service"
            elif [ "$SERVICE_NAME" = "mlops-training" ]; then
              HELM_SET_KEY="mlops.training"
              DEPLOYMENT_NAME="demand-sales-capture"
            elif [ "$SERVICE_NAME" = "mlflow" ]; then
              HELM_SET_KEY="mlops.mlflow"
              DEPLOYMENT_NAME="mlflow"
            fi
            IMAGE_DIGEST=""
            if [ -f "artifacts/images/${SERVICE_NAME}.digest" ]; then
              IMAGE_DIGEST="$(cat "artifacts/images/${SERVICE_NAME}.digest")"
            fi
            DIGEST_ARGS=()
            if [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              DIGEST_ARGS=(--set "${HELM_SET_KEY}.image.digest=${IMAGE_DIGEST}")
            fi
            TARGET_CLUSTERS=("$GKE_CLUSTER_NAME")
            if [ "${BITBUCKET_DEPLOYMENT_ENVIRONMENT}" = "production" ]; then
              TARGET_CLUSTERS+=("${GKE_CLUSTER_NAME_DP2:-msa-gcp-dp2-prod-cluster}")
            fi
            for CLUSTER in "${TARGET_CLUSTERS[@]}"; do
              echo "Deploying ${SERVICE_NAME} to GKE cluster ${CLUSTER} (namespace: ${NAMESPACE})..."
              gcloud container clusters get-credentials "$CLUSTER" --region "$GCP_REGION" --project "$GCP_PROJECT_ID"
              kubectl get nodes
              if helm status microservices --namespace "$NAMESPACE" >/dev/null 2>&1; then RELEASE_EXISTS=true; else RELEASE_EXISTS=false; fi
              PREVIOUS_REVISION=""
              if [ "$RELEASE_EXISTS" = true ]; then
                PREVIOUS_REVISION="$(helm history microservices --namespace "$NAMESPACE" --max 1 2>/dev/null | awk 'NR == 2 { print $1 }')"
              fi
              rollback_on_error() {
                result=$?
                if [ "$result" -ne 0 ] && [ "$RELEASE_EXISTS" = true ] && [ -n "$PREVIOUS_REVISION" ]; then
                  helm rollback microservices "$PREVIOUS_REVISION" --namespace "$NAMESPACE" --wait --timeout 5m || true
                fi
                exit "$result"
              }
              trap rollback_on_error ERR
              helm upgrade --install microservices "$CHART_REPOSITORY" \
                --version "$CHART_VERSION" \
                --namespace "$NAMESPACE" --create-namespace --reuse-values \
                --set "${HELM_SET_KEY}.image.repository=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${SERVICE_NAME}" \
                --set "${HELM_SET_KEY}.image.tag=${IMAGE_TAG}" \
                "${DIGEST_ARGS[@]}" \
                --set global.environment="$SPRING_PROFILE" \
                --wait --timeout 8m --atomic
              kubectl rollout status "deployment/${DEPLOYMENT_NAME}" --namespace "$NAMESPACE" --timeout=5m
            done
    - step: &api-contract
        name: '9. API contract smoke tests'
        image: node:22-slim
        script:
          - set -euo pipefail
          - ': "${GKE_INGRESS_URL:?Set GKE_INGRESS_URL in the deployment environment}"'
          - ': "${KEYCLOAK_URL:?Set KEYCLOAK_URL in the deployment environment}"'
          - npm install --global newman
          - newman run devsecops/testing/newman/microservices.postman_collection.json --env-var "BASE_URL=${GKE_INGRESS_URL}" --env-var "keycloak_url=${KEYCLOAK_URL}" --bail
    - step: &frontend-e2e
        name: '10. Storefront synthetic E2E checks'
        image: python:3.12-slim
        script:
          - set -euo pipefail
          - ': "${GKE_INGRESS_URL:?Set GKE_INGRESS_URL in the deployment environment}"'
          - ': "${GKE_FRONTEND_URL:?Set GKE_FRONTEND_URL in the deployment environment}"'
          - python scripts/testing/smoke.py --deployment --base-url "$GKE_INGRESS_URL" --frontend-url "$GKE_FRONTEND_URL"
    - step: &performance
        name: '11. k6 performance and SLO checks'
        image: grafana/k6:1.8.1
        script:
          - set -euo pipefail
          - ': "${GKE_INGRESS_URL:?Set GKE_INGRESS_URL in the deployment environment}"'
          - k6 run -e TARGET_URL="$GKE_INGRESS_URL" devsecops/testing/k6/load-test.js
    - step: &dast
        name: '12. OWASP ZAP DAST baseline'
        image: ghcr.io/zaproxy/zaproxy:stable
        script:
          - set -euo pipefail
          - ': "${GKE_FRONTEND_URL:?Set GKE_FRONTEND_URL in the deployment environment}"'
          - mkdir -p artifacts/zap
          - zap-baseline.py -t "$GKE_FRONTEND_URL" -c devsecops/dast/zap/rules.tsv -r artifacts/zap/report.html -I
        artifacts:
          - artifacts/zap/**
    - step: &runtime-verify
        name: '13. Kubernetes rollout and endpoint verification'
        image: google/cloud-sdk:alpine
        oidc: true
        script:
          - |
            set -euo pipefail
            : "${GKE_CLUSTER_NAME:?Set GKE_CLUSTER_NAME in the deployment environment}"
            : "${GCP_REGION:?Set GCP_REGION in the deployment environment}"
            : "${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in the deployment environment}"
            : "${K8S_NAMESPACE:?Set K8S_NAMESPACE in deployment environment}"
            if [ -n "${BITBUCKET_STEP_OIDC_TOKEN:-}" ] && [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT_EMAIL:-}" ]; then
              printf '%s' "$BITBUCKET_STEP_OIDC_TOKEN" > /tmp/oidc-token.jwt
              gcloud iam workload-identity-pools create-cred-config "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
                --service-account="$GCP_SERVICE_ACCOUNT_EMAIL" \
                --credential-source-file=/tmp/oidc-token.jwt \
                --output-file=/tmp/gcp-cred-config.json
              trap 'rm -f /tmp/oidc-token.jwt /tmp/gcp-cred-config.json' EXIT
              gcloud auth login --cred-file=/tmp/gcp-cred-config.json --project="$GCP_PROJECT_ID"
            else
              : "${GCP_SA_KEY:?Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT_EMAIL (OIDC) or GCP_SA_KEY}"
              printf '%s' "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json
              trap 'rm -f /tmp/gcp-key.json' EXIT
              gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --project="$GCP_PROJECT_ID"
            fi
            TARGET_CLUSTERS=("$GKE_CLUSTER_NAME")
            if [ "$K8S_NAMESPACE" = "production" ]; then
              TARGET_CLUSTERS+=("${GKE_CLUSTER_NAME_DP2:-msa-gcp-dp2-prod-cluster}")
            fi
            for CLUSTER in "${TARGET_CLUSTERS[@]}"; do
              gcloud container clusters get-credentials "$CLUSTER" --region "$GCP_REGION" --project "$GCP_PROJECT_ID"
              kubectl get deployments,pods,services --namespace "$K8S_NAMESPACE"
            done
            curl --fail --silent --show-error "$GKE_FRONTEND_URL/healthz"
    - step: &release-evidence
        name: '14. Release evidence and immutable artifact verification'
        image: alpine:3.21
        script:
          - set -euo pipefail
          - test -s "artifacts/sbom/${SERVICE_NAME:-products-service}.cdx.json"
          - sha256sum "artifacts/sbom/${SERVICE_NAME:-products-service}.cdx.json"
          - echo "Verified commit ${BITBUCKET_COMMIT} for ${SERVICE_NAME:-products-service}."

pipelines:
  branches:
    develop:
      - stage: { name: '1. Unit tests', steps: [{ step: *unit-tests }] }
      - stage: { name: '2. SAST and secrets', steps: [{ step: *sast }] }
      - stage: { name: '3. Build and SBOM', steps: [{ step: *build-sbom }] }
      - stage: { name: '4. Image vulnerability scan', steps: [{ step: *container-scan }] }
