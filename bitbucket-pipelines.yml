      - step: *sast
      - step: *terraform-validate

  custom:
    terraform-gcp-validate:
      - step: *terraform-validate
    deploy-service-staging:
      - variables:
          - name: SERVICE_NAME
            default: products-service
            allowed-values: [frontend, inventory-service, notification-service, orders-service, products-service, payments-service, fulfillment-service, analytics-service, cosmo-router, demand-forecast, mlops-training]
          - name: GKE_INGRESS_URL
      - step: *unit-tests
      - step: *sast
      - step: *build-sbom
      - step: *container-scan
      - step: *policy-gate
      - stage:
          name: Publish and deploy to staging
          deployment: staging
          steps:
            - step: *publish-candidate
            - step: *deploy-gke
            - step: *api-contract
            - step: *frontend-e2e
            - step: *performance
            - step: *dast
            - step: *runtime-verify
      - step: *release-evidence
