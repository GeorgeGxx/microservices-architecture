global:
  environment: dev
  cloudProvider: azure
  storageClass: managed-premium-retain

# Generic Azure ACR Repository Placeholders (Replace <ACR_NAME> before deployment)
api-gateway:
  image:
    repository: "<ACR_NAME>.azurecr.io/api-gateway"
    tag: "1.0.0"
  replicaCount: 1

inventory-service:
  image:
    repository: "<ACR_NAME>.azurecr.io/inventory-service"
    tag: "1.0.0"
  replicaCount: 1

notification-service:
  image:
    repository: "<ACR_NAME>.azurecr.io/notification-service"
    tag: "1.0.0"
  replicaCount: 1

orders-service:
  image:
    repository: "<ACR_NAME>.azurecr.io/orders-service"
    tag: "1.0.0"
  replicaCount: 1

products-service:
  image:
    repository: "<ACR_NAME>.azurecr.io/products-service"
    tag: "1.0.0"
  replicaCount: 1

frontend:
  enabled: false
  image:
    repository: "<ACR_NAME>.azurecr.io/frontend"
    tag: "1.0.0"
  replicaCount: 0

# Edge ingress is standardized on the Istio gateway declared in k8s/istio/02-gateway.yaml.
# Keep Helm values disabled here to avoid creating a second, conflicting ingress path.
ingress:
  enabled: false
  className: "istio"
  annotations:
    kubernetes.io/ingress.class: "istio"
  hosts: []
