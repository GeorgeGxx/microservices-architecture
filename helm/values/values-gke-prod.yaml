global:
  environment: production
  cloudProvider: gcp
  storageClass: premium-rwo

configMap:
  data:
    TRACING_SAMPLING_PROBABILITY: "0.1"

# GCP Artifact Registry High Performance Tier (Production Dual-Dataplane: gke + gke_dp2)
cosmo-router:
  graphql:
    introspection: false
    playgroundEnabled: false
  cors:
    allowedOrigins: []
  image:
    repository: "ghcr.io/wundergraph/cosmo/router"
    tag: "0.362.0"
  trafficShaping:
    circuitBreaker:
      enabled: true
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

inventory-service:
  image:
    repository: "us-central1-docker.pkg.dev/<GCP_PROJECT_ID>/msa-gcp-prod/inventory-service"
    tag: "1.0.0" # Bootstrap fallback only; CI should override the deployed image with its registry digest.
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  resources:
    requests:
      cpu: "500m"
      memory: "1024Mi"
    limits:
      cpu: "1000m"
      memory: "2048Mi"

