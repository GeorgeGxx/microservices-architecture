global:
  environment: staging
  cloudProvider: azure
  storageClass: managed-csi

configMap:
  data:
    TRACING_SAMPLING_PROBABILITY: "0.25"

# Azure ACR Medium Performance Tier (Staging)
cosmo-router:
  image:
    repository: "ghcr.io/wundergraph/cosmo/router"
    tag: "0.362.0"
  trafficShaping:
    circuitBreaker:
      enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

inventory-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/inventory-service"
    tag: "1.0.0" # Bootstrap fallback only; CI should override the deployed image with its registry digest.
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1024Mi"

notification-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/notification-service"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

orders-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/orders-service"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1024Mi"

products-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/products-service"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1024Mi"

payments-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/payments-service"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "150m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

fulfillment-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/fulfillment-service"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

analytics-service:
  image:
    repository: "msaazurestagingacr.azurecr.io/analytics-service"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "150m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

frontend:
  image:
    repository: "msaazurestagingacr.azurecr.io/frontend"
    tag: "1.0.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

ingress:
  enabled: false
  className: "istio"
  annotations:
    kubernetes.io/ingress.class: "istio"
  hosts: []
