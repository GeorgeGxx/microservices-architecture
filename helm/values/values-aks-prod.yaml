global:
  environment: prod
  # Azure Key Vault CSI driver (opt-in) - descomenta y completa para que los
  # secrets vengan de Key Vault en vez de --set/--values planos. Ver
  # helm/microservices-umbrella/templates/secretproviderclass.yaml.
  # azureKeyVault:
  #   enabled: true
  #   name: georgegxx-msa-prod-kv
  #   tenantId: "<tu-tenant-id>"
  #   workloadIdentityClientId: "<client-id-de-la-workload-identity>"
  #   secrets:
  #     - name: db-password
  #       alias: DB_PASSWORD

api-gateway:
  image: { repository: "georgegxxmsaprodacr.azurecr.io/api-gateway", tag: "1.0.0" }
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
