global:
  environment: prod
  # Azure Key Vault CSI driver (opt-in) - uncomment and fill to fetch
  # secrets from Key Vault instead of plain --set/--values. See
  # helm/microservices-umbrella/templates/secretproviderclass.yaml.
  # azureKeyVault:
  #   enabled: true
  #   name: georgegxx-msa-prod-kv
  #   tenantId: "<your-tenant-id>"
  #   workloadIdentityClientId: "<workload-identity-client-id>"
  #   secrets:
  #     - name: db-password
  #       alias: DB_PASSWORD

configMap:
  data:
    TRACING_SAMPLING_PROBABILITY: "0.1"

cosmo-router:
  graphql:
    introspection: false
    playgroundEnabled: false
  cors:
    # Set to the public storefront origin(s) if browser traffic is cross-origin.
    allowedOrigins: []
  image: { repository: "ghcr.io/wundergraph/cosmo/router", tag: "0.362.0" }
  trafficShaping:
    circuitBreaker:
      enabled: true
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
inventory-service:
  image: { repository: "georgegxxmsaprodacr.azurecr.io/inventory-service", tag: "1.0.0" }
  replicaCount: 2
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6 }
