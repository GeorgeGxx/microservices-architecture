# The chart uses clusterName as the Kubernetes DNS suffix in generated service
# URLs; it must remain the cluster domain, not the human-readable cluster ID.
clusterName: cluster.local

opencost:
  exporter:
    replicas: 1
    defaultClusterId: microservices-minikube-dev
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1024Mi
    livenessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    startupProbe:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30
    extraVolumeMounts:
      - name: var-configs
        mountPath: /var/configs
  customPricing:
    enabled: true
    configmapName: custom-pricing-model
    configPath: /tmp/custom-config
    createConfigmap: true
    provider: custom
    costModel:
      description: "Minikube Local Dev FinOps Pricing Model"
      CPU: 0.031611
      spotCPU: 0.006655
      RAM: 0.004237
      spotRAM: 0.000892
      GPU: 0.95
      storage: 0.10
      zoneNetworkEgress: 0.01
      regionNetworkEgress: 0.01
      internetNetworkEgress: 0.12
  prometheus:
    internal:
      enabled: true
      serviceName: kube-prometheus-kube-prome-prometheus
      namespaceName: observability
      port: 9090
  cloudCost:
    enabled: false
  mcp:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 512Mi
  ui:
    enabled: true
    uiPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi
  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus

extraVolumes:
  - name: var-configs
    emptyDir: {}
