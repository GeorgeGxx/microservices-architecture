# The chart uses clusterName as the Kubernetes DNS suffix in generated service
# URLs; it must remain the cluster domain, not the human-readable cluster ID.
clusterName: cluster.local

opencost:
  exporter:
    replicas: 1
    defaultClusterId: microservices-minikube-dev
  prometheus:
    internal:
      enabled: true
      serviceName: kube-prometheus-kube-prome-prometheus
      namespaceName: observability
      port: 9090
  cloudCost:
    enabled: false
  mcp:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 512Mi
  ui:
    enabled: true
    uiPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi
  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus
