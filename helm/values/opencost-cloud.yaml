# Cloud workload allocation uses a Prometheus instance deployed in the same cluster.
# Cloud billing ingestion is opt-in and requires provider billing exports and credentials.
# The chart uses clusterName as the Kubernetes DNS suffix in generated service
# URLs; keep it at the standard Kubernetes domain for cloud clusters too.
clusterName: cluster.local

opencost:
  exporter:
    replicas: 1
    defaultClusterId: microservices-cloud
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  prometheus:
    internal:
      enabled: true
      serviceName: prometheus-server
      namespaceName: observability
      port: 80
  cloudCost:
    enabled: false
  mcp:
    enabled: false
  ui:
    enabled: true
    uiPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  metrics:
    serviceMonitor:
      enabled: false
