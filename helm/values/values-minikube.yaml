# Local minikube: images built directly into minikube's docker daemon
# (see scripts/deploy-minikube.sh), no external registry needed.
global:
  environment: local
  # Vault Integration Options (Choose Option A or Option B, or leave disabled for native K8s secrets)
  vault:
    enabled: false # Set to true to enable Vault integration
    integrationMethod: "external-secrets" # Options: "external-secrets" (Recommended) | "sidecar"

# ==============================================================================
# Option A: Vault Agent Sidecar Injector (Per-pod sidecar template)
# ==============================================================================
# products-service:
#   podAnnotations:
#     vault.hashicorp.com/agent-inject: "true"
#     vault.hashicorp.com/role: "products-service-role"
#     vault.hashicorp.com/agent-inject-secret-database.env: "secret/data/products-service"
#     vault.hashicorp.com/agent-inject-template-database.env: |
#       {{- with secret "secret/data/products-service" -}}
#       export SPRING_DATASOURCE_URL="{{ .Data.data.spring_datasource_url }}"
#       export SPRING_DATASOURCE_USERNAME="{{ .Data.data.spring_datasource_username }}"
#       export SPRING_DATASOURCE_PASSWORD="{{ .Data.data.spring_datasource_password }}"
#       {{- end -}}

cosmo-router:
  serviceAccount:
    create: false
    name: "cosmo-router-sa"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  graphql:
    introspection: true
    playgroundEnabled: true
  cors:
    allowedOrigins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  image: { repository: ghcr.io/wundergraph/cosmo/router, tag: "0.353.0" }
  keda:
    prometheus:
      serverAddress: "http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090"
inventory-service:
  image: { repository: georgegxx/inventory-service, tag: "1.0.0" }
  serviceAccount:
    create: false
    name: "inventory-service-sa"
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1024Mi }
  probes:
    startupFailureThreshold: 30
    startupPeriodSeconds: 10
notification-service:
  image: { repository: georgegxx/notification-service, tag: "1.0.0" }
  serviceAccount:
    create: false
    name: "notification-service-sa"
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1024Mi }
  probes:
    startupFailureThreshold: 30
    startupPeriodSeconds: 10
orders-service:
  image: { repository: georgegxx/orders-service, tag: "1.0.0" }
  serviceAccount:
    create: false
    name: "orders-service-sa"
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1024Mi }
  probes:
    startupFailureThreshold: 30
    startupPeriodSeconds: 10
products-service:
  image: { repository: georgegxx/products-service, tag: "1.0.0" }
  serviceAccount:
    create: false
    name: "products-service-sa"
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1024Mi }
  probes:
    startupFailureThreshold: 30
    startupPeriodSeconds: 10

mlops:
  enabled: true
  mlflow:
    image: { repository: georgegxx/mlflow, tag: "1.0.0" }
  training:
    image: { repository: georgegxx/mlops-training, tag: "1.0.0" }
  forecast:
    image: { repository: georgegxx/demand-forecast, tag: "1.0.0" }
