# Local Minikube values. Credentials are created by platform-minikube.ps1
# from ignored .env settings or cryptographically-generated development values.
global:
  environment: dev
  vault:
    enabled: false
    integrationMethod: external-secrets

glitchtip:
  enabled: true
  provisionProjects:
    enabled: false
  image:
    repository: docker.io/glitchtip/glitchtip
    tag: "7.0.0"
  database:
    image: docker.io/postgres:18-alpine
    storage: 5Gi
  valkey:
    image: docker.io/valkey/valkey:8-alpine
  domain: http://localhost:8091
  retentionDays: "30"
  defaultFromEmail: glitchtip@microservices-architecture.dev

cosmo-router:
  serviceAccount: { create: false, name: cosmo-router-sa }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
  graphql: { introspection: true, playgroundEnabled: true }
  cors:
    allowedOrigins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  image: { repository: ghcr.io/wundergraph/cosmo/router, tag: "0.362.0" }
  keda:
    prometheus:
      serverAddress: http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090

inventory-service:
  sentryDsnSecretKey: GLITCHTIP_INVENTORY_DSN
  image: { repository: georgegxx/inventory-service, tag: "1.0.0" }
  serviceAccount: { create: false, name: inventory-service-sa }
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: 500m, memory: 1280Mi }
  probes: { startupFailureThreshold: 30, startupPeriodSeconds: 10 }
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 1
    kafka:
      enabled: true
      bootstrapServers: kafka.data.svc.cluster.local:9092
      consumerGroup: inventory-service
      topic: orders-topic
      lagThreshold: "10"
    cpu: { enabled: true, targetUtilizationPercentage: 70 }

notification-service:
  sentryDsnSecretKey: GLITCHTIP_NOTIFICATION_DSN
  image: { repository: georgegxx/notification-service, tag: "1.0.0" }
  serviceAccount: { create: false, name: notification-service-sa }
  resources:
    requests: { cpu: 100m, memory: 640Mi }
    limits: { cpu: 500m, memory: 1024Mi }
  probes: { startupFailureThreshold: 30, startupPeriodSeconds: 10 }
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 1
    kafka:
      enabled: true
      bootstrapServers: kafka.data.svc.cluster.local:9092
      consumerGroup: notification-service
      topic: orders-topic
      lagThreshold: "10"
    cpu: { enabled: true, targetUtilizationPercentage: 70 }

