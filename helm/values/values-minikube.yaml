ai-service:
  image: { repository: georgegxx/ai-service, tag: "1.0.0" }
  serviceAccount:
    create: false
    name: "ai-service-sa"
  resources:
    requests: { cpu: 75m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }
  env:
    APP_ENV: "production"
    PORT: "8010"
    LLM_PROVIDER: "ollama"
    OLLAMA_BASE_URL: "http://ollama:11434"
    OLLAMA_MODEL: "llama3.1:8b"
    ORDERS_SERVICE_URL: "http://orders-service:8003"
    PRODUCTS_SERVICE_URL: "http://products-service:8004"
    INVENTORY_SERVICE_URL: "http://inventory-service:8001"
    COSMO_ROUTER_URL: "http://cosmo-router:8080/graphql"
    REDIS_URL: "redis://redis:6379/0"
    ENABLE_OBSERVABILITY: "true"
    PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix:6006/v1/traces"

mlops:
  enabled: true
  mlflow:
    image: { repository: georgegxx/mlflow, tag: "1.0.0" }
  training:
    image: { repository: georgegxx/mlops-training, tag: "1.0.0" }
  forecast:
    image: { repository: georgegxx/demand-forecast, tag: "1.0.0" }

configMap:
  data:
    HIBERNATE_DDL_AUTO: "update"
