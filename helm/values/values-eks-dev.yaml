global:
  environment: dev
  cloudProvider: aws
  storageClass: ebs-gp3-sc

# AWS ECR Repository Placeholders (Replace <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com)
api-gateway:
  image:
    repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/api-gateway"
    tag: "1.0.0"
  replicaCount: 1

inventory-service:
  image:
    repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/inventory-service"
    tag: "1.0.0"
  replicaCount: 1

notification-service:
  image:
    repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/notification-service"
    tag: "1.0.0"
  replicaCount: 1

orders-service:
  image:
    repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/orders-service"
    tag: "1.0.0"
  replicaCount: 1

products-service:
  image:
    repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/products-service"
    tag: "1.0.0"
  replicaCount: 1
  # Example activation of Vault Agent Injector in EKS:
  # podAnnotations:
  #   vault.hashicorp.com/agent-inject: "true"
  #   vault.hashicorp.com/role: "products-service-role"
  #   vault.hashicorp.com/agent-inject-secret-database.env: "secret/data/products-service"
  #   vault.hashicorp.com/agent-inject-template-database.env: |
  #     {{- with secret "secret/data/products-service" -}}
  #     export SPRING_DATASOURCE_URL="{{ .Data.data.spring_datasource_url }}"
  #     export SPRING_DATASOURCE_USERNAME="{{ .Data.data.spring_datasource_username }}"
  #     export SPRING_DATASOURCE_PASSWORD="{{ .Data.data.spring_datasource_password }}"
  #     {{- end -}}

frontend:
  enabled: false
  image:
    repository: "<ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/frontend"
    tag: "1.0.0"
  replicaCount: 0

# Edge ingress is standardized on the Istio gateway declared in k8s/istio/02-gateway.yaml.
# Keep Helm values disabled here to avoid creating a second, conflicting ingress path.
ingress:
  enabled: false
  className: "istio"
  annotations:
    kubernetes.io/ingress.class: "istio"
  hosts: []
