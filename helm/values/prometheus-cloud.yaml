alertmanager:
  enabled: false
pushgateway:
  enabled: false
server:
  retention: 15d
  retentionSize: 6GB
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
