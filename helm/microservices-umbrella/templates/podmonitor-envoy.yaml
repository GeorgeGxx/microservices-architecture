apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-stats
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
      - istio-system
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 10s
