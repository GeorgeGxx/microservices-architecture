# Azure Key Vault CSI driver - alternativa a helm/microservices-umbrella/templates/secret.yaml
# (Secret plano) para AKS. Requiere que el add-on "azureKeyvaultSecretsProvider"
# esté habilitado en el clúster AKS (lo hace terraform/modules/azure/aks) y que el
# Key Vault le haya dado permisos de lectura a la identidad del clúster (lo hace
# terraform/modules/azure/keyvault, rol "Key Vault Secrets User").
#
# Usa AKS Workload Identity (no pod-identity, que está deprecado): el ServiceAccount
# del servicio que monta este volumen debe tener la anotación
# "azure.workload.identity/client-id" (ver serviceAccount.annotations en cada
# helm/charts/<servicio>/values.yaml) y el label "azure.workload.identity/use: true".
#
# secretObjects sincroniza los valores de Key Vault hacia el mismo K8s Secret
# ({{ .Values.secret.name }}) que los 6 servicios ya leen vía envFrom.secretRef -
# no hace falta tocar ningún deployment.yaml para adoptarlo.
{{- if .Values.global.azureKeyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: microservices-akv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "{{ required "global.azureKeyVault.workloadIdentityClientId es obligatorio cuando global.azureKeyVault.enabled=true" .Values.global.azureKeyVault.workloadIdentityClientId }}"
    keyvaultName: "{{ required "global.azureKeyVault.name es obligatorio cuando global.azureKeyVault.enabled=true" .Values.global.azureKeyVault.name }}"
    tenantId: "{{ required "global.azureKeyVault.tenantId es obligatorio cuando global.azureKeyVault.enabled=true" .Values.global.azureKeyVault.tenantId }}"
    objects: |
      array:
        {{- range .Values.global.azureKeyVault.secrets }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secret.name }}
      type: Opaque
      data:
        {{- range .Values.global.azureKeyVault.secrets }}
        - objectName: {{ .name }}
          key: {{ .alias }}
        {{- end }}
{{- end }}
