# Azure Key Vault CSI driver - alternative to helm/microservices-umbrella/templates/secret.yaml
# (plain Secret) for AKS. Requires that the "azureKeyvaultSecretsProvider" add-on
# is enabled in the AKS cluster (configured by terraform/modules/azure/aks) and that
# Key Vault has granted read permissions to the cluster identity (configured by
# terraform/modules/azure/keyvault, "Key Vault Secrets User" role).
#
# Uses AKS Workload Identity (not pod-identity, which is deprecated): the ServiceAccount
# of the service mounting this volume must have the annotation
# "azure.workload.identity/client-id" (see serviceAccount.annotations in each
# helm/charts/<service>/values.yaml) and the label "azure.workload.identity/use: true".
#
# secretObjects synchronizes Key Vault values into the same K8s Secret
# ({{ .Values.secret.name }}) that all microservices read via envFrom.secretRef -
# no deployment.yaml changes needed to adopt it.
{{- if .Values.global.azureKeyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: microservices-akv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "{{ required "global.azureKeyVault.workloadIdentityClientId is required when global.azureKeyVault.enabled=true" .Values.global.azureKeyVault.workloadIdentityClientId }}"
    keyvaultName: "{{ required "global.azureKeyVault.name is required when global.azureKeyVault.enabled=true" .Values.global.azureKeyVault.name }}"
    tenantId: "{{ required "global.azureKeyVault.tenantId is required when global.azureKeyVault.enabled=true" .Values.global.azureKeyVault.tenantId }}"
    objects: |
      array:
        {{- range .Values.global.azureKeyVault.secrets }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ .Values.secret.name }}
      type: Opaque
      data:
        {{- range .Values.global.azureKeyVault.secrets }}
        - objectName: {{ .name }}
          key: {{ .alias }}
        {{- end }}
{{- end }}
