{{- if and .Values.glitchtip.enabled .Values.glitchtip.provisionProjects.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: glitchtip-project-dsns
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
data:
  GLITCHTIP_DEMAND_FORECAST_DSN: ""
  GLITCHTIP_INVENTORY_DSN: ""
  GLITCHTIP_NOTIFICATION_DSN: ""
  GLITCHTIP_ORDERS_DSN: ""
  GLITCHTIP_PAYMENTS_DSN: ""
  GLITCHTIP_FULFILLMENT_DSN: ""
  GLITCHTIP_ANALYTICS_DSN: ""
  GLITCHTIP_PRODUCTS_DSN: ""
  GLITCHTIP_AI_DSN: ""
  GLITCHTIP_FRONTEND_DSN: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glitchtip-provision-projects
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glitchtip-provision-project-dsns
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["glitchtip-project-dsns"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glitchtip-provision-project-dsns
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: glitchtip-provision-projects
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: glitchtip-provision-project-dsns
---
apiVersion: batch/v1
kind: Job
metadata:
  name: glitchtip-provision-projects-{{ .Files.Get "files/glitchtip-provision-projects.py" | sha256sum | trunc 8 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app: glitchtip-provision-projects
    spec:
      restartPolicy: OnFailure
      serviceAccountName: glitchtip-provision-projects
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-glitchtip
          image: "{{ .Values.glitchtip.image.repository }}:{{ .Values.glitchtip.image.tag }}"
          command: ["python", "-c"]
          args:
            - |
              import socket, time
              for attempt in range(90):
                  try:
                      with socket.create_connection(("glitchtip", 8000), timeout=3):
                          pass
                      break
                  except OSError:
                      if attempt == 89:
                          raise SystemExit("GlitchTip TCP endpoint did not become ready")
                      time.sleep(5)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: provision-projects
          image: "{{ .Values.glitchtip.image.repository }}:{{ .Values.glitchtip.image.tag }}"
          command: ["python", "/code/glitchtip-provision-projects.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: DATABASE_URL
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: VALKEY_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: SECRET_KEY
            - name: GLITCHTIP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: GLITCHTIP_ADMIN_EMAIL
            - name: GLITCHTIP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: GLITCHTIP_ADMIN_PASSWORD
            - name: GLITCHTIP_DOMAIN
              value: {{ .Values.glitchtip.domain | quote }}
            - name: GLITCHTIP_WRITE_K8S_SECRET
              value: "true"
            - name: GLITCHTIP_PRINT_DSNS
              value: "false"
          volumeMounts:
            - name: projects-script
              mountPath: /code/glitchtip-provision-projects.py
              subPath: glitchtip-provision-projects.py
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: projects-script
          configMap:
            name: glitchtip-provision-projects
{{- end }}
