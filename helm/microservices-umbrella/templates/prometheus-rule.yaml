{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-microservices-alerts
  labels:
    app: {{ .Release.Name }}
    release: kube-prometheus
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  groups:
    - name: microservices-architecture-alerts
      rules:
        - alert: ServiceDown
          expr: up{job=~"apollo-router|inventory-service|notification-service|orders-service|products-service"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{`{{ $labels.job }}`}} is down"
            description: "Service {{`{{ $labels.job }}`}} has been unreachable for more than 3 minutes."

        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job=~"inventory-service|notification-service|orders-service|products-service", status=~"5..", uri!~".*actuator.*"}[5m]))
            / sum(rate(http_server_requests_seconds_count{job=~"inventory-service|notification-service|orders-service|products-service", uri!~".*actuator.*"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx Error Rate"
            description: "5xx HTTP error rate for services exceeds 5% over the last 5 minutes."

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket{job=~"inventory-service|notification-service|orders-service|products-service", uri!~".*actuator.*"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Service Latency"
            description: "P95 request latency for services exceeds 1 second over the last 5 minutes."

        - alert: HighHeapUsage
          expr: sum(jvm_memory_used_bytes{job=~"inventory-service|notification-service|orders-service|products-service", area="heap"}) by (service)
            / sum(jvm_memory_max_bytes{job=~"inventory-service|notification-service|orders-service|products-service", area="heap"}) by (service) > 0.75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High JVM Heap Memory Usage"
            description: "Service {{`{{ $labels.service }}`}} is consuming more than 75% of allocated JVM heap memory."

        - alert: ApolloRouterHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service="apollo-router", otel_scope_name="apollo/router", http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{service="apollo-router", otel_scope_name="apollo/router"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Apollo Router 5xx error rate is high"
            description: "Apollo Router has returned 5xx responses for more than 5% of requests over the last 5 minutes."

        - alert: ApolloRouterHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service="apollo-router", otel_scope_name="apollo/router"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Apollo Router P95 latency is high"
            description: "Apollo Router request latency P95 has exceeded 1 second for 5 minutes."

        - alert: RedisExporterDown
          expr: up{job="redis"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis Exporter Unreachable"
            description: "The Redis Prometheus exporter target is down or unreachable."
{{- end }}
