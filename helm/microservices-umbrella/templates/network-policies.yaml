{{- if and .Values.networkPolicies .Values.networkPolicies.enabled }}
# ==============================================================================
# Zero-Trust L3/L4 Network Policies for Application Namespace ({{ .Release.Namespace }})
# Defense-in-depth complement to Istio mTLS (Layer 7)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 01. Allow DNS resolution (Egress to CoreDNS in kube-system)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-resolution
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 02. Allow Ingress Gateway (istio-system) & Frontend proxy traffic to Edge services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway-traffic
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["frontend", "cosmo-router"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
---
# 03. Allow East-West communication from Ingress Gateway, Cosmo Router & Frontend to Microservices
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-microservices-east-west
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - "products-service"
          - "orders-service"
          - "inventory-service"
          - "notification-service"
          - "payments-service"
          - "fulfillment-service"
          - "analytics-service"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - podSelector:
            matchLabels:
              app: cosmo-router
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: orders-service
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 8004
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
---
# 04. Allow Egress to Backing Infrastructure (Data, Auth, Vault, Observability, Istio)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backing-infra-egress
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow egress to 'istio-system' (Istiod xDS, Envoy config & Citadel mTLS CA)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15010
    # Allow egress to 'observability' (OTel/Tempo traces: 4317/4318, Loki logs: 3100, Tempo HTTP: 3200, Alloy: 3300, Prometheus: 9090)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - namespaceSelector:
            matchLabels:
              environment: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 3300
        - protocol: TCP
          port: 9090
    # Allow egress to 'data' namespace (PostgreSQL 18: 5432, Redis: 6379, Kafka: 9092)
    - to:
        - namespaceSelector:
            matchLabels:
              environment: data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
    # Allow egress to 'auth' namespace (Keycloak: 8181)
    - to:
        - namespaceSelector:
            matchLabels:
              environment: auth
      ports:
        - protocol: TCP
          port: 8181
    # Allow egress to 'vault' namespace (Vault: 8200)
    - to:
        - namespaceSelector:
            matchLabels:
              environment: vault
      ports:
        - protocol: TCP
          port: 8200
    # Allow intra-namespace egress between pods
    - to:
        - podSelector: {}
---
# 05. Allow Telemetry & Health Scraping from Observability namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scraping
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
        - namespaceSelector:
            matchLabels:
              environment: observability
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 8004
        - protocol: TCP
          port: 8005
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 15021
        - protocol: TCP
          port: 15090
{{- end }}
