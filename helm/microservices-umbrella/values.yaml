frontend:
  enabled: true
  image:
    repository: georgegxx/frontend
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent

mlops:
  enabled: true
  mlflow:
    image:
      repository: georgegxx/mlflow
      tag: "1.0.0"
      pullPolicy: IfNotPresent
    storage:
      data: 1Gi
      artifacts: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 3Gi
  training:
    image:
      repository: georgegxx/mlops-training
      tag: "1.0.0"
      pullPolicy: IfNotPresent
    storage:
      salesData: 5Gi
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 4Gi
    minPartitions: 9
    autoTrainIntervalSec: 20
  forecast:
    image:
      repository: georgegxx/demand-forecast
      tag: "1.0.0"
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
