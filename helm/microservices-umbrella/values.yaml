# Default values shared by every environment. Environment-specific
# overrides live in helm/values/values-<env>.yaml and are passed with
# `helm upgrade -f`.

global:
  environment: dev
  otelEndpoint: "https://otel-collector:4317"

  # Azure Key Vault CSI driver - AKS only, opt-in. When enabled, syncs the
  # secrets listed below from Key Vault into the same K8s Secret
  # (`secret.name`) the 6 services already read via envFrom, so no service
  # chart needs to change. Requires: the "azureKeyvaultSecretsProvider"
  # AKS add-on (already on via terraform/modules/azure/aks), the Key Vault
  # RBAC role granted in terraform/modules/azure/keyvault, and an AKS
  # Workload Identity client-id for discovery-server's ServiceAccount.
  azureKeyVault:
    enabled: false
    name: ""                       # e.g. georgegxx-msa-dev-kv (matches terraform/modules/azure/keyvault naming: <name>-<environment>-kv)
    tenantId: ""
    workloadIdentityClientId: ""   # client-id de la Workload Identity con permiso "Key Vault Secrets User"
    secrets: []
    # - name: db-password        # nombre del secret en Azure Key Vault
    #   alias: DB_PASSWORD       # key resultante en el K8s Secret sincronizado

configMap:
  create: true
  name: microservices-config
  data:
    COSMO_ROUTER_SERVICE_NAME: "cosmo-router"
    COSMO_ROUTER_PORT: "8080"
    INVENTORY_SERVICE_NAME: "inventory-service"
    NOTIFICATION_SERVICE_NAME: "notification-service"
    ORDERS_SERVICE_NAME: "orders-service"
    PRODUCTS_SERVICE_NAME: "products-service"
    INVENTORY_SERVICE_URI: "http://inventory-service:8001"
    ORDERS_SERVICE_URI: "http://orders-service:8003"
    PRODUCTS_SERVICE_URI: "http://products-service:8004"
    NOTIFICATION_SERVICE_URI: "http://notification-service:8002"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318"
    TRACING_SAMPLING_PROBABILITY: "1.0"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    KEYCLOAK_ISSUER_URI: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm"
    KEYCLOAK_JWT_URI: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs"
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
    VAULT_ENABLED: "false"
    INVENTORY_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-inventory:5432/ms_inventory"
    ORDERS_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-orders:5432/ms_orders"
    PRODUCTS_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-products:5432/ms_products"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
    ARGOCD_VERSION: "3.5.3"
    ARGOCD_HELM_CHART_VERSION: "10.9.2"
    GATEKEEPER_VERSION: "3.23.0"
    KUBE_PROMETHEUS_STACK_VERSION: "89.2.2"
    TEMPO_VERSION: "3.0.3"
    JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1"


secret:
  create: true
  name: microservices-secrets
  data:
    KEYCLOAK_ADMIN: "admin"
    KEYCLOAK_ADMIN_PASSWORD: "admin"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "admin"
    REDIS_PASSWORD: "admin"
    KEYCLOAK_CLIENT_SECRET: "mdIV7hoeQlOzQGSiYGzPfWXgt505pSbu"

prometheusRule:
  enabled: true

alertmanagerConfig:
  enabled: true
  slack:
    # Set to true and create secret 'alertmanager-slack-webhook' with key 'url'
    enabled: false
    channel: "#alerts-microservices"
    apiURLSecret:
      name: "alertmanager-slack-webhook"
      key: "url"
  jira:
    # Set to true to route critical alerts to Jira webhook / automation endpoint
    enabled: false
    webhookUrl: "https://your-domain.atlassian.net/rest/api/3/issue"
    urlSecret:
      enabled: false
      name: "alertmanager-jira-webhook"
      key: "url"

# Per-subchart overrides (mirrors each chart's own values.yaml keys)
cosmo-router:
  serviceAccount:
    create: false
    name: "cosmo-router-sa"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  probes:
    initialDelaySeconds: 10
    readinessPath: /health/ready
    livenessPath: /health/live
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 1
    prometheus:
      enabled: true
      serverAddress: "http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090"
      metricName: "cosmo_router_requests_per_second"
      query: 'sum(rate(router_http_requests_total{wg_subgraph_name=""}[1m]) or vector(0))'
      threshold: "100"
    cpu:
      enabled: true
      targetUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

inventory-service:
  serviceAccount:
    create: false
    name: "inventory-service-sa"
  resources:
    requests:
      cpu: 400m
      memory: 640Mi
    limits:
      cpu: 2000m
      memory: 1536Mi
  probes:
    initialDelaySeconds: 45
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 1
    cpu:
