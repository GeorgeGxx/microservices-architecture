replicaCount: 1

image:
  repository: georgegxx/orders-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8003

containerPort: 8003

resources:
  requests:
    cpu: 400m
    memory: 640Mi
  limits:
    cpu: 2000m
    memory: 1536Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 300
  prometheus:
    enabled: false
    serverAddress: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
    metricName: "http_requests_per_second"
    query: "sum(rate(http_server_requests_seconds_count{uri!~'.*actuator.*',service='orders-service'}[1m]))"
    threshold: "80"
  cpu:
    enabled: true
    targetUtilizationPercentage: 70
  memory:
    enabled: false
    targetUtilizationPercentage: 80

probes:
  readinessPath: /actuator/orders/health/readiness
  livenessPath: /actuator/orders/health/liveness
  initialDelaySeconds: 45

env: {}
  # EXTRA_VAR: value

envFrom:
  configMapRef: microservices-config
  secretRef: microservices-secrets

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: false
  name: ""
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::...:role/xxx-irsa-xxx
  # azure.workload.identity/client-id: xxxxxxxx-xxxx

serviceMonitor:
  enabled: true
  interval: 15s
  path: /actuator/orders/prometheus

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8003"
  prometheus.io/path: "/actuator/orders/prometheus"
