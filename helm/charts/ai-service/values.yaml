replicaCount: 1

image:
  repository: georgegxx/ai-service
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8010

containerPort: 8010

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  automountServiceAccountToken: false
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  readinessPath: /api/health
  livenessPath: /api/health
  initialDelaySeconds: 15

env:
  APP_ENV: "production"
  PORT: "8010"
  LLM_PROVIDER: "ollama"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1:8b"
  ORDERS_SERVICE_URL: "http://orders-service:8003"
  PRODUCTS_SERVICE_URL: "http://products-service:8004"
  INVENTORY_SERVICE_URL: "http://inventory-service:8001"
  COSMO_ROUTER_URL: "http://cosmo-router:8080/graphql"
  REDIS_URL: "redis://redis:6379/0"
  ENABLE_OBSERVABILITY: "false"
