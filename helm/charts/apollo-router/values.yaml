replicaCount: 1

image:
  repository: ghcr.io/apollographql/router
  tag: "v2.16.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

containerPort: 8080
healthPort: 8088
metricsPort: 9090

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 300
  prometheus:
    enabled: true
    serverAddress: "http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090"
    metricName: "apollo_router_requests_per_second"
    query: "sum(rate(http_server_request_duration_seconds_count{otel_scope_name='apollo/router'}[1m]))"
    threshold: "100"
  cpu:
    enabled: true
    targetUtilizationPercentage: 70
  memory:
    enabled: false
    targetUtilizationPercentage: 80

probes:
  readinessPath: /health
  livenessPath: /health
  initialDelaySeconds: 5

env: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: false
  name: ""
  annotations: {}

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
  port: metrics

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
