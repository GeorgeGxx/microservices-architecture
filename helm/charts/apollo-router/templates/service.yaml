apiVersion: v1
kind: Service
metadata:
  name: {{ include "apollo-router.fullname" . }}
  labels:
    {{- include "apollo-router.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-router
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.metricsPort }}
      protocol: TCP
  selector:
    app: apollo-router
