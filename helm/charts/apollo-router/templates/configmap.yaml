apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apollo-router.fullname" . }}-config
  labels:
    {{- include "apollo-router.labels" . | nindent 4 }}
data:
  router.yaml: |
    supergraph:
      listen: 0.0.0.0:8080
      path: /graphql
      introspection: true

    health_check:
      listen: 0.0.0.0:8088
      enabled: true
      path: /health

    homepage:
      enabled: false

    sandbox:
      enabled: true

    cors:
      allow_any_origin: true
      allow_headers:
        - Authorization
        - Content-Type
        - X-Idempotency-Key
        - apollographql-client-name
        - apollographql-client-version

    headers:
      all:
        request:
          operations:
            - propagate:
                named: authorization
            - propagate:
                named: x-idempotency-key

    telemetry:
      exporters:
        tracing:
          otlp:
            enabled: true
            endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
            protocol: http
        metrics:
          prometheus:
            enabled: true
            listen: 0.0.0.0:9090
            path: /metrics

  supergraph.graphql: |
    schema
      @link(url: "https://specs.apollo.dev/link/v1.0")
      @link(url: "https://specs.apollo.dev/join/v0.3", for: EXECUTION)
    {
      query: Query
      mutation: Mutation
    }

    directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

    directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

    directive @join__graph(name: String!, url: String!) on ENUM_VALUE

    directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

    directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

    directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

    directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

    type InventoryResponse
      @join__type(graph: INVENTORY)
    {
      id: ID
      sku: String!
      quantity: Int!
      isInStock: Boolean!
    }

    scalar join__FieldSet

    enum join__Graph {
      INVENTORY @join__graph(name: "inventory", url: "http://inventory-service:8001/graphql")
      ORDERS @join__graph(name: "orders", url: "http://orders-service:8003/graphql")
      PRODUCTS @join__graph(name: "products", url: "http://products-service:8004/graphql")
    }

    scalar link__Import

    enum link__Purpose {
      SECURITY
      EXECUTION
    }

    type Mutation
      @join__type(graph: ORDERS)
    {
      placeOrder(input: PlaceOrderInput!): Order
      cancelOrder(id: ID!): Order
      shipOrder(id: ID!): Order
      deliverOrder(id: ID!): Order
    }

    type Order
      @join__type(graph: ORDERS)
    {
      id: ID!
      orderNumber: String!
      userId: String
      username: String
      orderStatus: String
      orderItems: [OrderLineItem!]!
      customerName: String
      customerEmail: String
      shippingAddress: String
      city: String
      postalCode: String
      phone: String
      deliveryMethod: String
      trackingNumber: String
      carrier: String
      subtotalAmount: Float
      shippingFee: Float
      taxAmount: Float
      totalAmount: Float
      paymentMethod: String
    }

    input OrderItemInput
      @join__type(graph: ORDERS)
    {
      sku: String!
      price: Float!
      quantity: Int!
    }

    type OrderLineItem
      @join__type(graph: ORDERS)
    {
      id: ID
      sku: String!
      price: Float
      quantity: Int
      product: Product
    }

    input PlaceOrderInput
      @join__type(graph: ORDERS)
    {
      orderItems: [OrderItemInput!]!
      customerName: String
      customerEmail: String
      shippingAddress: String
      city: String
      postalCode: String
      phone: String
      deliveryMethod: String
      paymentMethod: String
    }

    type Product
      @join__type(graph: INVENTORY, key: "sku")
      @join__type(graph: ORDERS, key: "sku")
      @join__type(graph: PRODUCTS, key: "sku")
    {
      sku: String!
      isInStock: Boolean! @join__field(graph: INVENTORY)
      quantity: Int! @join__field(graph: INVENTORY)
      id: ID @join__field(graph: PRODUCTS)
      name: String! @join__field(graph: PRODUCTS)
      description: String @join__field(graph: PRODUCTS)
      price: Float @join__field(graph: PRODUCTS)
      status: Boolean @join__field(graph: PRODUCTS)
      imageUrl: String @join__field(graph: PRODUCTS)
      category: String @join__field(graph: PRODUCTS)
      rating: Float @join__field(graph: PRODUCTS)
      reviewCount: Int @join__field(graph: PRODUCTS)
      isBestSeller: Boolean @join__field(graph: PRODUCTS)
    }

    type Query
      @join__type(graph: INVENTORY)
      @join__type(graph: ORDERS)
      @join__type(graph: PRODUCTS)
    {
      inventory(sku: String!): InventoryResponse @join__field(graph: INVENTORY)
      inventories: [InventoryResponse!]! @join__field(graph: INVENTORY)
      orders: [Order!]! @join__field(graph: ORDERS)
      order(id: ID!): Order @join__field(graph: ORDERS)
      products: [Product!]! @join__field(graph: PRODUCTS)
      productBySku(sku: String!): Product @join__field(graph: PRODUCTS)
    }
