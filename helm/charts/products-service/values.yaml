replicaCount: 1

image:
  repository: georgegxx/products-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8004

containerPort: 8004

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

probes:
  readinessPath: /actuator/products/health/readiness
  livenessPath: /actuator/products/health/liveness
  initialDelaySeconds: 45

env: {}
  # EXTRA_VAR: value

envFrom:
  configMapRef: microservices-config
  secretRef: microservices-secrets

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: false
  name: ""
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::...:role/xxx-irsa-xxx
  # azure.workload.identity/client-id: xxxxxxxx-xxxx

serviceMonitor:
  enabled: true
  interval: 15s
  path: /actuator/products/prometheus

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8004"
  prometheus.io/path: "/actuator/products/prometheus"
