spring:
  application:
    name: ${INVENTORY_SERVICE_NAME:inventory-service}
  
  threads:
    virtual:
      enabled: true
  
  lifecycle:
    timeout-per-shutdown-phase: 30s
  
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      "[security.protocol]": ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    consumer:
      group-id: ${INVENTORY_KAFKA_GROUP_ID:inventory-service}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3
      observation-enabled: true
  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${INVENTORY_SPRING_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5431/inventory_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      pool-name: InventoryHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 15000

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        '[default_batch_fetch_size]': 25    # Reduces the N+1 query problem.
        '[order_inserts]': true             # Optimize batch inserts.
        '[order_updates]': true             # Optimize batch updates
        jdbc:
          '[batch_size]': 25

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false # Avoid filling Redis with empty/null responses
      use-key-prefix: true
      key-prefix: "cache:inventory"

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWT_URI:http://localhost:8181/realms/microservices-realm/protocol/openid-connect/certs}

ecommerce:
  inventory-reservation:
    enabled: ${INVENTORY_RESERVATION_ENABLED:true}
    ttl: ${INVENTORY_RESERVATION_TTL:PT15M}
    expiration-scheduler-delay-ms: ${INVENTORY_RESERVATION_EXPIRATION_SCHEDULER_DELAY_MS:10000}
    expiration-scheduler-initial-delay-ms: ${INVENTORY_RESERVATION_INITIAL_DELAY_MS:30000}

server:
  port: ${PORT:8001}
  shutdown: graceful

springdoc:
  api-docs:
    version: openapi_3_0

logging:
  pattern:
    correlation: "[${spring.application.name:-},%X{traceId:-},%X{spanId:-}] "
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}] [%t] %-40.40logger{39} : %m%n%wEx"
  level:
    root: info
    "[org.springdoc.core.utils.SpringDocUtils]": error

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
      base-path: /actuator/inventory
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
  # Enable only if you migrate from Prometheus scraper to OTLP Push for metrics:
  otlp:
    metrics:
      export:
        enabled: false
  #       url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      '["service.name"]': ${spring.application.name}
      '["service.version"]': "1.0"
      '["deployment.environment"]': ${ENVIRONMENT:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
