spring:
  application:
    name: ${ORDERS_SERVICE_NAME:orders-service}
  
  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
  
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ORDERS_SPRING_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5435/orders_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      pool-name: OrdersHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 15000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # For prod ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        "[default_batch_fetch_size]": 25    # Avoids N+1 problem in order lines
        "[order_inserts]": true             # Groups Order and OrderItem inserts by batch
        "[order_updates]": true
      jdbc:
          '[batch_size]': 25

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      '[security.protocol]': ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      '[sasl.mechanism]': ${KAFKA_SASL_MECHANISM:PLAIN}
      '[sasl.jaas.config]': ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      acks: all
      retries: 3
      properties:
        '[enable.idempotence]': true
        '[compression.type]': snappy
        '[linger.ms]': 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true        # Injects W3C TraceContext headers into Kafka messages

  cache:
    type: redis
    redis:
      time-to-live: 300000
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWT_URI:http://localhost:8181/realms/microservices-realm/protocol/openid-connect/certs}

server:
  port: ${PORT:8003}
  shutdown: graceful

springdoc:
  api-docs:
    version: openapi_3_0

logging:
  level:
    root: info
    "[org.springdoc.core.utils.SpringDocUtils]": error

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 5
        sliding-window-type: count_based
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - java.lang.IllegalArgumentException
    instances:
      # orders-service:
      #   base-config: default
      inventory-service:
        base-config: default
      products-service:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      products-service:
        timeout-duration: 3s
      inventory-service:
        timeout-duration: 3s
      # orders-service:
      #   timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
      base-path: /actuator/orders
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
  # Enable only if you migrate from Prometheus scraper to OTLP Push for metrics:
  otlp:
    metrics:
      export:
        enabled: false
  #       url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      '[service.name]': ${spring.application.name}
      '[service.version]': "1.0"
      '[deployment.environment]': ${ENVIRONMENT:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true