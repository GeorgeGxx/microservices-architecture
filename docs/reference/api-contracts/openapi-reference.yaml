openapi: 3.0.3
info:
  title: Enterprise E-Commerce Microservices Architecture API
  description: 'Authoritative OpenAPI 3.0 specification consolidating all Spring Boot
    4.0.9 REST microservices:

    - Products Service (:8004)

    - Orders Service (:8003)

    - Inventory Service (:8001)

    - Notification Service (:8002)


    Secured via Keycloak 26.8.1 OAuth2 / OIDC Bearer JWT and Istio Service Mesh.'
  version: 1.0.0
  contact:
    name: Platform Architecture Team
    url: https://github.com/GeorgeGxx/microservices-architecture
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:8080
  description: Cosmo Router / Edge Gateway (Local)
- url: http://localhost:8004
  description: Direct Products Service (Local)
- url: http://localhost:8003
  description: Direct Orders Service (Local)
- url: http://localhost:8001
  description: Direct Inventory Service (Local)
- url: http://localhost:8002
  description: Direct Notification Service (Local)
tags:
- name: Products Service
  description: Product catalog management, pricing, and category search
- name: Orders Service
  description: Order lifecycle, payment checkout, DHL shipment dispatch, and funnel
    telemetry
- name: Inventory Service
  description: Real-time warehouse stock tracking, allocation, and low-stock alerts
- name: Notification Service
  description: Transactional Server-Sent Events (SSE) notification streaming
paths:
  /api/product/{id}:
    put:
      tags:
      - Products Service
      summary: Update an existing product
      description: Updates product details by product ID
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        description: Product ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      responses:
        '200':
          description: Product updated successfully
        '400':
          description: Invalid product request payload
        '404':
          description: Product not found
        '403':
          description: Access denied
    delete:
      tags:
      - Products Service
      summary: Delete a product
      description: Removes a product from the catalog by ID
      operationId: deleteProduct
      parameters:
      - name: id
        in: path
        description: Product ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Product deleted successfully
        '404':
          description: Product not found
        '403':
          description: Access denied
  /api/product:
    get:
      tags:
      - Products Service
      summary: Get all products
      description: Retrieves all products from the catalog
      operationId: getAllProducts
      responses:
        '200':
          description: List of products retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
    post:
      tags:
      - Products Service
      summary: Create a new product
      description: Adds a new product to the catalog
      operationId: addProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      responses:
        '201':
          description: Product created successfully
        '400':
          description: Invalid product request payload
        '403':
          description: Access denied
      security:
      - KeycloakBearerAuth: []
  /api/product/prices:
    post:
      tags:
      - Products Service
      summary: Get prices by SKUs
      description: Resolves authoritative product prices for a given list of SKUs
      operationId: getPricesBySkus
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: Product prices retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
  /api/order/{id}/ship:
    put:
      tags:
      - Orders Service
      summary: Ship an order
      description: Marks order as SHIPPED and dispatches event to Kafka
      operationId: shipOrder_1
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
    post:
      tags:
      - Orders Service
      summary: Ship an order
      description: Marks order as SHIPPED and dispatches event to Kafka
      operationId: shipOrder
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
  /api/order/{id}/deliver:
    put:
      tags:
      - Orders Service
      summary: Deliver an order
      description: Marks order as DELIVERED and dispatches event to Kafka
      operationId: deliverOrder_1
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
    post:
      tags:
      - Orders Service
      summary: Deliver an order
      description: Marks order as DELIVERED and dispatches event to Kafka
      operationId: deliverOrder
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
  /api/order/{id}/cancel:
    put:
      tags:
      - Orders Service
      summary: Cancel an order
      description: Cancels a placed order and restores stock in inventory service
      operationId: cancelOrder_1
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Order cancelled successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request or order already processed/cancelled
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
    post:
      tags:
      - Orders Service
      summary: Cancel an order
      description: Cancels a placed order and restores stock in inventory service
      operationId: cancelOrder
      parameters:
      - name: id
        in: path
        description: Order ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Order cancelled successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request or order already processed/cancelled
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
  /api/order:
    get:
      tags:
      - Orders Service
      summary: Get orders
      description: Retrieves orders. Administrators view all system orders; standard
        users retrieve exclusively their personal orders.
      operationId: getAllOrders
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
    post:
      tags:
      - Orders Service
      summary: Place a new purchase order
      description: Creates an order and decrements inventory. Supports distributed
        idempotency via X-Idempotency-Key header.
      operationId: placeOrder
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Unique UUID for request deduplication and safe retries
        required: false
        schema:
          pattern: ^[0-9a-fA-F\-]{36}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
        required: true
      responses:
        '201':
          description: Order created successfully or returned from idempotency cache
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation failed or business rule violation
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Concurrent request in progress with same idempotency key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '422':
          description: Idempotency key reused with different request payload
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '503':
          description: Downstream service unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderResponse'
      security:
      - KeycloakBearerAuth: []
  /api/order/funnel:
    post:
      tags:
      - Orders Service
      summary: Record conversion funnel telemetry event
      description: Asynchronously ingests user journey events such as CART_ADD, CHECKOUT_START,
        CHECKOUT_STEP
      operationId: recordFunnelEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelEventRequest'
        required: true
      responses:
        '202':
          description: Accepted
      security:
      - KeycloakBearerAuth: []
  /api/inventory/{sku}:
    get:
      tags:
      - Inventory Service
      summary: Check if product is in stock
      description: Returns true if the SKU has stock greater than 0
      operationId: isInStock
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          pattern: ^[A-Z0-9\-]{6,20}$
          type: string
      responses:
        '200':
          description: Stock status returned successfully
          content:
            '*/*':
              schema:
                type: boolean
        '400':
          description: Invalid SKU format
          content:
            '*/*':
              schema:
                type: boolean
      security:
      - KeycloakBearerAuth: []
    put:
      tags:
      - Inventory Service
      summary: Update stock quantity
      description: Adjusts stock quantity for a specific SKU
      operationId: updateStock
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          pattern: ^[A-Z0-9\-]{6,20}$
          type: string
      - name: quantity
        in: query
        required: true
        schema:
          minimum: 0
          type: integer
          format: int64
      responses:
        '200':
          description: Stock quantity updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Invalid SKU format or parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '403':
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
      security:
      - KeycloakBearerAuth: []
  /api/inventory:
    get:
      tags:
      - Inventory Service
      summary: Get all inventory items
      description: Retrieves current stock levels for all products
      operationId: getAllInventory
      responses:
        '200':
          description: Inventory items retrieved successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryResponse'
        '403':
          description: Access denied
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryResponse'
      security:
      - KeycloakBearerAuth: []
    post:
      tags:
      - Inventory Service
      summary: Save or update inventory
      description: Creates or sets the stock level for a SKU
      operationId: saveOrUpdateInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryRequest'
        required: true
      responses:
        '201':
          description: Inventory saved or updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Invalid inventory request payload
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '403':
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
      security:
      - KeycloakBearerAuth: []
  /api/inventory/increment:
    post:
      tags:
      - Inventory Service
      summary: Increment inventory stock
      description: Restores or adds stock for the specified order items on order
        cancellation/rollback (requires INTERNAL_SERVICE or ADMIN role)
      operationId: incrementStock
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemsRequest'
        required: true
      responses:
        '200':
          description: Stock incremented successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Invalid order items payload
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Authentication required
        '403':
          description: Access denied
      security:
      - KeycloakBearerAuth: []
  /api/inventory/in-stock:
    post:
      tags:
      - Inventory Service
      summary: Verify stock availability
      description: Verifies whether sufficient stock is available for requested order
        items
      operationId: areInStock
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemsRequest'
        required: true
      responses:
        '200':
          description: Stock check evaluated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Invalid order items payload
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
      security:
      - KeycloakBearerAuth: []
  /api/inventory/decrement:
    post:
      tags:
      - Inventory Service
      summary: Decrement inventory stock
      description: Deducts stock for the specified order items (requires INTERNAL_SERVICE
        or ADMIN role)
      operationId: decrementStock
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemsRequest'
        required: true
      responses:
        '200':
          description: Stock decremented successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Insufficient stock or invalid payload
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Authentication required
        '403':
          description: Access denied
      security:
      - KeycloakBearerAuth: []
  /api/inventory/detail/{sku}:
    get:
      tags:
      - Inventory Service
      summary: Get inventory details by SKU
      description: Retrieves stock details for a specific product SKU
      operationId: getInventoryDetail
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          pattern: ^[A-Z0-9\-]{6,20}$
          type: string
      responses:
        '200':
          description: Inventory details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '400':
          description: Invalid SKU format
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '403':
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InventoryResponse'
      security:
      - KeycloakBearerAuth: []
  /api/notifications/stream:
    get:
      tags:
      - Notification Service
      operationId: streamNotifications
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseEmitter'
components:
  securitySchemes:
    KeycloakBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak 26.8.1 OIDC Bearer Token (microservices-realm)
  schemas:
    ProductRequest:
      required:
      - name
      - price
      - sku
      - status
      type: object
      properties:
        sku:
          minLength: 1
          pattern: ^[A-Z0-9\-]{6,20}$
          type: string
        name:
          maxLength: 150
          minLength: 0
          pattern: ^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9.,'\-()"/&+%:#!*\[\] ]+$
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        price:
          minimum: 0.0
          exclusiveMinimum: true
          type: number
          format: double
        status:
          type: boolean
        imageUrl:
          type: string
        category:
          type: string
        rating:
          type: number
          format: double
        reviewCount:
          type: integer
          format: int32
        isBestSeller:
          type: boolean
        prices:
          type: object
          additionalProperties:
            type: number
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        status:
          type: boolean
        imageUrl:
          type: string
        category:
          type: string
        rating:
          type: number
          format: double
        reviewCount:
          type: integer
          format: int32
        isBestSeller:
          type: boolean
        prices:
          type: object
          additionalProperties:
            type: number
    OrderItemsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        price:
          type: number
          format: double
        quantity:
          type: integer
          format: int64
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
        userId:
          type: string
        username:
          type: string
        orderStatus:
          type: string
          enum:
          - PLACED
          - CANCELLED
          - SHIPPED
          - DELIVERED
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemsResponse'
        customerName:
          type: string
        customerEmail:
          type: string
        shippingAddress:
          type: string
        city:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        deliveryMethod:
          type: string
        trackingNumber:
          type: string
        carrier:
          type: string
        subtotalAmount:
          type: number
          format: double
        shippingFee:
          type: number
          format: double
        taxAmount:
          type: number
          format: double
        totalAmount:
          type: number
          format: double
        paymentMethod:
          type: string
    OrderItemsRequest:
      required:
      - quantity
      - sku
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          minLength: 1
          pattern: ^[A-Z0-9\-]{6,20}$
          type: string
        price:
          minimum: 0.0
          exclusiveMinimum: true
          type: number
          format: double
        quantity:
          minimum: 1
          type: integer
          format: int64
    OrderRequest:
      required:
      - customerName
      - orderItems
      - shippingAddress
      type: object
      properties:
        orderItems:
          maxItems: 100
          minItems: 0
          type: array
          items:
            $ref: '#/components/schemas/OrderItemsRequest'
        customerName:
          minLength: 1
          type: string
        customerEmail:
          type: string
          format: email
        shippingAddress:
          minLength: 1
          type: string
        city:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        deliveryMethod:
          type: string
        shippingFee:
          minimum: 0
          type: number
          format: double
        taxAmount:
          minimum: 0
          type: number
          format: double
        totalAmount:
          minimum: 0
          exclusiveMinimum: true
          type: number
          format: double
        paymentMethod:
          type: string
    FunnelEventRequest:
      type: object
      properties:
        eventType:
          type: string
        sku:
          type: string
        category:
          type: string
        step:
          type: string
    InventoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        quantity:
          type: integer
          format: int64
        isInStock:
          type: boolean
    InventoryRequest:
      required:
      - quantity
      - sku
      type: object
      properties:
        sku:
          minLength: 1
          pattern: ^[A-Z0-9\-]{6,20}$
          type: string
        quantity:
          minimum: 0
          type: integer
          format: int64
    BaseResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            type: string
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
