apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPodSecurityRestricted
metadata:
  name: enforce-pod-security-restricted
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    namespaces:
      - "dev"
      - "staging"
      - "prod"
      - "production"
  parameters:
    exemptContainers:
      - "istio-proxy"
      - "vault-agent"
      - "vault-agent-init"
