apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valid-database
spec:
  serviceName: valid-database
  selector:
    matchLabels:
      app: valid-database
  template:
    metadata:
      labels:
        app: valid-database
    spec:
      serviceAccountName: database-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: database
          image: postgres:18.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready"]
          readinessProbe:
            exec:
              command: ["pg_isready"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: valid-backup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          initContainers:
            - name: prepare
              image: busybox:1.36
              command: ["sh", "-c", "true"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
          containers:
            - name: backup
              image: postgres:18.0
              command: ["sh", "-c", "true"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop:
                    - ALL
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: OnFailure
