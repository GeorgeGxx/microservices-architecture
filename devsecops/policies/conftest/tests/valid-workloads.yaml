apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valid-database
spec:
  serviceName: valid-database
  selector:
    matchLabels:
      app: valid-database
  template:
    metadata:
      labels:
        app: valid-database
    spec:
      serviceAccountName: database-sa
      containers:
        - name: database
          image: postgres:18.0
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready"]
          readinessProbe:
            exec:
              command: ["pg_isready"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: valid-backup
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup-sa
          initContainers:
            - name: prepare
              image: busybox:1.36
              command: ["sh", "-c", "true"]
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
              livenessProbe:
                exec:
                  command: ["true"]
              readinessProbe:
                exec:
                  command: ["true"]
          containers:
            - name: backup
              image: postgres:18.0
              command: ["sh", "-c", "true"]
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
              livenessProbe:
                exec:
                  command: ["true"]
              readinessProbe:
                exec:
                  command: ["true"]
          restartPolicy: OnFailure
