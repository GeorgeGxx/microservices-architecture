apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: invalid-agent
spec:
  selector:
    matchLabels:
      app: invalid-agent
  template:
    metadata:
      labels:
        app: invalid-agent
    spec:
      serviceAccountName: default
      initContainers:
        - name: privileged-init
          image: busybox:1.36
          securityContext:
            privileged: true
      containers:
        - name: agent
          image: example/agent:latest
          resources:
            limits:
              cpu: 100m
---
apiVersion: batch/v1
kind: Job
metadata:
  name: invalid-job
spec:
  template:
    spec:
      containers:
        - name: worker
          image: example/worker
      restartPolicy: Never
