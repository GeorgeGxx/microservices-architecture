# Trivy Configuration File
severity:
  - CRITICAL
  - HIGH
ignore-unfixed: true
ignorefile: devsecops/compliance/trivy/.trivyignore
timeout: 10m
format: table
exit-code: 0 # Calibrated: Audit Mode / Soft-Gate. Change to 1 for Enforce / Blocking Mode
quiet: true
table-mode:
  - detailed
scan:
  skip-version-check: true
  skip-dirs:
    - devsecops/policies/conftest/tests
    - node_modules
    - .venv
    - .venv-ml
    - target
vulnerability:
  type:
    - os
    - library
