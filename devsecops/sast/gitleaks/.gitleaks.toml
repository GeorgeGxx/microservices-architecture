# Gitleaks Configuration - Enterprise DevSecOps Rule Set
title = "Microservices DevSecOps Gitleaks Profile"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for dummy/test values, local configs, and bootstrap scripts"
paths = [
  '''(?i).*/devsecops/.*\.rego$''',
  '''(?i).*\.example\.env$''',
  '''(?i).*\.env.*''',
  '''(?i).*values.*\.yaml$''',
  '''(?i).*/scripts/devsecops/.*''',
  '''(?i).*/k8s/minikube/.*''',
  '''(?i).*/terraform/.*\.tfvars.*''',
  '''(?i).*execution-config\.json$''',
  '''(?i).*/cosmo-router/.*'''
]
regexes = [
  '''(?i)dummy.*''',
  '''(?i)test-token''',
  '''(?i)CHANGE_ME''',
  '''(?i)admin''',
  '''(?i)mdIV7hoeQlOzQGSiYGzPfWXgt505pSbu''',
  '''(?i)\$2a\$10\$.*'''
]
