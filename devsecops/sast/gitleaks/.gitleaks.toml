# Gitleaks profile. Keep exceptions narrow and scoped to known non-secret data.
title = "Microservices DevSecOps Gitleaks Profile"

[extend]
useDefault = true

[allowlist]
description = "The root .env is a gitignored local secret store; scan .env.example and other dotenv files."
paths = [
  '''^\.env$'''
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Cosmo upstreamSchema.key values are schema content hashes, not credentials."
  condition = "AND"
  paths = [
    '''(^|/)cosmo-router/execution-config\.json$''',
    '''(^|/)deploy/helm/charts/cosmo-router/files/execution-config\.json$'''
  ]
  regexes = [
    '''^75c719fe0547c9a3a76a3340d619a60a52cfa35a$''',
    '''^1fc91a47c7bd76a2582ac2531aaad718899a9115$''',
    '''^689c4b476427a1ff714993a8144bf8f68de9d0c1$'''
  ]
