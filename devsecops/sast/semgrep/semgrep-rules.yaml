# ==============================================================================
# Centralized Semgrep SAST Policy Ruleset
# Governed by Platform Security & DevSecOps Architecture
# Version: 1.0.0 | Target Semgrep CLI: 1.110.0
# ==============================================================================
rules:
  - id: msa-no-hardcoded-bearer-or-jwt-secret
    message: "Hardcoded JWT secret or Bearer token detected in source code. Inject credentials from Vault, KMS, or environment variables."
    severity: ERROR
    languages:
      - typescript
      - javascript
      - python
    patterns:
      - pattern-either:
          - pattern: jwt.sign($PAYLOAD, "...", ...)
          - pattern: jwt.encode($PAYLOAD, "...", ...)
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH

  - id: msa-go-no-hardcoded-hmac-secret
    message: "Hardcoded HMAC/JWT secret detected in Go source code. Inject credentials from Vault, KMS, or environment variables."
    severity: ERROR
    languages:
      - go
    pattern: hmac.New($HASH, []byte("..."))
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH

  - id: msa-java-no-raw-sql-concatenation
    message: "Potential SQL injection via string concatenation in JDBC/JPA query. Use parameterized queries or Spring Data repositories."
    severity: ERROR
    languages:
      - java
    patterns:
      - pattern-either:
          - pattern: $EM.createQuery("..." + $VAR + "...")
          - pattern: $EM.createNativeQuery("..." + $VAR + "...")
          - pattern: $JDBC.query("..." + $VAR + "...", ...)
          - pattern: $JDBC.execute("..." + $VAR + "...")
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: msa-python-no-unsafe-subprocess-shell
    message: "Execution of subprocess with shell=True can lead to command injection. Pass command arguments as a list with shell=False."
    severity: ERROR
    languages:
      - python
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: msa-python-no-unsafe-yaml-load
    message: "Avoid yaml.load() without SafeLoader; use yaml.safe_load() to prevent arbitrary code execution."
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: yaml.load($DATA)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH

  - id: msa-ts-js-no-eval
    message: "Use of eval() or Function() constructor introduces code injection risks and violates CSP."
    severity: ERROR
    languages:
      - typescript
      - javascript
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: msa-go-no-tls-insecure-skip-verify
    message: "InsecureSkipVerify: true disables TLS certificate verification in Go HTTP clients."
    severity: ERROR
    languages:
      - go
    pattern: |
      &tls.Config{..., InsecureSkipVerify: true, ...}
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
