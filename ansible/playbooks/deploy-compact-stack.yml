---
# ==============================================================================
# 🤖 Master Ansible Playbook: Deploy Compact Microservices Stack
# Target: Single-Node Ubuntu Host (EC2 t3.xlarge / On-Premise)
# ==============================================================================
- name: Deploy Compact Microservices Stack
  hosts: microservices_hosts
  become: true
  vars:
    app_dir: /opt/microservices
    microservices_env_file: "{{ lookup('env', 'MICROSERVICES_ENV_FILE') }}"
    admin_cidr: "{{ hostvars[inventory_hostname].admin_cidr }}"

  tasks:
    - name: Require an operator-provided deployment environment file
      ansible.builtin.assert:
        that:
          - microservices_env_file | length > 0
          - microservices_env_file is match('^(?:/|[A-Za-z]:[\\\\/])')
          - microservices_env_file | basename != '.env.example'
          - admin_cidr | length > 0
        fail_msg: >-
          Set MICROSERVICES_ENV_FILE to an absolute, deployment-specific .env file
          (never .env.example) and define admin_cidr in the inventory.
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check the deployment environment file on the Ansible controller
      ansible.builtin.stat:
        path: "{{ microservices_env_file }}"
      register: deployment_env_file
      delegate_to: localhost
      become: false
      run_once: true

    - name: Require a regular deployment environment file
      ansible.builtin.assert:
        that:
          - deployment_env_file.stat.exists
          - deployment_env_file.stat.isreg
          - deployment_env_file.stat.size > 0
        fail_msg: "MICROSERVICES_ENV_FILE must point to an existing regular file."
      delegate_to: localhost
      become: false
      run_once: true

    # --------------------------------------------------------------------------
    # 1. SYSTEM PACKAGES & HARDENING
    # --------------------------------------------------------------------------
    - name: Require a supported Ubuntu host architecture
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: "The compact playbook supports Ubuntu on amd64 or arm64 hosts."

    - name: Update apt cache and install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - ufw
          - htop
        state: present
        update_cache: true

    - name: Set default-deny inbound firewall policy
      community.general.ufw:
        policy: deny
        direction: incoming

    - name: Keep outbound traffic available for updates and registries
      community.general.ufw:
        policy: allow
        direction: outgoing

    - name: Add restricted SSH rule before removing any legacy broad rule
      community.general.ufw:
        rule: limit
        from_ip: "{{ admin_cidr }}"
        port: "22"
        proto: tcp

    - name: Remove legacy unrestricted SSH and Router firewall rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        delete: true
      loop:
        - "22"
        - "8080"

    - name: Allow public storefront HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: Restrict direct GraphQL Router access to the administrator network
      community.general.ufw:
        rule: allow
        from_ip: "{{ admin_cidr }}"
        port: "8080"
        proto: tcp

    - name: Ensure UFW is enabled
      community.general.ufw:
        state: enabled

    # --------------------------------------------------------------------------
    # 2. DOCKER ENGINE INSTALLATION
    # --------------------------------------------------------------------------
    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE and Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Configure Docker daemon log rotation to prevent disk exhaustion
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "20m",
              "max-file": "3"
            }
          }

    - name: Ensure Docker service is running and enabled on boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # --------------------------------------------------------------------------
    # 3. APPLICATION STACK DEPLOYMENT
    # --------------------------------------------------------------------------
    - name: Create application deployment directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: docker
        mode: '0755'

    - name: Deploy docker-compose.compact.yml
      ansible.builtin.copy:
        src: ../templates/docker-compose.compact.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: docker
        mode: '0644'

    - name: Deploy database initialization script
      ansible.builtin.copy:
        src: ../templates/init-dbs.sql
        dest: "{{ app_dir }}/init-dbs.sql"
        owner: ubuntu
        group: docker
        mode: '0644'

    - name: Deploy Vault initialization script
      ansible.builtin.copy:
        src: ../../scripts/vault-init.sh
        dest: "{{ app_dir }}/vault-init.sh"
        owner: ubuntu
        group: docker
        mode: '0755'

    - name: Deploy Cosmo Router federation configuration
      ansible.builtin.copy:
        src: ../../cosmo-router/
        dest: "{{ app_dir }}/cosmo-router/"
        owner: ubuntu
        group: docker
        mode: '0644'

    - name: Deploy operator-managed .env configuration
      ansible.builtin.copy:
        src: "{{ microservices_env_file }}"
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: docker
        mode: '0600'
      no_log: true

    - name: Validate the rendered Compose configuration without printing secrets
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - config
          - --quiet
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      changed_when: false
      no_log: true

    # --------------------------------------------------------------------------
    # 4. SYSTEMD AUTO-HEALING SERVICE
    # --------------------------------------------------------------------------
    - name: Create systemd unit for automated stack auto-start & recovery
      ansible.builtin.copy:
        dest: /etc/systemd/system/microservices.service
        content: |
          [Unit]
          Description=Compact Enterprise Microservices Stack
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/docker compose up -d --remove-orphans
          ExecStop=/usr/bin/docker compose down
          ExecReload=/bin/sh -c '/usr/bin/docker compose pull && /usr/bin/docker compose up -d'
          TimeoutStartSec=300

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start microservices systemd service
      ansible.builtin.systemd:
        name: microservices
        state: started
        enabled: true

    # --------------------------------------------------------------------------
    # 5. POST-DEPLOYMENT VERIFICATION GATE
    # --------------------------------------------------------------------------
    - name: Wait for Cosmo Router GraphQL endpoint to become healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health/ready"
        status_code: 200
        timeout: 5
      register: router_probe
      until: router_probe.status == 200
      retries: 30
      delay: 5

    - name: Verify Frontend HTTP response
      ansible.builtin.uri:
        url: "http://127.0.0.1:80"
        status_code: [200, 304]
        timeout: 5

    - name: Print deployment success summary
      ansible.builtin.debug:
        msg: "✅ Compact Microservices Stack deployed successfully on {{ inventory_hostname }}!"
