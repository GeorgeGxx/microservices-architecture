apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-bcdr-backup
  namespace: data
  labels:
    app.kubernetes.io/name: postgres-bcdr-backup
    app.kubernetes.io/part-of: bcdr-governance
spec:
  # Execute automated backup snapshot every 6 hours (RPO < 6h for batch, continuous WAL streaming handles < 1m)
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-bcdr-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:18-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups"
                  echo "=== [BCDR] Starting Automated PostgreSQL Backup at ${TIMESTAMP} ==="
                  
                  # Databases to snapshot
                  DATABASES="db_keycloak ms_inventory ms_orders ms_products"
                  
                  for DB in $DATABASES; do
                    echo "Backing up ${DB}..."
                    if [ "$DB" = "db_keycloak" ]; then
                      HOST="db-keycloak.auth.svc.cluster.local"
                    elif [ "$DB" = "ms_inventory" ]; then
                      HOST="db-inventory.data.svc.cluster.local"
                    elif [ "$DB" = "ms_orders" ]; then
                      HOST="db-orders.data.svc.cluster.local"
                    elif [ "$DB" = "ms_products" ]; then
                      HOST="db-products.data.svc.cluster.local"
                    fi
                    
                    pg_dump -h $HOST -U postgres -d $DB -F c -b -v -f "${BACKUP_DIR}/${DB}_${TIMESTAMP}.dump"
                    echo "Snapshot created: ${BACKUP_DIR}/${DB}_${TIMESTAMP}.dump"
                  done
                  
                  echo "=== [BCDR] All database snapshots completed successfully ==="
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: microservices-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              emptyDir: {}
