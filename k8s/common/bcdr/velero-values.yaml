# ==============================================================================
# 🛡️ Velero Server v1.18.3 Helm Values Manifest
# Enterprise Multi-Cloud Disaster Recovery & Stateful Volume Backup
# ==============================================================================
image:
  repository: velero/velero
  tag: v1.18.3
  pullPolicy: IfNotPresent

# Backup storage plugins for Cloud or On-Prem / Minikube
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /plugins
        name: plugins

# Enable Node-Agent (Kopia) DaemonSet for file-system level PVC backups.
# Required by: defaultVolumesToFsBackup: true in velero-schedule.yaml
deployNodeAgent: true

nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

# Storage Backend Configuration
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: ${VELERO_BUCKET:-microservices-bcdr-backups}
      prefix: ${VELERO_PREFIX:-cluster-backups}
      config:
        region: ${AWS_DEFAULT_REGION:-us-east-1}
        # For local MinIO (Minikube / Dev):
        # s3Url: http://minio.data.svc.cluster.local:9000
        # s3ForcePathStyle: "true"
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: ${AWS_DEFAULT_REGION:-us-east-1}

  # Global backup configuration
  features: EnableCSI
  extraEnvVars:
    VELERO_SCRATCH_DIR: /scratch

# Server execution policies and resource limits
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Metrics exposure for the LGTM stack Prometheus TSDB (:9090)
metrics:
  enabled: true
  scrapeInterval: 30s
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
