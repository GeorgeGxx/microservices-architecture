# ==============================================================================
# cert-manager ClusterIssuers for Automated TLS Certificate Rotation
# Manages public Let's Encrypt certificates and internal private CA certificates.
# ==============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops-security@example.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            class: istio
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops-security@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: istio
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Automatic Certificate request for production edge domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microservices-edge-tls-cert
  namespace: istio-system
spec:
  secretName: microservices-tls-cert
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "msa.example.com"
    - "*.msa.example.com"
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days before expiration auto-renewal
