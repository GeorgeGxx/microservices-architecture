# ==============================================================================
# Production Vault ClusterSecretStore (Zero-Token Kubernetes Native Auth)
# Eliminates static 'root' or permanent Vault tokens. Authenticates via ServiceAccount JWT.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-k8s-cluster-secret-store
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "microservices-role"
          serviceAccountRef:
            name: "vault-k8s-auth-sa"
            namespace: "vault"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-k8s-auth-sa
  namespace: vault
