# ==============================================================================
# Production ExternalSecret: Automated Secret Rotation & Drift Detection
# Automatically refreshes credentials every 1 hour from the Vault/Cloud SecretStore.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: microservices-production-secrets
  namespace: prod
spec:
  refreshInterval: "1h" # Automatic 1-hour secret rotation sync
  secretStoreRef:
    name: vault-k8s-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: microservices-secrets
    creationPolicy: Owner # Kubernetes Secret lifecycle owned and cleaned up by ESO
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/data/production/database
        property: password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/data/production/database
        property: username
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: secret/data/production/keycloak
        property: client-secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/data/production/jwt
        property: secret-key
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: secret/data/production/payments
        property: stripe-api-key
