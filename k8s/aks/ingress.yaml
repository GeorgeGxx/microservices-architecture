apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: microservices-gateway
  namespace: dev
spec:
  selector:
    istio: ingressgateway # Ingress Gateway pod selector deployed in your cluster
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      tls:
        httpsRedirect: true # Equivalent to nginx.ingress.kubernetes.io/ssl-redirect: "true"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*"
      tls:
        mode: SIMPLE
        credentialName: microservices-tls-cert # Secret with TLS certificate in the Istio namespace
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: microservices-virtualservice
  namespace: dev
spec:
  hosts:
    - "*"
  gateways:
    - microservices-gateway
  http:
    - name: graphql-route
      match:
        - uri:
            prefix: /graphql
      timeout: 60s # Equivalent to nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      headers:
        response:
          set:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
      route:
        - destination:
            host: cosmo-router.dev.svc.cluster.local
            port:
              number: 8080

    - name: frontend-routes
      match:
        - uri:
            prefix: /
      timeout: 60s
      headers:
        response:
          set:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
      route:
        - destination:
            host: frontend.dev.svc.cluster.local
            port:
              number: 80
