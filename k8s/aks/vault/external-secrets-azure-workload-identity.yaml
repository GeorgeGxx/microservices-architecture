# ==============================================================================
# Azure AKS Key Vault SecretStore using Azure Workload Identity
# Eliminates service principal secrets. Uses federated OIDC authentication.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: prod
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-microservices-prod.vault.azure.net"
      serviceAccountRef:
        name: azure-workload-identity-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-workload-identity-sa
  namespace: prod
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  labels:
    azure.workload.identity/use: "true"
