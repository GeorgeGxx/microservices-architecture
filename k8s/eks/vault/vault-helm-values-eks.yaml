# ==============================================================================
# HashiCorp Vault Helm Chart Values for AWS EKS (Production Grade)
# Install via: helm repo add hashicorp https://helm.releases.hashicorp.com
#              helm install vault hashicorp/vault -n vault --create-namespace -f vault-helm-values-eks.yaml
# ==============================================================================

global:
  enabled: true
  tlsDisable: false

server:
  image:
    repository: "hashicorp/vault"
    tag: "2.0.4"

  # AWS IRSA (IAM Roles for Service Accounts)
  serviceAccount:
    create: true
    name: "vault-server"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/VaultEKSAutoUnsealRole"

  # High-Availability (HA) Raft Integrated Storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
        }

        # AWS KMS Auto-Unseal (Zero-touch unseal)
        seal "awskms" {
          region     = "us-east-1"
          kms_key_id = "alias/vault-unseal-key"
        }

        service_registration "kubernetes" {}

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: "gp3" # AWS EBS CSI Driver GP3

# Vault Agent Sidecar Injector (Injects secrets automatically into pods)
injector:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Web UI
ui:
  enabled: true
  serviceType: "ClusterIP"
