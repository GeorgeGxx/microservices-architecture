# ==============================================================================
# AWS EKS Secrets Manager SecretStore using IAM Roles for Service Accounts (IRSA)
# Eliminates AWS Access Keys. Authenticates using temporary STS assume role.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager-store
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: aws-irsa-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-irsa-secrets-sa
  namespace: prod
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/microservices-secrets-irsa-role"
