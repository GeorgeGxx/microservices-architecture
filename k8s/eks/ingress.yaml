apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-eks
  namespace: dev
  annotations:
    # Traefik Ingress Controller L7 Configuration for AWS EKS
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.middlewares: dev-strip-prefix@kubernetescrd, dev-rate-limit@kubernetescrd
    # AWS Network Load Balancer (L4) Target Integration
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# Traefik Middlewares for L7 Ingress Hardening on EKS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: dev
spec:
  stripPrefix:
    prefixes:
      - /strip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: dev
spec:
  rateLimit:
    average: 100
    burst: 50
