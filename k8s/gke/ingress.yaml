apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: microservices-gateway-gke
  namespace: dev
spec:
  selector:
    istio: ingressgateway # Ingress Gateway Selector in GKE
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      tls:
        httpsRedirect: true # HTTP to HTTPS Redirect
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*"
      tls:
        mode: SIMPLE
        credentialName: microservices-tls-cert # Secret TLS in the gateway namespace (eg. istio-system)
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: microservices-virtualservice-gke
  namespace: dev
spec:
  hosts:
    - "*"
  gateways:
    - microservices-gateway-gke
  http:
    - name: api-routes
      match:
        - uri:
            prefix: /api
        - uri:
            prefix: /actuator
      # Equivalent to kong-security-headers plugin
      headers:
        response:
          set:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
      # Istio does not rewrite the URI by default (maintains strip-path: false)
      route:
        - destination:
            host: api-gateway.dev.svc.cluster.local
            port:
              number: 8080

    - name: frontend-routes
      match:
        - uri:
            prefix: /
      headers:
        response:
          set:
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            X-XSS-Protection: 1; mode=block
      route:
        - destination:
            host: frontend.dev.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingress-local-ratelimit-gke
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: http_local_rate_limiter
            token_bucket:
              max_tokens: 300
              tokens_per_fill: 300
              fill_interval: 60s # Equivalent to 300 requests per minute
            filter_enabled:
              runtime_key: local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header:
                  key: x-local-rate-limit
                  value: 'true'
            status:
              code: 429
---
service:
  type: LoadBalancer
  annotations:
    cloud.google.com/load-balancer-type: "External" #[cite: 3]

