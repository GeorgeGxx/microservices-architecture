apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress-gke
  namespace: default
  annotations:
    # GKE Ingress Controller (GCE HTTP/HTTPS Load Balancer)
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /actuator/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
