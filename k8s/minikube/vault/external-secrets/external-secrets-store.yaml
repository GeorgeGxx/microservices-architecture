apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: ecommerce
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Method 1: Kubernetes ServiceAccount Token Review (Production / Cluster Native)
        kubernetes:
          mountPath: "kubernetes"
          role: "microservices-role"
          serviceAccountRef:
            name: "default"
