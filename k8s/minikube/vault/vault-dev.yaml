apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-tokenreview-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  type: NodePort
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30820
  selector:
    app: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: dev
spec:
  type: ExternalName
  externalName: vault.vault.svc.cluster.local
  ports:
    - name: http
      port: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: vault
          image: hashicorp/vault:2.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "root"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            - name: VAULT_LOCAL_CONFIG
              value: '{"disable_mlock": true, "telemetry": {"prometheus_retention_time": "30s", "disable_hostname": true, "unauthenticated_metrics_access": true}}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      if vault status >/dev/null 2>&1; then
                        break
                      fi
                      sleep 1
                    done
                    vault secrets enable -path=secret kv-v2 2>/dev/null || true
                    vault kv put secret/application spring.datasource.username=postgres spring.datasource.password=admin jwt.secret=super-secure-jwt-secret-key-for-microservices-dev-environment-12345 2>/dev/null || true
                    vault kv put secret/products-service spring.datasource.username=postgres spring.datasource.password=admin 2>/dev/null || true
                    vault kv put secret/orders-service spring.datasource.username=postgres spring.datasource.password=admin 2>/dev/null || true
                    vault kv put secret/inventory-service spring.datasource.username=postgres spring.datasource.password=admin 2>/dev/null || true
                    vault kv put secret/notification-service spring.mail.username=notification@microservices.local spring.mail.password=dev-mail-password 2>/dev/null || true
                    vault secrets enable transit 2>/dev/null || true
                    vault write -f transit/keys/microservices-data-key type=aes256-gcm96 2>/dev/null || true
                    vault secrets enable database 2>/dev/null || true
                    # Products Database
                    vault write database/config/postgres-products \
                      plugin_name="postgresql-database-plugin" \
                      allowed_roles="products-db-role" \
                      connection_url="postgresql://{{username}}:{{password}}@db-products.data.svc.cluster.local:5432/ms_products?sslmode=disable" \
                      username="postgres" \
                      password="admin" 2>/dev/null || true
                    vault write database/roles/products-db-role \
                      db_name="postgres-products" \
                      creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
                      default_ttl="1h" \
                      max_ttl="24h" 2>/dev/null || true
                    # Orders Database
                    vault write database/config/postgres-orders \
                      plugin_name="postgresql-database-plugin" \
                      allowed_roles="orders-db-role" \
                      connection_url="postgresql://{{username}}:{{password}}@db-orders.data.svc.cluster.local:5432/ms_orders?sslmode=disable" \
                      username="postgres" \
                      password="admin" 2>/dev/null || true
                    vault write database/roles/orders-db-role \
                      db_name="postgres-orders" \
                      creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
                      default_ttl="1h" \
                      max_ttl="24h" 2>/dev/null || true
                    # Inventory Database
                    vault write database/config/postgres-inventory \
                      plugin_name="postgresql-database-plugin" \
                      allowed_roles="inventory-db-role" \
                      connection_url="postgresql://{{username}}:{{password}}@db-inventory.data.svc.cluster.local:5432/ms_inventory?sslmode=disable" \
                      username="postgres" \
                      password="admin" 2>/dev/null || true
                    vault write database/roles/inventory-db-role \
                      db_name="postgres-inventory" \
                      creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
                      default_ttl="1h" \
                      max_ttl="24h" 2>/dev/null || true
          startupProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
    release: kube-prometheus
spec:
  namespaceSelector:
    matchNames:
      - vault
  selector:
    matchLabels:
      app: vault
  endpoints:
    - port: http
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: 15s
      scrapeTimeout: 10s
