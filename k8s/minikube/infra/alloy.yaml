apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    local.file_match "pod_logs" {
      path_targets = [
        {
          __path__ = "/var/log/pods/*/*/*.log",
        },
      ]
    }

    loki.source.file "pods" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.cri {}
      stage.regex {
        expression = "^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[a-f0-9-]+/(?P<container>[^/]+)/.*\\.log$"
        source     = "filename"
      }
      stage.template {
        source   = "service"
        template = "{{ .container }}"
      }
      stage.template {
        source   = "app"
        template = "{{ .container }}"
      }
      stage.labels {
        values = {
          namespace = "",
          pod       = "",
          container = "",
          service   = "",
          app       = "",
        }
      }
      forward_to = [loki.write.endpoint.receiver]
    }

    loki.write "endpoint" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: observability
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
        sidecar.istio.io/inject: "false"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.1
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--storage.path=/var/lib/alloy/data"
            - "--server.http.listen-addr=0.0.0.0:3300"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
            runAsUser: 0
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
