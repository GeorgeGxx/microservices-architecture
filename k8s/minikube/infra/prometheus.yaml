apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-role
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/prometheus-rules.yml
    scrape_configs:
      - job_name: 'spring-microservices'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [dev]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (cosmo-router|products-service|inventory-service|orders-service|notification-service)
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
            action: keep
            regex: (cosmo-router;9090|products-service;8004|inventory-service;8001|orders-service;8003|notification-service;8002)
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: (cosmo-router|products-service|inventory-service|orders-service|notification-service)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: __metrics_path__
            regex: cosmo-router
            replacement: /metrics
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: __metrics_path__
            regex: inventory-service
            replacement: /actuator/inventory/prometheus
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: __metrics_path__
            regex: notification-service
            replacement: /actuator/notification/prometheus
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: __metrics_path__
            regex: orders-service
            replacement: /actuator/orders/prometheus
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: __metrics_path__
            regex: products-service
            replacement: /actuator/products/prometheus
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: 'envoy-stats'
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [dev, auth, data]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: istio-proxy
          - source_labels: [__meta_kubernetes_pod_ip]
            replacement: $1:15090
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance

      - job_name: 'istiod'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [istio-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: istiod;http-monitoring

      - job_name: 'vault'
        metrics_path: /v1/sys/metrics
        params:
          format: ['prometheus']
        bearer_token: 'root'
        static_configs:
          - targets: ['vault.vault.svc.cluster.local:8200']
            labels: {service: vault}
      - job_name: 'redis'
        static_configs:
          - targets: ['redis.data.svc.cluster.local:9121']
            labels: {service: redis}
      - job_name: 'keycloak'
        static_configs:
          - targets: ['keycloak.auth.svc.cluster.local:9000']
            labels: {service: keycloak}
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka-exporter.data.svc.cluster.local:9308']
            labels: {service: kafka}
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter.data.svc.cluster.local:9187']
            labels: {service: postgres}
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus.observability.svc.cluster.local:9090']
      - job_name: 'loki'
        static_configs:
          - targets: ['loki.observability.svc.cluster.local:3100']
      - job_name: 'tempo'
        static_configs:
          - targets: ['tempo.observability.svc.cluster.local:3200']
      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy.observability.svc.cluster.local:3300']

  prometheus-rules.yml: |
    groups:
      - name: microservices-architecture-alerts
        rules:
          - alert: ObservabilityTargetDown
            expr: up{job=~"prometheus|loki|tempo|alloy"} == 0
            for: 5m
            labels:
              severity: warning
              category: observability
            annotations:
              summary: "Observability target {{ $labels.job }} is down"
              description: "Prometheus has not scraped {{ $labels.job }} successfully for 5 minutes."

          - alert: ServiceDown
            expr: up{service=~"cosmo-router|products-service|inventory-service|orders-service|notification-service"} == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} is down"
              description: "Service {{ $labels.service }} has been unreachable for more than 3 minutes."

          - alert: CosmoRouterHighErrorRate
            expr: |
              sum(rate(router_http_requests_error_total{wg_subgraph_name=""}[5m]))
              / sum(rate(router_http_requests_total{wg_subgraph_name=""}[5m])) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cosmo Router failed-request rate is high"
              description: "More than 5% of Cosmo Router GraphQL requests failed over the last 5 minutes."

          - alert: CosmoRouterHighLatency
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(router_http_request_duration_milliseconds_bucket{wg_subgraph_name=""}[5m]))) > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cosmo Router P95 latency is high"
              description: "Cosmo Router request latency P95 has exceeded 1 second for 5 minutes."

          - alert: CosmoRouterHighTraffic
            expr: sum(rate(router_http_requests_total{wg_subgraph_name=""}[1m])) > 150
            for: 1m
            labels:
              severity: warning
              category: traffic
            annotations:
              summary: "Cosmo Router request rate is unusually high"
              description: "Cosmo Router has exceeded 150 HTTP requests per second for one minute."

          - alert: CosmoRouterHigh429Rate
            expr: sum(rate(router_http_requests_total{wg_subgraph_name="", http_status_code="429"}[1m])) > 25
            for: 1m
            labels:
              severity: warning
              category: security
            annotations:
              summary: "Cosmo Router is returning many HTTP 429 responses"
              description: "More than 25 HTTP 429 responses per second have been observed for one minute."

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.retention.size=4GB"
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http-prom
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: dev
spec:
  type: ExternalName
  externalName: prometheus.observability.svc.cluster.local
  ports:
    - name: http-prom
      port: 9090
      targetPort: 9090
