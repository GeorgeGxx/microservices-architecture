apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: staging
data:
  GATEWAY_SERVICE_NAME: "api-gateway"
  GATEWAY_PORT: "8080"
  INVENTORY_SERVICE_NAME: "inventory-service"
  NOTIFICATION_SERVICE_NAME: "notification-service"
  ORDERS_SERVICE_NAME: "orders-service"
  PRODUCTS_SERVICE_NAME: "products-service"

  # 🔹 Native Service Discovery (CoreDNS / Istio Mesh)
  INVENTORY_SERVICE_URI: "http://inventory-service:8001"
  ORDERS_SERVICE_URI: "http://orders-service:8003"
  PRODUCTS_SERVICE_URI: "http://products-service:8004"
  NOTIFICATION_SERVICE_URI: "http://notification-service:8002"

  KEYCLOAK_ISSUER_URI: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm"
  KEYCLOAK_JWT_URI: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs"
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_ENABLED: "false"
  INVENTORY_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-inventory.data.svc.cluster.local:5432/ms_inventory"
  ORDERS_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-orders.data.svc.cluster.local:5432/ms_orders"
  PRODUCTS_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-products.data.svc.cluster.local:5432/ms_products"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.data.svc.cluster.local:9094"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"app\" password=\"microservices-kafka-secret\";"
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: "PLAIN"
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"app\" password=\"microservices-kafka-secret\";"

  # Redis (Cache / Rate Limiter)
  REDIS_HOST: "redis.data.svc.cluster.local"
  REDIS_PORT: "6379"

  # OpenTelemetry & Tracing (Tempo in-cluster endpoint)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=microservices"

  # 🔹 Platform Tools & Infrastructure Versions Alignment
  KEYCLOAK_VERSION: "26.7.3"
  POSTGRES_VERSION: "17-alpine"
  KAFKA_VERSION: "7.8.0"
  REDIS_VERSION: "8.8.1-alpine"
  PROM_VERSION: "v3.14.0"
  GRAFANA_VERSION: "13.2.1"
  LOKI_VERSION: "3.7.4"
  TEMPO_VERSION: "3.0.3"
  TEMPO_FALLBACK_VERSION: "3.0.2"
  ALLOY_VERSION: "v1.18.1"
  OTEL_COLLECTOR_VERSION: "0.159.0"
  VAULT_VERSION: "2.0.4"
  ARGOCD_VERSION: "3.5.2"
  ARGOCD_HELM_CHART_VERSION: "10.8.0"
  GATEKEEPER_VERSION: "3.23.1"
  KUBE_PROMETHEUS_STACK_VERSION: "89.2.2"
  REDIS_EXPORTER_VERSION: "v1.82.0"
  KAFKA_EXPORTER_VERSION: "v1.9.0"
  POSTGRES_EXPORTER_VERSION: "v0.20.1"
  JAVA_TOOL_OPTIONS: "-XX:+ExitOnOutOfMemoryError -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

---
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
  namespace: staging
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: <password>
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: <password>
  REDIS_PASSWORD: <password>
  # Automatically injected when running: python scripts/bootstrap_keycloak.py
  KEYCLOAK_CLIENT_SECRET: <YOUR_KEYCLOAK_CLIENT_SECRET>
