    function httpRequestInternal({ host, port, path, method = 'GET', body = '', timeoutMs = 2800 }) {
      return new Promise((resolve) => {
        const start = Date.now();
        const headers = { 'Accept': 'application/json, text/plain, */*' };
        if (body) {
          headers['Content-Type'] = 'application/json';
          headers['Content-Length'] = Buffer.byteLength(body);
        }
        const req = http.request({ host, port, path, method, headers, timeout: timeoutMs }, (res) => {
          const chunks = [];
          res.on('data', (c) => chunks.push(c));
          res.on('end', () => {
            const raw = Buffer.concat(chunks).toString('utf8');
            const latencyMs = Date.now() - start;
            const ok = res.statusCode >= 200 && res.statusCode < 400;
            resolve({ ok, status: res.statusCode, latencyMs, raw: raw.slice(0, 12000) });
          });
        });
        req.on('timeout', () => {
          req.destroy();
          resolve({ ok: false, status: 504, latencyMs: Date.now() - start, raw: 'Timeout connecting to in-cluster target' });
        });
        req.on('error', (err) => {
          resolve({ ok: false, status: 502, latencyMs: Date.now() - start, raw: err.message });
        });
        if (body) req.write(body);
        req.end();
      });
    }

    async function probeAllServices() {
      const entries = Object.entries(INTERNAL_TARGETS);
      const results = await Promise.all(entries.map(async ([name, cfg]) => {
        const r = await httpRequestInternal({ host: cfg.host, port: cfg.port, path: cfg.healthPath, method: 'GET', timeoutMs: 2200 });
        return [name, {
          name,
          category: cfg.category,
          target: `${cfg.host}:${cfg.port}${cfg.healthPath}`,
          status: r.ok ? 'UP' : 'DOWN',
          badgeLabel: r.ok ? (cfg.label || 'UP') : 'DOWN',
          httpCode: r.status,
          latencyMs: r.latencyMs,
          checkedAt: new Date().toISOString()
        }];
      }));
      return Object.fromEntries(results);
    }

    function generateScaffoldBundle(params) {
      const name = String(params.name || 'promotions-service').toLowerCase().replace(/[^a-z0-9-]/g, '-');
      const title = String(params.title || 'Promotions Microservice');
      const domain = String(params.domain || 'commerce');
      const system = String(params.system || 'novashop-commerce-system');
      const owner = String(params.owner || 'group:developers');
      const stack = String(params.stack || 'spring-boot');
      const port = Number(params.port || 8089);
      const enablePostgres = Boolean(params.enablePostgres !== false);
      const enableKafka = Boolean(params.enableKafka !== false);
      const enableKeda = Boolean(params.enableKeda !== false);

      const deps = [];
      if (enablePostgres) deps.push('    - resource:postgresql-databases');
      if (enableKafka) deps.push('    - resource:kafka-event-streaming');

      const catalogYaml = `apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${name}
      title: ${title}
      description: Golden Path scaffolded ${stack} microservice in domain ${domain}
      annotations:
        github.com/project-slug: GeorgeGxx/microservices-architecture
        backstage.io/kubernetes-id: ${name}
        argocd/app-name: microservices-dev
        sonarqube.org/project-key: msa-${name}
        devsecops.georgegxx.dev/sast-scanner: semgrep-1.110.0
        devsecops.georgegxx.dev/container-scanner: trivy-0.76.1
        devsecops.georgegxx.dev/supply-chain-signing: cosign-3.1.3
    spec:
      type: service
      lifecycle: production
      owner: ${owner}
      system: ${system}
      providesApis:
        - ${name}-rest-api
    ${deps.length ? '  dependsOn:\n' + deps.join('\n') : ''}`;

      const workflowYaml = `name: ${title} CI/CD

    on:
      push:
        branches: [develop]
        paths:
          - '${name}/**'
          - '.github/workflows/_service-ci-cd-template.yml'
          - '.github/workflows/service-${name}.yml'
      pull_request:
        branches: [develop]
        paths:
          - '${name}/**'
      workflow_dispatch:
        inputs:
          image-tag:
            description: 'Explicit SemVer release tag to publish (e.g. 1.1.0; required when publish-to-registry is true)'
            required: false
            type: string
            default: ''
          publish-to-registry:
            description: 'Publish release image to Docker Registry (enforces 2-version Active + Rollback retention)'
            required: false
            type: boolean
            default: false

    concurrency:
      group: ${name}-\${{ github.ref }}
      cancel-in-progress: true

    jobs:
      pipeline:
        uses: ./.github/workflows/_service-ci-cd-template.yml
        with:
          service-name: ${name}
          service-type: ${stack}
          service-dir: ${name}
          image-tag: \${{ inputs.image-tag || '' }}
          publish-to-registry: \${{ inputs.publish-to-registry == true && inputs.image-tag != '' }}`;

      const helmValuesYaml = `${name}:
      replicaCount: 1
      image:
        repository: georgegxx/${name}
        tag: "1.0.0"
        pullPolicy: IfNotPresent
      service:
        port: ${port}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      keda:
        enabled: ${enableKeda}
        minReplicaCount: 1
        maxReplicaCount: 4`;

      return { catalogYaml, workflowYaml, helmValuesYaml };
    }

