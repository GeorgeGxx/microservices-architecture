        .card h3 { font-size: 15.5px; color: var(--text-main); }
        .card p { font-size: 12.8px; color: var(--text-muted); line-height: 1.45; }
        .card ul { padding-left: 18px; font-size: 12.3px; color: var(--text-muted); }
        .card li { margin-bottom: 4px; }
        .btn-link {
          display: inline-block;
          margin-top: auto;
          padding: 7px 12px;
          border-radius: 6px;
          background: rgba(56, 189, 248, 0.14);
          color: var(--accent);
          text-decoration: none;
          font-size: 12px;
          font-weight: 600;
          width: fit-content;
        }
        .btn-link:hover { background: rgba(56, 189, 248, 0.25); }
        .hidden { display: none; }
      </style>
    </head>
    <body>
      <aside>
        <div class="brand">
          <div class="brand-logo">B</div>
          <div>
            <div class="brand-title">Backstage IDP</div>
            <div class="brand-sub">v1.36.0 • Multi-Cloud Portal</div>
          </div>
        </div>
        <button class="nav-btn active" onclick="showTab('catalog', this)">📦 Software Catalog</button>
        <button class="nav-btn" onclick="showTab('apis', this)">🔌 APIs & Subgraphs</button>
        <button class="nav-btn" onclick="showTab('domains', this)">🏛️ Domains & Resources</button>
        <button class="nav-btn" onclick="showTab('templates', this)">🚀 Golden Path Templates</button>
        <button class="nav-btn" onclick="showTab('portals', this)">🌐 Platform Ecosystem Links</button>
        <div class="sidebar-footer">
          <strong>● Operational Independence</strong>
          Decoupled from runtime request path • Synced with Argo CD v3.6.1 & Keycloak OIDC
        </div>
      </aside>
      <main>
        <header>
          <div>
            <h1>Enterprise Microservices Developer Portal</h1>
            <p>Unified Software Catalog, Federated GraphQL APIs, Golden Path Scaffolder & GitOps Topology</p>
          </div>
          <div class="badges">
            <span class="badge green">Argo CD v3.6.1 Synced</span>
            <span class="badge blue">Semgrep & Trivy: 0 Findings</span>
            <span class="badge purple">AWS • Azure • GCP • Minikube</span>
          </div>
        </header>

        <div class="stats-grid" id="stats"></div>

        <section id="tab-catalog">
          <div class="toolbar">
            <input type="search" id="searchInput" placeholder="Filter services by name, tech stack, system, or owner..." oninput="renderCatalog()" />
            <select id="domainFilter" onchange="renderCatalog()">
              <option value="">All Domains</option>
              <option value="commerce-domain">commerce-domain</option>
              <option value="data-and-ai-domain">data-and-ai-domain</option>
              <option value="platform-engineering-domain">platform-engineering-domain</option>
            </select>
          </div>
          <table>
            <thead>
              <tr>
                <th>Component</th>
                <th>Domain / System</th>
                <th>Technology Stack</th>
                <th>Owner</th>
                <th>Lifecycle</th>
                <th>Local Port</th>
              </tr>
            </thead>
            <tbody id="catalogBody"></tbody>
          </table>
        </section>

        <section id="tab-apis" class="hidden">
          <div class="cards-grid" id="apisGrid"></div>
        </section>

        <section id="tab-domains" class="hidden">
          <div class="cards-grid" id="domainsGrid"></div>
        </section>

        <section id="tab-templates" class="hidden">
          <div class="cards-grid" id="templatesGrid"></div>
        </section>

        <section id="tab-portals" class="hidden">
          <div class="cards-grid" id="portalsGrid"></div>
        </section>
      </main>

      <script>
        const data = ${JSON.stringify(CATALOG_DATA)};

        function init() {
          document.getElementById('stats').innerHTML = [
            { v: data.components.length, l: 'Catalog Microservices & Apps' },
            { v: data.apis.length, l: 'GraphQL & OpenAPI Contracts' },
            { v: data.resources.length, l: 'Stateful & Security Resources' },
            { v: data.templates.length, l: 'Golden Path Scaffolder Templates' },
            { v: data.domains.length, l: 'Bounded Architecture Domains' }
          ].map(s => '<div class="stat-card"><div class="stat-value">' + s.v + '</div><div class="stat-label">' + s.l + '</div></div>').join('');

          renderCatalog();

          document.getElementById('apisGrid').innerHTML = data.apis.map(a =>
            '<div class="card">' +
              '<div><span class="pill">' + a.type.toUpperCase() + '</span> <span class="pill domain">' + a.system + '</span></div>' +
              '<h3>' + a.name + '</h3>' +
              '<p>' + a.description + '</p>' +
              '<p><strong>Owner:</strong> ' + a.owner + '</p>' +
              '<a class="btn-link" href="' + a.endpoint + '" target="_blank" rel="noopener">Open Endpoint ↗</a>' +
            '</div>'
          ).join('');

          document.getElementById('domainsGrid').innerHTML =
            data.domains.map(d =>
              '<div class="card">' +
                '<div><span class="pill domain">DOMAIN</span></div>' +
                '<h3>' + d.name + '</h3>' +
                '<p>' + d.description + '</p>' +
                '<p><strong>Owner:</strong> ' + d.owner + ' • <strong>Systems:</strong> ' + d.systems.join(', ') + '</p>' +
              '</div>'
            ).join('') +
            data.resources.map(r =>
              '<div class="card">' +
                '<div><span class="pill">' + r.type.toUpperCase() + '</span></div>' +
                '<h3>' + r.name + '</h3>' +
                '<p>' + r.description + '</p>' +
                '<p><strong>Technology:</strong> ' + r.tech + '</p>' +
              '</div>'
            ).join('');

          document.getElementById('templatesGrid').innerHTML = data.templates.map(t =>
            '<div class="card">' +
              '<div><span class="pill prod">' + t.language + '</span></div>' +
              '<h3>' + t.title + '</h3>' +
              '<p><code>' + t.path + '</code></p>' +
              '<ul>' + t.features.map(f => '<li>' + f + '</li>').join('') + '</ul>' +
            '</div>'
          ).join('');

          document.getElementById('portalsGrid').innerHTML = data.portals.map(p =>
            '<div class="card">' +
              '<div><span class="pill">' + p.category + '</span> <span class="pill prod">' + p.status + '</span></div>' +
              '<h3>' + p.name + '</h3>' +
              '<p><code>' + p.url + '</code></p>' +
              '<a class="btn-link" href="' + p.url + '" target="_blank" rel="noopener">Launch Portal ↗</a>' +
            '</div>'
          ).join('');
        }

        function renderCatalog() {
          const q = (document.getElementById('searchInput').value || '').toLowerCase();
          const dom = document.getElementById('domainFilter').value;
          const rows = data.components.filter(c => {
            if (dom && c.domain !== dom) return false;
            return !q || [c.name, c.tech, c.system, c.owner, c.description].some(v => v.toLowerCase().includes(q));
          });
          document.getElementById('catalogBody').innerHTML = rows.map(c =>
            '<tr>' +
              '<td><strong>' + c.name + '</strong><br><span style="color:#94a3b8;font-size:11.5px">' + c.description + '</span></td>' +
              '<td><span class="pill domain">' + c.domain + '</span><br><span style="color:#94a3b8;font-size:11.5px">' + c.system + '</span></td>' +
              '<td>' + c.tech + '</td>' +
              '<td>' + c.owner + '</td>' +
              '<td><span class="pill prod">' + c.lifecycle + '</span></td>' +
              '<td><a class="btn-link" href="http://localhost:' + c.port + '" target="_blank" rel="noopener">:' + c.port + ' ↗</a></td>' +
            '</tr>'
          ).join('');
        }

        function showTab(tab, btn) {
          ['catalog', 'apis', 'domains', 'templates', 'portals'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
          });
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }

        init();
      </script>
    </body>
    </html>`;

    const server = http.createServer((req, res) => {
      const url = (req.url || '/').split('?')[0];
      if (url === '/.backstage/health/v1/liveness' || url === '/.backstage/health/v1/readiness' || url === '/healthz') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok', service: 'backstage-idp', version: '1.36.0' }));
        return;
      }
      if (url === '/api/catalog/entities') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(CATALOG_DATA, null, 2));
        return;
      }
      res.writeHead(200, {
        'Content-Type': 'text/html; charset=utf-8',
        'X-Content-Type-Options': 'nosniff',
        'X-Frame-Options': 'SAMEORIGIN'
      });
      res.end(HTML_PAGE);
    });

    server.listen(PORT, '0.0.0.0', () => {
      console.log(`Backstage IDP Portal listening on http://0.0.0.0:${PORT}`);
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-idp
  namespace: dev
  labels:
    app: backstage-idp
    app.kubernetes.io/name: backstage-idp
    app.kubernetes.io/part-of: microservices-architecture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-idp
  template:
    metadata:
      labels:
        app: backstage-idp
        app.kubernetes.io/name: backstage-idp
        app.kubernetes.io/part-of: microservices-architecture
    spec:
      serviceAccountName: backstage-idp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage-backend
          image: ghcr.io/backstage/backstage:1.36.0
          imagePullPolicy: IfNotPresent
          command: ["node", "/app-portal/server.js"]
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_CONFIG_backend_listen_port
              value: "7007"
            - name: KEYCLOAK_OIDC_METADATA_URL
              value: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/.well-known/openid-configuration"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: 7007
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: portal-script
              mountPath: /app-portal
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: portal-script
          configMap:
            name: backstage-idp-portal
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-idp
  namespace: dev
  labels:
    app: backstage-idp
    app.kubernetes.io/name: backstage-idp
    app.kubernetes.io/part-of: microservices-architecture
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7007
      targetPort: 7007
      protocol: TCP
  selector:
    app: backstage-idp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage-idp-netpol
  namespace: dev
  labels:
    app: backstage-idp
spec:
  podSelector:
    matchLabels:
      app: backstage-idp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 7007
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
