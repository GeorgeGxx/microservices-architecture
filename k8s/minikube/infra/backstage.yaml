          gap: 14px;
          margin-bottom: 26px;
        }
        .stat-card {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px 18px;
        }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .toolbar {
          display: flex;
          gap: 12px;
          margin-bottom: 18px;
