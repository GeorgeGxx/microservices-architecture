        .badge {
          padding: 5px 11px;
          border-radius: 999px;
          font-size: 11.5px;
          font-weight: 600;
          border: 1px solid var(--border);
          background: var(--bg-card);
        }
        .badge.green { border-color: rgba(34,197,94,0.4); color: #4ade80; }
        .badge.blue { border-color: rgba(56,189,248,0.4); color: #38bdf8; }
        .badge.purple { border-color: rgba(168,85,247,0.4); color: #c084fc; }
        .stats-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
          gap: 12px;
          margin-bottom: 22px;
        }
        .stat-card {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 14px 16px;
        }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
        .toolbar {
          display: flex;
          gap: 10px;
          margin-bottom: 16px;
          flex-wrap: wrap;
          align-items: center;
        }
        input[type="search"], input[type="text"], input[type="number"], select, textarea {
          background: var(--bg-card);
          border: 1px solid var(--border);
          color: var(--text-main);
          padding: 9px 13px;
          border-radius: 8px;
          font-size: 13px;
          outline: none;
          font-family: inherit;
        }
        input[type="search"] { flex: 1; min-width: 240px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        table {
          width: 100%;
          border-collapse: collapse;
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 10px;
          overflow: hidden;
        }
        th, td {
          padding: 12px 15px;
          text-align: left;
          border-bottom: 1px solid var(--border);
          font-size: 12.8px;
        }
        th {
          background: rgba(15, 23, 42, 0.7);
          color: var(--text-muted);
          font-weight: 600;
          text-transform: uppercase;
          font-size: 11px;
          letter-spacing: 0.04em;
        }
        tr:hover td { background: var(--bg-card-hover); }
        .pill {
          display: inline-block;
          padding: 3px 9px;
          border-radius: 6px;
          font-size: 11px;
          font-weight: 600;
          background: rgba(56, 189, 248, 0.13);
          color: var(--accent);
        }
        .pill.prod { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .pill.down { background: rgba(239, 68, 68, 0.18); color: #f87171; }
        .pill.domain { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .cards-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
          gap: 15px;
        }
        .card {
          background: var(--bg-card);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 18px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          min-width: 0;
          overflow: hidden;
          overflow-wrap: anywhere;
          word-break: break-word;
        }
        .card h3 { font-size: 15px; color: var(--text-main); overflow-wrap: anywhere; }
        .card p { font-size: 12.6px; color: var(--text-muted); line-height: 1.45; overflow-wrap: anywhere; }
        .card code, .dep-item code {
          display: inline-block;
          max-width: 100%;
          overflow-wrap: anywhere;
          word-break: break-all;
          background: rgba(15, 23, 42, 0.65);
          padding: 3px 7px;
          border-radius: 5px;
          font-size: 11.4px;
          color: #cbd5e1;
          border: 1px solid rgba(51, 65, 85, 0.65);
        }
        .card ul { padding-left: 18px; font-size: 12px; color: var(--text-muted); }
        .card li { margin-bottom: 4px; }
        .btn-link, .btn-action {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 7px 12px;
          border-radius: 6px;
          background: rgba(56, 189, 248, 0.14);
          color: var(--accent);
          border: 1px solid rgba(56, 189, 248, 0.3);
          text-decoration: none;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
          width: fit-content;
          transition: all 0.15s;
        }
        .btn-link:hover, .btn-action:hover { background: rgba(56, 189, 248, 0.26); }
        .btn-action.primary {
          background: linear-gradient(135deg, #0284c7, #0d9488);
          color: #fff;
          border: none;
        }
        .btn-action.primary:hover { filter: brightness(1.1); }
        .hidden { display: none !important; }
        /* Interactive Modal / Drawer */
        .modal-backdrop {
          position: fixed;
          inset: 0;
          background: rgba(2, 6, 23, 0.78);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 50;
          padding: 20px;
        }
        .modal {
          background: #0f172a;
          border: 1px solid var(--border);
          border-radius: 12px;
          width: 100%;
          max-width: 920px;
          max-height: 90vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .modal-header {
          padding: 16px 22px;
          border-bottom: 1px solid var(--border);
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: var(--bg-card);
        }
        .modal-body {
          padding: 20px 22px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        pre.code-box {
          background: #020617;
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 14px;
          color: #e2e8f0;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px;
          overflow-x: auto;
          max-height: 340px;
          white-space: pre-wrap;
        }
        .graph-layout {
          display: grid;
          grid-template-columns: 280px 1fr;
          gap: 18px;
        }
        .node-btn {
          width: 100%;
          text-align: left;
          padding: 10px 12px;
          margin-bottom: 6px;
          border-radius: 8px;
          border: 1px solid var(--border);
          background: var(--bg-card);
          color: var(--text-main);
          cursor: pointer;
          font-size: 12.5px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .node-btn.active, .node-btn:hover {
          border-color: var(--accent);
          background: rgba(56, 189, 248, 0.14);
        }
        .dep-columns {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 14px;
        }
        .dep-box {
          background: rgba(15, 23, 42, 0.75);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 14px;
        }
        .dep-box h4 {
          font-size: 12px;
          text-transform: uppercase;
          color: var(--accent);
          margin-bottom: 10px;
          letter-spacing: 0.04em;
        }
        .dep-item {
          padding: 7px 10px;
          border-radius: 6px;
          background: var(--bg-card);
          border: 1px solid var(--border);
          margin-bottom: 6px;
          font-size: 12px;
        }
      </style>
    </head>
    <body>
      <aside>
        <div class="brand">
          <div class="brand-logo">B</div>
          <div>
            <div class="brand-title">Backstage IDP</div>
            <div class="brand-sub">v1.36.0 • Interactive Self-Service</div>
          </div>
        </div>
        <button class="nav-btn active" onclick="showTab('catalog', this)">📦 Software Catalog</button>
        <button class="nav-btn" onclick="showTab('health', this)">🩺 Live Cluster Health</button>
        <button class="nav-btn" onclick="showTab('apis', this)">⚡ Interactive APIs & Subgraphs</button>
        <button class="nav-btn" onclick="showTab('graph', this)">🕸️ Dependency Topology</button>
        <button class="nav-btn" onclick="showTab('templates', this)">🚀 Golden Path Scaffolder</button>
        <button class="nav-btn" onclick="showTab('domains', this)">🏛️ Domains & Cloud Resources</button>
        <button class="nav-btn" onclick="showTab('portals', this)">🌐 Platform Ecosystem Links</button>
        <div class="sidebar-footer">
          <strong id="sidebarHealthSummary">● Probing Cluster Services...</strong>
          Connected to Minikube K8s ('dev' ns) • Argo CD v3.6.1 & Keycloak OIDC
        </div>
      </aside>
      <main>
        <header>
          <div>
            <h1>Enterprise Microservices Internal Developer Portal</h1>
            <p>Interactive Software Catalog, Live Cluster Health Matrix, GraphQL/REST Playground, Dependency Graph & Self-Service Scaffolder</p>
          </div>
          <div class="badges">
            <button class="btn-action primary" onclick="refreshLiveHealth()">🔄 Probe Live Cluster Health</button>
            <span class="badge green" id="liveClusterBadge">Cluster Probe Ready</span>
            <span class="badge blue">Docker Hub: 2-Version SemVer Policy</span>
          </div>
        </header>

        <div class="stats-grid" id="stats"></div>

        <!-- TAB 1: SOFTWARE CATALOG -->
        <section id="tab-catalog">
          <div class="toolbar">
            <input type="search" id="searchInput" placeholder="Filter services by name, tech stack, system, or owner..." oninput="renderCatalog()" />
            <select id="domainFilter" onchange="renderCatalog()">
              <option value="">All Domains (4)</option>
              <option value="commerce">commerce</option>
              <option value="fulfillment-logistics">fulfillment-logistics</option>
              <option value="data-mlops">data-mlops</option>
              <option value="platform-engineering">platform-engineering</option>
            </select>
          </div>
          <table>
            <thead>
              <tr>
                <th>Component</th>
                <th>Domain / System</th>
                <th>Technology Stack</th>
                <th>Live Cluster Status</th>
                <th>Owner / Sonar</th>
                <th>Interactive Actions</th>
              </tr>
            </thead>
            <tbody id="catalogBody"></tbody>
          </table>
        </section>

        <!-- TAB 2: LIVE CLUSTER HEALTH & LATENCY MATRIX -->
        <section id="tab-health" class="hidden">
          <div class="toolbar">
            <button class="btn-action primary" onclick="refreshLiveHealth()">🔄 Run Live In-Cluster Health & Latency Probe</button>
            <span style="color:var(--text-muted);font-size:12.5px" id="lastProbeTimestamp">Probing internal Kubernetes DNS endpoints...</span>
          </div>
          <div class="cards-grid" id="healthGrid"></div>
        </section>

        <!-- TAB 3: INTERACTIVE APIS & SUBGRAPHS -->
        <section id="tab-apis" class="hidden">
          <div class="toolbar">
            <input type="search" id="apiSearchInput" placeholder="Filter APIs & Subgraphs by name, service, endpoint, or GraphQL/REST operation..." oninput="renderApis()" />
            <select id="apiTypeFilter" onchange="renderApis()">
              <option value="">All API Types (11)</option>
              <option value="graphql">GraphQL Supergraph & Subgraphs</option>
              <option value="openapi">OpenAPI REST & SSE Contracts</option>
              <option value="asyncapi">AsyncAPI Kafka Event Bus</option>
            </select>
          </div>
          <div class="cards-grid" id="apisGrid"></div>
        </section>

        <!-- TAB 4: INTERACTIVE DEPENDENCY TOPOLOGY -->
        <section id="tab-graph" class="hidden">
          <div class="graph-layout">
            <div id="graphNodeList"></div>
            <div class="card" id="graphDetailPanel"></div>
          </div>
        </section>

        <!-- TAB 5: GOLDEN PATH SELF-SERVICE SCAFFOLDER -->
        <section id="tab-templates" class="hidden">
          <div class="cards-grid" id="templatesGrid"></div>
        </section>

        <!-- TAB 6: DOMAINS & CLOUD RESOURCES -->
        <section id="tab-domains" class="hidden">
          <div class="cards-grid" id="domainsGrid"></div>
        </section>

        <!-- TAB 7: PLATFORM ECOSYSTEM LINKS -->
        <section id="tab-portals" class="hidden">
          <div class="cards-grid" id="portalsGrid"></div>
        </section>
      </main>

      <!-- MODAL 1: INTERACTIVE API / GRAPHQL CONSOLE -->
      <div class="modal-backdrop hidden" id="apiConsoleModal">
        <div class="modal">
          <div class="modal-header">
            <div>
              <h3 id="consoleTitle">⚡ Interactive API & GraphQL Explorer</h3>
              <p style="font-size:12px;color:var(--text-muted)" id="consoleSubtitle"></p>
            </div>
            <button class="btn-action" onclick="closeApiConsole()">✕ Close</button>
          </div>
          <div class="modal-body">
            <div class="toolbar" id="consolePresets"></div>
            <div style="display:flex;gap:10px">
              <select id="consoleMethod" style="width:110px">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
              </select>
              <input type="text" id="consolePath" style="flex:1" placeholder="/graphql or /api/v1/products" />
              <button class="btn-action primary" onclick="executeConsoleRequest()">▶ Execute Live Request</button>
            </div>
            <div>
              <label style="font-size:11.5px;color:var(--text-muted);display:block;margin-bottom:5px">Request Body (GraphQL Query or JSON Payload):</label>
              <textarea id="consoleBody" rows="6" style="width:100%;font-family:monospace;font-size:12px"></textarea>
            </div>
            <div>
              <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <span style="font-size:11.5px;color:var(--text-muted)">Live In-Cluster Response:</span>
                <span id="consoleStatusBadge"></span>
              </div>
              <pre class="code-box" id="consoleOutput">Click "▶ Execute Live Request" to query the microservice inside the Kubernetes cluster.</pre>
            </div>
          </div>
        </div>
      </div>

      <!-- MODAL 2: GOLDEN PATH SELF-SERVICE SCAFFOLDER WIZARD -->
      <div class="modal-backdrop hidden" id="scaffolderModal">
        <div class="modal">
          <div class="modal-header">
            <div>
              <h3 id="scaffolderTitle">🚀 Golden Path Microservice Scaffolder</h3>
              <p style="font-size:12px;color:var(--text-muted)">Generate production-ready manifests, non-root Dockerfile, Helm values & CI/CD workflow</p>
            </div>
            <button class="btn-action" onclick="closeScaffolder()">✕ Close</button>
          </div>
          <div class="modal-body">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div>
                <label style="font-size:11.5px;color:var(--text-muted)">Service Name (kebab-case):</label>
                <input type="text" id="scfName" value="promotions-service" style="width:100%;margin-top:4px" />
              </div>
              <div>
                <label style="font-size:11.5px;color:var(--text-muted)">Display Title:</label>
                <input type="text" id="scfTitleInput" value="Promotions & Loyalty Microservice" style="width:100%;margin-top:4px" />
              </div>
              <div>
                <label style="font-size:11.5px;color:var(--text-muted)">Bounded Domain:</label>
                <select id="scfDomain" style="width:100%;margin-top:4px">
                  <option value="commerce">commerce</option>
                  <option value="fulfillment-logistics">fulfillment-logistics</option>
                  <option value="data-mlops">data-mlops</option>
                  <option value="platform-engineering">platform-engineering</option>
                </select>
              </div>
              <div>
                <label style="font-size:11.5px;color:var(--text-muted)">Target System:</label>
                <select id="scfSystem" style="width:100%;margin-top:4px">
                  <option value="novashop-commerce-system">novashop-commerce-system</option>
                  <option value="supply-chain-fulfillment-system">supply-chain-fulfillment-system</option>
                  <option value="intelligence-mlops-system">intelligence-mlops-system</option>
                  <option value="multi-cloud-platform-system">multi-cloud-platform-system</option>
                </select>
              </div>
              <div>
                <label style="font-size:11.5px;color:var(--text-muted)">Owner Group (Keycloak OIDC):</label>
                <select id="scfOwner" style="width:100%;margin-top:4px">
                  <option value="group:developers">group:developers</option>
                  <option value="group:devops-engineers">group:devops-engineers</option>
                  <option value="group:platform-admins">group:platform-admins</option>
                </select>
              </div>
              <div>
                <label style="font-size:11.5px;color:var(--text-muted)">Container Port:</label>
                <input type="number" id="scfPort" value="8089" style="width:100%;margin-top:4px" />
              </div>
            </div>
            <div style="display:flex;gap:18px;font-size:12.5px">
              <label><input type="checkbox" id="scfPostgres" checked /> PostgreSQL 18 Dedicated DB</label>
              <label><input type="checkbox" id="scfKafka" checked /> Kafka Event Producer/Consumer</label>
              <label><input type="checkbox" id="scfKeda" checked /> KEDA Autoscaler</label>
            </div>
            <div style="display:flex;gap:10px">
              <button class="btn-action primary" onclick="runScaffolder()">⚡ Generate Artifacts & Register in Catalog</button>
              <button class="btn-action" onclick="copyScaffolderOutput()">📋 Copy Active File</button>
            </div>
            <div class="toolbar" id="scfFileTabs"></div>
            <pre class="code-box" id="scfOutput">Configure parameters above and click "⚡ Generate Artifacts & Register in Catalog".</pre>
          </div>
        </div>
      </div>

      <script>
        const data = ${JSON.stringify(CATALOG_DATA)};
        let liveHealth = {};
        let selectedGraphComponent = 'orders-service';
        let activeConsoleTarget = 'cosmo-router';
        let activeScaffoldStack = 'spring-boot';
        let generatedBundle = null;

        function init() {
          renderStats();
          renderCatalog();
          renderApis();
          renderGraph();

          document.getElementById('domainsGrid').innerHTML =
            data.domains.map(d =>
              '<div class="card">' +
                '<div><span class="pill domain">DOMAIN</span> <span class="pill prod">' + d.owner + '</span></div>' +
                '<h3>' + d.name + '</h3>' +
                '<p>' + d.description + '</p>' +
                '<p><strong>System:</strong> <code>' + d.systems.join(', ') + '</code></p>' +
              '</div>'
            ).join('') +
            data.groups.map(g =>
              '<div class="card">' +
                '<div><span class="pill">KEYCLOAK OIDC GROUP</span></div>' +
                '<h3>' + g.displayName + '</h3>' +
                '<p>' + g.description + '</p>' +
                '<p><strong>Entity Ref:</strong> <code>' + g.name + '</code> • <strong>Contact:</strong> ' + g.email + '</p>' +
              '</div>'
            ).join('') +
            data.resources.map(r =>
              '<div class="card">' +
                '<div><span class="pill">' + r.type.toUpperCase() + '</span> <span class="pill domain">' + r.system + '</span></div>' +
                '<h3>' + r.title + '</h3>' +
                '<p>' + r.description + '</p>' +
                '<p><strong>Technology:</strong> ' + r.tech + '<br><strong>Owner:</strong> ' + r.owner + '</p>' +
              '</div>'
            ).join('');

          document.getElementById('templatesGrid').innerHTML = data.templates.map((t, idx) =>
            '<div class="card">' +
              '<div><span class="pill prod">' + t.language + '</span> <span class="pill domain">' + t.targetSystem + '</span></div>' +
              '<h3>' + t.title + '</h3>' +
              '<p><code>' + t.path + '</code></p>' +
              '<ul>' + t.features.map(f => '<li>' + f + '</li>').join('') + '</ul>' +
              '<div style="margin-top:auto;padding-top:8px">' +
                '<button class="btn-action primary" onclick="openScaffolder(' + idx + ')">➕ Scaffold New Microservice</button>' +
              '</div>' +
            '</div>'
          ).join('');

          document.getElementById('portalsGrid').innerHTML = data.portals.map(p =>
            '<div class="card">' +
              '<div><span class="pill">' + p.category + '</span> <span class="pill domain">ns: ' + p.namespace + '</span> <span class="pill prod">' + p.status + '</span></div>' +
              '<h3>' + p.name + '</h3>' +
              '<p><code>' + p.url + '</code><br><span style="font-size:11.5px;color:#94a3b8">Auth: ' + p.auth + '</span></p>' +
              '<a class="btn-link" href="' + p.url + '" target="_blank" rel="noopener">Launch Console ↗</a>' +
            '</div>'
          ).join('');

          refreshLiveHealth();
        }

        function renderStats() {
          document.getElementById('stats').innerHTML = [
            { v: data.components.length, l: 'Catalog Microservices & Apps' },
            { v: data.apis.length, l: 'Interactive API & Subgraph Contracts' },
            { v: data.resources.length, l: 'Stateful, IAM & Cloud Resources' },
            { v: data.templates.length, l: 'Self-Service Golden Path Templates' },
            { v: data.domains.length, l: 'Bounded Architecture Domains' },
            { v: data.portals.length, l: 'Active Platform Tunnels & Consoles' }
          ].map(s => '<div class="stat-card"><div class="stat-value">' + s.v + '</div><div class="stat-label">' + s.l + '</div></div>').join('');
        }

        async function refreshLiveHealth() {
          try {
            const res = await fetch('/api/live/status');
            liveHealth = await res.json();
            const entries = Object.values(liveHealth);
            const upCount = entries.filter(e => e.status === 'UP').length;
            document.getElementById('liveClusterBadge').textContent = 'Live Cluster: ' + upCount + '/' + entries.length + ' UP';
            document.getElementById('sidebarHealthSummary').textContent = '● Cluster Health: ' + upCount + '/' + entries.length + ' Services UP';
            document.getElementById('lastProbeTimestamp').textContent = 'Last live in-cluster probe: ' + new Date().toLocaleTimeString();

            document.getElementById('healthGrid').innerHTML = entries.map(e =>
              '<div class="card">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">' +
                  '<span class="pill">' + e.category + '</span>' +
                  '<span class="pill ' + (e.status === 'UP' ? 'prod' : 'down') + '">' + (e.badgeLabel || e.status) + ' (HTTP ' + e.httpCode + ' • ' + e.latencyMs + ' ms)</span>' +
                '</div>' +
                '<h3>' + e.name + '</h3>' +
                '<p><code>' + e.target + '</code></p>' +
              '</div>'
            ).join('');

            renderCatalog();
            renderGraph();
          } catch (err) {
            console.error(err);
          }
        }

        function renderCatalog() {
          const q = (document.getElementById('searchInput').value || '').toLowerCase();
          const dom = document.getElementById('domainFilter').value;
          const rows = data.components.filter(c => {
            if (dom && c.domain !== dom) return false;
            return !q || [c.name, c.title, c.tech, c.system, c.owner, c.description].some(v => v.toLowerCase().includes(q));
          });
          document.getElementById('catalogBody').innerHTML = rows.map(c => {
            const h = liveHealth[c.name];
            const healthPill = h
              ? '<span class="pill ' + (h.status === 'UP' ? 'prod' : 'down') + '">● ' + (h.badgeLabel || h.status) + ' (' + h.latencyMs + ' ms)</span>'
              : '<span class="pill">Probing...</span>';
            return '<tr>' +
              '<td><strong>' + c.name + '</strong><br><span style="color:#38bdf8;font-size:11.5px">' + c.title + '</span><br><span style="color:#94a3b8;font-size:11.5px">' + c.description + '</span></td>' +
              '<td><span class="pill domain">' + c.domain + '</span><br><span style="color:#94a3b8;font-size:11.5px">' + c.system + '</span></td>' +
              '<td>' + c.tech + '</td>' +
              '<td>' + healthPill + '</td>' +
              '<td>' + c.owner + '<br><span style="color:#94a3b8;font-size:11px">Sonar: ' + c.sonarKey + '</span></td>' +
              '<td>' +
                '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
                  '<button class="btn-action" data-name="' + c.name + '" onclick="inspectTopology(this.dataset.name)">🕸️ Topology</button>' +
                  '<a class="btn-link" href="' + c.docsUrl + '" target="_blank" rel="noopener">:' + c.port + ' UI ↗</a>' +
                '</div>' +
              '</td>' +
            '</tr>';
          }).join('');
        }

        function renderApis() {
          const q = (document.getElementById('apiSearchInput').value || '').toLowerCase();
          const tFilter = document.getElementById('apiTypeFilter').value;
          const items = data.apis.filter(a => {
            if (tFilter && !a.type.includes(tFilter)) return false;
            return !q || [a.name, a.title, a.component, a.system, a.specVersion, a.description, ...(a.operations || [])].some(v => v.toLowerCase().includes(q));
          });
          document.getElementById('apisGrid').innerHTML = items.map(a => {
            const apiIdx = data.apis.indexOf(a);
            return '<div class="card">' +
              '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
                '<span class="pill">' + a.specVersion + '</span>' +
                '<span class="pill domain">' + a.component + '</span>' +
                '<span class="pill prod">' + a.domain + '</span>' +
              '</div>' +
              '<h3>' + a.title + '</h3>' +
              '<p style="font-size:11.5px;color:#38bdf8"><code>' + a.name + '</code> • System: <code>' + a.system + '</code></p>' +
              '<p>' + a.description + '</p>' +
              '<ul>' + (a.operations || []).map(op => '<li><code>' + op + '</code></li>').join('') + '</ul>' +
              '<div style="display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap">' +
                '<button class="btn-action primary" onclick="openApiConsole(' + apiIdx + ')">⚡ Try Live in IDP</button>' +
                '<a class="btn-link" href="' + a.endpoint + '" target="_blank" rel="noopener">Swagger / UI ↗</a>' +
              '</div>' +
            '</div>';
          }).join('');
        }

        function inspectTopology(compName) {
          selectedGraphComponent = compName;
          const btn = document.querySelectorAll('.nav-btn')[3];
          showTab('graph', btn);
          renderGraph();
        }

        function selectGraphNode(compName) {
          selectedGraphComponent = compName;
          renderGraph();
        }

        function renderGraph() {
          document.getElementById('graphNodeList').innerHTML = data.components.map(c => {
            const h = liveHealth[c.name];
            const dot = h ? (h.status === 'UP' ? '🟢' : '🔴') : '⚪';
            return '<button class="node-btn ' + (c.name === selectedGraphComponent ? 'active' : '') + '" data-name="' + c.name + '" onclick="selectGraphNode(this.dataset.name)">' +
              '<span>' + dot + ' <strong>' + c.name + '</strong></span>' +
              '<span class="pill">:' + c.port + '</span>' +
            '</button>';
          }).join('');

          const comp = data.components.find(c => c.name === selectedGraphComponent) || data.components[0];
          const upstreamCallers = data.components.filter(other => (other.dependsOn || []).includes('component:' + comp.name)).map(o => o.name);
          const h = liveHealth[comp.name];

          document.getElementById('graphDetailPanel').innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px">' +
              '<div>' +
                '<span class="pill domain">' + comp.domain + '</span> <span class="pill">' + comp.system + '</span>' +
                '<h2 style="margin-top:6px">' + comp.title + ' (<code>' + comp.name + '</code>)</h2>' +
              '</div>' +
              '<div>' + (h ? '<span class="pill ' + (h.status === 'UP' ? 'prod' : 'down') + '">● ' + (h.badgeLabel || h.status) + ' (' + h.latencyMs + ' ms)</span>' : '') + '</div>' +
            '</div>' +
            '<p style="margin:8px 0">' + comp.description + '</p>' +
            '<div class="dep-columns">' +
              '<div class="dep-box">' +
                '<h4>⬅️ Upstream Consumers (' + upstreamCallers.length + ')</h4>' +
                (upstreamCallers.length ? upstreamCallers.map(u => '<div class="dep-item">🔗 <strong>' + u + '</strong></div>').join('') : '<div class="dep-item">Entrypoint / Event Consumer</div>') +
              '</div>' +
              '<div class="dep-box">' +
                '<h4>📡 Provided APIs (' + (comp.providesApis || []).length + ')</h4>' +
                ((comp.providesApis || []).length ? comp.providesApis.map(a => '<div class="dep-item">🔌 <code>' + a + '</code></div>').join('') : '<div class="dep-item">UI / Background Pipeline</div>') +
              '</div>' +
              '<div class="dep-box">' +
                '<h4>📥 Consumed APIs & Event Buses (' + (comp.consumesApis || []).length + ')</h4>' +
                ((comp.consumesApis || []).length ? comp.consumesApis.map(a => '<div class="dep-item">⚡ <code>' + a + '</code></div>').join('') : '<div class="dep-item">None (Leaf Service)</div>') +
              '</div>' +
              '<div class="dep-box">' +
                '<h4>🗄️ Infrastructure & Service Dependencies (' + (comp.dependsOn || []).length + ')</h4>' +
                ((comp.dependsOn || []).length ? comp.dependsOn.map(d => '<div class="dep-item">📦 <code>' + d + '</code></div>').join('') : '<div class="dep-item">None</div>') +
              '</div>' +
            '</div>';
        }

        function openApiConsole(apiIdx) {
          const api = data.apis[apiIdx];
          activeConsoleTarget = api.component;
          document.getElementById('consoleTitle').textContent = '⚡ Live Explorer: ' + api.title;
          document.getElementById('consoleSubtitle').textContent = 'Target Service: ' + api.component + ' (' + api.specVersion + ')';
          const presets = api.presets || [{ label: 'Health Check', method: 'GET', path: '/health', body: '' }];
          document.getElementById('consolePresets').innerHTML = presets.map((p, i) =>
            '<button class="btn-action" onclick="loadPreset(' + apiIdx + ',' + i + ')">Preset: ' + p.label + '</button>'
          ).join('');
          loadPreset(apiIdx, 0);
          document.getElementById('apiConsoleModal').classList.remove('hidden');
        }

        function loadPreset(apiIdx, presetIdx) {
          const api = data.apis[apiIdx];
          const p = (api.presets || [])[presetIdx];
          if (!p) return;
          activeConsoleTarget = p.targetOverride || api.component;
          document.getElementById('consoleMethod').value = p.method;
          document.getElementById('consolePath').value = p.path;
          document.getElementById('consoleBody').value = p.body || '';
          document.getElementById('consoleOutput').textContent = 'Ready to execute ' + p.method + ' ' + p.path + ' on ' + activeConsoleTarget + '...';
          document.getElementById('consoleStatusBadge').innerHTML = '';
        }

        function closeApiConsole() {
          document.getElementById('apiConsoleModal').classList.add('hidden');
        }

        async function executeConsoleRequest() {
          const method = document.getElementById('consoleMethod').value;
          const path = document.getElementById('consolePath').value;
          const body = document.getElementById('consoleBody').value;
          document.getElementById('consoleOutput').textContent = 'Executing live request inside Kubernetes cluster...';
          try {
            const res = await fetch('/api/live/execute', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ target: activeConsoleTarget, method, path, body })
            });
            const out = await res.json();
            document.getElementById('consoleStatusBadge').innerHTML =
              '<span class="pill ' + (out.ok ? 'prod' : 'down') + '">HTTP ' + out.status + ' • ' + out.latencyMs + ' ms</span>';
            try {
              document.getElementById('consoleOutput').textContent = JSON.stringify(JSON.parse(out.raw), null, 2);
            } catch (_) {
              document.getElementById('consoleOutput').textContent = out.raw;
            }
          } catch (err) {
            document.getElementById('consoleOutput').textContent = 'Error: ' + err.message;
          }
        }

        function openScaffolder(tplIdx) {
          const tpl = data.templates[tplIdx];
          activeScaffoldStack = tpl.stackKey;
          document.getElementById('scaffolderTitle').textContent = '🚀 ' + tpl.title;
          document.getElementById('scfSystem').value = tpl.targetSystem;
          document.getElementById('scfPort').value = tpl.defaultPort;
          document.getElementById('scaffolderModal').classList.remove('hidden');
          runScaffolder();
        }

        function closeScaffolder() {
          document.getElementById('scaffolderModal').classList.add('hidden');
        }

        async function runScaffolder() {
          const payload = {
            name: document.getElementById('scfName').value,
            title: document.getElementById('scfTitleInput').value,
            domain: document.getElementById('scfDomain').value,
            system: document.getElementById('scfSystem').value,
            owner: document.getElementById('scfOwner').value,
            port: Number(document.getElementById('scfPort').value),
            stack: activeScaffoldStack,
            enablePostgres: document.getElementById('scfPostgres').checked,
            enableKafka: document.getElementById('scfKafka').checked,
            enableKeda: document.getElementById('scfKeda').checked
          };
          const res = await fetch('/api/scaffolder/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          generatedBundle = await res.json();
          document.getElementById('scfFileTabs').innerHTML = [
            ['catalogYaml', '📄 catalog-info.yaml'],
            ['workflowYaml', '⚙️ .github/workflows/service-' + payload.name + '.yml'],
            ['helmValuesYaml', '☸️ helm/values-snippet.yaml']
          ].map(([k, label]) => '<button class="btn-action" data-key="' + k + '" onclick="showScfFile(this.dataset.key)">' + label + '</button>').join('');
          showScfFile('catalogYaml');

          if (!data.components.some(c => c.name === payload.name)) {
            data.components.push({
              name: payload.name,
              title: payload.title,
              type: 'service',
              lifecycle: 'experimental',
              owner: payload.owner,
              system: payload.system,
              domain: payload.domain,
              tech: activeScaffoldStack + ' • Scaffolded Golden Path',
              port: payload.port,
              docsUrl: 'http://localhost:' + payload.port,
              healthUrl: 'http://localhost:' + payload.port + '/health',
              argoApp: 'microservices-dev',
              sonarKey: 'msa-' + payload.name,
              providesApis: [payload.name + '-rest-api'],
              consumesApis: payload.enableKafka ? ['kafka-commerce-events-asyncapi'] : [],
              dependsOn: payload.enablePostgres ? ['resource:postgresql-databases'] : [],
              description: 'Dynamically scaffolded via Backstage IDP Golden Path Scaffolder.'
            });
            renderStats();
            renderCatalog();
            renderGraph();
          }
        }

        function showScfFile(key) {
          if (!generatedBundle) return;
          document.getElementById('scfOutput').textContent = generatedBundle[key] || '';
        }

        function copyScaffolderOutput() {
          navigator.clipboard.writeText(document.getElementById('scfOutput').textContent || '');
        }

        function showTab(tab, btn) {
          ['catalog', 'health', 'apis', 'graph', 'templates', 'domains', 'portals'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
          });
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          if (btn) btn.classList.add('active');
        }

        init();
      </script>
    </body>
    </html>`;

    function readJsonBody(req) {
      return new Promise((resolve) => {
        const chunks = [];
        req.on('data', (c) => chunks.push(c));
        req.on('end', () => {
          try {
            resolve(JSON.parse(Buffer.concat(chunks).toString('utf8') || '{}'));
          } catch (_) {
            resolve({});
          }
        });
      });
    }

    const server = http.createServer(async (req, res) => {
      const url = (req.url || '/').split('?')[0];
      if (url === '/.backstage/health/v1/liveness' || url === '/.backstage/health/v1/readiness' || url === '/healthz') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok', service: 'backstage-idp', version: '1.36.0' }));
        return;
      }
      if (url === '/api/catalog/entities') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(CATALOG_DATA, null, 2));
        return;
      }
      if (url === '/api/live/status') {
        const statusMap = await probeAllServices();
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(statusMap, null, 2));
        return;
      }
      if (url === '/api/live/execute' && req.method === 'POST') {
        const body = await readJsonBody(req);
        const targetCfg = INTERNAL_TARGETS[String(body.target || '')];
        if (!targetCfg) {
          res.writeHead(400, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({ ok: false, status: 400, latencyMs: 0, raw: 'Unknown internal target service' }));
          return;
        }
        const safePath = String(body.path || '/').startsWith('/') ? String(body.path) : '/' + String(body.path);
        const method = String(body.method || 'GET').toUpperCase() === 'POST' ? 'POST' : 'GET';
        const result = await httpRequestInternal({
          host: targetCfg.host,
          port: targetCfg.port,
          path: safePath,
          method,
          body: method === 'POST' ? String(body.body || '') : ''
        });
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(result));
        return;
      }
      if (url === '/api/scaffolder/generate' && req.method === 'POST') {
        const body = await readJsonBody(req);
        const bundle = generateScaffoldBundle(body);
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(bundle));
        return;
      }
      res.writeHead(200, {
        'Content-Type': 'text/html; charset=utf-8',
        'X-Content-Type-Options': 'nosniff',
        'X-Frame-Options': 'SAMEORIGIN'
      });
      res.end(HTML_PAGE);
    });

    server.listen(PORT, '0.0.0.0', () => {
      console.log(`Backstage IDP Portal listening on http://0.0.0.0:${PORT}`);
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-idp
  namespace: dev
  labels:
    app: backstage-idp
    app.kubernetes.io/name: backstage-idp
    app.kubernetes.io/part-of: microservices-architecture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-idp
  template:
    metadata:
      labels:
        app: backstage-idp
        app.kubernetes.io/name: backstage-idp
        app.kubernetes.io/part-of: microservices-architecture
    spec:
      serviceAccountName: backstage-idp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage-backend
          image: ghcr.io/backstage/backstage:1.36.0
          imagePullPolicy: IfNotPresent
          command: ["node", "/app-portal/server.js"]
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_CONFIG_backend_listen_port
              value: "7007"
            - name: KEYCLOAK_OIDC_METADATA_URL
              value: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/.well-known/openid-configuration"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: 7007
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: portal-script
              mountPath: /app-portal
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: portal-script
          configMap:
            name: backstage-idp-portal
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-idp
  namespace: dev
  labels:
    app: backstage-idp
    app.kubernetes.io/name: backstage-idp
    app.kubernetes.io/part-of: microservices-architecture
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7007
      targetPort: 7007
      protocol: TCP
  selector:
    app: backstage-idp
