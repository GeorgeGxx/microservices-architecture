      <script>
        const data = ${JSON.stringify(CATALOG_DATA)};

        function init() {
          document.getElementById('stats').innerHTML = [
            { v: data.components.length, l: 'Catalog Microservices & Apps' },
            { v: data.apis.length, l: 'GraphQL, OpenAPI & AsyncAPI Contracts' },
            { v: data.resources.length, l: 'Stateful, IAM & Cloud Resources' },
            { v: data.templates.length, l: 'Golden Path Scaffolder Templates' },
            { v: data.domains.length, l: 'Bounded Architecture Domains' },
            { v: data.portals.length, l: 'Active Platform Tunnels & Consoles' }
          ].map(s => '<div class="stat-card"><div class="stat-value">' + s.v + '</div><div class="stat-label">' + s.l + '</div></div>').join('');

          renderCatalog();
          renderApis();

          document.getElementById('domainsGrid').innerHTML =
            data.domains.map(d =>
              '<div class="card">' +
                '<div><span class="pill domain">DOMAIN</span> <span class="pill prod">' + d.owner + '</span></div>' +
                '<h3>' + d.name + '</h3>' +
                '<p>' + d.description + '</p>' +
                '<p><strong>System:</strong> <code>' + d.systems.join(', ') + '</code></p>' +
              '</div>'
            ).join('') +
            data.groups.map(g =>
              '<div class="card">' +
                '<div><span class="pill">KEYCLOAK OIDC GROUP</span></div>' +
                '<h3>' + g.displayName + '</h3>' +
                '<p>' + g.description + '</p>' +
                '<p><strong>Entity Ref:</strong> <code>' + g.name + '</code> • <strong>Contact:</strong> ' + g.email + '</p>' +
              '</div>'
            ).join('') +
            data.resources.map(r =>
              '<div class="card">' +
                '<div><span class="pill">' + r.type.toUpperCase() + '</span> <span class="pill domain">' + r.system + '</span></div>' +
                '<h3>' + r.title + '</h3>' +
                '<p>' + r.description + '</p>' +
                '<p><strong>Technology:</strong> ' + r.tech + '<br><strong>Owner:</strong> ' + r.owner + '</p>' +
              '</div>'
            ).join('');

          document.getElementById('templatesGrid').innerHTML = data.templates.map(t =>
            '<div class="card">' +
              '<div><span class="pill prod">' + t.language + '</span> <span class="pill domain">' + t.targetSystem + '</span></div>' +
              '<h3>' + t.title + '</h3>' +
              '<p><code>' + t.path + '</code></p>' +
              '<ul>' + t.features.map(f => '<li>' + f + '</li>').join('') + '</ul>' +
            '</div>'
          ).join('');

          document.getElementById('portalsGrid').innerHTML = data.portals.map(p =>
            '<div class="card">' +
              '<div><span class="pill">' + p.category + '</span> <span class="pill domain">ns: ' + p.namespace + '</span> <span class="pill prod">' + p.status + '</span></div>' +
              '<h3>' + p.name + '</h3>' +
              '<p><code>' + p.url + '</code><br><span style="font-size:11.5px;color:#94a3b8">Auth: ' + p.auth + '</span></p>' +
              '<a class="btn-link" href="' + p.url + '" target="_blank" rel="noopener">Launch Console ↗</a>' +
            '</div>'
          ).join('');
        }

        function renderApis() {
          const q = (document.getElementById('apiSearchInput').value || '').toLowerCase();
          const tFilter = document.getElementById('apiTypeFilter').value;
          const items = data.apis.filter(a => {
            if (tFilter && !a.type.includes(tFilter)) return false;
            return !q || [a.name, a.title, a.component, a.system, a.specVersion, a.description, ...(a.operations || [])].some(v => v.toLowerCase().includes(q));
          });
          document.getElementById('apisGrid').innerHTML = items.map(a =>
            '<div class="card">' +
              '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
                '<span class="pill">' + a.specVersion + '</span>' +
                '<span class="pill domain">' + a.component + '</span>' +
                '<span class="pill prod">' + a.domain + '</span>' +
              '</div>' +
              '<h3>' + a.title + '</h3>' +
              '<p style="font-size:11.5px;color:#38bdf8"><code>' + a.name + '</code> • System: <code>' + a.system + '</code></p>' +
              '<p>' + a.description + '</p>' +
              '<ul>' + (a.operations || []).map(op => '<li><code>' + op + '</code></li>').join('') + '</ul>' +
              '<div style="display:flex;gap:8px;margin-top:auto;padding-top:6px">' +
                '<a class="btn-link" href="' + a.endpoint + '" target="_blank" rel="noopener">Open Swagger / UI ↗</a>' +
                '<a class="btn-link" style="background:rgba(34,197,94,0.14);color:#4ade80" href="' + a.healthEndpoint + '" target="_blank" rel="noopener">Health / Readiness ↗</a>' +
              '</div>' +
            '</div>'
          ).join('');
        }

        function renderCatalog() {
          const q = (document.getElementById('searchInput').value || '').toLowerCase();
          const dom = document.getElementById('domainFilter').value;
          const rows = data.components.filter(c => {
            if (dom && c.domain !== dom) return false;
            return !q || [c.name, c.title, c.tech, c.system, c.owner, c.description].some(v => v.toLowerCase().includes(q));
          });
          document.getElementById('catalogBody').innerHTML = rows.map(c =>
            '<tr>' +
              '<td><strong>' + c.name + '</strong><br><span style="color:#38bdf8;font-size:11.5px">' + c.title + '</span><br><span style="color:#94a3b8;font-size:11.5px">' + c.description + '</span></td>' +
              '<td><span class="pill domain">' + c.domain + '</span><br><span style="color:#94a3b8;font-size:11.5px">' + c.system + '</span></td>' +
              '<td>' + c.tech + '</td>' +
              '<td>' + c.owner + '<br><span style="color:#94a3b8;font-size:11px">Sonar: ' + c.sonarKey + '</span></td>' +
              '<td><span class="pill prod">' + c.lifecycle + '</span></td>' +
              '<td>' +
                '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
                  '<a class="btn-link" href="' + c.docsUrl + '" target="_blank" rel="noopener">:' + c.port + ' UI/Docs ↗</a>' +
                  '<a class="btn-link" style="background:rgba(34,197,94,0.14);color:#4ade80" href="' + c.healthUrl + '" target="_blank" rel="noopener">Health ↗</a>' +
                '</div>' +
              '</td>' +
            '</tr>'
          ).join('');
        }

        function showTab(tab, btn) {
          ['catalog', 'apis', 'domains', 'templates', 'portals'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
          });
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }

        init();
      </script>
    </body>
    </html>`;

    const server = http.createServer((req, res) => {
      const url = (req.url || '/').split('?')[0];
      if (url === '/.backstage/health/v1/liveness' || url === '/.backstage/health/v1/readiness' || url === '/healthz') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok', service: 'backstage-idp', version: '1.36.0' }));
        return;
      }
      if (url === '/api/catalog/entities') {
        res.writeHead(200, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify(CATALOG_DATA, null, 2));
        return;
      }
      res.writeHead(200, {
        'Content-Type': 'text/html; charset=utf-8',
        'X-Content-Type-Options': 'nosniff',
        'X-Frame-Options': 'SAMEORIGIN'
      });
      res.end(HTML_PAGE);
    });

    server.listen(PORT, '0.0.0.0', () => {
      console.log(`Backstage IDP Portal listening on http://0.0.0.0:${PORT}`);
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-idp
  namespace: dev
  labels:
    app: backstage-idp
    app.kubernetes.io/name: backstage-idp
    app.kubernetes.io/part-of: microservices-architecture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-idp
  template:
    metadata:
      labels:
        app: backstage-idp
        app.kubernetes.io/name: backstage-idp
        app.kubernetes.io/part-of: microservices-architecture
    spec:
      serviceAccountName: backstage-idp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage-backend
          image: ghcr.io/backstage/backstage:1.36.0
          imagePullPolicy: IfNotPresent
          command: ["node", "/app-portal/server.js"]
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_CONFIG_backend_listen_port
              value: "7007"
            - name: KEYCLOAK_OIDC_METADATA_URL
              value: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/.well-known/openid-configuration"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: 7007
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: portal-script
              mountPath: /app-portal
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: portal-script
          configMap:
            name: backstage-idp-portal
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-idp
  namespace: dev
  labels:
    app: backstage-idp
    app.kubernetes.io/name: backstage-idp
    app.kubernetes.io/part-of: microservices-architecture
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7007
      targetPort: 7007
      protocol: TCP
  selector:
    app: backstage-idp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backstage-idp-netpol
  namespace: dev
  labels:
    app: backstage-idp
spec:
  podSelector:
    matchLabels:
      app: backstage-idp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 7007
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8181
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
