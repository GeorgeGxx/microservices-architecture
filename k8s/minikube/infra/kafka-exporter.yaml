apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: data
  labels:
    app: kafka-exporter
spec:
  ports:
    - name: http-metrics
      port: 9308
      targetPort: 9308
  selector:
    app: kafka-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: data
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - "--kafka.server=kafka:9092"
          ports:
            - name: http-metrics
              containerPort: 9308
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  namespace: data
  labels:
    app: kafka-exporter
    release: prometheus
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: kafka-exporter
  endpoints:
    - port: http-metrics
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: kafka
        - targetLabel: service
          replacement: kafka

