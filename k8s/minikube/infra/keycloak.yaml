apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: auth
spec:
  type: NodePort
  ports:
    - name: http-keycloak
      port: 8181
      targetPort: 8181
      nodePort: 30181
    - name: http-metrics
      port: 9000
      targetPort: 9000
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          command: ['sh', '-c', 'until nc -z -w 2 db-keycloak 5432; do echo "Waiting for PostgreSQL db-keycloak:5432..."; sleep 2; done; echo "PostgreSQL is ready!"']
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args: ["start-dev"]
          ports:
            - containerPort: 8181
              name: http
            - containerPort: 9000
              name: management
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://db-keycloak:5432/ms_keycloak?sslmode=disable"
            - name: KC_HTTP_PORT
              value: "8181"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: JAVA_OPTS_APPEND
              value: "-Xms512m -Xmx1536m -XX:+UseG1GC"
          resources:
            requests:
              cpu: "1000m"
              memory: "1536Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2500m"
              memory: "3072Mi"
              ephemeral-storage: "2Gi"
          startupProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
