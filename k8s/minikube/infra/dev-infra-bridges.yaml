---
# Observability bridges: transparent DNS routing to 'observability' namespace
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: dev
  labels:
    app.kubernetes.io/part-of: devsecops-platform
    environment: dev
spec:
  type: ExternalName
  externalName: tempo.observability.svc.cluster.local
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: http-otlp
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: dev
  labels:
    app.kubernetes.io/part-of: devsecops-platform
    environment: dev
spec:
  type: ExternalName
  externalName: loki.observability.svc.cluster.local
  ports:
    - name: http
      port: 3100
      targetPort: 3100
