apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: staging
spec:
  type: ExternalName
  externalName: keycloak.auth.svc.cluster.local
  ports:
    - name: http-keycloak
      port: 8181
      targetPort: 8181
