apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus-ds
        type: prometheus
        access: proxy
        url: http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 15s
      - name: Loki
        uid: loki-ds
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: 'tempo-ds'
              matcherRegex: "(?:traceId|trace_id)[:=]\\s*\"?([a-f0-9]{32})\"?"
              name: 'TraceID'
              url: '$${__value.raw}'
      - name: Tempo
        uid: tempo-ds
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: false
        editable: true
        jsonData:
          httpMethod: GET
          search:
            hide: false
          tracesToLogsV2:
            datasourceUid: 'loki-ds'
            spanStartTimeShift: '1h'
            spanEndTimeShift: '1h'
            filterByTraceId: true
            filterBySpanId: false
            query: '{service=~".+"} |= "$${__span.traceId}"'
          serviceMap:
            datasourceUid: 'prometheus-ds'
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: 'loki-ds'
