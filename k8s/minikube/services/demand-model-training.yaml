apiVersion: batch/v1
kind: Job
metadata:
  name: demand-model-training
  namespace: dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: demand-model-training
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: demand-training-sa
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-mlflow
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          command:
            - sh
            - -c
            - >-
              until wget -q -T 2 -O /dev/null http://mlflow:5000/health;
              do echo "Waiting for MLflow..."; sleep 5; done
      containers:
        - name: train
          image: georgegxx/mlops-training:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --input-parquet
            - /data/sales_parquet
          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: MLFLOW_TRACKING_URI
            - name: MLFLOW_EXPERIMENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: mlops-config
                  key: MLFLOW_EXPERIMENT_NAME
            - name: HOME
              value: /tmp
            - name: GIT_PYTHON_REFRESH
              value: quiet
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: sales-data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sales-data
          persistentVolumeClaim:
            claimName: mlops-sales-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
