apiVersion: batch/v1
kind: CronJob
metadata:
  name: demand-model-training-scheduler
  namespace: dev
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: demand-model-training
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: demand-model-training
          annotations:
            sidecar.istio.io/nativeSidecar: "true"
        spec:
          serviceAccountName: demand-training-sa
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: train
              image: georgegxx/mlops-training:1.0.0
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/train_demand_model.py
                - --auto
              env:
                - name: MLFLOW_TRACKING_URI
                  valueFrom:
                    configMapKeyRef:
                      name: mlops-config
                      key: MLFLOW_TRACKING_URI
                - name: MLFLOW_EXPERIMENT_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: mlops-config
                      key: MLFLOW_EXPERIMENT_NAME
                - name: MLOPS_SALES_PATH
                  value: /data/sales_parquet
                - name: MLOPS_TRAINING_STATE_PATH
                  value: /data/checkpoints/auto-training/last-successful-input.sha256
                - name: HOME
                  value: /tmp
                - name: GIT_PYTHON_REFRESH
                  value: quiet
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "4"
                  memory: 4Gi
                  ephemeral-storage: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: sales-data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: sales-data
              persistentVolumeClaim:
                claimName: mlops-sales-data
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
