apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmo-router-config
  namespace: dev
  labels:
    app: cosmo-router
data:
  router.yaml: |
    version: "1"
    log_level: info
    listen_addr: 0.0.0.0:8080
    graphql_path: /graphql
    playground_enabled: true
    introspection:
      enabled: true
    health_check_path: /health
    readiness_check_path: /health/ready
    liveness_check_path: /health/live
    execution_config:
      file:
        path: /runtime/execution-config.json
        watch: true
        watch_interval: 5s
    watch_config:
      enabled: true
      interval: 10s
    authentication:
      jwt:
        jwks:
          - url: http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs
            refresh_interval: 5m
            algorithms: [RS256]
            refresh_unknown_kid:
              enabled: true
              max_wait: 10s
              interval: 30s
              burst: 2
        header_name: Authorization
        header_value_prefix: Bearer
        header_sources:
          - type: header
            name: Authorization
            value_prefixes: [Bearer]
        on_error: reject
    authorization:
      require_authentication: false
      reject_operation_if_unauthorized: true
      enable_pre_fetch_field_authorization: true
    access_logs:
      enabled: true
      level: info
      router:
        ignore_query_params_list: [variables, extensions]
        fields:
          - key: operation_name
            value_from:
              context_field: operation_name
          - key: operation_type
            value_from:
              context_field: operation_type
          - key: operation_hash
            value_from:
              context_field: operation_hash
      subgraphs:
        enabled: true
        fields:
          - key: operation_name
            value_from:
              context_field: operation_name
    cors:
      allow_origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      allow_methods: [GET, POST, OPTIONS]
      allow_headers: [Authorization, Content-Type, X-Idempotency-Key, X-Correlation-ID, apollographql-client-name, apollographql-client-version]
    headers:
      all:
        request:
          - op: propagate
            named: Authorization
          - op: propagate
            named: X-Idempotency-Key
          - op: propagate
            named: traceparent
          - op: propagate
            named: tracestate
          - op: propagate
            named: X-Correlation-ID
    traffic_shaping:
      router:
        max_request_body_size: 1MB
        max_header_bytes: 1MiB
      all:
        request_timeout: 20s
        dial_timeout: 3s
        response_header_timeout: 15s
        max_conns_per_host: 64
        max_idle_conns_per_host: 16
        retry:
          enabled: true
          algorithm: backoff_jitter
          max_attempts: 2
          interval: 100ms
          max_duration: 1s
          expression: "IsRetryableStatusCode() || IsConnectionError() || IsTimeout()"
        circuit_breaker:
          enabled: false
          request_threshold: 20
          error_threshold_percentage: 50
          sleep_window: 15s
          half_open_attempts: 3
          required_successful: 2
          rolling_duration: 60s
          num_buckets: 10
          execution_timeout: 20s
    security:
      complexity_calculation_cache:
        enabled: true
        size: 1024
      complexity_limits:
        mode: enforce
        ignore_introspection: false
        depth:
          enabled: true
          limit: 12
        total_fields:
          enabled: true
          limit: 250
        root_fields:
          enabled: true
          limit: 12
        root_field_aliases:
          enabled: true
          limit: 5
      parser_limits:
        approximate_depth_limit: 40
        total_fields_limit: 500
      operation_name_length_limit: 128
    telemetry:
      service_name: cosmo-router
      tracing:
        enabled: true
        sampling_rate: 0.25
        exporters:
          - exporter: http
            endpoint: http://otel-collector.observability.svc.cluster.local:4318
            batch_timeout: 5s
            export_timeout: 5s
      metrics:
        prometheus:
          enabled: true
          listen_addr: 0.0.0.0:9090
          path: /metrics
          graphql_cache: true
          connection_stats: true
          network:
            enabled: true
          circuit_breaker: true
  supergraph.yaml: |
    version: 1
    subgraphs:
      - name: products
        routing_url: http://products-service:8004/graphql
        schema:
          file: ./subgraphs/products.graphql
      - name: inventory
        routing_url: http://inventory-service:8001/graphql
        schema:
          file: ./subgraphs/inventory.graphql
      - name: orders
        routing_url: http://orders-service:8003/graphql
        schema:
          file: ./subgraphs/orders.graphql
  products.graphql: |
    extend schema
      @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
    type Product @key(fields: "sku") {
      id: ID
      sku: String!
      name: String!
      description: String
      price: Float
      status: Boolean
      imageUrl: String
      category: String
      rating: Float
      reviewCount: Int
      isBestSeller: Boolean
    }
    type Query {
      products: [Product!]!
      productBySku(sku: String!): Product
      product(id: ID!): Product
    }
  inventory.graphql: |
    extend schema
      @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
    type Product @key(fields: "sku") {
      sku: String!
      isInStock: Boolean!
      quantity: Int!
    }
    type InventoryResponse {
      id: ID
      sku: String!
      quantity: Int!
      isInStock: Boolean!
    }
    type Query {
      inventory(sku: String!): InventoryResponse
      inventories: [InventoryResponse!]!
    }
  orders.graphql: |
    extend schema
      @link(url: "https://specs.apollo.dev/federation/v2.5", import: ["@key", "@shareable", "@authenticated"])
    type Product @key(fields: "sku") {
      sku: String!
    }
    type OrderLineItem {
      id: ID
      sku: String!
      price: Float
      quantity: Int
      product: Product
    }
    type Order {
      id: ID!
      orderNumber: String!
      userId: String
      username: String
      orderStatus: String
      orderItems: [OrderLineItem!]!
      customerName: String
      customerEmail: String
      shippingAddress: String
      city: String
      postalCode: String
      phone: String
      deliveryMethod: String
      trackingNumber: String
      carrier: String
      subtotalAmount: Float
      shippingFee: Float
      taxAmount: Float
      totalAmount: Float
      paymentMethod: String
    }
    input OrderItemInput {
      sku: String!
      price: Float!
      quantity: Int!
    }
    input PlaceOrderInput {
      orderItems: [OrderItemInput!]!
      customerName: String
      customerEmail: String
      shippingAddress: String
      city: String
      postalCode: String
      phone: String
      deliveryMethod: String
      paymentMethod: String
    }
    type Query {
      orders: [Order!]! @authenticated
      order(id: ID!): Order @authenticated
    }
    type Mutation {
      placeOrder(input: PlaceOrderInput!): Order @authenticated
      cancelOrder(id: ID!): Order @authenticated
      shipOrder(id: ID!): Order @authenticated
      deliverOrder(id: ID!): Order @authenticated
    }
---
apiVersion: v1
kind: Service
metadata:
  name: cosmo-router
  namespace: dev
  labels:
    app: cosmo-router
spec:
  type: ClusterIP
  ports:
    - name: http-router
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: cosmo-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmo-router
  namespace: dev
  labels:
    app: cosmo-router
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosmo-router
  template:
    metadata:
      labels:
        app: cosmo-router
        version: "0.353.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: compose-federation-config
          image: node:22-alpine
          workingDir: /source
          command: ["sh", "-ec", "npx --yes wgc@0.132.0 router compose --input /source/supergraph.yaml --out /runtime/execution-config.json"]
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/npm-cache
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: execution-config
              mountPath: /runtime
            - name: tmp
              mountPath: /tmp
      containers:
        - name: cosmo-router
          image: ghcr.io/wundergraph/cosmo/router:0.353.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /dist/config/router.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http-router
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 800m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /dist/config/router.yaml
              subPath: router.yaml
              readOnly: true
            - name: execution-config
              mountPath: /runtime
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-router
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-router
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: source
          configMap:
            name: cosmo-router-config
            items:
              - key: supergraph.yaml
                path: supergraph.yaml
              - key: products.graphql
                path: subgraphs/products.graphql
              - key: inventory.graphql
                path: subgraphs/inventory.graphql
              - key: orders.graphql
                path: subgraphs/orders.graphql
        - name: config
          configMap:
            name: cosmo-router-config
            items:
              - key: router.yaml
                path: router.yaml
        - name: execution-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
