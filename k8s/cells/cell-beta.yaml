apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service-cell-beta
  namespace: prod
  labels:
    app: orders-service
    cell: cell-beta
    tier: backend
    framework: spring-boot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-service
      cell: cell-beta
  template:
    metadata:
      labels:
        app: orders-service
        cell: cell-beta
        sidecar.istio.io/inject: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: orders-service
          image: ghcr.io/georgegxx/orders-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: CELL_ID
              value: "cell-beta"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-orders-cell-beta.prod.svc.cluster.local:5432/orders_shard_beta"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.infra.svc.cluster.local:9092"
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "orders-group-cell-beta"
            - name: RESILIENCE_ADAPTIVE_CONCURRENCY_ENABLED
              value: "true"
            - name: RESILIENCE_ADAPTIVE_CONCURRENCY_INITIAL_LIMIT
              value: "100"
            - name: RESILIENCE_ADAPTIVE_CONCURRENCY_MAX_LIMIT
              value: "1000"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service-cell-beta
  namespace: prod
  labels:
    app: orders-service
    cell: cell-beta
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: orders-service
    cell: cell-beta
