apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: products-service-vs
  namespace: staging
spec:
  hosts:
    - products-service
  http:
    - match:
        - headers:
            x-chaos-test:
              exact: "delay"
      fault:
        delay:
          percentage:
            value: 100.0
          fixedDelay: 5s
      route:
        - destination:
            host: products-service
            subset: v1
    - match:
        - headers:
            x-chaos-test:
              exact: "abort"
      fault:
        abort:
          percentage:
            value: 100.0
          httpStatus: 503
      route:
        - destination:
            host: products-service
            subset: v1
    - route:
        - destination:
            host: products-service
            subset: v1
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: "5xx,connect-failure,refused-stream"
---
