apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service-v2
  namespace: dev
  labels:
    app: products-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-service
      version: v2
  template:
    metadata:
      labels:
        app: products-service
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/actuator/products/prometheus"
    spec:
      serviceAccountName: products-service-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: products-service
          # platform-minikube.ps1 sets this to the immutable candidate tag supplied by the operator.
          image: georgegxx/products-service:1.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8004
              name: http
          envFrom:
            - configMapRef:
                name: microservices-config
            - secretRef:
                name: microservices-secrets
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /actuator/products/health/readiness
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/products/health/liveness
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
