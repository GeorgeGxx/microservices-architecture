# ==============================================================================
# Istio CNI (Container Network Interface) Configuration
# Eliminates elevated NET_ADMIN and NET_RAW privileges from application pods.
# Allows application namespaces to run with pod-security.kubernetes.io/enforce: restricted.
# ==============================================================================
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  namespace: istio-system
  name: istio-cni-config
spec:
  components:
    cni:
      enabled: true
      namespace: kube-system
      k8s:
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          # nosemgrep: yaml.kubernetes.security.privileged-container.privileged-container
          privileged: true # CNI daemonset runs in kube-system node-level to manage network namespaces
  values:
    cni:
      cniBinDir: /opt/cni/bin
      cniConfDir: /etc/cni/net.d
      chained: true
      repair:
        enabled: true
        deletePods: true
        labelPods: true
    sidecarInjectorWebhook:
      injectedAnnotations:
        "k8s.v1.cni.cncf.io/networks": "istio-cni"
