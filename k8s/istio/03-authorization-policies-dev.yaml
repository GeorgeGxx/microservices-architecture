# ==============================================================================
# Zero-Trust Istio Authorization Policies - DEV Environment
# Implements Principle of Least Privilege: Default Deny + Explicit Workload Allow
# ==============================================================================

# 1. Default Deny all traffic in namespace 'dev'
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: dev
spec:
  {}
---
# 1b. Mesh-level JWT Validation via Keycloak OIDC JWKS
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt-auth
  namespace: dev
spec:
  jwtRules:
    - issuer: "http://localhost:8181/realms/microservices-realm"
      jwksUri: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs"
      forwardOriginalToken: true
    - issuer: "http://127.0.0.1:8181/realms/microservices-realm"
      jwksUri: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs"
      forwardOriginalToken: true
    - issuer: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm"
      jwksUri: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs"
      forwardOriginalToken: true
---
# 1c. Deny unauthenticated edge calls to sensitive financial and HITL approval mutations
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-unauthenticated-sensitive-mutations
  namespace: dev
spec:
  action: DENY
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/dev/sa/frontend-sa"
            notRequestPrincipals: ["*"]
      to:
        - operation:
            methods: ["POST", "PUT", "PATCH", "DELETE"]
            paths:
              - "/api/v1/payments/process*"
              - "/api/v1/payments/refund*"
              - "/api/ai/hitl/approve*"
              - "/api/hitl/approve*"
              - "/api/ai/evals/run*"
              - "/api/evals/run*"
---
# 2. Allow Ingress Gateway and Frontend to reach Edge Services (Cosmo Router & Storefront)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-edge
  namespace: dev
spec:
  selector:
    matchLabels:
      app: cosmo-router
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/dev/sa/frontend-sa"
              - "cluster.local/ns/dev/sa/ai-service-sa"
      to:
        - operation:
            ports: ["8080"]
            paths: ["/graphql*", "/health*"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: dev
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            ports: ["8080", "80"]
    - to:
        - operation:
            paths: ["/healthz", "/actuator/health"]
---
# 3. Allow Cosmo Router to call Federated Subgraph Microservices
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-router-to-subgraphs
  namespace: dev
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/dev/sa/cosmo-router-sa"
      to:
        - operation:
            ports: ["8001", "8002", "8003", "8004", "8085", "8086", "8087"]
---
# 4. Allow Ingress Gateway and Frontend to call Microservice REST APIs
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-and-frontend-to-subgraphs
  namespace: dev
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/dev/sa/frontend-sa"
              - "cluster.local/ns/dev/sa/ai-service-sa"
      to:
        - operation:
            ports: ["8001", "8002", "8003", "8004", "8005", "8010", "8085", "8086", "8087"]
---
# 5. Allow Service-to-Service East-West Communication (Orders -> Products, Inventory, Payments, Notifications, Fulfillment, Analytics)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-orders-to-downstream
  namespace: dev
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/dev/sa/orders-service-sa"
      to:
        - operation:
            ports: ["8001", "8002", "8004", "8085", "8086", "8087"]
---
# 6. Allow Ingress Gateway, Frontend, and Internal Callers to reach Demand Forecast Service
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-forecast
  namespace: dev
spec:
  selector:
    matchLabels:
      app: demand-forecast-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/dev/sa/frontend-sa"
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/dev/sa/orders-service-sa"
              - "cluster.local/ns/dev/sa/cosmo-router-sa"
      to:
        - operation:
            ports: ["8005"]
---
# 7. Allow MLOps workloads to access MLflow Tracking
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mlops-to-mlflow
  namespace: dev
spec:
  selector:
    matchLabels:
      app: mlflow
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/dev/sa/demand-forecast-sa"
              - "cluster.local/ns/dev/sa/demand-sales-capture-sa"
      to:
        - operation:
            ports: ["5000"]
---
# 8. Allow Prometheus and Observability Scrapers to reach Metrics and Health endpoints
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-scraping
  namespace: dev
spec:
  action: ALLOW
  rules:
    # Authenticated in-mesh telemetry collectors (mTLS SPIFFE ID)
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
      to:
        - operation:
            paths: ["/actuator*", "/metrics*", "/stats/prometheus*", "/health*"]
    # Telemetry scraping without sidecar (L3/L4 NetworkPolicy restricts network origin to observability)
    - to:
        - operation:
            methods: ["GET", "HEAD"]
            paths: ["/actuator*", "/metrics*", "/stats/prometheus*", "/health*"]
