apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: dev
spec:
  mtls:
    mode: STRICT
---
# Dedicated metrics port exception: only port 9090 on Cosmo Router is exposed for
# unauthenticated Prometheus scraping when scraper is outside mesh.
# Application ports (8001-8087) enforce STRICT mTLS for zero-trust microservice communication.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: cosmo-router-metrics
  namespace: dev
spec:
  selector:
    matchLabels:
      app: cosmo-router
  portLevelMtls:
    9090:
      mode: PERMISSIVE
