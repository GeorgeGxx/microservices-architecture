apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: dev-zero-trust-mtls
  namespace: dev
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: orders-service-metrics-mtls
  namespace: dev
spec:
  selector:
    matchLabels:
      app: orders-service
  mtls:
    mode: STRICT
  portLevelMtls:
    8003:
      mode: PERMISSIVE
---
