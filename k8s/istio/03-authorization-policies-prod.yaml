# ==============================================================================
# Zero-Trust Istio Authorization Policies - PRODUCTION Environment
# Implements Principle of Least Privilege: Default Deny + Explicit Workload Allow
# ==============================================================================

# 1. Default Deny all traffic in namespace 'production'
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  {}
---
# 2. Allow Ingress Gateway and Frontend to reach Edge Services (Cosmo Router & Storefront)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-edge
  namespace: production
spec:
  selector:
    matchLabels:
      app: cosmo-router
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
              - "cluster.local/ns/production/sa/frontend-sa"
      to:
        - operation:
            ports: ["8080"]
            paths: ["/graphql*", "/health*"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: production
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      to:
        - operation:
            ports: ["8080", "80"]
---
# 3. Allow Cosmo Router to call Federated Subgraph Microservices
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-router-to-subgraphs
  namespace: production
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/production/sa/cosmo-router-sa"
      to:
        - operation:
            ports: ["8001", "8002", "8003", "8004", "8085", "8086", "8087"]
---
# 4. Allow Service-to-Service East-West Communication (Orders -> Products, Inventory, Payments, Notifications)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-orders-to-downstream
  namespace: production
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/production/sa/orders-service-sa"
      to:
        - operation:
            ports: ["8001", "8002", "8004", "8085"]
---
# 5. Allow Frontend to call Demand Forecast Service
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-forecast
  namespace: production
spec:
  selector:
    matchLabels:
      app: demand-forecast-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/production/sa/frontend-sa"
      to:
        - operation:
            ports: ["8005"]
---
# 6. Allow MLOps workloads to access MLflow Tracking
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mlops-to-mlflow
  namespace: production
spec:
  selector:
    matchLabels:
      app: mlflow
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/production/sa/demand-forecast-sa"
              - "cluster.local/ns/production/sa/demand-sales-capture-sa"
      to:
        - operation:
            ports: ["5000"]
---
# 7. Allow Prometheus and Observability Scrapers to reach Metrics and Health endpoints
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-scraping
  namespace: production
spec:
  action: ALLOW
  rules:
    # Authenticated in-mesh telemetry collectors (mTLS SPIFFE ID)
    - from:
        - source:
            namespaces: ["observability", "istio-system"]
      to:
        - operation:
            paths: ["/actuator*", "/metrics*", "/stats/prometheus*", "/health*"]
    # Telemetry scraping without sidecar (L3/L4 NetworkPolicy restricts network origin to observability)
    - to:
        - operation:
            methods: ["GET", "HEAD"]
            paths: ["/actuator*", "/metrics*", "/stats/prometheus*", "/health*"]
