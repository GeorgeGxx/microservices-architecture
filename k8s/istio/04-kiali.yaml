apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/name: kiali
    app.kubernetes.io/instance: kiali
    app.kubernetes.io/part-of: kiali
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali
  labels:
    app: kiali
    app.kubernetes.io/name: kiali
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - namespaces
      - nodes
      - pods
      - pods/log
      - replicationcontrollers
      - services
      - serviceaccounts
      - secrets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io", "security.istio.io", "telemetry.istio.io", "extensions.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - tlsroutes
      - tcproutes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali
  labels:
    app: kiali
    app.kubernetes.io/name: kiali
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali
subjects:
  - kind: ServiceAccount
    name: kiali
    namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kiali
    namespace: istio-system
---
apiVersion: v1
kind: Secret
metadata:
  name: kiali
  namespace: istio-system
type: Opaque
stringData:
  session-signing-key: "1234567890123456"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/name: kiali
data:
  config.yaml: |
    server:
      port: 20001
      web_root: /kiali
      listen_address: "0.0.0.0"
    auth:
      strategy: anonymous
    deployment:
      instance_name: kiali
      accessible_namespaces:
        - "**"
    api:
      namespaces:
        exclude:
          - "default"
          - "kube-.*"
          - "staging"
          - "prod"
    external_services:
      istio:
        root_namespace: istio-system
      prometheus:
        url: "http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090"
      tracing:
        enabled: true
        provider: "tempo"
        internal_url: "http://tempo.observability.svc.cluster.local:3200"
        external_url: "http://localhost:3000"
        use_grpc: false
        tempo_config:
          datasource_uid: "tempo-ds"
          url_format: "grafana"
      grafana:
        enabled: true
        internal_url: "http://kube-prometheus-grafana.observability.svc.cluster.local:80"
        external_url: "http://localhost:3000"
        auth:
          type: "basic"
          username: "admin"
          password: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/name: kiali
    app.kubernetes.io/instance: kiali
spec:
  type: NodePort
  ports:
    - name: http-kiali
      port: 20001
      targetPort: 20001
      nodePort: 32001
    - name: http-metrics
      port: 9090
      targetPort: 9090
  selector:
    app: kiali
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/name: kiali
    app.kubernetes.io/instance: kiali
    app.kubernetes.io/version: "v2.31.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiali
  template:
    metadata:
      labels:
        app: kiali
        app.kubernetes.io/name: kiali
        app.kubernetes.io/instance: kiali
        app.kubernetes.io/version: "v2.31.0"
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: kiali
      containers:
        - name: kiali
          image: quay.io/kiali/kiali:v2.31.0
          imagePullPolicy: IfNotPresent
          command:
            - "/opt/kiali/kiali"
          args:
            - "-config"
            - "/kiali-configuration/config.yaml"
          env:
            - name: AUTH_STRATEGY
              value: "anonymous"
            - name: SERVER_WEB_ROOT
              value: "/kiali"
            - name: SERVER_PORT
              value: "20001"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local:9090"
          ports:
            - name: api-port
              containerPort: 20001
            - name: http-metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /kiali/healthz
              port: 20001
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /kiali/healthz
              port: 20001
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: kiali-configuration
              mountPath: "/kiali-configuration"
            - name: kiali-secret
              mountPath: "/kiali-secret"
      volumes:
        - name: kiali-configuration
          configMap:
            name: kiali
        - name: kiali-secret
          secret:
            secretName: kiali
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: istio-system
spec:
  type: ExternalName
  externalName: kube-prometheus-kube-prome-prometheus.observability.svc.cluster.local
  ports:
    - name: http-prom
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: istio-system
spec:
  type: ExternalName
  externalName: tempo.observability.svc.cluster.local
  ports:
    - name: http-ui
      port: 3200
      targetPort: 3200
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: istio-system
spec:
  type: ExternalName
  externalName: kube-prometheus-grafana.observability.svc.cluster.local
  ports:
    - name: http-grafana
      port: 80
      targetPort: 80
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-stats
  namespace: observability
  labels:
    release: kube-prometheus
spec:
  selector:
    matchExpressions:
      - key: istio-prometheus-ignore
        operator: DoesNotExist
  namespaceSelector:
    matchNames:
      - dev
      - istio-system
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 10s

