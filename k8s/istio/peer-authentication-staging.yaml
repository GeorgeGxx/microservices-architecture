apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: staging
spec:
  mtls:
    mode: STRICT
---
# Dedicated metrics scraping exceptions:
# Exposes application and proxy telemetry ports for unauthenticated Prometheus scraping
# when the Prometheus scraper is outside the mesh (observability namespace).
# L3/L4 NetworkPolicies restrict incoming traffic to namespace 'observability', and L7
# AuthorizationPolicies strictly restrict methods to GET/HEAD on metrics & health paths.
# All intra-mesh business traffic on service-to-service paths enforces STRICT mTLS.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: cosmo-router-metrics
  namespace: staging
spec:
  selector:
    matchLabels:
      app: cosmo-router
  portLevelMtls:
    9090:
      mode: PERMISSIVE
---
