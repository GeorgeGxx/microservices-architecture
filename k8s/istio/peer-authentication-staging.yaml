apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: staging
spec:
  mtls:
    mode: STRICT
---
# Dedicated metrics port exception: only port 9090 on Cosmo Router is exposed for
# Prometheus scraping. Application business ports enforce STRICT mTLS.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: cosmo-router-metrics
  namespace: staging
spec:
  selector:
    matchLabels:
      app: cosmo-router
  portLevelMtls:
    9090:
      mode: PERMISSIVE
