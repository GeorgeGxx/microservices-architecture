apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki-ds
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: 'tempo-ds'
          matcherRegex: "(?:traceId|trace_id)[:=]\\s*\"?([a-f0-9]{32})\"?"
          name: 'TraceID'
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo-ds
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      search:
        hide: false
      tracesToLogsV2:
        datasourceUid: 'loki-ds'
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceId: true
        filterBySpanId: false
        query: '{service=~".+"} |= "$${__span.traceId}"'
      serviceMap:
        datasourceUid: 'prometheus-ds'
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: 'loki-ds'
