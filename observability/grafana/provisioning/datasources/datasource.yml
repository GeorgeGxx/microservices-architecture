apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki-ds
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true

  - name: Tempo
    uid: tempo-ds
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'loki-ds'
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceId: true
        filterBySpanId: false
        query: '{service="$${__span.tags.service_name}"} |= "$${__span.traceId}"'
      serviceMap:
        datasourceUid: 'prometheus-ds'
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: 'loki-ds'
