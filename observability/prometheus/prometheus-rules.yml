groups:
  - name: microservices-architecture-alerts
    rules:
      - alert: ObservabilityTargetDown
        expr: up{job=~"prometheus|loki|tempo|alloy"} == 0
        for: 5m
        labels:
          severity: warning
          category: observability
        annotations:
          summary: "Observability target {{ $labels.job }} is down"
          description: "Prometheus has not scraped {{ $labels.job }} successfully for 5 minutes."

      - alert: ServiceDown
        expr: up{service=~"products-service|inventory-service|orders-service|notification-service"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Service {{ $labels.service }} has been unreachable for more than 3 minutes."

      - alert: CosmoRouterDown
        expr: up{service="cosmo-router"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Cosmo Router is down"
          description: "The Cosmo Router Prometheus target has been unreachable for more than 3 minutes."

      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", status=~"5..", uri!~".*actuator.*"}[5m]))
            / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", uri!~".*actuator.*"}[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx Error Rate"
          description: "5xx HTTP error rate for a Spring service exceeds 5% over the last 5 minutes. Cosmo Router has its own alert."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket{service=~"products-service|inventory-service|orders-service|notification-service", uri!~".*actuator.*"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Service Request Latency"
          description: "P95 request latency for Spring services exceeds 1 second over the last 5 minutes."

      - alert: CosmoRouterHighErrorRate
        expr: |
          sum(rate(router_http_requests_error_total{wg_subgraph_name=""}[5m]))
          / sum(rate(router_http_requests_total{wg_subgraph_name=""}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cosmo Router failed-request rate is high"
          description: "More than 5% of Cosmo Router GraphQL requests failed over the last 5 minutes."

      - alert: CosmoRouterHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(router_http_request_duration_milliseconds_bucket{wg_subgraph_name=""}[5m]))) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cosmo Router P95 latency is high"
          description: "Cosmo Router request latency P95 has exceeded 1 second for 5 minutes."

      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis Exporter Unreachable"
          description: "The Redis Prometheus exporter target is down or unreachable."

      - alert: HighHeapUsage
        expr: sum(jvm_memory_used_bytes{service=~"products-service|inventory-service|orders-service|notification-service", area="heap"}) by (service)
          / sum(jvm_memory_max_bytes{service=~"products-service|inventory-service|orders-service|notification-service", area="heap"}) by (service) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High JVM Heap Memory Usage"
          description: "Service {{ $labels.service }} is consuming more than 75% of allocated JVM heap memory."

      # Q6: How do you configure a Prometheus alert definition to catch a crashing pod before it triggers an engineering incident?
      # Answer: In a DevSecOps environment, you monitor container states. The Prometheus metric kube_pod_container_status_waiting_reason can tell you if a pod is stuck in a loop.

      - alert: ContainerStuckInCrashLoop
        expr: sum by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) > 0
        for: 5m
        labels:
          severity: critical
          team: devsecops
        annotations:
          summary: "Container {{ $labels.container }} in pod {{ $labels.pod }} is failing to start."
          description: "The container has been stuck in a CrashLoopBackOff cycle for more than 5 minutes in the {{ $labels.namespace }} namespace."

      # Security & DDoS Detection Alert Rules
      - alert: PotentialDDoSAttack
        expr: |
          (sum(rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", uri!~".*actuator.*"}[1m])) or vector(0))
          + (sum(rate(router_http_requests_total{wg_subgraph_name=""}[1m])) or vector(0)) > 150
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Potential DDoS Attack In Progress"
          description: "Observed Spring service and Cosmo Router HTTP throughput is above 150 requests/sec."

      - alert: RateLimiterHighRejections
        expr: |
          (sum(rate(http_server_requests_seconds_count{status="429"}[1m])) or vector(0))
          + (sum(rate(router_http_requests_total{wg_subgraph_name="", http_status_code="429"}[1m])) or vector(0)) > 25
        for: 1m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High Volume of 429 Rate Limiter Blocks"
          description: "Observed Spring services and Cosmo Router are returning more than 25 HTTP 429 responses/sec; this rule reports the status code and does not assume a specific limiting implementation."

      - alert: TargetEndpointFlooding
        expr: topk(1, sum by (uri) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", uri!~".*actuator.*"}[1m]))) > 80
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Layer 7 Endpoint Flooding Detected"
          description: "Endpoint {{ $labels.uri }} is experiencing abnormally heavy concentrated traffic (> 80 req/s)."

  - name: microservices-availability-slo
    interval: 30s
    rules:
      - record: microservices:http_requests:rate5m
        expr: sum by (service) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", uri!~".*actuator.*"}[5m]))
      - record: microservices:http_errors:rate5m
        expr: sum by (service) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", status=~"5..", uri!~".*actuator.*"}[5m]))
      - record: microservices:http_error_ratio:rate5m
        expr: microservices:http_errors:rate5m / clamp_min(microservices:http_requests:rate5m, 1e-9)
      - record: microservices:http_requests:rate1h
        expr: sum by (service) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", uri!~".*actuator.*"}[1h]))
      - record: microservices:http_errors:rate1h
        expr: sum by (service) (rate(http_server_requests_seconds_count{service=~"products-service|inventory-service|orders-service|notification-service", status=~"5..", uri!~".*actuator.*"}[1h]))
      - record: microservices:http_error_ratio:rate1h
        expr: microservices:http_errors:rate1h / clamp_min(microservices:http_requests:rate1h, 1e-9)
      - alert: MicroserviceAvailabilityErrorBudgetBurn
        expr: (microservices:http_error_ratio:rate5m > 0.072) and (microservices:http_error_ratio:rate1h > 0.072)
        for: 2m
        labels:
          severity: critical
          slo: availability
          objective: "99.5%"
        annotations:
          summary: "{{ $labels.service }} is consuming its availability error budget rapidly"
          description: "The 5-minute and 1-hour 5xx ratios exceed 7.2%, a 14.4x burn rate against the 99.5% availability objective. Check recent deployments, downstream dependencies, and the service runbook."
          runbook: "docs/04-observability/OBSERVABILITY_QUERIES.md#availability-slo-and-error-budget"

  - name: microservices-mlops-alerts
    interval: 30s
    rules:
      - alert: MLOpsForecastServiceDown
        expr: up{job=~"demand-forecast.*",service="demand-forecast-service"} == 0
        for: 3m
        labels:
          severity: critical
          category: mlops
        annotations:
          summary: "Demand Forecast Service is down"
          description: "Prometheus has not scraped the demand forecast inference API for 3 minutes."

      - alert: MLOpsModelStale
        expr: demand_forecast_model_age_seconds > 604800
        for: 15m
        labels:
          severity: warning
          category: mlops
        annotations:
          summary: "Active Demand Forecast Model is Stale (> 7 days)"
          description: "The active model was trained {{ $value | humanizeDuration }} ago. Retraining may have stalled or auto-training interval failed."
          runbook: "docs/04-observability/OBSERVABILITY_QUERIES.md#mlops-alerts"

      - alert: MLOpsDataFreshnessLag
        expr: (time() - demand_forecast_last_observed_sale_unixtime) > 259200
        for: 30m
        labels:
          severity: warning
          category: mlops
        annotations:
          summary: "Sales Input Dataset Freshness Lag (> 3 days)"
          description: "The latest observed sale date in the feature store is more than 3 days old. Check demand-sales-capture pipeline and Kafka consumer lag."
          runbook: "docs/04-observability/OBSERVABILITY_QUERIES.md#mlops-alerts"

      - alert: MLOpsHighModelRMSE
        expr: demand_forecast_model_rmse > 15.0
        for: 10m
        labels:
          severity: warning
          category: mlops
        annotations:
          summary: "Demand Forecast Model Degradation (High RMSE)"
          description: "Active demand forecast model RMSE is {{ $value }}, exceeding the acceptable operational ceiling of 15.0."
          runbook: "docs/04-observability/OBSERVABILITY_QUERIES.md#mlops-alerts"

      - alert: MLOpsNoActiveModel
        expr: absent(demand_forecast_model_rmse) == 1
        for: 10m
        labels:
          severity: critical
          category: mlops
        annotations:
          summary: "No Active Demand Model Registered in MLflow"
          description: "The demand-forecast-service does not export an active model RMSE metric. No trained champion model is serving predictions."
          runbook: "docs/04-observability/OBSERVABILITY_QUERIES.md#mlops-alerts"
