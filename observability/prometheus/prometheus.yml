global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: 'apollo-router'
    metrics_path: /metrics
    static_configs:
      - targets: ['apollo-router:9090']
        labels:
          service: 'apollo-router'
          job: 'graphql-router'

  - job_name: 'products-service'
    metrics_path: /actuator/products/prometheus
    static_configs:
      - targets: ['products-service:8004']
        labels:
          service: 'products-service'
          job: 'spring-services'

  - job_name: 'orders-service'
    metrics_path: /actuator/orders/prometheus
    static_configs:
      - targets: ['orders-service:8003']
        labels:
          service: 'orders-service'
          job: 'spring-services'

  - job_name: 'inventory-service'
    metrics_path: /actuator/inventory/prometheus
    static_configs:
      - targets: ['inventory-service:8001']
        labels:
          service: 'inventory-service'
          job: 'spring-services'

  - job_name: 'notification-service'
    metrics_path: /actuator/notification/prometheus
    static_configs:
      - targets: ['notification-service:8002']
        labels:
          service: 'notification-service'
          job: 'spring-services'

  - job_name: 'redis'
    metrics_path: /metrics
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          job: 'redis'
          app: 'redis'

  - job_name: 'vault'
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    bearer_token: 'root'
    static_configs:
      - targets: ['vault:8200']
        labels:
          service: 'vault'
          job: 'vault'
          app: 'vault'

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']
        labels:
          service: 'keycloak'
          job: 'keycloak'
          app: 'keycloak'

  - job_name: 'kafka'
    metrics_path: /metrics
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'
          job: 'kafka'
          app: 'kafka'

  - job_name: 'postgres'
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          job: 'postgres'
          app: 'postgres'