global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: 'cosmo-router'
    metrics_path: /metrics
    static_configs:
      - targets: ['cosmo-router:9090']
        labels:
          service: 'cosmo-router'
          job: 'graphql-router'

  - job_name: 'products-service'
    metrics_path: /actuator/products/prometheus
    static_configs:
      - targets: ['products-service:8004']
        labels:
          service: 'products-service'
          job: 'spring-services'

  - job_name: 'orders-service'
    metrics_path: /actuator/orders/prometheus
    static_configs:
      - targets: ['orders-service:8003']
        labels:
          service: 'orders-service'
          job: 'spring-services'

  - job_name: 'inventory-service'
    metrics_path: /actuator/inventory/prometheus
    static_configs:
      - targets: ['inventory-service:8001']
        labels:
          service: 'inventory-service'
          job: 'spring-services'

  - job_name: 'notification-service'
    metrics_path: /actuator/notification/prometheus
    static_configs:
      - targets: ['notification-service:8002']
        labels:
          service: 'notification-service'
          job: 'spring-services'

  - job_name: 'payments-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['payments-service:8085']
        labels:
          service: 'payments-service'
          job: 'polyglot-services'

  - job_name: 'fulfillment-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['fulfillment-service:8086']
        labels:
          service: 'fulfillment-service'
          job: 'polyglot-services'

  - job_name: 'analytics-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['analytics-service:8087']
        labels:
          service: 'analytics-service'
          job: 'polyglot-services'

  - job_name: 'demand-forecast-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['demand-forecast-service:8005']
        labels:
          service: 'demand-forecast-service'
          job: 'mlops'

  - job_name: 'redis'
    metrics_path: /metrics
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          job: 'redis'
          app: 'redis'

  - job_name: 'vault'
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    bearer_token: 'root'
    static_configs:
      - targets: ['vault:8200']
        labels:
          service: 'vault'
          job: 'vault'
          app: 'vault'

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']
        labels:
          service: 'keycloak'
          job: 'keycloak'
          app: 'keycloak'

  - job_name: 'kafka'
    metrics_path: /metrics
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'
          job: 'kafka'
          app: 'kafka'

  - job_name: 'postgres'
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          job: 'postgres'
          app: 'postgres'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:3300']

  - job_name: 'blackbox-synthetic'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend:80/healthz
          - http://cosmo-router:8080/health/ready
          - http://keycloak:8181/realms/microservices-realm
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
