# Default values shared by every environment. Environment-specific overrides
# live in deploy/helm/values/values-<env>.yaml and are passed with `helm upgrade -f`.

global:
  environment: dev
  otelEndpoint: "https://otel-collector:4317"
  azureKeyVault:
    enabled: false

glitchtip:
  enabled: false
  provisionProjects:
    enabled: false
  image:
    repository: docker.io/glitchtip/glitchtip
    tag: "7.0.0"
  database:
    image: docker.io/postgres:18-alpine
    storage: 5Gi
  valkey:
    image: docker.io/valkey/valkey:8-alpine
  domain: http://localhost:8090
  retentionDays: "30"
  defaultFromEmail: glitchtip@microservices-architecture.dev

frontend:
  enabled: false
  nginxResolverAddress: "10.96.0.10"

mlops:
  enabled: false

configMap:
  create: true
  name: microservices-config
  data:
    COSMO_ROUTER_SERVICE_NAME: "cosmo-router"
    COSMO_ROUTER_PORT: "8080"
    INVENTORY_SERVICE_NAME: "inventory-service"
    NOTIFICATION_SERVICE_NAME: "notification-service"
    ORDERS_SERVICE_NAME: "orders-service"
    PRODUCTS_SERVICE_NAME: "products-service"
    PAYMENTS_SERVICE_NAME: "payments-service"
    FULFILLMENT_SERVICE_NAME: "fulfillment-service"
    ANALYTICS_SERVICE_NAME: "analytics-service"
    INVENTORY_SERVICE_URI: "http://inventory-service:8001"
    ORDERS_SERVICE_URI: "http://orders-service:8003"
    PRODUCTS_SERVICE_URI: "http://products-service:8004"
    NOTIFICATION_SERVICE_URI: "http://notification-service:8002"
    PAYMENTS_SERVICE_URI: "http://payments-service:8085"
    FULFILLMENT_SERVICE_URI: "http://fulfillment-service:8086"
    ANALYTICS_SERVICE_URI: "http://analytics-service:8087"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
    OTEL_METRICS_EXPORTER: "none"
    TRACING_SAMPLING_PROBABILITY: "1.0"
    HIBERNATE_DDL_AUTO: "validate"
    INVENTORY_RESERVATION_TTL: "PT15M"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
    KEYCLOAK_ISSUER_URI: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm"
    KEYCLOAK_JWT_URI: "http://keycloak.auth.svc.cluster.local:8181/realms/microservices-realm/protocol/openid-connect/certs"
    VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
    VAULT_ENABLED: "false"
    INVENTORY_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-inventory:5432/ms_inventory"
    ORDERS_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-orders:5432/ms_orders"
    PRODUCTS_SPRING_DATASOURCE_JDBC_URL: "jdbc:postgresql://db-products:5432/ms_products"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
    ARGOCD_VERSION: "3.6.1"
    ARGOCD_HELM_CHART_VERSION: "10.14.0"
    GATEKEEPER_VERSION: "3.23.0"
    KUBE_PROMETHEUS_STACK_VERSION: "89.2.2"
    TEMPO_VERSION: "3.0.5"
    JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=75.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dcom.sun.net.ssl.checkRevocation=true -Dcom.sun.security.enableCRLDP=true"

secret:
  create: false
  name: microservices-secrets
  data: {}

prometheusRule:
  enabled: true
networkPolicies:
  enabled: true
alertmanagerConfig:
  enabled: true
  slack:
    enabled: false
    channel: "#alerts-microservices"
    apiURLSecret:
      name: "alertmanager-slack-webhook"
      key: "url"
  jira:
    enabled: false
    webhookUrl: "https://your-domain.atlassian.net/rest/api/3/issue"
    urlSecret:
      enabled: false
      name: "alertmanager-jira-webhook"
      key: "url"
