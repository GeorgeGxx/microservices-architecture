map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    # OWASP & DevSecOps Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    access_log /dev/stdout security_json if=$log_security_rejection;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to Cosmo Router v2 (GraphQL)
    location /graphql {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://cosmo-router:8080/graphql;
        proxy_http_version 1.1;
        # Explicitly preserve the Keycloak bearer token for Cosmo's JWT auth.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin "http://localhost:5173";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for real-time SSE notifications
    location /api/notifications/ {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://notification-service:8002/api/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $proxy_host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Reverse proxy for REST endpoints
    location /api/order {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://orders-service:8003/api/order;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/product {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://products-service:8004/api/product;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/inventory {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://inventory-service:8001/api/inventory;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/payments {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://payments-service:8085/api/v1/payments;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/shipments {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://fulfillment-service:8086/api/v1/shipments;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/analytics {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://analytics-service:8087/api/v1/analytics;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin-only demand forecasts served by the local MLOps API
    location = /api/forecast {
        limit_req zone=graphql_per_ip burst=10 nodelay;
        proxy_pass http://demand-forecast-service:8005/api/forecast;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to Cosmo Router
    location /api/ {
        limit_req zone=graphql_per_ip burst=30 nodelay;
        proxy_pass http://cosmo-router:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin "http://localhost:5173";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Keycloak IAM (OAuth2 / OIDC authentication & realm assets)
    location /realms/ {
        proxy_pass http://keycloak:8181/realms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /resources/ {
        proxy_pass http://keycloak:8181/resources/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /js/ {
        proxy_pass http://keycloak:8181/js/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Gateway Health Probes
    location /actuator/health {
        default_type application/json;
        return 200 '{"status":"UP","gateway":"Nginx","version":"1.0.0"}';
    }

    location /healthz {
        default_type application/json;
        return 200 '{"status":"OK","timestamp":"2026-09-26"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # Static Assets Cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|txt|xml)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
