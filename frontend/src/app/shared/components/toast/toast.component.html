<div class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl border shadow-xl backdrop-blur-xl transition-all duration-300 animate-in slide-in-from-bottom-4"
      [class.border-emerald-500/40]="toast.type === 'success'"
      [class.bg-surface-card/95]="true"
      [class.border-danger/40]="toast.type === 'error'"
      [class.border-amber-500/40]="toast.type === 'warning'"
      [class.border-primary/40]="toast.type === 'info'"
    >
      <div 
        class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0"
        [class.bg-emerald-500/15]="toast.type === 'success'"
        [class.text-emerald-400]="toast.type === 'success'"
        [class.bg-danger/15]="toast.type === 'error'"
        [class.text-danger]="toast.type === 'error'"
        [class.bg-amber-500/15]="toast.type === 'warning'"
        [class.text-amber-400]="toast.type === 'warning'"
        [class.bg-primary/15]="toast.type === 'info'"
        [class.text-primary]="toast.type === 'info'"
      >
        @if (toast.type === 'success') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        } @else if (toast.type === 'error') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        } @else if (toast.type === 'warning') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        }
      </div>

      <div class="flex-1 min-w-0 pt-0.5">
        <div class="text-xs font-bold text-text-primary">{{ toast.title }}</div>
        @if (toast.message) {
          <div class="text-xs text-text-secondary mt-0.5 leading-snug">{{ toast.message }}</div>
        }
      </div>

      <button 
        class="p-1 rounded-lg text-text-muted hover:text-text-primary hover:bg-surface-color/50 transition-colors" 
        (click)="toastService.dismiss(toast.id)" 
        aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  }
</div>
