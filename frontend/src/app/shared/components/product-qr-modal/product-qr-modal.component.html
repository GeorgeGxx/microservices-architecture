@if (isOpen() && product(); as prod) {
  <div class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 animate-in fade-in duration-200" (click)="close()">
    <div class="relative w-full max-w-sm bg-surface-color/95 backdrop-blur-2xl rounded-3xl border border-border shadow-2xl p-6 flex flex-col items-center text-center animate-in zoom-in-95 duration-200" (click)="$event.stopPropagation()">
      <button 
        class="absolute top-4 right-4 p-2 rounded-xl text-text-muted hover:text-text-primary hover:bg-surface-card transition-colors" 
        (click)="close()" 
        aria-label="Close">✕</button>

      <div class="flex items-center gap-2 mb-3">
        <span class="px-2 py-0.5 rounded-md bg-primary/15 text-primary border border-primary/25 text-[10px] font-bold uppercase tracking-wider">MICROSTORE POS</span>
        <span class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400 border border-emerald-500/25 text-[10px] font-bold uppercase tracking-wider">ACTIVE SKU</span>
      </div>

      <h3 class="text-base font-extrabold text-text-primary tracking-tight">{{ prod.name }}</h3>
      <p class="text-xs text-text-secondary mt-1 font-mono">SKU: <strong class="text-text-primary">{{ prod.sku }}</strong></p>

      <div class="p-4 rounded-2xl bg-white shadow-inner my-4 flex items-center justify-center w-52 h-52 overflow-hidden border border-slate-200" [innerHTML]="qrSvg()"></div>

      <div class="w-full py-2 rounded-xl bg-surface-card border border-border mb-4">
        <span class="text-base font-black text-text-primary font-mono">${{ prod.price | number:'1.2-2' }} <small class="text-xs text-text-secondary">USD</small></span>
      </div>

      <div class="w-full grid grid-cols-2 gap-2">
        <button 
          class="py-2.5 px-4 rounded-xl text-xs font-bold text-white bg-primary hover:bg-primary-hover shadow-md shadow-primary/25 flex items-center justify-center gap-1.5 transition-all" 
          (click)="printLabel()">
          <span>🖨️ Print Label</span>
        </button>
        <button 
          class="py-2.5 px-4 rounded-xl text-xs font-semibold text-text-secondary hover:text-text-primary bg-surface-card border border-border hover:border-border-hover transition-colors" 
          (click)="close()">
          Close
        </button>
      </div>
    </div>
  </div>
}
