# Included from nginx.conf's http context before default.conf.
# Use the socket peer address, never caller-supplied X-Forwarded-For, as the key.
limit_req_zone $binary_remote_addr zone=graphql_per_ip:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level notice;

map $status $log_security_rejection {
    default 0;
    429     1;
}

log_format security_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"peer_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status"}';
