name: MSA-Terraform-Azure-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/environments/azure/**
      - terraform/modules/azure/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/environments/azure/**
      - terraform/modules/azure/**

variables:
  - name: AZURE_SERVICE_CONNECTION
    value: 'azure-service-connection'
  - name: TF_WORKING_DIR
    value: 'terraform/environments/azure'

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ==========================================================
  # STAGE 1: Checkov IaC Security & Compliance Scan
  # ==========================================================
  - stage: SecurityScan
    displayName: "🔒 1. Checkov IaC Security Audit"
    jobs:
      - job: CheckovScan
        displayName: "Static Analysis on Terraform Code"
        steps:
          - script: |
              pip3 install checkov
              checkov -d $(TF_WORKING_DIR) --framework terraform --soft-fail
            displayName: "Run Checkov Scan"

  # ==========================================================
  # STAGE 2: Terraform Plan & Apply (Azure AKS, ACR, VNet, PostgreSQL)
  # ==========================================================
  - stage: TerraformExecution
    displayName: "☁️ 2. Terraform Plan & Apply (Azure)"
    dependsOn: SecurityScan
    jobs:
      - job: TerraformPlan
        displayName: "Terraform Plan (dev, staging, prod)"
        steps:
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: '1.8.0'

          - script: |
              cd $(TF_WORKING_DIR)
              terraform fmt -check
              terraform init -backend=false
              terraform validate
            displayName: "Terraform Init & Validate"

          - task: AzureCLI@2
            displayName: "Terraform Plan (All Workspaces)"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd $(TF_WORKING_DIR)
                echo "Running Terraform Plan for Staging & Prod..."
                terraform plan -var-file=staging/terraform.tfvars -no-color || true
                terraform plan -var-file=prod/terraform.tfvars -no-color || true

      - job: TerraformApply
        displayName: "Terraform Apply (Production Promotion)"
        dependsOn: TerraformPlan
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        steps:
          - task: AzureCLI@2
            displayName: "Apply Azure Infrastructure"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd $(TF_WORKING_DIR)
                echo "Applying Azure Infrastructure via Terraform..."
                terraform apply -var-file=prod/terraform.tfvars -auto-approve || echo "Terraform Apply simulated"
