# Retired legacy pipeline. Create/use azure-devops/pipelines/infra.yml instead.
# This file is deliberately validation-only to prevent branch-triggered applies
# from an older pipeline definition.
name: MSA-Terraform-Azure-Legacy-Validation-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: LegacyPipelineRetired
    displayName: Legacy cloud apply pipeline retired
    jobs:
      - job: ValidateOnly
        displayName: Static validation only
        steps:
          - checkout: self
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: '1.8.0'
          - script: |
              set -euo pipefail
              cd terraform/environments/azure
              terraform fmt -check -recursive
              terraform init -backend=false -input=false
              terraform validate -no-color
            displayName: Validate Azure Terraform without remote state or apply
          - script: |
              echo "This legacy pipeline no longer plans or applies cloud infrastructure."
              echo "Use azure-devops/pipelines/infra.yml for saved-plan gated deployments."
            displayName: Explain replacement pipeline
