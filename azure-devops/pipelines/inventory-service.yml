name: MSA-Inventory-Service-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - inventory-service/**
      - helm/**
      - pom.xml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - inventory-service/**

variables:
  - name: AZURE_SERVICE_CONNECTION
    value: 'azure-service-connection'
  - name: AZURE_RG
    value: 'msa-azure-prod-rg'
  - name: AKS_CLUSTER_NAME
    value: 'msa-azure-prod-aks'
  - name: ACR_NAME
    value: 'msaazureprodacr'

stages:
  - template: ../templates/azure-pipelines.yml
    parameters:
      serviceName: 'inventory-service'
      serviceDir: 'inventory-service'
      serviceType: 'spring-boot'
      servicePort: 8001
