# Azure cloud infrastructure checks only. The root has a partial remote backend;
# cloud planning/apply remains disabled until the state store and locking exist.
name: MSA-Terraform-Azure-Validation-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [develop, staging, master]
  paths:
    include:
      - terraform/environments/azure/**
      - terraform/modules/azure/**
      - helm/microservices-umbrella/Chart.yaml
      - azure-devops/pipelines/infra.yml
      - azure-devops/templates/infra-stages.yml

pr:
  branches:
    include: [develop, staging, master]
  paths:
    include:
      - terraform/environments/azure/**
      - terraform/modules/azure/**
      - helm/microservices-umbrella/Chart.yaml
      - azure-devops/templates/infra-stages.yml

parameters:
  - name: enableCloudPlanApply
    displayName: "Execute live Azure Terraform Plan & Apply (requires Azure service connection & state backend)"
    type: boolean
    default: false
  - name: serviceConnection
    displayName: "Azure Resource Manager Service Connection"
    type: string
    default: 'azure-infra-service-connection'

variables:
  - template: ../templates/gates.yml

pool:
  vmImage: ubuntu-latest

stages:
  - stage: TerraformValidation
    displayName: Azure Terraform validation (fmt, init -backend=false, validate across dev/staging/prod)
    jobs:
      - job: ValidateAzureTerraform
        steps:
          - checkout: self
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: '1.16.2'
          - script: |
              set -euo pipefail
              cd terraform/environments/azure
              terraform fmt -check -recursive
              terraform init -backend=false -input=false
              for environment in dev staging prod; do
                terraform workspace select "$environment" 2>/dev/null || terraform workspace new "$environment"
                terraform validate -no-color
              done
            displayName: Format and validate Azure Terraform
          - script: |
              echo "Offline validation passed for dev, staging, and prod (including dual-dataplane aks + aks_dp2)."
            displayName: Validation summary

  - ${{ if eq(parameters.enableCloudPlanApply, true) }}:
    - template: ../templates/infra-stages.yml
      parameters:
        serviceConnection: ${{ parameters.serviceConnection }}
