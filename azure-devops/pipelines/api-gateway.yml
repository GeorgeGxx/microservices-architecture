name: MSA-API-Gateway-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - api-gateway/**
      - helm/**
      - pom.xml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - api-gateway/**

variables:
  - name: AZURE_SERVICE_CONNECTION
    value: 'azure-service-connection'
  - name: AZURE_RG
    value: 'msa-azure-prod-rg'
  - name: AKS_CLUSTER_NAME
    value: 'msa-azure-prod-aks'
  - name: ACR_NAME
    value: 'msaazureprodacr'

stages:
  - template: ../templates/ci-cd-master-template.yml
    parameters:
      serviceName: 'api-gateway'
      serviceDir: 'api-gateway'
      serviceType: 'spring-boot'
      servicePort: 8080
