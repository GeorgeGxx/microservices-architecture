# =============================================================================
# pipelines/products-service-v2.yml  —  ENTRY POINT: one file per microservice
# Copy this file for every service, changing only the `parameters:` block
# and the trigger paths. The pipeline logic lives in templates/app-stages.yml.
# =============================================================================
name: products-service-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - develop
      - release/*
      - main
      - master
  paths:
    include:
      - products-service/**            # <- this service's folder
      - helm/**
      - devsecops/**
      - azure-devops/pipelines/products-service-v2.yml
      - azure-devops/templates/app-stages.yml
      - azure-devops/templates/gates.yml
      - azure-devops/templates/steps/**

pr:
  branches:
    include:
      - develop
      - release/*
      - main
      - master
  paths:
    include:
      - products-service/**
      - helm/**

variables:
  - template: ../templates/gates.yml
  # - group: msa-secrets              # variable group holding SONAR_TOKEN (secret), if you use Sonar

pool:
  vmImage: 'ubuntu-latest'

stages:
  - template: ../templates/app-stages.yml
    parameters:
      serviceName: products-service
      serviceDir: products-service
      serviceType: spring-boot          # spring-boot | react | frontend | apollo-router
      servicePort: 8080
      serviceConnection: 'azure-app-connection'   # AcrPush + AKS RBAC only
      acrName: 'msaacr'                           # <acrName>.azurecr.io
      imageVersion: ''                            # e.g. '1.4.0' to add an immutable semver tag on promotion
      canaryEnabled: true
      canaryVirtualServicePath: 'k8s/istio/products-virtualservice.yaml'
