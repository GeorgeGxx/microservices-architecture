name: MSA-MLOps-Training-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [develop, staging, master]
  paths:
    include:
      - mlops/**
      - helm/**
      - devsecops/**
      - azure-devops/pipelines/mlops-training.yml
      - azure-devops/templates/**

pr:
  branches:
    include: [develop, staging, master]
  paths:
    include:
      - mlops/**
      - helm/**
      - devsecops/**
      - azure-devops/pipelines/mlops-training.yml
      - azure-devops/templates/**

variables:
  - template: ../templates/gates.yml

pool:
  vmImage: ubuntu-latest

stages:
  - template: ../templates/app-stages.yml
    parameters:
      serviceName: mlops-training
      serviceDir: mlops
      serviceType: python
      servicePort: 5000
      dockerfilePath: mlops/Dockerfile.training
      contextDir: mlops
      helmValuesKey: mlops.training
      deploymentName: demand-sales-capture
      serviceConnection: azure-service-connection
      acrNameDev: msaazuredevacr
      acrNameStaging: msaazurestagingacr
      acrNameProd: msaazureprodacr
      namePrefix: msa-azure
      canaryEnabled: false
      canaryVirtualServicePath: ''
