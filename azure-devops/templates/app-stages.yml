# =============================================================================
# templates/app-stages.yml  —  DevSecOps CI/CD for ONE microservice on AKS
#
# Flow:
#  1 UnitTests (+Sonar) -> 2 SASTSecurity -> 3 BuildContainer(+SBOM) -> 4 ContainerScan
#  -> 5 ComplianceGate -> 6 PushCandidate (SHA tag to ACR)
#       |-> DeployDev (develop)                   -> RollbackDev
#       |-> DeployStaging (staging | master)  -> Integration | E2E | Perf | DAST
#                                                  -> RollbackStaging (on any failure)
#                                                  -> PromoteImage (semver/latest tags)
#                                                      -> DeployProduction (master) -> RollbackProduction
#
# GATE POLICY: Gitleaks always blocks; SAST/Trivy/Conftest block on protected
# branches (staging, master) and are advisory elsewhere (gates.yml).
# Everything reaching staging is already a production candidate, so staging
# test gates are always blocking.
#
# Branch model: develop -> dev | staging -> staging | master -> staging + prod
# Registries are environment-scoped by the matching Terraform workspace. A master\n# build is pushed to staging first, then copied to production only after QA.
# Environments (ADO): dev, staging, production. Cluster/RG per env come from
# <namePrefix>-<env>-aks / -rg, i.e. the ones created by infra-stages.yml.
#
# Sonar is optional until SONAR_TOKEN (secret) and SONAR_ORGANIZATION are configured.
# =============================================================================
parameters:
  - name: serviceName
    type: string
  - name: serviceDir
    type: string
  - name: serviceType          # 'spring-boot' | 'react' | 'frontend' | 'cosmo-router' | 'python' | 'go' | 'nestjs'
    type: string
    default: 'spring-boot'
  - name: servicePort
    type: number
    default: 8080
  - name: dockerfilePath       # optional override for Dockerfile location
    type: string
    default: ''
  - name: contextDir           # optional override for docker build context directory
    type: string
    default: ''
  - name: helmValuesKey        # optional override for umbrella values key (e.g. mlops.forecast)
    type: string
    default: ''
  - name: deploymentName       # optional override for k8s deployment name in rollout status
    type: string
    default: ''
  - name: ingressUrl           # fallback when the Istio ingress IP cannot be resolved
    type: string
    default: ''
  - name: imageVersion         # optional immutable semantic tag added on promotion
    type: string
    default: ''
  - name: tagLatest            # mutable 'latest' tag on promotion (off by default)
    type: boolean
    default: false
  - name: sonarQualityGateWait # wait for SonarQube Cloud quality gate (fails if gate fails)
    type: boolean
    default: false
  - name: canaryEnabled
    type: boolean
    default: false
  - name: canaryVirtualServicePath
    type: string
    default: ''
  - name: enableCloudStagingProdDeploy # Paused until Azure AKS staging/prod cloud deployment is enabled
    type: boolean
    default: false
  # ---- environment wiring (previously undeclared pipeline variables) ----
  - name: serviceConnection    # app-deploy connection: AcrPush + AKS RBAC only (NOT the infra one)
    type: string
  - name: acrNameDev
    type: string
  - name: acrNameStaging
    type: string
  - name: acrNameProd
    type: string
  - name: namePrefix
    type: string
    default: 'msa-azure'
  - name: helmChartPath
    type: string
    default: './helm/microservices-umbrella'
  - name: helmRelease
    type: string
    default: 'microservices'
  - name: sonarHostUrl
    type: string
    default: 'https://sonarcloud.io'
  # ---- pinned tool versions (example values: bump to current ones) ----
  - name: helmVersion
    type: string
    default: 'v4.3.1'
  - name: gitleaksVersion
    type: string
    default: 'v8.21.2'
  - name: trivyVersion
    type: string
    default: 'v0.76.1'
  - name: conftestVersion
    type: string
    default: '0.58.0'
  - name: k6Version
    type: string
    default: '1.8.1'

stages:
  # ==========================================================
  # STAGE 1: Unit tests, coverage and Sonar
  # Sonar runs HERE (same workspace as the build) because it needs the
  # compiled classes and the JaCoCo report in target/.
  # ==========================================================
  - stage: UnitTests
    displayName: "🧪 1. Unit Tests - ${{ parameters.serviceName }}"
    jobs:
      - job: TestExecution
        displayName: "Unit Tests, Coverage & Quality Gate"
        variables:
          MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
          npm_config_cache: $(Pipeline.Workspace)/.npm
        steps:
          - script: echo "Service ${{ parameters.serviceName }} (${{ parameters.serviceType }})"
            displayName: "Service info"

          - ${{ if eq(parameters.serviceType, 'spring-boot') }}:
            - task: Cache@2
              displayName: "Cache Maven Repository"
              inputs:
                key: 'maven | "$(Agent.OS)" | ${{ parameters.serviceDir }}/pom.xml'
                restoreKeys: |
                  maven | "$(Agent.OS)"
                  maven
                path: $(MAVEN_CACHE_FOLDER)

            - task: JavaToolInstaller@0
              inputs:
                versionSpec: '21'
                jdkArchitectureOption: 'x64'
                jdkSourceOption: 'PreInstalled'

            - script: |
                cd ${{ parameters.serviceDir }}
                mvn clean test jacoco:report -B -T 1C -Dspring.profiles.active=test -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
              displayName: "Maven Test & JaCoCo"

            - task: PublishTestResults@2
              condition: succeededOrFailed()
              displayName: "Publish Surefire Test Results"
              inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '${{ parameters.serviceDir }}/target/surefire-reports/TEST-*.xml'
                mergeTestResults: true
                failTaskOnFailedTests: true

            - task: PublishCodeCoverageResults@2
              condition: succeededOrFailed()
              displayName: "Publish JaCoCo Code Coverage"
              inputs:
                summaryFileLocation: '${{ parameters.serviceDir }}/target/site/jacoco/jacoco.xml'
                pathToSources: '${{ parameters.serviceDir }}/src/main/java'

            # Secret variables are NOT auto-mapped to env vars: SONAR_TOKEN is mapped in env: below.
            # The step is skipped (visible in the UI) when SONAR_TOKEN is not defined.
            - script: |
                set -euo pipefail
                if [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(SONAR_ORGANIZATION)' ]; then
                  echo "SONAR_ORGANIZATION must match the SonarQube Cloud organization key."
                  exit 1
                fi
                cd ${{ parameters.serviceDir }}
                mvn -B -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER) \
                  org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
                  -Dsonar.projectKey=msa-${{ parameters.serviceName }} \
                  -Dsonar.projectName="MSA ${{ parameters.serviceName }}" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="${{ parameters.sonarHostUrl }}" \
                  -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
                  -Dsonar.qualitygate.wait=${{ parameters.sonarQualityGateWait }}
              displayName: "SonarQube Cloud Analysis & Quality Gate"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              env:
                SONAR_TOKEN: $(SONAR_TOKEN)
                SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)

          - ${{ if or(eq(parameters.serviceType, 'react'), eq(parameters.serviceType, 'frontend')) }}:
            - task: Cache@2
              displayName: "Cache npm Packages"
              inputs:
                key: 'npm | "$(Agent.OS)" | ${{ parameters.serviceDir }}/package-lock.json'
                restoreKeys: |
                  npm | "$(Agent.OS)"
                  npm
                path: $(npm_config_cache)

            - task: Cache@2
              displayName: "Cache SonarCloud Packages"
              inputs:
                key: 'sonar | "$(Agent.OS)"'
                path: $(HOME)/.sonar/cache

            - task: NodeTool@0
              inputs:
                versionSpec: '22.x'

            - script: |
                cd ${{ parameters.serviceDir }}
                npm ci
                npm run test:coverage
                npm run build
              displayName: "Novashop Frontend Test, Coverage & Build Gate"

            - task: JavaToolInstaller@0
              displayName: "Set up Java for Sonar Scanner"
              inputs:
                versionSpec: '21'
                jdkArchitectureOption: 'x64'
                jdkSourceOption: 'PreInstalled'

            - script: |
                set -euo pipefail
                if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = '$(SONAR_TOKEN)' ]; then
                  echo "SonarQube Cloud token is not configured; skipping frontend analysis."
                  exit 0
                fi
                if [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(SONAR_ORGANIZATION)' ]; then
                  echo "SONAR_ORGANIZATION must match the SonarQube Cloud organization key."
                  exit 1
                fi
                cd ${{ parameters.serviceDir }}
                npx --yes sonarqube-scanner \
                  -Dsonar.projectKey=msa-frontend \
                  -Dsonar.projectName="Novashop Storefront" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="${{ parameters.sonarHostUrl }}" \
                  -Dsonar.sources=src \
                  -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx \
                  -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
                  -Dsonar.qualitygate.wait=${{ parameters.sonarQualityGateWait }}
              displayName: "SonarQube Cloud Frontend Analysis & Quality Gate"
              condition: succeeded()
              env:
                SONAR_TOKEN: $(SONAR_TOKEN)
                SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)

          - ${{ if eq(parameters.serviceType, 'go') }}:
            - task: GoTool@0
              displayName: "Set up Go 1.24+"
              inputs:
                version: '1.24.x'

            - script: |
                set -euo pipefail
                cd ${{ parameters.serviceDir }}
                go test -v -coverprofile=coverage.out ./...
              displayName: "Go Unit Tests & Coverage"

            - task: NodeTool@0
              displayName: "Set up Node.js for Sonar Scanner"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              inputs:
                versionSpec: '22.x'

            - script: |
                set -euo pipefail
                if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = '$(SONAR_TOKEN)' ]; then
                  echo "SonarQube Cloud token is not configured; skipping Go analysis."
                  exit 0
                fi
                if [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(SONAR_ORGANIZATION)' ]; then
                  echo "SONAR_ORGANIZATION must match the SonarQube Cloud organization key."
                  exit 1
                fi
                cd ${{ parameters.serviceDir }}
                npx --yes sonarqube-scanner \
                  -Dsonar.projectKey=msa-${{ parameters.serviceName }} \
                  -Dsonar.projectName="MSA ${{ parameters.serviceName }}" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="${{ parameters.sonarHostUrl }}" \
                  -Dsonar.sources=. \
                  -Dsonar.tests=. \
                  -Dsonar.test.inclusions="**/*_test.go" \
                  -Dsonar.exclusions="**/*_test.go,docs/**,scripts/**" \
                  -Dsonar.go.coverage.reportPaths=coverage.out \
                  -Dsonar.qualitygate.wait=${{ parameters.sonarQualityGateWait }}
              displayName: "SonarQube Cloud Go Analysis & Quality Gate"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              env:
                SONAR_TOKEN: $(SONAR_TOKEN)
                SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)

          - ${{ if eq(parameters.serviceType, 'nestjs') }}:
            - task: NodeTool@0
              displayName: "Set up Node.js 22"
              inputs:
                versionSpec: '22.x'

            - script: |
                set -euo pipefail
                cd ${{ parameters.serviceDir }}
                npm ci || npm install
                npm run test:cov
                npm run build
              displayName: "NestJS Unit Tests, Coverage & Build"

            - task: JavaToolInstaller@0
              displayName: "Set up Java for Sonar Scanner"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              inputs:
                versionSpec: '21'
                jdkArchitectureOption: 'x64'
                jdkSourceOption: 'PreInstalled'

            - script: |
                set -euo pipefail
                if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = '$(SONAR_TOKEN)' ]; then
                  echo "SonarQube Cloud token is not configured; skipping NestJS analysis."
                  exit 0
                fi
                if [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(SONAR_ORGANIZATION)' ]; then
                  echo "SONAR_ORGANIZATION must match the SonarQube Cloud organization key."
                  exit 1
                fi
                cd ${{ parameters.serviceDir }}
                npx --yes sonarqube-scanner \
                  -Dsonar.projectKey=msa-${{ parameters.serviceName }} \
                  -Dsonar.projectName="MSA ${{ parameters.serviceName }}" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="${{ parameters.sonarHostUrl }}" \
                  -Dsonar.sources=src \
                  -Dsonar.tests=src \
                  -Dsonar.test.inclusions="**/*.spec.ts" \
                  -Dsonar.exclusions="**/*.spec.ts,dist/**,node_modules/**" \
                  -Dsonar.coverage.exclusions="src/main.ts,src/**/*.module.ts,src/**/*.orm-entity.ts,**/*.spec.ts" \
                  -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
                  -Dsonar.qualitygate.wait=${{ parameters.sonarQualityGateWait }}
              displayName: "SonarQube Cloud NestJS Analysis & Quality Gate"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              env:
                SONAR_TOKEN: $(SONAR_TOKEN)
                SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)

          - ${{ if eq(parameters.serviceType, 'python') }}:
            - task: UsePythonVersion@0
              displayName: "Set up Python 3.12"
              inputs:
                versionSpec: '3.12'
                addToPath: true

            - script: |
                set -euo pipefail
                export PYTHONPATH="$(Build.SourcesDirectory)/${{ parameters.serviceDir }}"
                python -m pip install --upgrade pip
                if [ -f "${{ parameters.serviceDir }}/requirements.txt" ]; then
                  pip install -r "${{ parameters.serviceDir }}/requirements.txt"
                fi
                pip install coverage pytest pytest-cov pytest-asyncio
                if [ -d "${{ parameters.serviceDir }}/tests" ]; then
                  if [ -d "${{ parameters.serviceDir }}/app" ]; then
                    cd "${{ parameters.serviceDir }}"
                    pytest --cov=app --cov-report=xml:coverage.xml tests/ -v
                  else
                    OMIT="*/generate_sample_sales.py,*/test_tdd.py,*/patch_spark_jars.py,*/tests/*,*/.venv*/*"
                    if [ "${{ parameters.serviceName }}" = "demand-forecast" ]; then
                      OMIT="$OMIT,*/capture_orders.py,*/train_demand_model.py,*/feature_engineering.py"
                    elif [ "${{ parameters.serviceName }}" = "mlops-training" ]; then
                      OMIT="$OMIT,*/forecast_api.py"
                    elif [ "${{ parameters.serviceName }}" = "mlflow" ]; then
                      OMIT="$OMIT,*/capture_orders.py,*/train_demand_model.py,*/feature_engineering.py,*/forecast_api.py"
                    fi
                    coverage run --source=${{ parameters.serviceDir }} --omit="$OMIT" -m unittest discover -s "${{ parameters.serviceDir }}/tests" -v
                    coverage xml -o ${{ parameters.serviceDir }}/coverage.xml
                  fi
                fi
              displayName: "Python Unit Tests & Coverage"

            - task: PublishCodeCoverageResults@2
              condition: succeededOrFailed()
              displayName: "Publish Python Code Coverage"
              inputs:
                summaryFileLocation: '${{ parameters.serviceDir }}/coverage.xml'

            - task: JavaToolInstaller@0
              displayName: "Set up Java for Sonar Scanner"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              inputs:
                versionSpec: '21'
                jdkArchitectureOption: 'x64'
                jdkSourceOption: 'PreInstalled'

            - task: NodeTool@0
              displayName: "Set up Node.js for Sonar Scanner"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              inputs:
                versionSpec: '22.x'

            - script: |
                set -euo pipefail
                if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = '$(SONAR_TOKEN)' ]; then
                  echo "SonarQube Cloud token is not configured; skipping Python analysis."
                  exit 0
                fi
                if [ -z "$SONAR_ORGANIZATION" ] || [ "$SONAR_ORGANIZATION" = '$(SONAR_ORGANIZATION)' ]; then
                  echo "SONAR_ORGANIZATION must match the SonarQube Cloud organization key."
                  exit 1
                fi
                cd ${{ parameters.serviceDir }}
                EXCLUSIONS="tests/**,data/**,*.sh,.venv*/**,generate_sample_sales.py,test_tdd.py,patch_spark_jars.py"
                COVERAGE_EXCLUSIONS="generate_sample_sales.py,test_tdd.py,patch_spark_jars.py"
                if [ "${{ parameters.serviceName }}" = "demand-forecast" ]; then
                  EXCLUSIONS="$EXCLUSIONS,Dockerfile.training,Dockerfile.capture,capture_orders.py,train_demand_model.py,feature_engineering.py"
                  COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,capture_orders.py,train_demand_model.py,feature_engineering.py"
                elif [ "${{ parameters.serviceName }}" = "mlops-training" ]; then
                  EXCLUSIONS="$EXCLUSIONS,Dockerfile.forecast,forecast_api.py"
                  COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,forecast_api.py"
                elif [ "${{ parameters.serviceName }}" = "mlflow" ]; then
                  EXCLUSIONS="$EXCLUSIONS,Dockerfile.forecast,Dockerfile.training,forecast_api.py,capture_orders.py,train_demand_model.py,feature_engineering.py"
                  COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,forecast_api.py,capture_orders.py,train_demand_model.py,feature_engineering.py"
                fi
                npx --yes sonarqube-scanner \
                  -Dsonar.projectKey=msa-${{ parameters.serviceName }} \
                  -Dsonar.projectName="MSA ${{ parameters.serviceName }}" \
                  -Dsonar.organization="$SONAR_ORGANIZATION" \
                  -Dsonar.host.url="${{ parameters.sonarHostUrl }}" \
                  -Dsonar.sources=. \
                  -Dsonar.tests=tests \
                  -Dsonar.exclusions="$EXCLUSIONS" \
                  -Dsonar.coverage.exclusions="$COVERAGE_EXCLUSIONS" \
                  -Dsonar.python.version=3.12 \
                  -Dsonar.python.coverage.reportPaths=coverage.xml \
                  -Dsonar.qualitygate.wait=${{ parameters.sonarQualityGateWait }}
              displayName: "SonarQube Cloud Python Analysis & Quality Gate"
              condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''))
              env:
                SONAR_TOKEN: $(SONAR_TOKEN)
                SONAR_ORGANIZATION: $(SONAR_ORGANIZATION)

  # ==========================================================
  # STAGE 2: SAST, secrets & governance
  # ==========================================================
  - stage: SASTSecurity
    displayName: "🔍 2. SAST & Secrets - ${{ parameters.serviceName }}"
    dependsOn: UnitTests
    jobs:
      - job: SecurityScans
        displayName: "Gitleaks, Semgrep, Trivy IaC, npm audit"
        steps:
          # Hard gate on EVERY branch.
          - script: |
              set -euo pipefail
              CONFIG="devsecops/sast/gitleaks/.gitleaks.toml"
              IMG=zricethezav/gitleaks:${{ parameters.gitleaksVersion }}
              if [ -f "$CONFIG" ]; then
                docker run --rm -v $(Build.SourcesDirectory):/repo $IMG detect --source=/repo --config=/repo/$CONFIG -v --no-git
              else
                docker run --rm -v $(Build.SourcesDirectory):/repo $IMG detect --source=/repo -v --no-git
              fi
            displayName: "Gitleaks Secret Scan (Hard Gate)"

          - script: |
              set -euo pipefail
              gate() {
                if "$@"; then return 0; fi
                if [ "$(isProtectedBranch)" = "True" ]; then return 1; fi
                echo "##vso[task.logissue type=warning]Advisory only (non-protected branch): $*"
              }
              python3 -m pip install semgrep
              gate semgrep scan --config auto --severity ERROR --error ${{ parameters.serviceDir }}
            displayName: "Semgrep SAST Scan"

          - script: |
              set -euo pipefail
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/${{ parameters.trivyVersion }}/contrib/install.sh \
                | sh -s -- -b /usr/local/bin ${{ parameters.trivyVersion }}
              trivy config \
                --config devsecops/compliance/trivy/trivy.yaml \
                --ignorefile devsecops/compliance/trivy/.trivyignore \
                ${{ parameters.serviceDir }}
            displayName: "Trivy IaC Configuration Scan (Audit Mode)"

          - ${{ if or(eq(parameters.serviceType, 'react'), eq(parameters.serviceType, 'frontend')) }}:
            - script: |
                cd ${{ parameters.serviceDir }}
                if [ "$(isProtectedBranch)" = "True" ]; then
                  npm audit --audit-level=high
                else
                  npm audit --audit-level=high || echo "##vso[task.logissue type=warning]npm audit findings (advisory on non-protected branches)"
                fi
              displayName: "npm audit (Frontend Dependency Gate)"

  # ==========================================================
  # STAGE 3: Build container & SBOM
  # ==========================================================
  - stage: BuildContainer
    displayName: "⚙️ 3. Build & SBOM - ${{ parameters.serviceName }}"
    dependsOn: SASTSecurity
    jobs:
      - job: DockerBuild
        displayName: "Build OCI image & CycloneDX SBOM"
        steps:
          - script: |
              set -euo pipefail
              export DOCKER_BUILDKIT=1
              IMAGE_LOCAL="local/${{ parameters.serviceName }}:$(Build.SourceVersion)"
              DOCKERFILE="${{ parameters.dockerfilePath }}"
              if [ -z "$DOCKERFILE" ]; then
                DOCKERFILE="${{ parameters.serviceDir }}/Dockerfile"
              fi
              CONTEXT="${{ parameters.contextDir }}"
              if [ -z "$CONTEXT" ]; then
                if [ "${{ parameters.serviceType }}" = "react" ] || [ "${{ parameters.serviceType }}" = "frontend" ] || [ "${{ parameters.serviceType }}" = "python" ] || [ "${{ parameters.serviceType }}" = "go" ] || [ "${{ parameters.serviceType }}" = "nestjs" ]; then
                  CONTEXT="${{ parameters.serviceDir }}"
                else
                  CONTEXT="."
                fi
              fi
              docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t $IMAGE_LOCAL -f "$DOCKERFILE" "$CONTEXT"
              mkdir -p $(Pipeline.Workspace)/images
              docker save $IMAGE_LOCAL -o $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar
            displayName: "Build OCI Image (BuildKit)"

          - script: |
              set -euo pipefail
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/${{ parameters.trivyVersion }}/contrib/install.sh \
                | sh -s -- -b /usr/local/bin ${{ parameters.trivyVersion }}
              mkdir -p $(Build.ArtifactStagingDirectory)/sbom
              trivy image --format cyclonedx \
                --output $(Build.ArtifactStagingDirectory)/sbom/${{ parameters.serviceName }}-sbom.cdx.json \
                --input $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar
            displayName: "Generate CycloneDX SBOM"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Image Tarball"
            inputs:
              targetPath: '$(Pipeline.Workspace)/images'
              artifact: 'container-image-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: "Publish CycloneDX SBOM"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sbom'
              artifact: 'sbom-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

  # ==========================================================
  # STAGE 4: Container vulnerability scan (Trivy)
  # ==========================================================
  - stage: ContainerScan
    displayName: "🧰 4. Container Scan - ${{ parameters.serviceName }}"
    dependsOn: BuildContainer
    jobs:
      - job: TrivyScan
        displayName: "Trivy audit (CRITICAL,HIGH)"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'container-image-${{ parameters.serviceName }}'
              targetPath: '$(Pipeline.Workspace)/images'

          - script: |
              set -euo pipefail
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/${{ parameters.trivyVersion }}/contrib/install.sh \
                | sh -s -- -b /usr/local/bin ${{ parameters.trivyVersion }}
              EXIT_CODE=0
              if [ "$(isProtectedBranch)" = "True" ]; then EXIT_CODE=1; fi
              trivy image \
                --input $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar \
                --config devsecops/compliance/trivy/trivy.yaml \
                --ignorefile devsecops/compliance/trivy/.trivyignore \
                --severity HIGH,CRITICAL --ignore-unfixed --exit-code $EXIT_CODE
            displayName: "Trivy Vulnerability Audit (Hard Gate on Protected Branches)"

  # ==========================================================
  # STAGE 5: Compliance gate (Conftest / OPA)
  # ==========================================================
  - stage: ComplianceGate
    displayName: "🧾 5. Compliance Gate - ${{ parameters.serviceName }}"
    dependsOn: ContainerScan
    jobs:
      - job: ConftestPolicyAudit
        displayName: "Conftest Rego policy verification"
        steps:
          - script: |
              set -euo pipefail
              bash scripts/install-helm4.sh "${{ parameters.helmVersion }}"
              helm version --short
            displayName: "Install Helm ${{ parameters.helmVersion }}"

          - script: |
              set -euo pipefail
              HELM_KEY="${{ parameters.helmValuesKey }}"
              if [ -z "$HELM_KEY" ]; then HELM_KEY="${{ parameters.serviceName }}"; fi
              helm template ${{ parameters.helmRelease }} ${{ parameters.helmChartPath }} \
                --set ${HELM_KEY}.image.tag=$(Build.SourceVersion) > rendered-manifests.yaml

              curl -sSfL https://github.com/open-policy-agent/conftest/releases/download/v${{ parameters.conftestVersion }}/conftest_${{ parameters.conftestVersion }}_Linux_x86_64.tar.gz -o conftest.tar.gz
              tar xzf conftest.tar.gz conftest
              sudo mv conftest /usr/local/bin/

              test -d devsecops/policies/conftest || { echo "##vso[task.logissue type=error]devsecops/policies/conftest/ not found - policy gate cannot verify."; exit 1; }
              test -n "$(find devsecops/policies/conftest -maxdepth 1 -name '*.rego' -print -quit)" || { echo "##vso[task.logissue type=error]No Rego policies found - policy gate cannot verify."; exit 1; }
              if [ "$(isProtectedBranch)" = "True" ]; then
                conftest test rendered-manifests.yaml --policy devsecops/policies/conftest/
              else
                conftest test rendered-manifests.yaml --policy devsecops/policies/conftest/ \
                  || echo "##vso[task.logissue type=warning]Policy findings (advisory on non-protected branches)"
              fi
            displayName: "Audit Helm manifests with Conftest"

  # ==========================================================
  # STAGE 6: Push the CANDIDATE image (immutable SHA tag) to ACR
  # Dev and Staging pull <acr>/<svc>:<sha>, so the image must exist in ACR
  # BEFORE the first deploy. Extra tags are added later, in PromoteImage.
  # ==========================================================
  - stage: PushCandidate
    displayName: "📦 6. Push Candidate to ACR - ${{ parameters.serviceName }}"
    dependsOn: ComplianceGate
    # Note: Staging and master ACR pushes are paused until enableCloudStagingProdDeploy=true
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), and(eq('${{ parameters.enableCloudStagingProdDeploy }}', 'true'), in(variables['Build.SourceBranch'], 'refs/heads/staging', 'refs/heads/master'))))
    jobs:
      - job: PushSha
        displayName: "Push <sha> tag to ACR"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'container-image-${{ parameters.serviceName }}'
              targetPath: '$(Pipeline.Workspace)/images'

          - task: AzureCLI@2
            displayName: "Login to ACR and push candidate (skip rebuild push if immutable SHA already in Staging ACR)"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                case "$(Build.SourceBranch)" in
                  refs/heads/develop) ACR_NAME='${{ parameters.acrNameDev }}' ;;
                  refs/heads/staging|refs/heads/master) ACR_NAME='${{ parameters.acrNameStaging }}' ;;
                  *) echo "##vso[task.logissue type=error]No ACR mapping for $(Build.SourceBranch)"; exit 1 ;;
                esac
                az acr login --name "$ACR_NAME"
                EXISTING_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${{ parameters.serviceName }}:$(Build.SourceVersion)" --query digest -o tsv 2>/dev/null || true)"
                if [[ "$EXISTING_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                  echo "Immutable artifact ${{ parameters.serviceName }}@$(EXISTING_DIGEST) already exists in $ACR_NAME; reusing without overwriting."
                  exit 0
                fi
                docker load -i $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar
                TARGET="$ACR_NAME.azurecr.io/${{ parameters.serviceName }}"
                docker tag local/${{ parameters.serviceName }}:$(Build.SourceVersion) $TARGET:$(Build.SourceVersion)
                docker push $TARGET:$(Build.SourceVersion)

  # ==========================================================
  # DEV (develop branch)
  # ==========================================================
  - stage: DeployDev
    displayName: "🌱 7. Deploy to AKS Dev - ${{ parameters.serviceName }}"
    dependsOn: PushCandidate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: HelmDeployDev
        displayName: "Helm upgrade on AKS Dev"
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: steps/helm-deploy.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    resourceGroup: ${{ parameters.namePrefix }}-dev-rg
                    cluster: ${{ parameters.namePrefix }}-dev-aks
                    namespace: dev
                    envName: dev
                    springProfile: dev
                    acrName: ${{ parameters.acrNameDev }}
                    serviceName: ${{ parameters.serviceName }}
                    servicePort: ${{ parameters.servicePort }}
                    helmRelease: ${{ parameters.helmRelease }}
                    helmVersion: ${{ parameters.helmVersion }}
                    helmValuesKey: ${{ parameters.helmValuesKey }}
                    deploymentName: ${{ parameters.deploymentName }}

  - stage: RollbackDev
    displayName: "🔄 Rollback Dev - ${{ parameters.serviceName }}"
    dependsOn: DeployDev
    condition: failed()
    jobs:
      - job: ExecuteDevRollback
        displayName: "Helm rollback on Dev"
        steps:
          - template: steps/helm-rollback.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}
              resourceGroup: ${{ parameters.namePrefix }}-dev-rg
              cluster: ${{ parameters.namePrefix }}-dev-aks
              namespace: dev
              helmRelease: ${{ parameters.helmRelease }}
              helmVersion: ${{ parameters.helmVersion }}

  # ==========================================================
  # STAGING (staging or master)
  # ==========================================================
  - stage: DeployStaging
    displayName: "🚀 8. Deploy to AKS Staging - ${{ parameters.serviceName }}"
    dependsOn: PushCandidate
    # Note: Staging and master AKS deployments are paused until enableCloudStagingProdDeploy=true
    condition: and(succeeded(), eq('${{ parameters.enableCloudStagingProdDeploy }}', 'true'), in(variables['Build.SourceBranch'], 'refs/heads/staging', 'refs/heads/master'))
    jobs:
      - deployment: HelmDeployStaging
        displayName: "Helm upgrade on AKS Staging"
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: steps/helm-deploy.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    resourceGroup: ${{ parameters.namePrefix }}-staging-rg
                    cluster: ${{ parameters.namePrefix }}-staging-aks
                    namespace: staging
                    envName: staging
                    springProfile: staging
                    acrName: ${{ parameters.acrNameStaging }}
                    serviceName: ${{ parameters.serviceName }}
                    servicePort: ${{ parameters.servicePort }}
                    helmRelease: ${{ parameters.helmRelease }}
                    helmVersion: ${{ parameters.helmVersion }}
                    helmValuesKey: ${{ parameters.helmValuesKey }}
                    deploymentName: ${{ parameters.deploymentName }}

      # Output variables of DEPLOYMENT jobs need a different (and fragile) path across
      # stages. A regular job right after the deployment exposes it with the documented syntax:
      #   stageDependencies.<stage>.<job>.outputs['<step>.<var>']
      - job: ResolveIngress
        displayName: "Resolve staging ingress URL"
        dependsOn: HelmDeployStaging
        steps:
          - checkout: none
          - task: AzureCLI@2
            name: resolve
            displayName: "Resolve Istio ingress gateway"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks get-credentials \
                  --resource-group ${{ parameters.namePrefix }}-staging-rg \
                  --name ${{ parameters.namePrefix }}-staging-aks --overwrite-existing
                if command -v kubelogin >/dev/null 2>&1; then kubelogin convert-kubeconfig -l azurecli; fi

                IP=$(kubectl get svc -n istio-system istio-ingressgateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                if [ -n "$IP" ]; then
                  URL="http://$IP"
                else
                  URL="${{ parameters.ingressUrl }}"
                fi
                if [ -z "$URL" ]; then
                  echo "##vso[task.logissue type=error]Could not resolve the staging ingress and no ingressUrl parameter was given."
                  exit 1
                fi
                echo "Staging ingress: $URL"
                echo "##vso[task.setvariable variable=RESOLVED_INGRESS_URL;isOutput=true]$URL"

  # ---- Post-deploy tests: parallel, all BLOCKING (staging = production candidate) ----
  - stage: IntegrationTests
    displayName: "🔗 9. Integration Tests - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.ResolveIngress.outputs['resolve.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: NewmanExecution
        displayName: "Postman Newman API contract suite"
        steps:
          - script: |
              set -euo pipefail
              TARGET_URL="$(STAGE_INGRESS_URL)"
              [ -n "$TARGET_URL" ] || { echo "##vso[task.logissue type=error]Empty STAGE_INGRESS_URL"; exit 1; }
              COLLECTION="devsecops/testing/newman/microservices.postman_collection.json"
              if [ ! -f "$COLLECTION" ]; then
                echo "##vso[task.logissue type=warning]$COLLECTION not found - Newman skipped."
                exit 0
              fi
              npm install -g newman newman-reporter-htmlextra
              newman run "$COLLECTION" --env-var "BASE_URL=${TARGET_URL}" \
                --reporters cli,htmlextra \
                --reporter-htmlextra-export $(Build.ArtifactStagingDirectory)/newman-report.html
            displayName: "Run Newman Collection (Hard Gate)"

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: "Publish Newman HTML Report"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'newman-report-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

  - stage: E2ETests
    displayName: "🧭 10. E2E Tests - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.ResolveIngress.outputs['resolve.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: CypressExecution
        displayName: "End-to-end user journeys"
        steps:
          - script: |
              set -euo pipefail
              TARGET_URL="$(STAGE_INGRESS_URL)"
              [ -n "$TARGET_URL" ] || { echo "##vso[task.logissue type=error]Empty STAGE_INGRESS_URL"; exit 1; }
              cd ${{ parameters.serviceDir }}
              if [ -f cypress.config.js ] || [ -f cypress.config.ts ]; then
                CYPRESS_BASE_URL=$TARGET_URL npx cypress run
              else
                echo "##vso[task.logissue type=warning]No Cypress config for ${{ parameters.serviceName }} - skipped."
              fi
            displayName: "Run Cypress E2E Suite (Hard Gate)"

  - stage: PerformanceTests
    displayName: "⚡ 11. Performance Tests - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.ResolveIngress.outputs['resolve.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: K6LoadTest
        displayName: "k6 latency (P95) & throughput"
        steps:
          - script: |
              set -euo pipefail
              TARGET_URL="$(STAGE_INGRESS_URL)"
              [ -n "$TARGET_URL" ] || { echo "##vso[task.logissue type=error]Empty STAGE_INGRESS_URL"; exit 1; }
              SCRIPT="devsecops/testing/k6/load-test.js"
              if [ ! -f "$SCRIPT" ]; then
                echo "##vso[task.logissue type=warning]$SCRIPT not found - k6 skipped."
                exit 0
              fi
              # The gate is the thresholds defined inside load-test.js (exit code != 0 on SLA breach).
              docker run --rm -v $(Build.SourcesDirectory):/work -w /work \
                -e TARGET_URL=$TARGET_URL grafana/k6:${{ parameters.k6Version }} run $SCRIPT
            displayName: "Execute k6 (Hard Gate on SLA thresholds)"

  - stage: DASTScan
    displayName: "🕵️ 12. DAST Scan - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.ResolveIngress.outputs['resolve.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: OWASPZAP
        displayName: "OWASP ZAP baseline"
        steps:
          - script: |
              set -euo pipefail
              TARGET_URL="$(STAGE_INGRESS_URL)"
              [ -n "$TARGET_URL" ] || { echo "##vso[task.logissue type=error]Empty STAGE_INGRESS_URL"; exit 1; }
              mkdir -p $(Build.ArtifactStagingDirectory)/zap
              chmod 777 $(Build.ArtifactStagingDirectory)/zap    # the ZAP container runs as a non-root user
              RULES_FILE="devsecops/dast/zap/rules.tsv"
              # Pin the ZAP image by tag/digest if you need reproducible scans.
              if [ -f "$RULES_FILE" ]; then
                docker run --rm \
                  -v $(Build.SourcesDirectory)/devsecops/dast/zap:/zap/rules:ro \
                  -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw \
                  ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t $TARGET_URL -c /zap/rules/rules.tsv -r zap-report.html -I
              else
                docker run --rm -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw \
                  ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t $TARGET_URL -r zap-report.html -I
              fi
            displayName: "Run OWASP ZAP Baseline (Hard Gate on FAIL-level alerts)"

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: "Publish ZAP Report"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/zap'
              artifact: 'zap-report-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

  # Fires when the staging deploy OR any post-deploy test failed (failed() = any direct dependency failed).
  - stage: RollbackStaging
    displayName: "🔄 Rollback Staging - ${{ parameters.serviceName }}"
    dependsOn:
      - DeployStaging
      - IntegrationTests
      - E2ETests
      - PerformanceTests
      - DASTScan
    condition: failed()
    jobs:
      - job: ExecuteRollback
        displayName: "Helm rollback on Staging"
        steps:
          - template: steps/helm-rollback.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}
              resourceGroup: ${{ parameters.namePrefix }}-staging-rg
              cluster: ${{ parameters.namePrefix }}-staging-aks
              namespace: staging
              helmRelease: ${{ parameters.helmRelease }}
              helmVersion: ${{ parameters.helmVersion }}

  # ==========================================================
  # PROMOTE: copy the exact immutable digest that PASSED staging to Prod ACR
  # ==========================================================
  - stage: PromoteImage
    displayName: "🏷️ 13. Promote Certified Image - ${{ parameters.serviceName }}"
    dependsOn:
      - IntegrationTests
      - E2ETests
      - PerformanceTests
      - DASTScan
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: PromoteTags
        displayName: "Promote immutable digest in ACR"
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: "Promote exact digest from Staging ACR to Production ACR"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                SOURCE_ACR='${{ parameters.acrNameStaging }}'
                TARGET_ACR='${{ parameters.acrNameProd }}'
                SOURCE_DIGEST="$(az acr repository show --name "$SOURCE_ACR" --image "${{ parameters.serviceName }}:$(Build.SourceVersion)" --query digest -o tsv)"
                [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "##vso[task.logissue type=error]Could not resolve immutable digest in $SOURCE_ACR"; exit 1; }
                SOURCE_IMAGE="$SOURCE_ACR.azurecr.io/${{ parameters.serviceName }}@$SOURCE_DIGEST"
                TARGET="$TARGET_ACR.azurecr.io/${{ parameters.serviceName }}"
                az acr login --name "$SOURCE_ACR"
                az acr login --name "$TARGET_ACR"
                docker pull "$SOURCE_IMAGE"
                docker tag "$SOURCE_IMAGE" "$TARGET:$(Build.SourceVersion)"
                docker push "$TARGET:$(Build.SourceVersion)"
                TARGET_DIGEST="$(az acr repository show --name "$TARGET_ACR" --image "${{ parameters.serviceName }}:$(Build.SourceVersion)" --query digest -o tsv)"
                [ "$SOURCE_DIGEST" = "$TARGET_DIGEST" ] || { echo "##vso[task.logissue type=error]Digest mismatch between Staging ($SOURCE_DIGEST) and Prod ($TARGET_DIGEST)"; exit 1; }
                if [ -n "${{ parameters.imageVersion }}" ]; then
                  docker tag "$SOURCE_IMAGE" "$TARGET:${{ parameters.imageVersion }}"
                  docker push "$TARGET:${{ parameters.imageVersion }}"
                fi
                if [ "${{ parameters.tagLatest }}" = "True" ]; then
                  docker tag "$SOURCE_IMAGE" "$TARGET:latest"
                  docker push "$TARGET:latest"
                fi
                echo "Certified immutable image ($SOURCE_DIGEST) promoted from $SOURCE_IMAGE to $TARGET:$(Build.SourceVersion)"

  # ==========================================================
  # PRODUCTION (master only) — Dual-Dataplane Deployment (DP1 + DP2)
  # Approval check lives on the 'production' environment in the ADO portal.
  # ==========================================================
  - stage: DeployProduction
    displayName: "🚢 14. Deploy to AKS Production (Dual-Dataplane DP1 + DP2) - ${{ parameters.serviceName }}"
    dependsOn: PromoteImage
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: HelmCanaryProductionDP1
        displayName: "Production rollout — Primary AKS Dataplane (DP1: ${{ parameters.namePrefix }}-prod-aks)"
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: steps/helm-deploy.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    resourceGroup: ${{ parameters.namePrefix }}-prod-rg
                    cluster: ${{ parameters.namePrefix }}-prod-aks
                    namespace: production
                    envName: production
                    springProfile: prod
                    acrName: ${{ parameters.acrNameProd }}
                    serviceName: ${{ parameters.serviceName }}
                    servicePort: ${{ parameters.servicePort }}
                    helmRelease: ${{ parameters.helmRelease }}
                    helmVersion: ${{ parameters.helmVersion }}
                    helmValuesKey: ${{ parameters.helmValuesKey }}
                    deploymentName: ${{ parameters.deploymentName }}
                    verifyRollout: true

                - ${{ if and(eq(parameters.canaryEnabled, true), ne(parameters.canaryVirtualServicePath, '')) }}:
                  - task: AzureCLI@2
                    displayName: "Istio canary traffic shifting (DP1)"
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        MANIFEST='${{ parameters.canaryVirtualServicePath }}'
                        if [ ! -f "$MANIFEST" ]; then
                          echo "##vso[task.logissue type=error]Production canary manifest not found: $MANIFEST"
                          exit 1
                        fi
                        kubectl apply -f "$MANIFEST"

      - deployment: HelmCanaryProductionDP2
        displayName: "Production rollout — Secondary AKS Dataplane (DP2: ${{ parameters.namePrefix }}-dp2-prod-aks)"
        dependsOn: HelmCanaryProductionDP1
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: steps/helm-deploy.yml
                  parameters:
                    serviceConnection: ${{ parameters.serviceConnection }}
                    resourceGroup: ${{ parameters.namePrefix }}-prod-rg
                    cluster: ${{ parameters.namePrefix }}-dp2-prod-aks
                    namespace: production
                    envName: production
                    springProfile: prod
                    acrName: ${{ parameters.acrNameProd }}
                    serviceName: ${{ parameters.serviceName }}
                    servicePort: ${{ parameters.servicePort }}
                    helmRelease: ${{ parameters.helmRelease }}
                    helmVersion: ${{ parameters.helmVersion }}
                    helmValuesKey: ${{ parameters.helmValuesKey }}
                    deploymentName: ${{ parameters.deploymentName }}
                    verifyRollout: true

                - ${{ if and(eq(parameters.canaryEnabled, true), ne(parameters.canaryVirtualServicePath, '')) }}:
                  - task: AzureCLI@2
                    displayName: "Istio canary traffic shifting (DP2)"
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        MANIFEST='${{ parameters.canaryVirtualServicePath }}'
                        if [ ! -f "$MANIFEST" ]; then
                          echo "##vso[task.logissue type=error]Production canary manifest not found: $MANIFEST"
                          exit 1
                        fi
                        kubectl apply -f "$MANIFEST"

  - stage: RollbackProduction
    displayName: "🔄 Rollback Production (DP1 + DP2) - ${{ parameters.serviceName }}"
    dependsOn: DeployProduction
    condition: failed()
    jobs:
      - job: ExecuteProdRollbackDP1
        displayName: "Helm rollback on Production DP1 (${{ parameters.namePrefix }}-prod-aks)"
        steps:
          - template: steps/helm-rollback.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}
              resourceGroup: ${{ parameters.namePrefix }}-prod-rg
              cluster: ${{ parameters.namePrefix }}-prod-aks
              namespace: production
              helmRelease: ${{ parameters.helmRelease }}
              helmVersion: ${{ parameters.helmVersion }}

      - job: ExecuteProdRollbackDP2
        displayName: "Helm rollback on Production DP2 (${{ parameters.namePrefix }}-dp2-prod-aks)"
        steps:
          - template: steps/helm-rollback.yml
            parameters:
              serviceConnection: ${{ parameters.serviceConnection }}
              resourceGroup: ${{ parameters.namePrefix }}-prod-rg
              cluster: ${{ parameters.namePrefix }}-dp2-prod-aks
              namespace: production
              helmRelease: ${{ parameters.helmRelease }}
              helmVersion: ${{ parameters.helmVersion }}
