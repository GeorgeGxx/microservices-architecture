# =============================================================================
# templates/steps/helm-deploy.yml  —  Helm upgrade of ONE service into ONE env
# Used by DeployDev / DeployStaging / DeployProduction (app-stages.yml).
#
# NOTE: no --atomic on purpose. Rollback lives in ONE place (helm-rollback.yml,
# run by the Rollback* stages). With --atomic + a rollback stage, the second
# `helm rollback` would go back to the FAILED revision.
# =============================================================================
parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: cluster
    type: string
  - name: namespace
    type: string
  - name: envName              # value for global.environment (dev | staging | production)
    type: string
  - name: springProfile
    type: string
  - name: acrName
    type: string
  - name: serviceName
    type: string
  - name: servicePort
    type: number
  - name: helmRelease
    type: string
  - name: helmVersion
    type: string
  - name: verifyRollout        # extra kubectl rollout check (used in production)
    type: boolean
    default: false

steps:
  # Deployment jobs: do not rely on an implicit checkout for chart/manifests.
  - checkout: self

  - task: HelmInstaller@1
    displayName: "Install Helm ${{ parameters.helmVersion }}"
    inputs:
      helmVersionToInstall: ${{ parameters.helmVersion }}

  - task: AzureCLI@2
    displayName: "Helm upgrade -> ${{ parameters.envName }} (${{ parameters.cluster }} / ${{ parameters.namespace }})"
    env:
      GHCR_USERNAME: $(GHCR_USERNAME)
      GHCR_TOKEN: $(GHCR_TOKEN)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.cluster }} \
          --overwrite-existing
        if command -v kubelogin >/dev/null 2>&1; then kubelogin convert-kubeconfig -l azurecli; fi

        : "${GHCR_USERNAME:?Set GHCR_USERNAME as a read-only GHCR package account}"
        : "${GHCR_TOKEN:?Set GHCR_TOKEN as a secret with read:packages access}"
        CHART_VERSION="$(helm show chart ./helm/microservices-umbrella | awk '$1 == "version:" { print $2; exit }')"
        CHART_REPOSITORY="$(sed -n 's/^[[:space:]]*microservices-architecture.io\/helm-oci-repository:[[:space:]]*"\(.*\)"$/\1/p' helm/microservices-umbrella/Chart.yaml)"
        [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid umbrella chart version: $CHART_VERSION"; exit 1; }
        [[ "$CHART_REPOSITORY" == oci://ghcr.io/*/microservices-umbrella ]] || { echo "Invalid umbrella chart OCI repository: $CHART_REPOSITORY"; exit 1; }
        printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

        helm upgrade --install ${{ parameters.helmRelease }} "$CHART_REPOSITORY" \
          --version "$CHART_VERSION" \
          --reuse-values \
          --namespace ${{ parameters.namespace }} \
          --create-namespace \
          --set ${{ parameters.serviceName }}.image.repository=${{ parameters.acrName }}.azurecr.io/${{ parameters.serviceName }} \
          --set ${{ parameters.serviceName }}.image.tag=$(Build.SourceVersion) \
          --set ${{ parameters.serviceName }}.service.port=${{ parameters.servicePort }} \
          --set global.environment=${{ parameters.envName }} \
          --set configMap.data.SPRING_PROFILES_ACTIVE=${{ parameters.springProfile }} \
          --wait --timeout 5m \
          --cleanup-on-fail

  - ${{ if eq(parameters.verifyRollout, true) }}:
    - task: AzureCLI@2
      displayName: "Verify rollout health"
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          kubectl rollout status deployment/${{ parameters.helmRelease }}-${{ parameters.serviceName }} \
            -n ${{ parameters.namespace }} --timeout=2m
