# =============================================================================
# templates/infra-stages.yml  —  Terraform on Azure (AKS)
#
# Stage flow:
#   SecurityScan (Trivy IaC + TFLint)
#     -> TerraformPlan   (fmt, validate, plan -> PUBLISHED as artifact)
#       -> TerraformApply_<env>   one stage per env (generated by the loop below),
#                                 applies EXACTLY the published plan
#         -> TerraformDiagnostics (only on failure; NO automatic force-unlock)
#
# Branch model (aligned with the app pipelines):
#   develop                 -> dev
#   staging (or release/*)  -> staging
#   prod (or main / master) -> prod (Dual-Dataplane: aks + aks_dp2)
#   Pull requests           -> plan only, against the workspace of the TARGET branch.
#
# Requirements in Azure DevOps:
#   - Environments: dev, staging, production  (put approvals on staging/production;
#     add an "Exclusive Lock" check to serialize runs against the same state).
#   - A service connection with rights to create RG/AKS (infra-only connection).
#   - Committed .terraform.lock.hcl and <workingDir>/<env>/terraform.tfvars per env.
# =============================================================================
parameters:
  - name: serviceConnection
    type: string
  - name: workingDir
    type: string
    default: 'terraform/environments/azure'
  - name: modulesDir
    type: string
    default: 'terraform/modules/azure'
  - name: namePrefix               # RG = <prefix>-<env>-rg | AKS = <prefix>-<env>-aks
    type: string
    default: 'msa-azure'
  - name: terraformVersion
    type: string
    default: '1.16.2'
  - name: tflintVersion            # example version: bump to the current one
    type: string
    default: 'v0.64.0'
  - name: trivyVersion
    type: string
    default: 'v0.76.1'
  - name: environments
    type: object
    default:
      - name: dev
        label: 'Dev (Burstable - Single Dataplane)'
        adoEnvironment: dev
        namespace: dev
        branchCondition: "eq(variables['Build.SourceBranch'], 'refs/heads/develop')"
      - name: staging
        label: 'Staging (Medium Perf - Single Dataplane)'
        adoEnvironment: staging
        namespace: staging
        branchCondition: "or(eq(variables['Build.SourceBranch'], 'refs/heads/staging'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))"
      - name: prod
        label: 'Production (High Perf - Dual Dataplane DP1 + DP2)'
        adoEnvironment: production
        namespace: production
        branchCondition: "in(variables['Build.SourceBranch'], 'refs/heads/prod', 'refs/heads/main', 'refs/heads/master')"

stages:
  # ==========================================================
  # STAGE A: Trivy IaC Security & TFLint
  # ==========================================================
  - stage: SecurityScan
    displayName: "🔒 1. IaC Security Audit & Lint"
    jobs:
      - job: TrivyTflint
        displayName: "Trivy IaC & TFLint"
        steps:
          - script: |
              set -euo pipefail
              # Blocking on protected branches, advisory elsewhere (see gates.yml)
              gate() {
                if "$@"; then return 0; fi
                if [ "$(isProtectedBranch)" = "True" ]; then
                  echo "##vso[task.logissue type=error]Gate failed: $*"; return 1
                fi
                echo "##vso[task.logissue type=warning]Advisory finding (non-protected branch): $*"
              }

              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/${{ parameters.trivyVersion }}/contrib/install.sh \
                | sh -s -- -b /usr/local/bin ${{ parameters.trivyVersion }}
              curl -sSfL https://raw.githubusercontent.com/terraform-linters/tflint/${{ parameters.tflintVersion }}/install_linux.sh \
                | TFLINT_VERSION=${{ parameters.tflintVersion }} bash

              for d in ${{ parameters.workingDir }} ${{ parameters.modulesDir }}; do
                echo "--- TFLint: $d"
                tflint --init --chdir="$d"
                gate tflint --chdir="$d"
              done

              for d in ${{ parameters.workingDir }} ${{ parameters.modulesDir }}; do
                echo "--- Trivy IaC: $d"
                gate trivy config --config devsecops/compliance/trivy/trivy.yaml --ignorefile devsecops/compliance/trivy/.trivyignore "$d"
              done
            displayName: "Run Trivy IaC and TFLint"

          - script: |
              set -euo pipefail
              bash scripts/install-helm4.sh v4.3.1
              helm version --short
            displayName: "Install Helm v4.3.1 for OpenCost chart validation"

          - script: bash scripts/validate-opencost.sh
            displayName: "Render OpenCost and Prometheus charts"

  # ==========================================================
  # STAGE B: Terraform Plan (published as artifact)
  # ==========================================================
  - stage: TerraformPlan
    displayName: "☁️ 2. Terraform Plan & Validate"
    dependsOn: SecurityScan
    jobs:
      - job: PlanExecution
        displayName: "Terraform Plan"
        steps:
          - task: TerraformInstaller@0
            displayName: "Install Terraform ${{ parameters.terraformVersion }}"
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - task: AzureCLI@2
            displayName: "fmt / init / validate / plan (target env resolved from branch)"
            env:
              SOURCE_BRANCH: $(Build.SourceBranch)
              BUILD_REASON: $(Build.Reason)
              PR_TARGET: $(System.PullRequest.TargetBranch)
              TF_IN_AUTOMATION: 'true'
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Resolve target env. Keep in sync with the `environments` parameter.
                BRANCH="$SOURCE_BRANCH"
                if [ "$BUILD_REASON" = "PullRequest" ]; then BRANCH="$PR_TARGET"; fi
                BRANCH="${BRANCH#refs/heads/}"
                case "$BRANCH" in
                  develop)           ENV=dev ;;
                  staging|release/*) ENV=staging ;;
                  prod|main|master)  ENV=prod ;;
                  *)                 ENV="" ;;
                esac
                echo "##vso[task.setvariable variable=TF_ENV]$ENV"
                if [ -z "$ENV" ]; then
                  echo "Branch '$BRANCH' is not mapped to any environment - nothing to plan."
                  exit 0
                fi
                echo "Target environment: $ENV"

                # azurerm v4 needs the subscription explicitly; auth comes from the az CLI session.
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                # If your backend authenticates with Entra ID instead of storage keys:
                # export ARM_USE_AZUREAD=true

                cd ${{ parameters.workingDir }}
                VAR_FILE="$ENV/terraform.tfvars"
                if [ ! -f "$VAR_FILE" ]; then
                  echo "##vso[task.logissue type=error]Missing ${{ parameters.workingDir }}/$VAR_FILE"
                  exit 1
                fi

                terraform fmt -check -recursive
                terraform init -input=false
                terraform workspace select -or-create "$ENV"
                terraform validate
                terraform plan -input=false -var-file="$VAR_FILE" -out=tfplan -no-color

                mkdir -p "$(Build.ArtifactStagingDirectory)/plan"
                cp tfplan "$(Build.ArtifactStagingDirectory)/plan/tfplan"
                terraform show -no-color tfplan > "$(Build.ArtifactStagingDirectory)/plan/tfplan.txt"
                terraform show -json tfplan > "$(Build.ArtifactStagingDirectory)/plan/tfplan.json"

                if [ "$ENV" = "prod" ] && [ "${ALLOW_DESTRUCTIVE_TERRAFORM:-false}" != "true" ]; then
                  python3 -c '
                import json, sys
                with open("'"$(Build.ArtifactStagingDirectory)/plan/tfplan.json"'") as f:
                    plan = json.load(f)
                destructive = []
                for rc in plan.get("resource_changes", []):
                    actions = rc.get("change", {}).get("actions", [])
                    addr = rc.get("address", "")
                    if "delete" in actions and (addr.startswith("module.aks") or addr.startswith("module.aks_dp2") or addr.startswith("module.postgresql")):
                        destructive.append(f"{addr} ({actions})")
                if destructive:
                    print("ERROR: Destructive production plan detected on critical dataplane/database resources:", ", ".join(destructive), file=sys.stderr)
                    sys.exit(1)
                '
                fi

          # The binary plan can contain secrets: restrict who can read pipeline artifacts.
          - task: PublishPipelineArtifact@1
            displayName: "Publish plan artifact"
            condition: and(succeeded(), ne(variables['TF_ENV'], ''))
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/plan'
              artifact: 'tfplan-$(TF_ENV)'
              publishLocation: pipeline

  # ==========================================================
  # STAGES C/D/E: Apply per environment (generated by the loop)
  # ==========================================================
  - ${{ each env in parameters.environments }}:
    - stage: TerraformApply_${{ env.name }}
      displayName: "🚀 Terraform Apply - ${{ env.label }}"
      dependsOn: TerraformPlan
      condition: and(succeeded(), ${{ env.branchCondition }})
      jobs:
        - deployment: Apply_${{ env.name }}
          displayName: "Apply Azure ${{ env.name }} infrastructure"
          environment: ${{ env.adoEnvironment }}
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  - download: current
                    artifact: tfplan-${{ env.name }}

                  - task: TerraformInstaller@0
                    displayName: "Install Terraform ${{ parameters.terraformVersion }}"
                    inputs:
                      terraformVersion: ${{ parameters.terraformVersion }}

                  - task: AzureCLI@2
                    displayName: "Apply the PUBLISHED plan (${{ env.name }})"
                    env:
                      TF_IN_AUTOMATION: 'true'
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                        # export ARM_USE_AZUREAD=true

                        cd ${{ parameters.workingDir }}
                        cp "$(Pipeline.Workspace)/tfplan-${{ env.name }}/tfplan" ./tfplan

                        terraform init -input=false
                        terraform workspace select "${{ env.name }}"
                        # Applies exactly what was planned (fails if the state changed since).
                        terraform apply -input=false tfplan

                  - task: AzureCLI@2
                    displayName: "Ensure AKS namespace '${{ env.namespace }}'"
                    inputs:
                      azureSubscription: ${{ parameters.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        az aks get-credentials \
                          --resource-group ${{ parameters.namePrefix }}-${{ env.name }}-rg \
                          --name ${{ parameters.namePrefix }}-${{ env.name }}-aks \
                          --overwrite-existing
                        if command -v kubelogin >/dev/null 2>&1; then kubelogin convert-kubeconfig -l azurecli; fi
                        kubectl create namespace ${{ env.namespace }} --dry-run=client -o yaml | kubectl apply -f -

                        if [ "${{ env.name }}" = "prod" ]; then
                          echo "Ensuring namespace '${{ env.namespace }}' on secondary production AKS dataplane (${{ parameters.namePrefix }}-dp2-prod-aks)..."
                          az aks get-credentials \
                            --resource-group ${{ parameters.namePrefix }}-prod-rg \
                            --name ${{ parameters.namePrefix }}-dp2-prod-aks \
                            --overwrite-existing
                          if command -v kubelogin >/dev/null 2>&1; then kubelogin convert-kubeconfig -l azurecli; fi
                          kubectl create namespace ${{ env.namespace }} --dry-run=client -o yaml | kubectl apply -f -
                        fi

  # ==========================================================
  # STAGE F: Diagnostics on failure
  # Terraform has NO rollback: recovery = revert the commit and re-run.
  # No automatic force-unlock: it needs the lock ID printed in the failed
  # run's log and must be a conscious manual action.
  # ==========================================================
  - stage: TerraformDiagnostics
    displayName: "🩺 6. Diagnostics on Apply Failure"
    dependsOn:
      - ${{ each env in parameters.environments }}:
        - TerraformApply_${{ env.name }}
    condition: failed()
    jobs:
      - job: Diagnostics
        displayName: "Resource group state & recovery hints"
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: "Report provisioning state"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "##vso[task.logissue type=error]Terraform apply failed."
                az group list \
                  --query "[?starts_with(name, '${{ parameters.namePrefix }}')].{Name:name, Location:location, State:properties.provisioningState}" \
                  -o table
                echo "Recovery: fix forward or revert the commit, then re-run."
                echo "If the state is left locked, run manually:  terraform force-unlock <LOCK_ID>  (ID is in the failed apply log)."
