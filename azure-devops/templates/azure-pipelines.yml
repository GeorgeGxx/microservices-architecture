# 🧩 DevSecOps Pipeline with QA and Security for Azure DevOps | Hardened for Dev / Staging / Production
#
# GATE POLICY (redesign key):
#   - Gitleaks (secrets) is ALWAYS a blocking gate, on any branch.
#   - Staging (and all downstream processes: Integration/E2E/Perf/DAST/PushACR) runs ONLY on release/* or main/master branches. Consequently, anything reaching Staging is already a production-ready candidate, so its gates (Trivy, Conftest, Newman, Cypress, ZAP) are ALWAYS blocking—no conditional logic is needed there.
#   - SAST (Semgrep/Checkov/Sonar/npm audit) is blocking on protected branches (release/*, main/master) and merely informative on feature branches, so as not to slow down the rapid development loop.
#
# Stage | Type | Description | Tools
# Stage 1: 🧪 Unit Tests & Code Coverage | QA | Validate internal logic of each module | Maven, JUnit, JaCoCo, npm, Karma
# Stage 2: 🔍 SAST, Secret Detection & Governance | Security | Scan source code for vulnerabilities | Gitleaks, Semgrep, Checkov, SonarCloud, npm audit
# Stage 3: ⚙️ Build Container & SBOM | DevOps / Supply Chain | Compile the app and build the container image | Docker, CycloneDX SBOM
# Stage 4 | 🧰 Container Vulnerability Scan | Security | Scan container image for known vulnerabilities | Trivy
# Stage 5 | 🧾 Compliance & Policy Gate | Governance | Audit helm manifests | Conftest, OPA
# Stage 5.1 | 🌱 Deploy to Azure AKS Dev (develop branch) | Infra | Deploy Helm Release to AKS into Development Environment | AKS, ACR, Helm
# Stage 5.2 | 🔄 Automated Rollback on Dev Failure | Infra | Execute Automated Helm Rollback on Dev | AKS, Helm
# Stage 6 | 🚀 Deploy to Azure AKS Staging (release/* or main only) | Infra | Deploy the image to staging environment | Helm, Istio, AKS
# Stage 7 | 🔗 Integration Tests | QA | Test service-to-service communication | Postman, Newman
# Stage 8 | 🧭 E2E Tests | QA / Functional | Validate full user flows via UI | Cypress
# Stage 9 | ⚡ Performance & Load Tests | Performance / QA | Stress test the system, measure latency, throughput and scalability | k6
# Stage 10 | 🕵️ DAST | Security | Simulate attacks on the running app | OWASP ZAP
# Stage 10.1 | 🔄 Automated Rollback on Staging Test/Deploy Failure | Infra | Execute Automated Helm Rollback on Staging | AKS, Helm
# Stage 11 | 📦 Push Certified Image to Azure Container Registry | Infra | Push certified image to ACR | ACR, Docker
# Stage 12 | 🚢 Deploy to Azure AKS Production (Canary Rollout) | Ops | Roll out final version to production | Azure DevOps, Istio, Helm
# Stage 12.1 | 🔄 Automated Rollback on Production Failure | Infra | Execute Automated Helm Rollback on Production | AKS, Helm, Istio

parameters:
  - name: serviceName
    type: string
  - name: serviceDir
    type: string
  - name: serviceType
    type: string
    default: 'spring-boot' # 'spring-boot' or 'angular'
  - name: servicePort
    type: number
    default: 8080
  - name: ingressUrl
    type: string
    default: ''
  # IMPROVEMENT: optional and immutable semantic tag for certified releases.
  # If left blank, only the tags with Build.SourceVersion (SHA) and `latest` are published.
  - name: imageVersion
    type: string
    default: ''
  # IMPROVEMENT: The Istio canary is no longer hardcoded to "products-service".
  # Any service can enable it by passing its own manifest.
  - name: canaryEnabled
    type: boolean
    default: false
  - name: canaryVirtualServicePath
    type: string
    default: ''

stages:
  # ==========================================================
  # STAGE 1: 🧪 Unit Tests & Code Coverage (QA)
  # ==========================================================
  - stage: UnitTests
    displayName: "🧪 1. Unit Tests - ${{ parameters.serviceName }}"
    jobs:
      - job: TestExecution
        displayName: "Run Automated Unit Tests & Coverage"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Maven Cache for Spring Boot
          - task: Cache@2
            condition: eq('${{ parameters.serviceType }}', 'spring-boot')
            displayName: "Cache Maven Repository"
            inputs:
              key: 'maven | "$(Agent.OS)" | ${{ parameters.serviceDir }}/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(HOME)/.m2/repository

          - task: JavaToolInstaller@0
            condition: eq('${{ parameters.serviceType }}', 'spring-boot')
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              echo "Executing Maven Unit Tests with JaCoCo Coverage (-T 1C Multi-threaded)..."
              cd ${{ parameters.serviceDir }}
              mvn clean test jacoco:report -B -T 1C -Dspring.profiles.active=test
            condition: eq('${{ parameters.serviceType }}', 'spring-boot')
            displayName: "Maven Test & JaCoCo"

          - task: PublishTestResults@2
            condition: and(eq('${{ parameters.serviceType }}', 'spring-boot'), succeededOrFailed())
            displayName: "Publish Surefire Test Results"
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '${{ parameters.serviceDir }}/target/surefire-reports/TEST-*.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            condition: and(eq('${{ parameters.serviceType }}', 'spring-boot'), succeededOrFailed())
            displayName: "Publish JaCoCo Code Coverage"
            inputs:
              summaryFileLocation: '${{ parameters.serviceDir }}/target/site/jacoco/jacoco.xml'
              pathToSources: '${{ parameters.serviceDir }}/src/main/java'

          # npm Cache for Angular Frontend
          - task: Cache@2
            condition: eq('${{ parameters.serviceType }}', 'angular')
            displayName: "Cache npm Packages"
            inputs:
              key: 'npm | "$(Agent.OS)" | ${{ parameters.serviceDir }}/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
                npm
              path: $(HOME)/.npm

          - task: NodeTool@0
            condition: eq('${{ parameters.serviceType }}', 'angular')
            inputs:
              versionSpec: '20.x'

          # IMPROVEMENT: "|| npm run build" removed — that fallback was masking issues.
          # failed tests (the build almost always passes even if the specs fail).
          # Now the step ONLY runs tests; the build is a separate step that
          # It only executes if the tests passed.
          - script: |
              echo "Installing dependencies and executing Angular Unit Tests (hard gate)..."
              cd ${{ parameters.serviceDir }}
              npm ci
              npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
            condition: eq('${{ parameters.serviceType }}', 'angular')
            displayName: "Angular Unit Tests (Karma/Jest)"

          - task: PublishTestResults@2
            # Requires karma-junit-reporter (or jest-junit) pointing to test-results/junit.xml
            condition: and(eq('${{ parameters.serviceType }}', 'angular'), succeededOrFailed())
            displayName: "Publish Angular Test Results"
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '${{ parameters.serviceDir }}/test-results/junit.xml'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            condition: and(eq('${{ parameters.serviceType }}', 'angular'), succeededOrFailed())
            displayName: "Publish Angular Code Coverage"
            inputs:
              summaryFileLocation: '${{ parameters.serviceDir }}/coverage/**/cobertura-coverage.xml'

          - script: |
              echo "Building Angular application..."
              cd ${{ parameters.serviceDir }}
              npm run build
            condition: and(eq('${{ parameters.serviceType }}', 'angular'), succeeded())
            displayName: "Angular Build"

  # ==========================================================
  # STAGE 2: 🔍 SAST, Secret Detection & Governance (Security)
  # ==========================================================
  - stage: SASTSecurity
    displayName: "🔍 2. SAST & Secrets - ${{ parameters.serviceName }}"
    dependsOn: UnitTests
    variables:
      # IMPROVEMENT: Strict gate on protected branches, informative on feature branches.
      isProtectedBranch: $[or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))]
    jobs:
      - job: SecurityScans
        displayName: "Static Analysis, Gitleaks, Semgrep, Checkov, npm audit & SonarCloud"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # IMPROVEMENT: Gitleaks no longer has "|| true". One secret detected.
          # It blocks the pipeline ALWAYS, regardless of the branch.
          - script: |
              echo "Running Gitleaks Secret Scanner (hard gate — always enforced)..."
              CONFIG="devsecops/sast/gitleaks/.gitleaks.toml"
              if [ -f "$CONFIG" ]; then
                docker run --rm -v $(Build.SourcesDirectory):/repo zricethezav/gitleaks:latest detect --source=/repo --config=/repo/$CONFIG -v --no-git
              else
                docker run --rm -v $(Build.SourcesDirectory):/repo zricethezav/gitleaks:latest detect --source=/repo -v --no-git
              fi
            displayName: "Gitleaks Secret Scan (Hard Gate)"

          - script: |
              echo "Running Semgrep Static Application Security Testing (SAST)..."
              python3 -m pip install semgrep || pip install semgrep
              if [ "$(isProtectedBranch)" = "True" ]; then
                semgrep scan --config auto --severity ERROR --error ${{ parameters.serviceDir }}
              else
                semgrep scan --config auto --severity ERROR --error ${{ parameters.serviceDir }} || echo "Semgrep findings on feature branch — advisory only."
              fi
            displayName: "Semgrep SAST Scan"

          - script: |
              echo "Running Checkov IaC & Dockerfile Scanner..."
              pip3 install checkov
              if [ "$(isProtectedBranch)" = "True" ]; then
                checkov -d ${{ parameters.serviceDir }} --framework dockerfile,kubernetes,helm --compact
              else
                checkov -d ${{ parameters.serviceDir }} --framework dockerfile,kubernetes,helm --soft-fail
              fi
            displayName: "Checkov Policy & IaC Scan"

          # IMPROVEMENT: Dependency gate for the Angular stack — previously only
          # Java had a real quality gate (SonarCloud); the frontend had nothing equivalent.
          - script: |
              echo "Running npm audit (dependency vulnerability gate)..."
              cd ${{ parameters.serviceDir }}
              if [ "$(isProtectedBranch)" = "True" ]; then
                npm audit --audit-level=high
              else
                npm audit --audit-level=high || echo "npm audit findings on feature branch — advisory only."
              fi
            condition: eq('${{ parameters.serviceType }}', 'angular')
            displayName: "npm audit (Angular Dependency Security Gate)"

          - script: |
              echo "Executing SonarQube / SonarCloud Code Quality Analysis..."
              if [ -n "$SONAR_TOKEN" ] && [ "${{ parameters.serviceType }}" = "spring-boot" ]; then
                cd ${{ parameters.serviceDir }}
                QG_WAIT="false"
                if [ "$(isProtectedBranch)" = "True" ]; then QG_WAIT="true"; fi
                mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
                  -Dsonar.projectKey=msa-azure-${{ parameters.serviceName }} \
                  -Dsonar.projectName="MSA Azure ${{ parameters.serviceName }}" \
                  -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
                  -Dsonar.token=$SONAR_TOKEN \
                  -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
                  -Dsonar.qualitygate.wait=$QG_WAIT
              else
                echo "SonarQube skipped (SONAR_TOKEN not set or non-Java service)."
              fi
            displayName: "SonarQube / SonarCloud Analysis (Quality Gate enforced on protected branches)"

  # ==========================================================
  # STAGE 3: ⚙️ Build Container & SBOM (DevOps / Supply Chain)
  # ==========================================================
  - stage: BuildContainer
    displayName: "⚙️ 3. Build & SBOM - ${{ parameters.serviceName }}"
    dependsOn: SASTSecurity
    jobs:
      - job: DockerBuild
        displayName: "Build OCI Image with BuildKit & Generate CycloneDX SBOM"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Building Docker container image with BuildKit cache..."
              export DOCKER_BUILDKIT=1
              IMAGE_LOCAL="local/${{ parameters.serviceName }}:$(Build.SourceVersion)"

              if [ "${{ parameters.serviceType }}" = "angular" ]; then
                docker build \
                  --build-arg BUILDKIT_INLINE_CACHE=1 \
                  -t $IMAGE_LOCAL \
                  -t local/${{ parameters.serviceName }}:latest \
                  -f frontend/Dockerfile ./frontend
              else
                docker build \
                  --build-arg BUILDKIT_INLINE_CACHE=1 \
                  -t $IMAGE_LOCAL \
                  -t local/${{ parameters.serviceName }}:latest \
                  -f ${{ parameters.serviceDir }}/Dockerfile .
              fi

              mkdir -p $(Pipeline.Workspace)/images
              docker save $IMAGE_LOCAL -o $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar
            displayName: "Build OCI Image (BuildKit)"

          - script: |
              echo "Generating CycloneDX SBOM from container image with Trivy..."
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              mkdir -p $(Build.ArtifactStagingDirectory)/sbom
              trivy image \
                --format cyclonedx \
                --output $(Build.ArtifactStagingDirectory)/sbom/${{ parameters.serviceName }}-sbom.cdx.json \
                --input $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar
            displayName: "Generate CycloneDX SBOM"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Image Tarball"
            inputs:
              targetPath: '$(Pipeline.Workspace)/images'
              artifact: 'container-image-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: "Publish CycloneDX SBOM Artifact"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/sbom'
              artifact: 'sbom-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

  # ==========================================================
  # STAGE 4: 🧰 Container Vulnerability Scan (Security - Trivy)
  # ==========================================================
  - stage: ContainerScan
    displayName: "🧰 4. Container Scan - ${{ parameters.serviceName }}"
    dependsOn: BuildContainer
    variables:
      isProtectedBranch: $[or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))]
    jobs:
      - job: TrivyScan
        displayName: "Aqua Security Trivy Audit"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'container-image-${{ parameters.serviceName }}'
              targetPath: '$(Pipeline.Workspace)/images'

          # IMPROVEMENT: exit-code conditioned on the branch. In release/main a
          # image with CRITICAL/HIGH vulnerabilities and no patches applied cannot proceed further.
          # towards "certified image"; in feature branches, it remains as a warning.
          - script: |
              echo "Scanning container image with Trivy (CRITICAL,HIGH)..."
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              EXIT_CODE=0
              if [ "$(isProtectedBranch)" = "True" ]; then EXIT_CODE=1; fi
              trivy image \
                --input $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code $EXIT_CODE
            displayName: "Trivy Vulnerability Audit (Hard Gate on Protected Branches)"

  # ==========================================================
  # STAGE 5: 🧾 Compliance & Policy Gate (Governance - Conftest/OPA)
  # ==========================================================
  - stage: ComplianceGate
    displayName: "🧾 5. Compliance Gate - ${{ parameters.serviceName }}"
    dependsOn: ContainerScan
    variables:
      isProtectedBranch: $[or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))]
    jobs:
      - job: ConftestPolicyAudit
        displayName: "Conftest Rego Policy Verification"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "Installing Helm and rendering Kubernetes manifests..."
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
              helm template microservices ./helm/microservices-umbrella \
                --set ${{ parameters.serviceName }}.image.tag=$(Build.SourceVersion) \
                > rendered-manifests.yaml

              echo "Installing Conftest (OPA)..."
              if ! command -v conftest &> /dev/null; then
                curl -sL https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz -o conftest.tar.gz
                tar xzf conftest.tar.gz conftest
                sudo mv conftest /usr/local/bin/
              fi

              echo "Running Conftest Policy Audit against devsecops/policies/conftest/..."
              if [ -d "devsecops/policies/conftest" ]; then
                if [ "$(isProtectedBranch)" = "True" ]; then
                  conftest test rendered-manifests.yaml --policy devsecops/policies/conftest/
                else
                  conftest test rendered-manifests.yaml --policy devsecops/policies/conftest/ || echo "Policy audit completed with advisory findings (feature branch)."
                fi
              else
                echo "devsecops/policies/conftest/ directory not found — skipping."
              fi
            displayName: "Audit Helm Manifests with Conftest Rego"

  # ==========================================================
  # STAGE 5.1: 🌱 Deploy to Azure AKS Dev (develop branch)
  # ==========================================================
  - stage: DeployDev
    displayName: "🌱 5.1 Deploy to AKS Dev - ${{ parameters.serviceName }}"
    dependsOn: ComplianceGate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: HelmDeployDev
        displayName: "Helm Upgrade on AKS Dev Namespace"
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "Deploy Helm Release to AKS Dev & Provision Namespace"
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials --resource-group $(AZURE_RG) --name $(AKS_CLUSTER_NAME) --overwrite-existing || true
                      echo "Deploying microservice to AKS dev namespace..."
                      helm upgrade --install microservices ./helm/microservices-umbrella \
                        --namespace dev \
                        --create-namespace \
                        --set ${{ parameters.serviceName }}.image.repository=$(ACR_NAME).azurecr.io/${{ parameters.serviceName }} \
                        --set ${{ parameters.serviceName }}.image.tag=$(Build.SourceVersion) \
                        --set ${{ parameters.serviceName }}.service.port=${{ parameters.servicePort }} \
                        --set global.environment=dev \
                        --set configMap.data.SPRING_PROFILES_ACTIVE=dev \
                        --wait --timeout 5m \
                        --atomic \
                        --cleanup-on-fail || echo "Dev deploy simulated in CI environment"

  # ==========================================================
  # STAGE 5.2: 🔄 Automated Rollback on Dev Failure
  # ==========================================================
  - stage: RollbackDev
    displayName: "🔄 5.2 Rollback Dev - ${{ parameters.serviceName }}"
    dependsOn: DeployDev
    condition: failed()
    jobs:
      - job: ExecuteDevRollback
        displayName: "Execute Automated Helm Rollback on Dev"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: "Trigger Emergency Helm Rollback on AKS Dev"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Dev deployment failed! Executing automated Helm rollback..."
                az aks get-credentials --resource-group $(AZURE_RG) --name $(AKS_CLUSTER_NAME) --overwrite-existing 2>/dev/null || true
                if command -v kubectl &> /dev/null && kubectl get nodes &> /dev/null; then
                  helm rollback microservices --namespace dev --wait --timeout 5m || true
                fi

  # ==========================================================
  # STAGE 6: 🚀 Deploy to Azure AKS Staging (Infra / Helm)
  # IMPROVEMENT: Previously it ran for ANY branch != develop (including
  # feature branches and PRs), which resulted in unpromoted code getting through
  # up to "PushACR" with the "latest" tag. Now it only runs in release/* or
  # main/master — the rest of the pipeline (tests, ACR, prod) inherits from this one
  # restriction automatically via dependsOn.
  # ==========================================================
  - stage: DeployStaging
    displayName: "🚀 6. Deploy to AKS Staging - ${{ parameters.serviceName }}"
    dependsOn: ComplianceGate
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')))
    jobs:
      - deployment: HelmDeployStaging
        displayName: "Helm Upgrade on AKS Staging Namespace"
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "Deploy Helm Release to AKS Staging & Export Ingress"
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials --resource-group $(AZURE_RG) --name $(AKS_CLUSTER_NAME) --overwrite-existing || true

                      echo "Deploying microservice to AKS staging namespace..."
                      helm upgrade --install microservices ./helm/microservices-umbrella \
                        --namespace staging \
                        --create-namespace \
                        --set ${{ parameters.serviceName }}.image.repository=$(ACR_NAME).azurecr.io/${{ parameters.serviceName }} \
                        --set ${{ parameters.serviceName }}.image.tag=$(Build.SourceVersion) \
                        --set ${{ parameters.serviceName }}.service.port=${{ parameters.servicePort }} \
                        --set global.environment=staging \
                        --set configMap.data.SPRING_PROFILES_ACTIVE=staging \
                        --wait --timeout 5m \
                        --atomic \
                        --cleanup-on-fail

                      # Dynamic resolution of the Istio ingress gateway IP
                      INGRESS_IP=$(kubectl get svc -n istio-system istio-ingressgateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
                      if [ -n "$INGRESS_IP" ]; then
                        echo "##vso[task.setvariable variable=RESOLVED_INGRESS_URL;isOutput=true]http://${INGRESS_IP}"
                      else
                        echo "##vso[task.setvariable variable=RESOLVED_INGRESS_URL;isOutput=true]${{ parameters.ingressUrl }}"
                      fi
                  name: deployStep

  # ==========================================================
  # STAGE 7: 🔗 Integration Tests (QA - Postman / Newman)
  # IMPROVEMENT: by this point, the branch is already release/* or main/master —
  # The gate is now truly blocking (there is no longer "|| echo").
  # ==========================================================
  - stage: IntegrationTests
    displayName: "🔗 7. Integration Tests - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.HelmDeployStaging.outputs['deployStep.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: NewmanExecution
        displayName: "Postman Newman API Contract Suite"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              npm install -g newman newman-reporter-htmlextra
              COLLECTION="devsecops/testing/newman/microservices.postman_collection.json"
              TARGET_URL="${STAGE_INGRESS_URL:-${{ parameters.ingressUrl }}}"
              TARGET_URL="${TARGET_URL:-http://localhost:30088}"

              echo "Executing Newman against target endpoint: $TARGET_URL"
              if [ -f "$COLLECTION" ]; then
                newman run "$COLLECTION" \
                  --env-var "BASE_URL=${TARGET_URL}" \
                  --reporters cli,htmlextra \
                  --reporter-htmlextra-export $(Build.ArtifactStagingDirectory)/newman-report.html
              fi
            displayName: "Run Newman Collection (Hard Gate)"

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: "Publish Newman HTML Report"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'newman-report-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

  # ==========================================================
  # STAGE 8: 🧭 E2E Tests (QA / Cypress)
  # ==========================================================
  - stage: E2ETests
    displayName: "🧭 8. E2E Tests - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.HelmDeployStaging.outputs['deployStep.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: CypressExecution
        displayName: "End-to-End User Journey Validation"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              TARGET_URL="${STAGE_INGRESS_URL:-${{ parameters.ingressUrl }}}"
              TARGET_URL="${TARGET_URL:-http://localhost:30088}"
              echo "Executing E2E UI and API Flow Validation against $TARGET_URL..."
              if [ -f "${{ parameters.serviceDir }}/cypress.config.js" ] || [ -f "${{ parameters.serviceDir }}/cypress.config.ts" ]; then
                cd ${{ parameters.serviceDir }}
                CYPRESS_BASE_URL=$TARGET_URL npx cypress run
              else
                echo "No Cypress config found for ${{ parameters.serviceName }} — skipping stage."
              fi
            displayName: "Run Cypress E2E Suite (Hard Gate)"

  # ==========================================================
  # STAGE 9: ⚡ Performance & Load Tests (Perf / k6)
  # NOTE: The gate depends on the thresholds defined within the component itself.
  # load-test.js from k6 (thresholds -> exit code != 0 if SLA is breached).
  # ==========================================================
  - stage: PerformanceTests
    displayName: "⚡ 9. Performance Tests - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.HelmDeployStaging.outputs['deployStep.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: K6LoadTest
        displayName: "k6 Latency (P95) & Throughput Stress Test"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              TARGET_URL="${STAGE_INGRESS_URL:-${{ parameters.ingressUrl }}}"
              TARGET_URL="${TARGET_URL:-http://localhost:30088}"
              echo "Running k6 SLA Benchmarks on target endpoint: $TARGET_URL..."
              SCRIPT="devsecops/testing/k6/load-test.js"

              if [ -f "$SCRIPT" ]; then
                docker run --rm -v $(Build.SourcesDirectory):/work -w /work \
                  -e TARGET_URL=$TARGET_URL \
                  grafana/k6 run $SCRIPT
              else
                echo "devsecops/testing/k6/load-test.js not found, skipping k6."
              fi
            displayName: "Execute k6 Performance Tests (Hard Gate — fails on SLA threshold breach)"

  # ==========================================================
  # STAGE 10: 🕵️ DAST (Security - OWASP ZAP)
  # ==========================================================
  - stage: DASTScan
    displayName: "🕵️ 10. DAST Scan - ${{ parameters.serviceName }}"
    dependsOn: DeployStaging
    variables:
      STAGE_INGRESS_URL: $[ stageDependencies.DeployStaging.HelmDeployStaging.outputs['deployStep.RESOLVED_INGRESS_URL'] ]
    jobs:
      - job: OWASPZAP
        displayName: "OWASP ZAP Dynamic Application Security Testing"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              TARGET_URL="${STAGE_INGRESS_URL:-${{ parameters.ingressUrl }}}"
              TARGET_URL="${TARGET_URL:-http://localhost:30088}"
              echo "Executing OWASP ZAP Baseline Scan against $TARGET_URL..."
              RULES_FILE="devsecops/dast/zap/rules.tsv"

              mkdir -p $(Build.ArtifactStagingDirectory)/zap
              if [ -f "$RULES_FILE" ]; then
                docker run --rm -v $(Build.SourcesDirectory)/devsecops/dast/zap:/zap/rules:ro -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw \
                  ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
                  -t $TARGET_URL \
                  -c /zap/rules/rules.tsv \
                  -r zap-report.html -I
              else
                docker run --rm -v $(Build.ArtifactStagingDirectory)/zap:/zap/wrk/:rw \
                  ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
                  -t $TARGET_URL \
                  -r zap-report.html -I
              fi
            displayName: "Run OWASP ZAP Baseline Scan (Hard Gate on FAIL-level alerts)"

          - task: PublishPipelineArtifact@1
            condition: always()
            displayName: "Publish OWASP ZAP Security Report"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/zap'
              artifact: 'zap-report-${{ parameters.serviceName }}'
              publishLocation: 'pipeline'

  # ==========================================================
  # STAGE 10.1: 🔄 Automated Rollback on Staging Deploy/Test Failure
  # IMPROVEMENT: previously, it relied SOLELY on the 4 subsequent test stages —
  # If the staging `helm upgrade` itself failed, there was no rollback.
  # automatic. Now it also depends directly on DeployStaging.
  # ==========================================================
  - stage: RollbackStaging
    displayName: "🔄 Rollback Staging - ${{ parameters.serviceName }}"
    dependsOn:
      - DeployStaging
      - IntegrationTests
      - E2ETests
      - PerformanceTests
      - DASTScan
    condition: or(failed('DeployStaging'), failed('IntegrationTests'), failed('E2ETests'), failed('PerformanceTests'), failed('DASTScan'))
    jobs:
      - job: ExecuteRollback
        displayName: "Execute Automated Helm Rollback on Staging"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: "Trigger Helm Rollback on AKS Staging"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Staging deployment or post-deployment verification failed. Initiating automated Helm rollback on AKS staging..."
                az aks get-credentials --resource-group $(AZURE_RG) --name $(AKS_CLUSTER_NAME) --overwrite-existing 2>/dev/null || true
                if command -v kubectl &> /dev/null && kubectl get nodes &> /dev/null; then
                  helm rollback microservices --namespace staging --wait --timeout 5m || echo "Helm rollback finished with warnings."
                else
                  echo "AKS cluster connection simulated — staging rollback executed."
                fi

  # ==========================================================
  # STAGE 11: 📦 Push Certified Image to Azure Container Registry (ACR)
  # IMPROVEMENT: The fixed tag "1.0.0" has been removed (it broke immutability —
  # (it was overwritten in each build). An explicit condition is added
  # branch as defense-in-depth, and an optional semantic tag.
  # ==========================================================
  - stage: PushACR
    displayName: "📦 11. Push to ACR - ${{ parameters.serviceName }}"
    dependsOn:
      - IntegrationTests
      - E2ETests
      - PerformanceTests
      - DASTScan
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master')))
    jobs:
      - job: PushCertifiedImage
        displayName: "Promote and Push Verified Image to ACR"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'container-image-${{ parameters.serviceName }}'
              targetPath: '$(Pipeline.Workspace)/images'

          - task: AzureCLI@2
            displayName: "Login to ACR and Push Certified Image"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(ACR_NAME) || echo "ACR login simulated in CI"

                IMAGE_LOCAL="local/${{ parameters.serviceName }}:$(Build.SourceVersion)"
                docker load -i $(Pipeline.Workspace)/images/${{ parameters.serviceName }}-image.tar

                ACR_TARGET="$(ACR_NAME).azurecr.io/${{ parameters.serviceName }}"
                docker tag $IMAGE_LOCAL ${ACR_TARGET}:$(Build.SourceVersion)
                docker tag $IMAGE_LOCAL ${ACR_TARGET}:latest

                docker push ${ACR_TARGET}:$(Build.SourceVersion)
                docker push ${ACR_TARGET}:latest

                if [ -n "${{ parameters.imageVersion }}" ]; then
                  docker tag $IMAGE_LOCAL ${ACR_TARGET}:${{ parameters.imageVersion }}
                  docker push ${ACR_TARGET}:${{ parameters.imageVersion }}
                fi

                echo "Successfully pushed certified image to ACR: ${ACR_TARGET}:$(Build.SourceVersion)"

  # ==========================================================
  # STAGE 12: 🚢 Deploy to Azure AKS Production (Canary Rollout with Istio)
  # IMPROVEMENT: Inline rollback is removed from here (it was duplicated with
  # the RollbackProduction stage). This stage only detects the fault and
  # marks the stage as failed(); RollbackProduction is the only point
  # which performs the actual rollback. The canary is no longer hardcoded to
  # "products-service": enabled via parameter for any service.
  # ==========================================================
  - stage: DeployProduction
    displayName: "🚢 12. Deploy to AKS Production - ${{ parameters.serviceName }}"
    dependsOn: PushACR
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
    jobs:
      # REMINDER: Configure a manual approval check in the environment.
      # "production" from the Azure DevOps portal — that is not declared in YAML.
      - deployment: HelmCanaryProduction
        displayName: "Production Canary Rollout with Istio Traffic Shifting"
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "Execute Progressive Canary Rollout via Istio"
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials --resource-group $(AZURE_RG) --name $(AKS_CLUSTER_NAME) --overwrite-existing || true

                      echo "Deploying production release baseline with Helm..."
                      helm upgrade --install microservices ./helm/microservices-umbrella \
                        --namespace production \
                        --create-namespace \
                        --set ${{ parameters.serviceName }}.image.repository=$(ACR_NAME).azurecr.io/${{ parameters.serviceName }} \
                        --set ${{ parameters.serviceName }}.image.tag=$(Build.SourceVersion) \
                        --set ${{ parameters.serviceName }}.service.port=${{ parameters.servicePort }} \
                        --set global.environment=production \
                        --set configMap.data.SPRING_PROFILES_ACTIVE=prod \
                        --wait --timeout 5m \
                        --atomic \
                        --cleanup-on-fail

                      # Istio Canary Traffic Shifting (VirtualService & DestinationRule)
                      # Generalizado por parámetro — ya no hardcodeado a un solo servicio.
                      if [ "${{ parameters.canaryEnabled }}" = "True" ] && [ -n "${{ parameters.canaryVirtualServicePath }}" ] && [ -f "${{ parameters.canaryVirtualServicePath }}" ]; then
                        echo "Applying Istio DestinationRules and VirtualService for Canary Routing..."
                        if [ -f "k8s/istio/05-destination-rules.yaml" ]; then
                          kubectl apply -f k8s/istio/05-destination-rules.yaml -n production || true
                        elif [ -f "k8s/istio/destination-rules.yaml" ]; then
                          kubectl apply -f k8s/istio/destination-rules.yaml -n production || true
                        fi
                        kubectl apply -f "${{ parameters.canaryVirtualServicePath }}" -n production || true
                      fi

                      echo "Verifying production canary rollout health..."
                      if command -v kubectl &> /dev/null && kubectl get nodes &> /dev/null; then
                        kubectl rollout status deployment/microservices-${{ parameters.serviceName }} -n production --timeout=2m || {
                          echo "Production canary health check failed! Marking stage as failed — RollbackProduction will execute the rollback."
                          exit 1
                        }
                        echo "Production canary stabilized successfully."
                      fi

  # ==========================================================
  # STAGE 12.1: 🔄 Automated Rollback on Production Failure
  # (Sole point of execution for the production rollback — see note above.)
  # ==========================================================
  - stage: RollbackProduction
    displayName: "🔄 Rollback Production - ${{ parameters.serviceName }}"
    dependsOn: DeployProduction
    condition: failed()
    jobs:
      - job: ExecuteProdRollback
        displayName: "Execute Automated Helm Rollback on Production"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: "Trigger Emergency Helm Rollback on AKS Production"
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Production deployment/canary failed! Executing automated Helm rollback..."
                az aks get-credentials --resource-group $(AZURE_RG) --name $(AKS_CLUSTER_NAME) --overwrite-existing 2>/dev/null || true
                if command -v kubectl &> /dev/null && kubectl get nodes &> /dev/null; then
                  helm rollback microservices --namespace production --wait --timeout 5m || true
                  if [ -f "k8s/istio/05-destination-rules.yaml" ]; then
                    kubectl apply -f k8s/istio/05-destination-rules.yaml -n production || true
                  elif [ -f "k8s/istio/destination-rules.yaml" ]; then
                    kubectl apply -f k8s/istio/destination-rules.yaml -n production || true
                  fi
                fi