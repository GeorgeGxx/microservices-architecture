# Keep the CI integration probe focused on the router and static storefront.
# Compose v2's !reset removes the default stack's heavy service dependencies.
services:
  cosmo-router:
    depends_on: !reset []
    volumes: !override
      - ./compose.smoke/router.yaml:/dist/config/router.yaml:ro
      - ./cosmo-router/execution-config.json:/runtime/execution-config.json:ro

  frontend:
    depends_on: !reset []
