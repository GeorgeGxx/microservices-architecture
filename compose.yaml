services:
  ### Keycloak - http://localhost:8181
  keycloak:
    hostname: keycloak
    container_name: keycloak
    image: "quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}"
    command: [ "start-dev" ]
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8181}:${KEYCLOAK_PORT:-8181}"
      - "9000:9000"
    depends_on:
      db-keycloak:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db-keycloak:5432/${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: "${KEYCLOAK_PORT:-8181}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m -XX:MaxRAMPercentage=70.0"
    networks:
      - spring
  ### Postgres database for Keycloak
  db-keycloak:
    hostname: db-keycloak
    container_name: db-keycloak
    image: "postgres:${KEYCLOAK_POSTGRES_VERSION}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    ports:
      - "5434:${POSTGRES_PORT}"
    networks:
      - spring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  ### API Gateway - http://localhost:8080/api/product
  api-gateway:
    hostname: api-gateway
    container_name: api-gateway
    image: georgegxx/api-gateway:1.0.0
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      INVENTORY_SERVICE_URI: ${INVENTORY_SERVICE_URI:-http://inventory-service:8001}
      ORDERS_SERVICE_URI: ${ORDERS_SERVICE_URI:-http://orders-service:8003}
      PRODUCTS_SERVICE_URI: ${PRODUCTS_SERVICE_URI:-http://products-service:8004}
      NOTIFICATION_SERVICE_URI: ${NOTIFICATION_SERVICE_URI:-http://notification-service:8002}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}    
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    restart: unless-stopped
    depends_on:
      - keycloak
      - redis
    networks:
      - spring

  ### Frontend (Angular 19 SPA) - http://localhost:4200
  frontend:
    hostname: frontend
    container_name: frontend
    image: georgegxx/frontend:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT_INTERNAL}"
    restart: unless-stopped
    depends_on:
      - api-gateway
      - keycloak
    networks:
      - spring

  ### Inventory Service
  inventory-service:
    hostname: inventory-service
    container_name: inventory-service
    image: georgegxx/inventory-service:1.0.0
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
    env_file:
      - .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    restart: unless-stopped
    depends_on:
      db-inventory:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spring
  ### Postgres database for inventory
  db-inventory:
    hostname: db-inventory
    container_name: db-inventory
    image: "postgres:${POSTGRES_VERSION}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data
    ports:
      - "5431:${POSTGRES_PORT}"
    networks:
      - spring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  ### Notification Service
  notification-service:
    hostname: notification-service
    container_name: notification-service
    image: georgegxx/notification-service:1.0.0
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    env_file:
      - .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    restart: unless-stopped
    depends_on:
      - kafka
      - redis
      - otel-collector
    networks:
      - spring

  ### Orders Service
  orders-service:
    hostname: orders-service
    container_name: orders-service
    image: georgegxx/orders-service:1.0.0
    build:
      context: .
      dockerfile: ./orders-service/Dockerfile
    env_file:
      - .env
    environment:
      INVENTORY_SERVICE_URI: ${INVENTORY_SERVICE_URI:-http://inventory-service:8001}
      PRODUCTS_SERVICE_URI: ${PRODUCTS_SERVICE_URI:-http://products-service:8004}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    restart: unless-stopped
    depends_on:
      db-orders:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - spring
  ### Postgres database for orders
  db-orders:
    hostname: db-orders
    container_name: db-orders
    image: "postgres:${ORDERS_POSTGRES_VERSION}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${ORDERS_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - orders-pgdata:/var/lib/postgresql/data
    ports:
      - "5435:${POSTGRES_PORT}"
    networks:
      - spring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  ### Products Service
  products-service:
    hostname: products-service
    container_name: products-service
    image: georgegxx/products-service:1.0.0
    build:
      context: .
      dockerfile: ./products-service/Dockerfile
    env_file:
      - .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
    restart: unless-stopped
    depends_on:
      db-products:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spring
  ### Postgres database for products
  db-products:
    hostname: db-products
    container_name: db-products
    image: "postgres:${PRODUCTS_POSTGRES_VERSION}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PRODUCTS_POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - products-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:${POSTGRES_PORT}"
    networks:
      - spring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  ### Kafka Broker
  kafka:
    hostname: kafka
    container_name: kafka
    image: "confluentinc/cp-kafka:${KAFKA_VERSION}"
    restart: unless-stopped
    networks:
      - spring
    env_file:
      - .env
    ports:
      - "9092:9092"
      - "9094:9094"
      - "29092:29092"
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_SASL_ENABLED_MECHANISMS: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_LISTENER_NAME_SASL__PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: ${KAFKA_BROKER_SASL_JAAS_CONFIG}
      KAFKA_OPTS: ${KAFKA_OPTS}
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG_DIRS: ${KAFKA_LOG_DIRS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  ### Kafka Prometheus Exporter - http://localhost:9308/metrics
  kafka-exporter:
    image: "danielqsj/kafka-exporter:${KAFKA_EXPORTER_VERSION:-v1.9.0}"
    container_name: kafka-exporter
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    networks:
      - spring
  
  redis:
    image: "redis:${REDIS_VERSION}"
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - spring

  redis-exporter:
    image: "oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.82.0}"
    container_name: redis-exporter
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - spring

  ### PostgreSQL Prometheus Exporter - http://localhost:9187/metrics
  postgres-exporter:
    image: "prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.20.1}"
    container_name: postgres-exporter
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db-orders:5432/${ORDERS_POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"
    restart: unless-stopped
    depends_on:
      db-orders:
        condition: service_healthy
    networks:
      - spring

  ### Prometheus - http://localhost:9090
  prometheus:
    image: "prom/prometheus:${PROM_VERSION}"
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
      - redis-exporter
      - kafka-exporter
      - postgres-exporter
    restart: unless-stopped
    networks:
      - spring

  ### Grafana - http://localhost:3000
  grafana:
    image: "grafana/grafana:${GRAFANA_VERSION}"
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - spring

  ### Tempo Tracing - http://localhost:3200
  tempo:
    image: "grafana/tempo:${TEMPO_VERSION}"
    container_name: tempo
    user: "0:0"
    command: [ "-config.file=/etc/tempo/tempo-config.yaml" ]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200" # HTTP UI / API
      - "9095:9095"                # gRPC
    restart: unless-stopped
    networks:
      - spring

  otel-collector:
    hostname: otel-collector
    container_name: otel-collector
    image: "otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION}"
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "${OTEL_GRCP_PORT}:${OTEL_GRCP_PORT}" # OTLP gRPC
      - "${OTEL_HTTP_PORT}:${OTEL_HTTP_PORT}" # OTLP HTTP
    depends_on:
      - tempo
    networks:
      - spring

  loki:
    image: "grafana/loki:${LOKI_VERSION}"
    container_name: loki
    user: "0:0"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./observability/loki/rules:/tmp/loki/rules
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - spring

  ### Grafana Alloy (Telemetry & Log Agent)
  alloy:
    image: "grafana/alloy:${ALLOY_VERSION}"
    container_name: alloy
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345" # Alloy UI & Metrics
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - spring

  ### HashiCorp Vault - http://localhost:8200
  vault:
    image: "hashicorp/vault:${VAULT_VERSION:-2.0.4}"
    container_name: vault
    hostname: vault
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN:-root}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LOCAL_CONFIG: '{"telemetry": {"prometheus_retention_time": "30s", "disable_hostname": true, "unauthenticated_metrics_access": true}}'
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - spring

  ### Vault Auto-Initialization & Secret Seeder (Automated zero-touch startup)
  vault-init:
    image: "hashicorp/vault:${VAULT_VERSION:-2.0.4}"
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-root}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "🔐 [Vault Auto-Init] Waiting for Vault server..."
        until vault status > /dev/null 2>&1; do sleep 1; done
        
        echo "🛡️ [Vault Auto-Init] Enabling Audit Device logging..."
        vault audit enable file file_path=/vault/file/vault_audit.log 2>/dev/null || true
        
        echo "📦 [Vault Auto-Init] Enabling KV-v2 secret engine..."
        vault secrets enable -path=secret kv-v2 2>/dev/null || true
        
        echo "📦 [Vault Auto-Init] Seeding microservice secrets..."
        vault kv put secret/application spring.datasource.username="postgres" spring.datasource.password="postgres" jwt.secret="super-secure-jwt-secret-key-12345" 2>/dev/null || true
        vault kv put secret/products-service spring.datasource.url="jdbc:postgresql://db-products:5432/ms_products" spring.datasource.username="postgres" spring.datasource.password="postgres" 2>/dev/null || true
        vault kv put secret/orders-service spring.datasource.url="jdbc:postgresql://db-orders:5432/ms_orders" spring.datasource.username="postgres" spring.datasource.password="postgres" spring.kafka.bootstrap-servers="kafka:9094" spring.kafka.properties.security.protocol="SASL_PLAINTEXT" spring.kafka.properties.sasl.mechanism="PLAIN" spring.kafka.properties.sasl.jaas.config='org.apache.kafka.common.security.plain.PlainLoginModule required username="app" password="microservices-kafka-secret";' 2>/dev/null || true
        vault kv put secret/inventory-service spring.datasource.url="jdbc:postgresql://db-inventory:5432/ms_inventory" spring.datasource.username="postgres" spring.datasource.password="postgres" 2>/dev/null || true
        vault kv put secret/notification-service spring.kafka.bootstrap-servers="kafka:9094" spring.kafka.properties.security.protocol="SASL_PLAINTEXT" spring.kafka.properties.sasl.mechanism="PLAIN" spring.kafka.properties.sasl.jaas.config='org.apache.kafka.common.security.plain.PlainLoginModule required username="app" password="microservices-kafka-secret";' spring.mail.username="notification@microservices.local" spring.mail.password="dev-mail-password" 2>/dev/null || true
        vault kv put secret/api-gateway keycloak.client-secret="microservices-client-secret-key-12345" keycloak.issuer-uri="http://keycloak:8181/realms/microservices-realm" 2>/dev/null || true
        
        echo "🔐 [Vault Auto-Init] Enabling Transit Encryption Engine..."
        vault secrets enable transit 2>/dev/null || true
        vault write -f transit/keys/microservices-data-key type=aes256-gcm96 2>/dev/null || true
        
        echo "🗄️ [Vault Auto-Init] Enabling Dynamic Database Engine..."
        vault secrets enable database 2>/dev/null || true
        vault write database/config/postgres-products \
            plugin_name=postgresql-database-plugin \
            allowed_roles="products-db-role" \
            connection_url="postgresql://{{username}}:{{password}}@db-products:5432/ms_products?sslmode=disable" \
            username="postgres" \
            password="postgres" 2>/dev/null || true
        vault write database/roles/products-db-role \
            db_name=postgres-products \
            creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
            default_ttl="1h" \
            max_ttl="24h" 2>/dev/null || true
        
        echo "🛡️ [Vault Auto-Init] Creating Least-Privilege Policies..."
        for svc in products-service orders-service inventory-service notification-service api-gateway; do
          echo "path \"secret/data/application\" { capabilities = [\"read\"] } path \"secret/data/$${svc}\" { capabilities = [\"read\"] }" | vault policy write "$${svc}-policy" - 2>/dev/null || true
        done
        
        echo "✅ [Vault Auto-Init] Enterprise Vault capabilities initialized successfully!"
        exit 0
    restart: "no"
    networks:
      - spring

volumes:
  inventory-pgdata:
  orders-pgdata:
  products-pgdata:
  keycloak-pgdata:
  kafka_data:
  redis_data:
  grafana_data:
  loki_data:
  tempo_data:
  alloy_data:
  vault_data:

networks:
  spring: