spring:
  application:
    name: ${GATEWAY_SERVICE_NAME:api-gateway}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                "[redis-rate-limiter.replenishRate]": 20
                "[redis-rate-limiter.burstCapacity]": 40
          routes:
            # --- Inventory Service ---
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8001}
              predicates:
                - Path=/api/inventory,/api/inventory/**

            - id: inventory-service-actuator
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8001}
              predicates:
                - Path=/actuator/inventory/**

            - id: inventory-service-docs
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8001}
              predicates:
                - Path=/v3/api-docs/inventory-service
              filters:
                - SetPath=/v3/api-docs

            # --- Orders Service ---
            - id: orders-service
              uri: ${ORDERS_SERVICE_URI:http://localhost:8003}
              predicates:
                - Path=/api/order,/api/order/**

            - id: orders-service-actuator
              uri: ${ORDERS_SERVICE_URI:http://localhost:8003}
              predicates:
                - Path=/actuator/orders/**

            - id: orders-service-docs
              uri: ${ORDERS_SERVICE_URI:http://localhost:8003}
              predicates:
                - Path=/v3/api-docs/orders-service
              filters:
                - SetPath=/v3/api-docs

            # --- Products Service ---
            - id: products-service
              uri: ${PRODUCTS_SERVICE_URI:http://localhost:8004}
              predicates:
                - Path=/api/product,/api/product/**

            - id: products-service-actuator
              uri: ${PRODUCTS_SERVICE_URI:http://localhost:8004}
              predicates:
                - Path=/actuator/products/**

            - id: products-service-docs
              uri: ${PRODUCTS_SERVICE_URI:http://localhost:8004}
              predicates:
                - Path=/v3/api-docs/products-service
              filters:
                - SetPath=/v3/api-docs

            # --- Notification Service ---
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8002}
              predicates:
                - Path=/api/notifications,/api/notifications/**

            - id: notification-service-actuator
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8002}
              predicates:
                - Path=/actuator/notification/**,/actuator/notifications/**

            - id: notification-service-docs
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8002}
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - SetPath=/v3/api-docs

            # --- Vault Health ---
            - id: vault-health
              uri: ${VAULT_ADDR:http://vault:8200}
              predicates:
                - Path=/actuator/vault/health
              filters:
                - SetPath=/v1/sys/health

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWT_URI:http://localhost:8181/realms/microservices-realm/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/microservices-realm}

server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: 🌟 All Microservices (Unified)
    urls:
      - name: 🌟 All Microservices (Unified)
        url: /v3/api-docs/consolidated
      - name: 1. Products Service
        url: /v3/api-docs/products-service
      - name: 2. Orders Service
        url: /v3/api-docs/orders-service
      - name: 3. Inventory Service
        url: /v3/api-docs/inventory-service
      - name: 4. Notification Service
        url: /v3/api-docs/notification-service

logging:
  level:
    root: info
    "[org.springframework.cloud.gateway.server.webflux]": info

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
  # Enable only if you migrate from Prometheus scraper to OTLP Push for metrics:
  otlp:
    metrics:
      export:
        enabled: false
  #       url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      "[service.name]": ${spring.application.name}
      "[service.version]": "1.0"
      "[deployment.environment]": ${ENVIRONMENT:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true