spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ${PRODUCTS_SERVICE_NAME:products-service}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PRODUCTS_SPRING_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5433/products_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 15000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
    redis:
      time-to-live: 300000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWT_URI:http://localhost:8181/realms/microservices-realm/protocol/openid-connect/certs}

server:
  port: ${PORT:8004}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      base-path: /actuator/products
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  resource:
    attributes: service.name=${spring.application.name},service.version=1.0
