apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nestjs-microservice-golden-path
  title: Golden Path — NestJS 11 / Node.js 24 Microservice
  description: Scaffold a production-ready TypeScript / NestJS 11 microservice on Node.js 24 Alpine with OpenTelemetry, Prometheus metrics, Jest coverage, non-root Dockerfile, and DevSecOps CI/CD integration.
  tags:
    - golden-path
    - nodejs-24
    - nestjs-11
    - typescript
spec:
  owner: group:platform-admins
  type: service
  parameters:
    - title: Service Identity & Ownership
      required:
        - component_id
        - description
        - owner
        - system
      properties:
        component_id:
          title: Service Name
          type: string
          pattern: '^[a-z][a-z0-9-]*-service$'
        description:
          title: Description
          type: string
        owner:
          title: Owner Group
          type: string
          default: group:developers
        system:
          title: Target System
          type: string
          default: supply-chain-fulfillment-system
        service_port:
          title: Container Port
          type: integer
          default: 3000
    - title: Repository Destination
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch-base
      name: Fetch Golden Path NestJS Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          service_port: ${{ parameters.service_port }}
    - id: publish
      name: Publish Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: feat/scaffold-${{ parameters.component_id }}
        title: "feat(${{ parameters.component_id }}): scaffold Golden Path NestJS 11 microservice"
        description: "Automated Golden Path scaffolding for `${{ parameters.component_id }}` on Node.js 24 Alpine."
        targetPath: ${{ parameters.component_id }}
    - id: register
      name: Register Component in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.remoteUrl }}
        catalogInfoPath: '/catalog-info.yaml'
