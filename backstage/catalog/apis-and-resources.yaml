apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: kafka-commerce-events-asyncapi
  title: Kafka Event-Driven Commerce & Saga AsyncAPI
  description: Asynchronous event contracts across orders-topic, orders-topic.DLT, payments-topic, and fulfillment-topic.
spec:
  type: asyncapi
  lifecycle: production
  owner: group:developers
  system: novashop-commerce-system
  definition: |
    asyncapi: 2.6.0
    info:
      title: Novashop Event-Driven Commerce Bus
      version: 1.0.0
    channels:
      orders-topic:
        description: Order creation, confirmation, and cancellation events
      orders-topic.DLT:
        description: Dead-letter topic for unprocessable order saga events
      payments-topic:
        description: Payment authorization, capture, and failure events
      fulfillment-topic:
        description: Shipment creation, carrier tracking, and delivery events
