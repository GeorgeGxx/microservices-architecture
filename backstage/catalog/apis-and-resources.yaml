apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: cosmo-supergraph-graphql-api
  title: Novashop Federated GraphQL Supergraph API
  description: Unified GraphQL schema federated across Products, Orders, Inventory, Payments, Fulfillment, Analytics, and Demand Forecasting subgraphs.
  tags:
    - graphql
    - federation-v2
    - cosmo-router
spec:
  type: graphql
  lifecycle: production
  owner: group:platform-admins
  system: multi-cloud-platform-system
  definition:
    $text: ../../cosmo-router/supergraph.yaml
---
apiVersion: backstage.io/v1alpha1
