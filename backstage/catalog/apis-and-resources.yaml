  title: Products Catalog OpenAPI
  description: REST & GraphQL subgraph interface for product catalog querying, SKU lookup, and stock price resolution.
spec:
  type: openapi
  lifecycle: production
  owner: group:developers
  system: novashop-commerce-system
  definition: |
    openapi: 3.0.3
    info:
      title: Products Service API
      version: 1.0.0
    paths:
      /api/v1/products:
        get:
          summary: List catalog products
          responses:
            '200':
              description: Product list returned
