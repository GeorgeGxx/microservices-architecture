    devsecops.georgegxx.dev/supply-chain-signing: cosign-3.1.3
  tags:
    - graphql-federation
    - wundergraph-cosmo
    - api-gateway
    - opentelemetry
  links:
    - url: https://api.georgegxx.dev/graphql
      title: Federated GraphQL Endpoint
      icon: api
spec:
