  title: Novashop Storefront (React 19)
  description: Customer-facing e-commerce SPA with Clean Architecture, Apollo GraphQL Client, Keycloak OIDC PKCE authentication, and real-time order tracking.
  annotations:
    github.com/project-slug: GeorgeGxx/microservices-architecture
