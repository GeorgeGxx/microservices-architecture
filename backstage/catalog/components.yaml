  title: WunderGraph Cosmo Federated GraphQL Router
  description: High-performance Go-based Federated GraphQL API Gateway composing Products, Orders, Inventory, Payments, Fulfillment, and Analytics subgraphs with JWT validation, rate limiting, and OpenTelemetry tracing.
  annotations:
