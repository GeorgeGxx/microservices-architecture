    devsecops.georgegxx.dev/supply-chain-signing: cosign-3.1.3
  tags:
    - react-19
    - typescript
    - nodejs-24
    - nginx
    - graphql-client
  links:
    - url: https://shop.georgegxx.dev
      title: Production Storefront
      icon: web
    - url: https://grafana.georgegxx.dev
      title: Grafana Telemetry Dashboard
      icon: dashboard
spec:
  type: website
  lifecycle: production
  owner: group:developers
  system: novashop-commerce-system
