name: Workflow Configuration Validation

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install pinned actionlint and verify checksum
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLo "$archive" "$base_url/$archive"
          curl -fsSLo checksums.txt "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "  ${archive}$" checksums.txt > actionlint.sha256
          sha256sum --check actionlint.sha256
          tar -xzf "$archive" actionlint
          ./actionlint .github/workflows/*.yml
