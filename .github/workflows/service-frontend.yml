name: Frontend Angular CI/CD

on:
  push:
    branches: [ master, main, staging, develop, 'release/*' ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ master, main, staging, develop ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: frontend
      service-type: angular
      service-dir: frontend
    secrets: inherit
