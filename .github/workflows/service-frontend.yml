name: Frontend React CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-frontend.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: frontend
      service-type: react
      service-dir: frontend
    secrets: inherit
