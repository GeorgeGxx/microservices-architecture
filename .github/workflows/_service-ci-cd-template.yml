name: Enterprise 12-Stage DevSecOps Pipeline - Local Minikube & Mesh

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: 'Name of the microservice or frontend'
      service-type:
        required: true
        type: string
        description: 'Type: spring-boot, react, cosmo-router, python, go, or nestjs'
      service-dir:
        required: true
        type: string
        description: 'Directory path relative to root'
      dockerfile-path:
        required: false
        type: string
        default: ''
        description: 'Optional custom Dockerfile path (e.g. mlops/Dockerfile.forecast)'
      context-dir:
        required: false
        type: string
        default: ''
        description: 'Optional custom build context directory'
      helm-values-key:
        required: false
        type: string
        default: ''
        description: 'Optional custom Helm values path (e.g. mlops.forecast, defaults to inputs.service-name)'
      runner-type:
        required: false
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label: self-hosted (local AMD/Intel) or ubuntu-latest'
      dockerhub-owner:
        required: false
        type: string
        default: 'georgegxx'
        description: 'Docker Hub user or organization namespace'
      istio-gateway-url:
        required: false
        type: string
        default: 'http://localhost:30088'
        description: 'Base URL exposed by Istio Ingress Gateway'
      argocd-server:
        required: false
        type: string
        default: 'localhost:8088'
        description: 'ArgoCD Server URL for GitOps CD'
      sonar-qualitygate-wait:
        required: false
        type: boolean
        default: false
        description: 'Wait for SonarQube / SonarCloud Quality Gate result (fails step if Quality Gate fails)'
      post-deploy-enabled:
        required: false
        type: boolean
        default: false
        description: 'Explicitly enable runtime post-deployment validation tests'
      base-url:
        required: false
        type: string
        default: ''
        description: 'Base URL for API contract test suite (defaults to vars.DEVSECOPS_BASE_URL)'
      frontend-url:
        required: false
        type: string
        default: ''
        description: 'Frontend URL for DAST/smoke test suite (defaults to vars.DEVSECOPS_FRONTEND_URL)'
      keycloak-url:
        required: false
        type: string
        default: ''
        description: 'Keycloak URL for IAM validation (defaults to vars.DEVSECOPS_KEYCLOAK_URL)'
      publish-to-registry:
        required: false
        type: boolean
        default: true
        description: 'Whether to push the certified container image to registry'
      image-tag:
        required: false
        type: string
        default: ''
        description: 'Explicit image tag to publish (e.g. 1.0.0). Defaults to git tag SemVer or commit SHA'
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      ARGOCD_SERVER:
        required: false
      ARGOCD_AUTH_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SONAR_ORGANIZATION:
        required: false

env:
  DOCKERHUB_OWNER: ${{ inputs.dockerhub-owner || 'georgegxx' }}
  IMAGE_NAME: ${{ inputs.dockerhub-owner || 'georgegxx' }}/${{ inputs.service-name }}
  ISTIO_GATEWAY_URL: ${{ inputs.istio-gateway-url }}

permissions:
  contents: read

jobs:
  # ==========================================================
  # STEP 1: 🧪 Unit Tests (QA) — Runs in parallel with SAST
  #   Leverages multi-threading (-T 1C) on AMD/Intel CPU
  # ==========================================================
  unit-tests:
    name: "🧪 1. Unit Tests (JUnit/JaCoCo) - ${{ inputs.service-name }}"
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Spring Boot / Maven (Multi-threaded)
      - name: Set up JDK 21
        if: inputs.service-type == 'spring-boot'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Unit Tests & JaCoCo Coverage (-T 1C Multi-threaded)
        if: inputs.service-type == 'spring-boot'
        run: |
          cd ${{ inputs.service-dir }}
          mvn clean test jacoco:report -B -T 1C

      - name: Upload Test & Coverage Results
        if: inputs.service-type == 'spring-boot' && always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ inputs.service-name }}
          path: |
            ${{ inputs.service-dir }}/target/classes/
            ${{ inputs.service-dir }}/target/test-classes/
            ${{ inputs.service-dir }}/target/surefire-reports/
            ${{ inputs.service-dir }}/target/site/jacoco/
          retention-days: 7

      # Novashop Storefront (Frontend)
      - name: Set up Node.js 22
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service-dir }}/package.json

      - name: Install & Build Novashop Frontend
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        run: |
          cd ${{ inputs.service-dir }}
          npm ci
          npm run test:coverage
          npm run build

      - name: Upload Frontend Coverage Artifact
        if: (inputs.service-type == 'react' || inputs.service-type == 'frontend') && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage/
          retention-days: 7

      # Go (Payments Service)
      - name: Set up Go
        if: inputs.service-type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ inputs.service-dir }}/go.sum

      - name: Run Go Unit Tests & Coverage
        if: inputs.service-type == 'go'
        run: |
          cd ${{ inputs.service-dir }}
          go test -v -coverprofile=coverage.out ./...

      - name: Upload Go Coverage Artifact
        if: inputs.service-type == 'go' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage.out
          retention-days: 7

      # NestJS / TypeScript (Fulfillment Service)
      - name: Set up Node.js 22 for NestJS
        if: inputs.service-type == 'nestjs'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service-dir }}/package.json

      - name: Install & Run NestJS Tests with Coverage
        if: inputs.service-type == 'nestjs'
        run: |
          cd ${{ inputs.service-dir }}
          npm ci || npm install
          npm run test:cov
          npm run build

      - name: Upload NestJS Coverage Artifact
        if: inputs.service-type == 'nestjs' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage/
          retention-days: 7

      # Python / MLOps & Analytics
      - name: Set up Python 3.12
        if: inputs.service-type == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Dependencies & Run Unit Tests with Coverage
        if: inputs.service-type == 'python'
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ inputs.service-dir }}
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ inputs.service-dir }}/requirements.txt" ]; then
            pip install -r "${{ inputs.service-dir }}/requirements.txt"
          fi
          pip install coverage pytest pytest-cov pytest-asyncio
          if [ -d "${{ inputs.service-dir }}/tests" ]; then
            cd "${{ inputs.service-dir }}"
            if [ -d "app" ]; then
              pytest --cov=app --cov-report=xml:coverage.xml tests/ -v
            else
              OMIT="*/generate_sample_sales.py,*/test_tdd.py,*/patch_spark_jars.py,*/tests/*,*/.venv*/*"
              if [ "${{ inputs.service-name }}" = "demand-forecast" ]; then
                OMIT="$OMIT,*/capture_orders.py,*/train_demand_model.py,*/feature_engineering.py"
              elif [ "${{ inputs.service-name }}" = "mlops-training" ]; then
                OMIT="$OMIT,*/forecast_api.py"
              elif [ "${{ inputs.service-name }}" = "mlflow" ]; then
                OMIT="$OMIT,*/capture_orders.py,*/train_demand_model.py,*/feature_engineering.py,*/forecast_api.py"
              fi
              coverage run --source=. --omit="$OMIT" -m unittest discover -s tests -v
              coverage xml -o coverage.xml
            fi
          fi

      - name: Upload Python Coverage Artifact
        if: inputs.service-type == 'python' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage.xml
          retention-days: 7

  # ==========================================================
  # STEP 2: 🔍 SAST & Secret Scanning (Security) — Runs in parallel with Unit Tests
  #   Uses centralized governance configs in devsecops/sast/
  # ==========================================================
  sast-scans:
    name: "🔍 2. SAST and IaC (Semgrep/Gitleaks/Trivy) - ${{ inputs.service-name }}"
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gitleaks Secrets Detection (Centralized Config - Hard Gate)
      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: devsecops/sast/gitleaks/.gitleaks.toml

      # Semgrep SAST — fails on ERROR-severity findings (Anti-bottleneck: container/CLI fast path)
      - name: Run Semgrep Security Scanner
        run: |
          if command -v semgrep &>/dev/null; then
            semgrep scan --config auto --severity ERROR --error ${{ inputs.service-dir }}
          elif command -v docker &>/dev/null; then
            docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" returntocorp/semgrep semgrep scan --config auto --severity ERROR --error "${{ inputs.service-dir }}"
          else
            python3 -m pip install --upgrade pip && pip install semgrep
            semgrep scan --config auto --severity ERROR --error ${{ inputs.service-dir }}
          fi

      # Keep local and CI IaC checks on the same Trivy engine and central policy.
      - name: Run Trivy IaC Configuration Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: 'v0.76.1'
          scan-ref: ${{ inputs.service-dir }}
          trivy-config: devsecops/compliance/trivy/trivy.yaml
          format: table
          exit-code: '0'

  # ==========================================================
  # STEP 2b: 📊 SonarQube Cloud Code Quality & Security Analysis
  #   Decoupled: runs in parallel with Container Build without blocking deployment
  # ==========================================================
  sonar-analysis:
    name: "📊 SonarQube Analysis - ${{ inputs.service-name }}"
    needs: unit-tests
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache SonarCloud Global Packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-cache
          restore-keys: |
            ${{ runner.os }}-sonar-cache

      # Spring Boot Sonar Analysis
      - name: Set up JDK 21
        if: inputs.service-type == 'spring-boot'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Spring Boot Test & Coverage Artifacts
        if: inputs.service-type == 'spring-boot'
        uses: actions/download-artifact@v8
        with:
          name: surefire-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/target

      - name: Sonar Analysis (Spring Boot)
        if: inputs.service-type == 'spring-boot'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_QG_WAIT: ${{ inputs.sonar-qualitygate-wait }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
            exit 0
          fi
          : "${SONAR_ORGANIZATION:?SONAR_ORGANIZATION must match the SonarQube Cloud organization key}"
          cd "${{ inputs.service-dir }}"
          mvn -B -T 1C \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=msa-${{ inputs.service-name }} \
            -Dsonar.projectName="MSA ${{ inputs.service-name }}" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"

      # Frontend Sonar Analysis
      - name: Set up Java for Frontend Sonar Scanner
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js for Frontend Sonar Scanner
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.service-dir }}/package.json

      - name: Download Frontend Coverage Artifacts
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage

      - name: Cache SonarCloud Scanner Work
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        uses: actions/cache@v6
        with:
          path: ${{ inputs.service-dir }}/.scannerwork
          key: ${{ runner.os }}-sonar-work-${{ inputs.service-name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sonar-work-${{ inputs.service-name }}-

      - name: Sonar Analysis (Novashop Frontend)
        if: inputs.service-type == 'react' || inputs.service-type == 'frontend'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_QG_WAIT: ${{ inputs.sonar-qualitygate-wait }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
            exit 0
          fi
          : "${SONAR_ORGANIZATION:?SONAR_ORGANIZATION must match the SonarQube Cloud organization key}"
          cd "${{ inputs.service-dir }}"
          npx --yes sonarqube-scanner \
            -Dsonar.projectKey=msa-frontend \
            -Dsonar.projectName="Novashop Storefront" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.sources=src \
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx \
            -Dsonar.coverage.exclusions=src/main.tsx,src/App.tsx,src/index.css,src/pages/**,src/components/**,src/context/**,src/domain/repositories/**,**/*.test.ts,**/*.test.tsx \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"

      # Go Sonar Analysis
      - name: Download Go Coverage Artifacts
        if: inputs.service-type == 'go'
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}

      - name: Set up Node.js for Go Sonar Scanner
        if: inputs.service-type == 'go'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sonar Analysis (Go)
        if: inputs.service-type == 'go'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_QG_WAIT: ${{ inputs.sonar-qualitygate-wait }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
            exit 0
          fi
          : "${SONAR_ORGANIZATION:?SONAR_ORGANIZATION must match the SonarQube Cloud organization key}"
          cd "${{ inputs.service-dir }}"
          npx --yes sonarqube-scanner \
            -Dsonar.projectKey=msa-${{ inputs.service-name }} \
            -Dsonar.projectName="MSA ${{ inputs.service-name }}" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.sources=. \
            -Dsonar.tests=. \
            -Dsonar.test.inclusions="**/*_test.go" \
            -Dsonar.exclusions="**/*_test.go,docs/**,scripts/**" \
            -Dsonar.go.coverage.reportPaths=coverage.out \
            -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"

      # NestJS Sonar Analysis
      - name: Set up Java for NestJS Sonar Scanner
        if: inputs.service-type == 'nestjs'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js for NestJS Sonar Scanner
        if: inputs.service-type == 'nestjs'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download NestJS Coverage Artifacts
        if: inputs.service-type == 'nestjs'
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/coverage

      - name: Sonar Analysis (NestJS)
        if: inputs.service-type == 'nestjs'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_QG_WAIT: ${{ inputs.sonar-qualitygate-wait }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
            exit 0
          fi
          : "${SONAR_ORGANIZATION:?SONAR_ORGANIZATION must match the SonarQube Cloud organization key}"
          cd "${{ inputs.service-dir }}"
          npx --yes sonarqube-scanner \
            -Dsonar.projectKey=msa-${{ inputs.service-name }} \
            -Dsonar.projectName="MSA ${{ inputs.service-name }}" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="**/*.spec.ts" \
            -Dsonar.exclusions="**/*.spec.ts,dist/**,node_modules/**" \
            -Dsonar.coverage.exclusions="src/main.ts,src/**/*.module.ts,src/**/*.orm-entity.ts,**/*.spec.ts" \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"

      # Python / MLOps Sonar Analysis
      - name: Download Python Coverage Artifacts
        if: inputs.service-type == 'python'
        uses: actions/download-artifact@v8
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}

      - name: Set up Java for Python Sonar Scanner
        if: inputs.service-type == 'python'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js for Python Sonar Scanner
        if: inputs.service-type == 'python'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sonar Analysis (Python MLOps)
        if: inputs.service-type == 'python'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_QG_WAIT: ${{ inputs.sonar-qualitygate-wait }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not configured; skipping SonarQube Cloud analysis."
            exit 0
          fi
          : "${SONAR_ORGANIZATION:?SONAR_ORGANIZATION must match the SonarQube Cloud organization key}"
          cd "${{ inputs.service-dir }}"
          EXCLUSIONS="tests/**,data/**,*.sh,*.ps1,Dockerfile*,.venv*/**,generate_sample_sales.py,test_tdd.py,patch_spark_jars.py"
          COVERAGE_EXCLUSIONS="*.sh,*.ps1,Dockerfile*,generate_sample_sales.py,test_tdd.py,patch_spark_jars.py"
          if [ "${{ inputs.service-name }}" = "demand-forecast" ]; then
            EXCLUSIONS="$EXCLUSIONS,Dockerfile.training,Dockerfile.capture,capture_orders.py,train_demand_model.py,feature_engineering.py"
            COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,capture_orders.py,train_demand_model.py,feature_engineering.py"
          elif [ "${{ inputs.service-name }}" = "mlops-training" ]; then
            EXCLUSIONS="$EXCLUSIONS,Dockerfile.forecast,forecast_api.py"
            COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,forecast_api.py"
          elif [ "${{ inputs.service-name }}" = "mlflow" ]; then
            EXCLUSIONS="$EXCLUSIONS,Dockerfile.forecast,Dockerfile.training,forecast_api.py,capture_orders.py,train_demand_model.py,feature_engineering.py"
            COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,forecast_api.py,capture_orders.py,train_demand_model.py,feature_engineering.py"
          elif [ "${{ inputs.service-name }}" = "analytics-service" ]; then
            EXCLUSIONS="$EXCLUSIONS,scripts/**"
            COVERAGE_EXCLUSIONS="$COVERAGE_EXCLUSIONS,scripts/**"
          fi
          npx --yes sonarqube-scanner \
            -Dsonar.projectKey=msa-${{ inputs.service-name }} \
            -Dsonar.projectName="MSA ${{ inputs.service-name }}" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.sources=. \
            -Dsonar.tests=tests \
            -Dsonar.exclusions="$EXCLUSIONS" \
            -Dsonar.coverage.exclusions="$COVERAGE_EXCLUSIONS" \
            -Dsonar.python.version=3.12 \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.qualitygate.wait="${SONAR_QG_WAIT:-false}"

  # ==========================================================
  # STEP 3: ⚙️ Build Container Once & SBOM (DevOps / Supply Chain)
  # ==========================================================
  build-container:
    name: "⚙️ 3. Build & SBOM - ${{ inputs.service-name }}"
    needs: [unit-tests, sast-scans]
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image & Export to OCI Tarball
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context-dir != '' && inputs.context-dir || ((inputs.service-type == 'react' || inputs.service-type == 'frontend') && './frontend' || '.') }}
          file: ${{ inputs.dockerfile-path != '' && inputs.dockerfile-path || ((inputs.service-type == 'react' || inputs.service-type == 'frontend') && './frontend/Dockerfile' || format('./{0}/Dockerfile', inputs.service-dir)) }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ inputs.service-name }}-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.service-name }}
          path: /tmp/${{ inputs.service-name }}-image.tar
          retention-days: 1
          compression-level: 1

      - name: Generate CycloneDX SBOM (from tarball)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          version: 'v0.76.1'
          input: /tmp/${{ inputs.service-name }}-image.tar
          format: 'cyclonedx'
          output: 'sbom-${{ inputs.service-name }}.cdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.service-name }}
          path: sbom-${{ inputs.service-name }}.cdx.json
          retention-days: 14

  # ==========================================================
  # STEP 4: 🧰 Container Image Scan (Trivy) — Calibrated
  #   Blocks fixed CRITICAL findings; reports HIGH findings as advisory.
  # ==========================================================
  image-scan:
    name: "🧰 4. Image Scan (Trivy) - ${{ inputs.service-name }}"
    needs: build-container
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Image Artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.service-name }}
          path: /tmp

      - name: Block on fixed CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          version: 'v0.76.1'
          input: /tmp/${{ inputs.service-name }}-image.tar
          trivy-config: devsecops/compliance/trivy/trivy.yaml
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Report HIGH image vulnerability findings (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          version: 'v0.76.1'
          input: /tmp/${{ inputs.service-name }}-image.tar
          trivy-config: devsecops/compliance/trivy/trivy.yaml
          format: 'table'
          severity: 'HIGH'
          ignore-unfixed: true
          exit-code: '0'

  # ==========================================================
  # STEP 5: 🧾 Pre-flight Policy Check (Governance - Conftest / Rego) — BLOCKING
  #   Anti-bottleneck: Decoupled to run in parallel at pipeline start
  # ==========================================================
  compliance-check:
    name: "🧾 5. Compliance & Policy Gate - ${{ inputs.service-name }}"
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Helm 4
        run: bash scripts/install-helm4.sh v4.3.1

      - name: Render Helm Manifests
        run: |
          HELM_KEY="${{ inputs.helm-values-key != '' && inputs.helm-values-key || inputs.service-name }}"
          helm template microservices ./helm/microservices-umbrella \
            --set ${HELM_KEY}.image.tag=${{ github.sha }} \
            > rendered-manifests.yaml

      - name: Cache Conftest Binary
        id: cache-conftest
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/conftest
          key: ${{ runner.os }}-conftest-0.58.0

      - name: Install Conftest (OPA)
        if: steps.cache-conftest.outputs.cache-hit != 'true'
        run: |
          if ! command -v conftest &> /dev/null; then
            curl -fsSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz
            tar xzf conftest.tar.gz conftest
            chmod +x conftest
            sudo install conftest /usr/local/bin/conftest
          fi
          conftest --version

      - name: Run Conftest Policy Audit (Centralized Rego Rules)
        run: |
          test -d "devsecops/policies/conftest" || { echo "::error::No devsecops/policies/conftest directory found — compliance gate cannot verify."; exit 1; }
          test -n "$(find devsecops/policies/conftest -maxdepth 1 -name '*.rego' -print -quit)" || { echo "::error::No Rego policies found — compliance gate cannot verify."; exit 1; }
          command -v conftest >/dev/null || { echo "::error::Conftest installation failed — compliance gate cannot verify."; exit 1; }
          conftest test rendered-manifests.yaml --policy devsecops/policies/conftest/

  # ==========================================================
  # STEP 6: 📦 Push Certified Image to Registry (Docker Hub / ECR)
  #   Runs after all CI tests, SAST, SBOM, vulnerability scans, and OPA compliance pass.
  # ==========================================================
  push-dockerhub:
    name: "📦 6. Push to Registry - ${{ inputs.service-name }}"
    needs: [build-container, image-scan, compliance-check]
    if: github.event_name != 'pull_request' && (inputs.publish-to-registry != false) && (inputs.image-tag != '' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master')
    outputs:
      image-digest: ${{ steps.registry-push.outputs.digest }}
      image-published: ${{ steps.registry-push.outputs.published }}
      image-tag: ${{ steps.registry-push.outputs.image-tag }}
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 15
    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ inputs.service-name }}
          path: /tmp

      - name: Load Image from Tarball
        run: docker load -i /tmp/${{ inputs.service-name }}-image.tar

      - name: Tag and Push to Container Registry (Immutable Promotion on staging/master)
        id: registry-push
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'georgegxx' }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          # Determine the single target tag:
          # 1. Explicit input tag (e.g. 1.0.0)
          # 2. Git Tag SemVer (e.g. refs/tags/v1.0.0 -> 1.0.0)
          # 3. Commit SHA fallback (always immutable)
          if [ -n "${{ inputs.image-tag }}" ]; then
            TARGET_TAG="${{ inputs.image-tag }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            TARGET_TAG="${BASH_REMATCH[1]}"
          else
            TARGET_TAG="${{ github.sha }}"
          fi

          FINAL_IMAGE="${{ env.IMAGE_NAME }}:${TARGET_TAG}"

          if [ -n "$DOCKER_PASS" ]; then
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

            # On staging/prod promotion, check if the exact immutable artifact for this commit SHA
            # was already built and pushed in an earlier stage; if so, promote its digest without overwriting.
            if [ "${{ github.ref }}" = "refs/heads/staging" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
              EXISTING_DIGEST="$(docker buildx imagetools inspect "$FINAL_IMAGE" 2>/dev/null | awk '/^Digest:/ { print $2; exit }' || true)"
              if [[ "$EXISTING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "digest=$EXISTING_DIGEST" >> "$GITHUB_OUTPUT"
                echo "published=true" >> "$GITHUB_OUTPUT"
                echo "image-tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
                echo "Promoted existing immutable artifact $FINAL_IMAGE@$EXISTING_DIGEST without rebuilding."
                exit 0
              fi
            fi

            # If target tag differs from github.sha, tag the loaded image
            if [ "$TARGET_TAG" != "${{ github.sha }}" ]; then
              docker tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" "$FINAL_IMAGE"
            fi

            echo "Pushing single immutable image tag: $FINAL_IMAGE"
            docker push "$FINAL_IMAGE" 2>&1 | tee /tmp/docker-push.log
            IMAGE_DIGEST="$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' /tmp/docker-push.log | tail -n 1)"
            if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Registry did not return a valid immutable image digest."
              exit 1
            fi
            echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "image-tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            echo "Published $FINAL_IMAGE with immutable digest $IMAGE_DIGEST."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "image-tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            echo "::notice::Registry credentials are not configured; deployment is skipped because no image was published."
          fi

  # ==========================================================
  # STEP 7: 🐙 ArgoCD GitOps Continuous Delivery Synchronization
  #   - Branch develop/dev: Syncs 'microservices-dev' on Minikube/EKS Dev (namespace: dev)
  #   - Branch staging: Syncs 'microservices-staging' on AWS EKS Staging (namespace: staging)
  #   - Branch master: Syncs BOTH 'microservices-prod' (DP1) and 'microservices-prod-dp2' (DP2)
  # ==========================================================
  gitops-argocd-sync:
    name: "🐙 7. ArgoCD GitOps Sync - ${{ inputs.service-name }}"
    needs: push-dockerhub
    if: needs.push-dockerhub.outputs.image-published == 'true'
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup ArgoCD CLI
        run: |
          if ! command -v argocd &> /dev/null; then
            echo "Installing ArgoCD CLI..."
            curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64 2>/dev/null || true
            chmod +x /usr/local/bin/argocd 2>/dev/null || true
          fi

      - name: Determine Target ArgoCD Application(s) & Namespace
        id: app-target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "APP_NAME=microservices-dev" >> $GITHUB_ENV
            echo "APP_NAMES=microservices-dev" >> $GITHUB_ENV
            echo "TARGET_ENV=dev" >> $GITHUB_ENV
            echo "TARGET_NS=dev" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "APP_NAME=microservices-staging" >> $GITHUB_ENV
            echo "APP_NAMES=microservices-staging" >> $GITHUB_ENV
            echo "TARGET_ENV=staging" >> $GITHUB_ENV
            echo "TARGET_NS=staging" >> $GITHUB_ENV
          else
            echo "APP_NAME=microservices-prod" >> $GITHUB_ENV
            echo "APP_NAMES=microservices-prod microservices-prod-dp2" >> $GITHUB_ENV
            echo "TARGET_ENV=prod" >> $GITHUB_ENV
            echo "TARGET_NS=production" >> $GITHUB_ENV
          fi

      - name: Trigger ArgoCD GitOps Synchronization & Health Verification
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER || inputs.argocd-server || 'localhost:8088' }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_INSECURE: ${{ vars.ARGOCD_INSECURE || 'false' }}
        run: |
          echo "Connecting to ArgoCD for [$APP_NAMES] in namespace $TARGET_NS..."
          IMAGE_DIGEST="${{ needs.push-dockerhub.outputs.image-digest }}"
          PUBLISHED_TAG="${{ needs.push-dockerhub.outputs.image-tag || github.sha }}"
          HELM_KEY="${{ inputs.helm-values-key != '' && inputs.helm-values-key || inputs.service-name }}"
          TLS_FLAGS=()
          if [[ "$ARGOCD_SERVER" == localhost* ]] || [[ "$ARGOCD_SERVER" == 127.0.0.1* ]] || [ "$ARGOCD_INSECURE" = "true" ]; then
            TLS_FLAGS=(--insecure)
          fi
          if command -v argocd &> /dev/null && [ -n "$ARGOCD_TOKEN" ]; then
            for APP in $APP_NAMES; do
              echo "Synchronizing ArgoCD application: $APP..."
              if [ -n "$IMAGE_DIGEST" ]; then
                argocd app set "$APP" --helm-set ${HELM_KEY}.image.digest="$IMAGE_DIGEST" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" "${TLS_FLAGS[@]}"
              else
                argocd app set "$APP" --helm-set ${HELM_KEY}.image.digest= --helm-set ${HELM_KEY}.image.tag="$PUBLISHED_TAG" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" "${TLS_FLAGS[@]}"
              fi
              argocd app sync "$APP" --prune --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" "${TLS_FLAGS[@]}"
              argocd app wait "$APP" --health --timeout 300 --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" "${TLS_FLAGS[@]}"
              echo "Successfully synchronized and validated $APP via ArgoCD."
            done
          elif command -v kubectl &> /dev/null && kubectl get nodes &> /dev/null; then
            echo "Using direct cluster fallback for $TARGET_ENV..."
            IMAGE_REF_ARGS=(--set ${HELM_KEY}.image.digest= --set ${HELM_KEY}.image.tag="$PUBLISHED_TAG")
            if [ -n "$IMAGE_DIGEST" ]; then
              IMAGE_REF_ARGS=(--set ${HELM_KEY}.image.digest="$IMAGE_DIGEST")
            fi
            helm upgrade --install microservices ./helm/microservices-umbrella \
              --namespace "$TARGET_NS" \
              --create-namespace \
              "${IMAGE_REF_ARGS[@]}" \
              --set global.environment="$TARGET_ENV" \
              --wait --timeout 5m \
              --atomic \
              --cleanup-on-fail
            echo "Cluster deployment healthy in $TARGET_NS."
          else
            echo "::notice::ArgoCD server not connected in this runner — GitOps delivery dispatched for [$APP_NAMES] (Tag: $PUBLISHED_TAG, Digest: $IMAGE_DIGEST)."
          fi

  # Opt-in because the GitHub runner must have network access to the deployed app.
  # Set DEVSECOPS_POST_DEPLOY_ENABLED=true and configure the three URL variables
  # to activate this runtime verification suite.
  post-deployment-validation:
    name: "🧪 Post-deployment API, SLO and DAST - ${{ inputs.service-name }}"
    needs: gitops-argocd-sync
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEVSECOPS_POST_DEPLOY_ENABLED == 'true') || inputs.post-deploy-enabled == true
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base-url != '' && inputs.base-url || vars.DEVSECOPS_BASE_URL }}
      FRONTEND_URL: ${{ inputs.frontend-url != '' && inputs.frontend-url || vars.DEVSECOPS_FRONTEND_URL }}
      KEYCLOAK_URL: ${{ inputs.keycloak-url != '' && inputs.keycloak-url || vars.DEVSECOPS_KEYCLOAK_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js for Newman
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python for storefront smoke checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate runtime test targets
        run: |
          : "${BASE_URL:?Set DEVSECOPS_BASE_URL to the deployed API/storefront entrypoint}"
          : "${FRONTEND_URL:?Set DEVSECOPS_FRONTEND_URL to the deployed Novashop storefront}"
          : "${KEYCLOAK_URL:?Set DEVSECOPS_KEYCLOAK_URL to the deployed Keycloak base URL}"

      - name: Run Newman API and authorization collection
        run: npx --yes newman@6 run devsecops/testing/newman/microservices.postman_collection.json --env-var "BASE_URL=$BASE_URL" --env-var "keycloak_url=$KEYCLOAK_URL" --bail

      - name: Run storefront smoke checks
        run: python3 scripts/testing/smoke.py --deployment --base-url "$BASE_URL" --frontend-url "$FRONTEND_URL"

      - name: Run k6 performance and SLO checks
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace:ro" \
            grafana/k6:1.8.1 run --env "TARGET_URL=$BASE_URL" \
            /workspace/devsecops/testing/k6/load-test.js

      - name: Run OWASP ZAP using centralized alert rules
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/zap"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/devsecops/dast/zap:/zap/rules:ro" \
            -v "$GITHUB_WORKSPACE/artifacts/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "$FRONTEND_URL" -c /zap/rules/rules.tsv -r zap-report.html -I

      - name: Upload OWASP ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report-${{ inputs.service-name }}
          path: artifacts/zap/zap-report.html
          if-no-files-found: warn
          retention-days: 7

  # ==========================================================
  # ROLLBACK: 🔄 Automated Rollback for ArgoCD & GitHub Actions on Failure
  #   Triggers if ArgoCD sync, pod deployment, or health verification fails
  # ==========================================================
  rollback-argocd:
    name: "🔄 Rollback ArgoCD GitOps - ${{ inputs.service-name }}"
    needs: [push-dockerhub, gitops-argocd-sync, post-deployment-validation]
    if: failure() && needs.push-dockerhub.result == 'success' && (needs.gitops-argocd-sync.result == 'failure' || needs.post-deployment-validation.result == 'failure')
    runs-on: ${{ inputs.runner-type }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Target Application(s) for Rollback
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "APP_NAMES=microservices-dev" >> $GITHUB_ENV
            echo "TARGET_NS=dev" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "APP_NAMES=microservices-staging" >> $GITHUB_ENV
            echo "TARGET_NS=staging" >> $GITHUB_ENV
          else
            echo "APP_NAMES=microservices-prod microservices-prod-dp2" >> $GITHUB_ENV
            echo "TARGET_NS=production" >> $GITHUB_ENV
          fi

      - name: Execute Automated Emergency Rollback in ArgoCD & Cluster
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER || inputs.argocd-server || 'localhost:8088' }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_INSECURE: ${{ vars.ARGOCD_INSECURE || 'false' }}
        run: |
          echo "::error::Deployment/sync failed for [$APP_NAMES]. Executing automated emergency rollback..."
          TLS_FLAGS=()
          if [[ "$ARGOCD_SERVER" == localhost* ]] || [[ "$ARGOCD_SERVER" == 127.0.0.1* ]] || [ "$ARGOCD_INSECURE" = "true" ]; then
            TLS_FLAGS=(--insecure)
          fi
          if command -v argocd &> /dev/null && [ -n "$ARGOCD_TOKEN" ]; then
            for APP in $APP_NAMES; do
              argocd app rollback "$APP" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" "${TLS_FLAGS[@]}" || true
              echo "ArgoCD app $APP rolled back to last healthy state."
            done
          elif command -v kubectl &> /dev/null && kubectl get nodes &> /dev/null; then
            helm rollback microservices --namespace "$TARGET_NS" --wait --timeout 5m || true
            echo "Cluster release rolled back in namespace $TARGET_NS."
          else
            echo "::warning::Automated rollback event recorded for [$APP_NAMES]."
          fi
