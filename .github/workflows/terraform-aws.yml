name: Microservices Architecture - Terraform AWS Infrastructure Pipeline

# Note: Automatic push, pull_request, and cron drift detection triggers are temporarily disabled
# until AWS remote state bucket (georgegxx-msa-tfstate-prod) is provisioned.
# To trigger manually: use the 'Run workflow' button in GitHub Actions.
on:
  workflow_dispatch:
  # push:
  #   branches: [ develop, staging, master, main ]
  #   paths:
  #     - 'terraform/**'
  #     - 'argocd/**'
  #     - 'helm/values/opencost-*.yaml'
  #     - 'helm/values/prometheus-cloud.yaml'
  #     - 'scripts/validate-opencost.sh'
  # pull_request:
  #   branches: [ develop, staging, master, main ]
  #   paths:
  #     - 'terraform/**'
  #     - 'argocd/**'
  #     - 'helm/values/opencost-*.yaml'
  #     - 'helm/values/prometheus-cloud.yaml'
  #     - 'scripts/validate-opencost.sh'
  # schedule:
  #   - cron: '0 6 * * 1' # Monday 6:00 AM UTC - Automated Drift Detection
    inputs:
      environment:
        description: 'Target AWS Terraform workspace'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform Action (plan, apply or drift-detection)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - drift-detection
      data_plane:
        description: 'Production cluster scope (all includes shared infrastructure)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - primary
          - secondary

concurrency:
  group: terraform-aws-${{ github.ref }}
  cancel-in-progress: false # Safe lock protection for cloud state

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/environments/aws

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ==========================================================
  # STAGE 1A: Terraform Lint, Format & Syntax Validation
  # ==========================================================
  tf-lint-validate:
    name: 🧹 1A. Terraform Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Install Helm 4
        run: bash scripts/install-helm4.sh v4.3.1

      - name: Validate OpenCost and Prometheus charts
        run: bash scripts/validate-opencost.sh

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive terraform/

      - name: Terraform Init (Validation Mode)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: Terraform Validate (dev, staging, prod workspaces)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          for ws in dev staging prod; do
            terraform workspace select "$ws" 2>/dev/null || terraform workspace new "$ws"
            terraform validate
          done

  # ==========================================================
  # STAGE 1B: Trivy IaC Misconfiguration Scan (Parallel with 1A)
  # ==========================================================
  tf-security-trivy:
    name: 🔒 1B. Trivy Terraform Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: 'v0.76.1'
          scan-ref: terraform/
          trivy-config: devsecops/compliance/trivy/trivy-sarif.yaml
          format: sarif
          output: trivy-tf-results.sarif
          exit-code: '0'

      - name: Upload Trivy IaC SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-tf-results.sarif'
          category: 'trivy-terraform'

  # ==========================================================
  # STAGE 2: Terraform Plan & Artifact Generation
  # ==========================================================
  tf-plan:
    name: 📊 2. Terraform Plan
    needs: [tf-lint-validate, tf-security-trivy]
    # Cloud plans are explicit/manual; PRs and branch pushes use the isolated
    # static validation workflow and never need cloud credentials or state.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'drift-detection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      target_env: ${{ steps.resolve-env.outputs.target_env }}
      data_plane: ${{ steps.resolve-env.outputs.data_plane }}
      s3_bucket: ${{ steps.resolve-env.outputs.s3_bucket }}
      dynamo_table: ${{ steps.resolve-env.outputs.dynamo_table }}
      var_file: ${{ steps.resolve-env.outputs.var_file }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Resolve Target AWS Environment
        id: resolve-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ] || [ "${{ github.base_ref }}" = "staging" ]; then
            TARGET_ENV="staging"
          else
            TARGET_ENV="prod"
          fi

          DATA_PLANE="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$TARGET_ENV" = "prod" ]; then
            DATA_PLANE="${{ github.event.inputs.data_plane }}"
          fi
          if [ "$TARGET_ENV" != "prod" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.data_plane }}" != "all" ]; then
            echo "::error::Data-plane targeting is available only for the prod environment."
            exit 1
          fi

          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "data_plane=$DATA_PLANE" >> $GITHUB_OUTPUT
          echo "var_file=$TARGET_ENV/terraform.tfvars" >> $GITHUB_OUTPUT
          # Match terraform/environments/aws/versions.tf and platform-multicloud.ps1 (-Provider aws):
          # one durable backend per provider, isolated by the Terraform workspace.
          echo "s3_bucket=georgegxx-msa-tfstate-prod" >> $GITHUB_OUTPUT
          echo "dynamo_table=georgegxx-msa-tflock-prod" >> $GITHUB_OUTPUT
          echo "Resolved target environment: $TARGET_ENV; data plane: $DATA_PLANE"

      - name: Configure AWS Credentials (IAM Key / OIDC fallback)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          TARGET_ENV="${{ steps.resolve-env.outputs.target_env }}"
          S3_BUCKET="${{ steps.resolve-env.outputs.s3_bucket }}"
          DYNAMO_TABLE="${{ steps.resolve-env.outputs.dynamo_table }}"

          echo "Initializing Terraform backend for environment: $TARGET_ENV"
          # Try live remote state backend first, fallback to -backend=false if simulation mode
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="dynamodb_table=$DYNAMO_TABLE" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Select or Create Terraform Workspace
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          TARGET_ENV="${{ steps.resolve-env.outputs.target_env }}"
          terraform workspace select "$TARGET_ENV" || terraform workspace new "$TARGET_ENV"

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          TARGET_ENV="${{ steps.resolve-env.outputs.target_env }}"
          VAR_FILE="${{ steps.resolve-env.outputs.var_file }}"
          DATA_PLANE="${{ steps.resolve-env.outputs.data_plane }}"
          PLAN_ARGS=(-no-color -out=tfplan)
          if [ -f "$VAR_FILE" ]; then
            PLAN_ARGS+=("-var-file=$VAR_FILE")
          fi
          if [ "$TARGET_ENV" = "prod" ]; then
            case "$DATA_PLANE" in
              all) ;;
              primary) PLAN_ARGS+=("-target=module.eks" "-target=module.irsa_lb_controller") ;;
              secondary) PLAN_ARGS+=("-target=module.eks_dp2" "-target=module.irsa_lb_controller_dp2") ;;
              *) echo "::error::Unsupported production data plane '$DATA_PLANE'."; exit 1 ;;
            esac
          fi
          test -n "$TF_VAR_db_master_password" || { echo "::error::DB_MASTER_PASSWORD secret is required."; exit 1; }
          terraform plan "${PLAN_ARGS[@]}"

      - name: FinOps Architecture Estimate and Optional Budget Gate
        env:
          FINOPS_MAX_MONTHLY_USD: ${{ vars.FINOPS_MAX_MONTHLY_USD }}
        run: |
          TARGET_ENV="${{ steps.resolve-env.outputs.target_env }}"
          if [ -n "$FINOPS_MAX_MONTHLY_USD" ]; then
            python scripts/local-cost-estimator.py --env "$TARGET_ENV" --max-monthly-usd "$FINOPS_MAX_MONTHLY_USD"
          else
            python scripts/local-cost-estimator.py --env "$TARGET_ENV"
            echo "FinOps ceiling is not configured; estimate is informational only. Set repository variable FINOPS_MAX_MONTHLY_USD to enable the profile-level budget gate."
          fi

      - name: Terraform Plan Cost Delta and Optional Increase Gate
        env:
          FINOPS_MAX_MONTHLY_DELTA_USD: ${{ vars.FINOPS_MAX_MONTHLY_DELTA_USD }}
        run: |
          terraform show -json "${TF_WORKING_DIR}/tfplan" > "$RUNNER_TEMP/tfplan.json"
          if [ -n "$FINOPS_MAX_MONTHLY_DELTA_USD" ]; then
            python scripts/local-cost-estimator.py --plan-delta "$RUNNER_TEMP/tfplan.json" --max-monthly-delta-usd "$FINOPS_MAX_MONTHLY_DELTA_USD"
          else
            python scripts/local-cost-estimator.py --plan-delta "$RUNNER_TEMP/tfplan.json"
            echo "Terraform delta ceiling is not configured; mapped resource changes are informational. Set repository variable FINOPS_MAX_MONTHLY_DELTA_USD to enable the increase gate."
          fi

      - name: Production Dual-Dataplane & Stateful Resource Destructive Change Guard
        if: steps.resolve-env.outputs.target_env == 'prod'
        env:
          ALLOW_DESTRUCTIVE_TERRAFORM: ${{ vars.ALLOW_DESTRUCTIVE_TERRAFORM || 'false' }}
        run: |
          if [ "$ALLOW_DESTRUCTIVE_TERRAFORM" = "true" ]; then
            echo "::warning::ALLOW_DESTRUCTIVE_TERRAFORM=true is set; bypassing production destructive change guard."
            exit 0
          fi
          python3 - "$RUNNER_TEMP/tfplan.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)
          protected_prefixes = (
              "module.eks.",
              "module.eks_dp2",
              "module.rds_postgres",
              "module.elasticache_redis",
              "module.msk_kafka",
          )
          destructive = []
          for rc in plan.get("resource_changes", []):
              actions = rc.get("change", {}).get("actions", [])
              addr = rc.get("address", "")
              if "delete" in actions and addr.startswith(protected_prefixes):
                  destructive.append(f"{addr} ({actions})")
          if destructive:
              print("::error::Destructive production plan detected on protected dataplane/stateful resources: " + ", ".join(destructive))
              sys.exit(1)
          print("Production plan verified: no destructive actions on primary/secondary EKS dataplanes or stateful backends.")
          PY

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ steps.resolve-env.outputs.target_env }}-${{ steps.resolve-env.outputs.data_plane }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
          # Plan files can embed sensitive values; keep them briefly in this private run.
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # STAGE 3A: Terraform Apply - AWS Dev Environment
  # =========================================================================
  tf-apply-dev:
    name: 🚀 3A. Terraform Apply (AWS Dev)
    needs: tf-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    environment:
      name: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-dev-all
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init \
            -backend-config="bucket=georgegxx-msa-tfstate-prod" \
            -backend-config="dynamodb_table=georgegxx-msa-tflock-prod" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Select Terraform Workspace
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform workspace select dev

      - name: Terraform Apply
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          test -s tfplan || { echo "::error::Reviewed dev plan artifact is required; refusing to create a fresh plan during apply."; exit 1; }
          test -n "$TF_VAR_db_master_password" || { echo "::error::DB_MASTER_PASSWORD secret is required."; exit 1; }
          terraform apply -input=false tfplan

  # =========================================================================
  # STAGE 3B: Terraform Apply - AWS Staging Environment
  # =========================================================================
  tf-apply-staging:
    name: 🚀 3B. Terraform Apply (AWS Staging)
    needs: tf-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    environment:
      name: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-staging-all
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init \
            -backend-config="bucket=georgegxx-msa-tfstate-prod" \
            -backend-config="dynamodb_table=georgegxx-msa-tflock-prod" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Select Terraform Workspace
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform workspace select staging

      - name: Terraform Apply
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          test -s tfplan || { echo "::error::Reviewed staging plan artifact is required; refusing to create a fresh plan during apply."; exit 1; }
          test -n "$TF_VAR_db_master_password" || { echo "::error::DB_MASTER_PASSWORD secret is required."; exit 1; }
          terraform apply -input=false tfplan

  # =========================================================================
  # STAGE 3C: Terraform Apply - AWS Production Environment
  # =========================================================================
  tf-apply-prod:
    name: 🚀 3C. Terraform Apply (AWS Production)
    needs: tf-plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-prod-${{ needs.tf-plan.outputs.data_plane }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init \
            -backend-config="bucket=georgegxx-msa-tfstate-prod" \
            -backend-config="dynamodb_table=georgegxx-msa-tflock-prod" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Select Terraform Workspace
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform workspace select prod

      - name: Terraform Apply
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          test -s tfplan || { echo "::error::Reviewed production plan artifact is required; refusing to create a fresh plan during apply."; exit 1; }
          test -n "$TF_VAR_db_master_password" || { echo "::error::DB_MASTER_PASSWORD secret is required."; exit 1; }
          terraform apply -input=false tfplan

  # =========================================================================
  # STAGE 4: Automated Drift Detection (Scheduled / On-demand)
  # =========================================================================
  tf-drift-detection:
    name: 🧭 4. Terraform Cloud Drift Detection
    if: github.event_name == 'schedule' || github.event.inputs.action == 'drift-detection'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || vars.AWS_ROLE_TO_ASSUME || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init \
            -backend-config="bucket=georgegxx-msa-tfstate-prod" \
            -backend-config="dynamodb_table=georgegxx-msa-tflock-prod" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Check Cloud Drift against Terraform State
        env:
          TF_VAR_db_master_password: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          test -n "$TF_VAR_db_master_password" || { echo "::error::DB_MASTER_PASSWORD secret is required."; exit 1; }
          terraform workspace select prod
          set +e
          terraform plan -detailed-exitcode -no-color -var-file="prod/terraform.tfvars"
          plan_status=$?
          set -e
          if [ "$plan_status" -eq 2 ]; then
            echo "::error::Terraform drift detected in AWS production. Review the plan; this job never applies changes."
            exit 1
          elif [ "$plan_status" -ne 0 ]; then
            exit "$plan_status"
          fi
