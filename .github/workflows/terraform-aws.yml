name: Microservices Architecture - Terraform AWS Infrastructure Pipeline

on:
  push:
    branches: [ master, main ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'terraform/**'
  schedule:
    - cron: '0 6 * * 1' # Lunes a las 6:00 AM UTC - Automated Drift Detection
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action (plan, apply or drift-detection)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - drift-detection

concurrency:
  group: terraform-aws-${{ github.ref }}
  cancel-in-progress: false # Safe lock protection for cloud state

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/environments/aws/prod

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================================
  # STAGE 1A: Terraform Lint, Format & Syntax Validation
  # ==========================================================
  tf-lint-validate:
    name: 🧹 1A. Terraform Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Init (Validation Mode)
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform validate

  # ==========================================================
  # STAGE 1B: Checkov IaC Security Scan (Parallel with 1A)
  # ==========================================================
  tf-security-checkov:
    name: 🔒 1B. Checkov Terraform Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 'terraform/'
          framework: 'terraform'
          output_format: 'cli,sarif'
          output_file_path: 'console,checkov-tf-report.sarif'
          soft_fail: true

      - name: Upload Checkov SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'checkov-tf-report.sarif'
          category: 'checkov-terraform'

  # ==========================================================
  # STAGE 2: Terraform Plan, Infracost & Artifact Generation
  # ==========================================================
  tf-plan-cost:
    name: 📊 2. Terraform Plan & FinOps Infracost
    needs: [tf-lint-validate, tf-security-checkov]
    if: github.event_name != 'schedule' && github.event.inputs.action != 'drift-detection'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC / IAM Key fallback)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true # demo environment fallback

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform plan -no-color -out=tfplan || echo "::warning::Plan generated in local simulation mode (no live AWS account wired)."
          if [ -f tfplan ]; then
            terraform show -json tfplan > tfplan.json
          fi

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Setup Infracost (FinOps Cost Estimation)
        if: github.event_name == 'pull_request'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Cost Breakdown on PR
        if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY != ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          if [ -f tfplan.json ]; then
            infracost breakdown --path tfplan.json --format json --out-file /tmp/infracost.json
            infracost comment github --path /tmp/infracost.json --repo $GITHUB_REPOSITORY --github-token ${{ github.token }} --pull-request ${{ github.event.pull_request.number }} --behavior update
          fi

  # ==========================================================
  # STAGE 3: Terraform Apply (CD Phase - Main Branch / Manual)
  # ==========================================================
  tf-apply:
    name: 🚀 3. Terraform Apply (Deploy Infra)
    needs: tf-plan-cost
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    environment:
      name: prod-infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC / IAM Key fallback)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: Terraform Apply
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          if [ -f tfplan ]; then
            terraform apply -auto-approve tfplan || echo "::warning::Apply simulated — no live AWS account wired."
          else
            terraform apply -auto-approve || echo "::warning::Apply simulated — no live AWS account wired."
          fi

  # ==========================================================
  # STAGE 4: Automated Drift Detection (Scheduled / On-demand)
  # ==========================================================
  tf-drift-detection:
    name: 🧭 4. Terraform Cloud Drift Detection
    if: github.event_name == 'schedule' || github.event.inputs.action == 'drift-detection'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          terraform init -backend=false

      - name: Check Cloud Drift against Terraform State
        run: |
          cd ${{ env.TF_WORKING_DIR }}
          echo "Checking for cloud infrastructure drift against state..."
          terraform plan -detailed-exitcode -no-color || echo "::warning::Drift detected or running in demo simulation mode."
