name: Production Helm Chart Release

on:
  push:
    tags:
      - 'helm-v*'
  workflow_dispatch:
    inputs:
      chart-version:
        description: 'Exact immutable chart version from helm/microservices-umbrella/Chart.yaml'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-helm-chart-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish immutable chart
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.17.3'

      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs['chart-version'] }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^helm-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "::error::Release tag must use helm-vMAJOR.MINOR.PATCH (for example helm-v1.0.1)."
              exit 1
            }
            CHART_VERSION="${BASH_REMATCH[1]}"
            git fetch origin main --no-tags
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Production chart tags must point to a commit reachable from main."
              exit 1
            }
          else
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "::error::Manual production chart releases must run from main."
              exit 1
            }
            CHART_VERSION="$REQUESTED_VERSION"
          fi

          [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Chart version must be a stable SemVer x.y.z value."
            exit 1
          }

          ACTUAL_VERSION="$(helm show chart helm/microservices-umbrella | awk '$1 == "version:" { print $2; exit }')"
          [[ "$CHART_VERSION" == "$ACTUAL_VERSION" ]] || {
            echo "::error::Requested release $CHART_VERSION does not match umbrella Chart.yaml version $ACTUAL_VERSION. Bump Chart.yaml and commit it before releasing."
            exit 1
          }

          CHART_REPOSITORY="$(sed -n 's/^[[:space:]]*microservices-architecture.io\/helm-oci-repository:[[:space:]]*"\(.*\)"$/\1/p' helm/microservices-umbrella/Chart.yaml)"
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          EXPECTED_REPOSITORY="oci://ghcr.io/${OWNER}/helm-charts/microservices-umbrella"
          [[ "$CHART_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
            echo "::error::Chart OCI annotation must match the canonical repository ${EXPECTED_REPOSITORY}."
            exit 1
          }

          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for pinned Cosmo composition
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compose the checked-in Federation v2 router config
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wgc@0.132.0 router compose \
            --input cosmo-router/supergraph.yaml \
            --out "$RUNNER_TEMP/execution-config.json"
          cmp --silent "$RUNNER_TEMP/execution-config.json" \
            helm/charts/cosmo-router/files/execution-config.json || {
            echo "::error::Generated Cosmo execution config differs from the committed chart input. Regenerate and commit it before releasing."
            exit 1
          }

      - name: Build and validate the versioned umbrella chart
        id: package
        shell: bash
        env:
          CHART_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          helm dependency build helm/microservices-umbrella
          helm lint helm/microservices-umbrella --values helm/values/values-eks-prod.yaml
          helm template microservices helm/microservices-umbrella \
            --namespace production \
            --set global.environment=prod \
            --values helm/values/values-eks-prod.yaml \
            > "$RUNNER_TEMP/production-manifests.yaml"

          mkdir -p "$RUNNER_TEMP/chart-package"
          helm package helm/microservices-umbrella \
            --destination "$RUNNER_TEMP/chart-package"
          PACKAGE="$RUNNER_TEMP/chart-package/microservices-umbrella-${CHART_VERSION}.tgz"
          test -s "$PACKAGE"
          PACKAGE_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          echo "path=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "sha256=$PACKAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Publish once or verify the existing immutable version
        id: publish
        shell: bash
        env:
          CHART_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.path }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          OCI_REPOSITORY="oci://ghcr.io/${OWNER}/helm-charts"
          CHART_REFERENCE="${OCI_REPOSITORY}/microservices-umbrella"
          EXISTING_DIR="$RUNNER_TEMP/existing-chart"
          mkdir -p "$EXISTING_DIR"

          if helm pull "$CHART_REFERENCE" --version "$CHART_VERSION" \
            --destination "$EXISTING_DIR" > /dev/null 2> "$RUNNER_TEMP/helm-pull.err"; then
            EXISTING_PACKAGE="$EXISTING_DIR/microservices-umbrella-${CHART_VERSION}.tgz"
            EXISTING_SHA256="$(sha256sum "$EXISTING_PACKAGE" | awk '{print $1}')"
            if [[ "$EXISTING_SHA256" != "$PACKAGE_SHA256" ]]; then
              echo "::error::Chart version ${CHART_VERSION} already exists in GHCR with different content. Chart releases are immutable; increment Chart.yaml version."
              exit 1
            fi
            echo "The identical chart version already exists; leaving the OCI artifact unchanged."
          else
            if ! grep -Eqi 'not found|manifest_unknown|404' "$RUNNER_TEMP/helm-pull.err"; then
              cat "$RUNNER_TEMP/helm-pull.err"
              echo "::error::Could not determine whether this chart version already exists. Refusing to publish without an authoritative registry check."
              exit 1
            fi
            helm push "$PACKAGE" "$OCI_REPOSITORY"
          fi

          VERIFY_DIR="$RUNNER_TEMP/verified-chart"
          mkdir -p "$VERIFY_DIR"
          helm pull "$CHART_REFERENCE" --version "$CHART_VERSION" --destination "$VERIFY_DIR"
          REMOTE_PACKAGE="$VERIFY_DIR/microservices-umbrella-${CHART_VERSION}.tgz"
          REMOTE_SHA256="$(sha256sum "$REMOTE_PACKAGE" | awk '{print $1}')"
          [[ "$REMOTE_SHA256" == "$PACKAGE_SHA256" ]] || {
            echo "::error::Downloaded OCI chart digest does not match the package produced by this release."
            exit 1
          }

          echo "reference=${CHART_REFERENCE}:${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${REMOTE_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Record immutable release coordinates
        shell: bash
        env:
          CHART_REFERENCE: ${{ steps.publish.outputs.reference }}
          CHART_SHA256: ${{ steps.publish.outputs.sha256 }}
        run: |
          {
            echo "### Production Helm chart published"
            echo "- OCI chart: \`${CHART_REFERENCE}\`"
            echo "- SHA-256: \`${CHART_SHA256}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
