name: Container Release Pipeline (Immutable SemVer)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Allowed Docker Hub release tag; exactly two versions are retained per service'
        required: true
        type: choice
        default: '1.1.0'
        options: ['1.0.0', '1.1.0']
      release-scope:
        description: 'Publish this version for all services, or only changed services'
        required: true
        type: choice
        options: [changed, all]
        default: all
      publish-only:
        description: 'Push and retain image versions without updating GitOps or deploying'
        required: true
        type: boolean
        default: false
      base-ref:
        description: 'Optional Git ref to compare against (manual dispatch only)'
        required: false
        type: string
  push:
    tags:
      - '1.0.0'
      - 'v1.0.0'
      - '1.1.0'
      - 'v1.1.0'

permissions:
  contents: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: "🏷️ Resolve Release Tag"
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Extract SemVer Tag
        id: extract-tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="${INPUT_VERSION#v}"
          elif [[ "$GH_REF" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            echo "::error::No valid SemVer release tag specified."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^(1\.0\.0|1\.1\.0)$ ]]; then
            echo "::error::Unsupported Docker Hub release '$TAG'. Only 1.0.0 and 1.1.0 are allowed."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target release tag: $TAG"

  detect-release-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          GH_SHA: ${{ github.sha }}
          RELEASE_SCOPE: ${{ inputs.release-scope || 'all' }}
          BASE_REF_INPUT: ${{ inputs.base-ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          base="$BASE_REF_INPUT"
          if [ -z "$base" ]; then
            if [[ "$GITHUB_EVENT_NAME" = push && "$GITHUB_REF" == refs/tags/* ]]; then
              current="${GITHUB_REF#refs/tags/}"
              base="$(git tag --merged "$GH_SHA" --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | grep -vx "$current" | head -n1 || true)"
            else
              base="$(git tag --merged "$GH_SHA" --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' | head -n1 || true)"
            fi
          fi
          if [ -z "$base" ]; then
            python_args=(--mode release --base-ref "$GH_SHA" --head-ref "$GH_SHA" --all)
          else
            python_args=(--mode release --base-ref "$base" --head-ref "$GH_SHA")
          fi
          if [ "$RELEASE_SCOPE" = all ]; then python_args+=(--all); fi
          selected="$(python3 scripts/release_service_detector.py "${python_args[@]}")"
          printf 'services=%s\n' "$selected" >> "$GITHUB_OUTPUT"

  release-ai-service:
    name: "🤖 Release ai-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'ai-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: ai-service
      service-type: python
      service-dir: ai-service
      context-dir: ai-service
      dockerfile-path: ai-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🛒 Core Spring Boot Microservices
  # ==========================================================
  release-products:
    name: "📦 Release products-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'products-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: products-service
      service-type: spring-boot
      service-dir: products-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-orders:
    name: "📦 Release orders-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'orders-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: orders-service
      service-type: spring-boot
      service-dir: orders-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-inventory:
    name: "📦 Release inventory-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'inventory-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: inventory-service
      service-type: spring-boot
      service-dir: inventory-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-notifications:
    name: "📦 Release notification-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'notification-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: notification-service
      service-type: spring-boot
      service-dir: notification-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # ⚡ Polyglot Saga Microservices (Go / NestJS / FastAPI)
  # ==========================================================
  release-payments:
    name: "💳 Release payments-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'payments-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: payments-service
      service-type: go
      service-dir: payments-service
      context-dir: payments-service
      dockerfile-path: payments-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-fulfillment:
    name: "🚚 Release fulfillment-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'fulfillment-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: fulfillment-service
      service-type: nestjs
      service-dir: fulfillment-service
      context-dir: fulfillment-service
      dockerfile-path: fulfillment-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-analytics:
    name: "📊 Release analytics-service"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'analytics-service')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: analytics-service
      service-type: python
      service-dir: analytics-service
      context-dir: analytics-service
      dockerfile-path: analytics-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🌐 Frontend React 19 SPA
  # ==========================================================
  release-frontend:
    name: "🌐 Release frontend"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'frontend')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: frontend
      service-type: react
      service-dir: frontend
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 📈 MLOps Demand Forecasting
  # ==========================================================
  release-demand-forecast:
    name: "📈 Release demand-forecast"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'demand-forecast')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: demand-forecast
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.forecast
      context-dir: mlops
      helm-values-key: mlops.forecast
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-mlops-training:
    name: "🧪 Release mlops-training"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'mlops-training')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlops-training
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.training
      context-dir: mlops
      helm-values-key: mlops.training
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-mlflow:
    name: "🧪 Release mlflow"
    needs: [resolve-tag, detect-release-services]
    if: contains(fromJSON(needs.detect-release-services.outputs.services), 'mlflow')
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlflow
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile
      context-dir: mlops
      helm-values-key: mlops.mlflow
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
      deploy-after-publish: ${{ inputs.publish-only != true }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🐙 GitOps Writeback: Align Helm Values via yq
  # ==========================================================
  gitops-writeback:
    name: "🐙 GitOps Writeback (yq Synchronizer)"
    needs:
      - resolve-tag
      - detect-release-services
      - release-products
      - release-orders
      - release-inventory
      - release-notifications
      - release-payments
      - release-fulfillment
      - release-analytics
      - release-frontend
      - release-demand-forecast
      - release-mlops-training
      - release-mlflow
      - release-ai-service
    runs-on: ubuntu-latest
    if: always() && inputs.publish-only != true && needs.resolve-tag.result == 'success' && needs.detect-release-services.result == 'success' && needs.detect-release-services.outputs.services != '[]' && !contains(toJSON(needs), 'failure')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && 'develop' || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: bash scripts/install-yq.sh v4.44.3

      - name: Synchronize Helm Values via yq
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.release-tag }}
          RELEASE_SERVICES: ${{ needs.detect-release-services.outputs.services }}
        run: |
          while IFS= read -r service; do
            case "$service" in
              products-service|orders-service|inventory-service|notification-service|payments-service|fulfillment-service|analytics-service|frontend|ai-service) expression=".\"${service}\".image.tag = strenv(RELEASE_TAG)" ;;
              demand-forecast) expression='.mlops.forecast.image.tag = strenv(RELEASE_TAG)' ;;
              mlops-training) expression='.mlops.training.image.tag = strenv(RELEASE_TAG)' ;;
              mlflow) expression='.mlops.mlflow.image.tag = strenv(RELEASE_TAG)' ;;
              *) echo "::error::Unexpected service in release selection: $service"; exit 1 ;;
            esac
            echo "Updating Helm image tag for $service to $RELEASE_TAG"
            for f in helm/values/values-*.yaml; do
              yq -i "$expression" "$f"
            done
          done < <(jq -r '.[]' <<< "$RELEASE_SERVICES")

      - name: Enforce 2-Version Docker Hub Retention Across Fleet (Active + Rollback)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'georgegxx' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          for repo in $(jq -r '.[]' <<< '${{ needs.detect-release-services.outputs.services }}'); do
            bash scripts/prune-dockerhub-tags.sh "georgegxx" "$repo"
          done

      - name: Commit & Push GitOps Release State
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.release-tag }}
          GH_REF_NAME: ${{ github.ref_name || 'develop' }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet helm/values/; then
            echo "No values changes to commit; values are already synchronized."
          else
            git commit -am "chore(release): synchronize GitOps values to version ${RELEASE_TAG} [skip ci]"
            TARGET_BRANCH="$GH_REF_NAME"
            if [ "$GH_EVENT" = push ]; then TARGET_BRANCH=develop; fi
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
