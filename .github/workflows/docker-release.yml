name: Container Release Pipeline (Immutable SemVer)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: "🏷️ Resolve Release Tag"
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Extract SemVer Tag
        id: extract-tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="${INPUT_VERSION#v}"
          elif [[ "$GH_REF" =~ ^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            echo "::error::No valid SemVer release tag specified."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer release tag '$TAG'. Expected format X.Y.Z (e.g., 1.0.0, 1.1.0)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target release tag: $TAG"

  # ==========================================================
  # 🛒 Core Spring Boot Microservices
  # ==========================================================
  release-products:
    name: "📦 Release products-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: products-service
      service-type: spring-boot
      service-dir: products-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-orders:
    name: "📦 Release orders-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: orders-service
      service-type: spring-boot
      service-dir: orders-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-inventory:
    name: "📦 Release inventory-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: inventory-service
      service-type: spring-boot
      service-dir: inventory-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-notifications:
    name: "📦 Release notification-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: notification-service
      service-type: spring-boot
      service-dir: notification-service
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # ⚡ Polyglot Saga Microservices (Go / NestJS / FastAPI)
  # ==========================================================
  release-payments:
    name: "💳 Release payments-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: payments-service
      service-type: go
      service-dir: payments-service
      context-dir: payments-service
      dockerfile-path: payments-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-fulfillment:
    name: "🚚 Release fulfillment-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: fulfillment-service
      service-type: nestjs
      service-dir: fulfillment-service
      context-dir: fulfillment-service
      dockerfile-path: fulfillment-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-analytics:
    name: "📊 Release analytics-service"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: analytics-service
      service-type: python
      service-dir: analytics-service
      context-dir: analytics-service
      dockerfile-path: analytics-service/Dockerfile
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🌐 Frontend React 19 SPA
  # ==========================================================
  release-frontend:
    name: "🌐 Release frontend"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: frontend
      service-type: react
      service-dir: frontend
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 📈 MLOps Demand Forecasting
  # ==========================================================
  release-demand-forecast:
    name: "📈 Release demand-forecast"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: demand-forecast
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.forecast
      context-dir: mlops
      helm-values-key: mlops.forecast
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-mlops-training:
    name: "🧪 Release mlops-training"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlops-training
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.training
      context-dir: mlops
      helm-values-key: mlops.training
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  release-mlflow:
    name: "🧪 Release mlflow"
    needs: resolve-tag
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlflow
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile
      context-dir: mlops
      helm-values-key: mlops.mlflow
      image-tag: ${{ needs.resolve-tag.outputs.release-tag }}
      publish-to-registry: true
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🐙 GitOps Writeback: Align Helm Values via yq
  # ==========================================================
  gitops-writeback:
    name: "🐙 GitOps Writeback (yq Synchronizer)"
    needs:
      - resolve-tag
      - release-products
      - release-orders
      - release-inventory
      - release-notifications
      - release-payments
      - release-fulfillment
      - release-analytics
      - release-frontend
      - release-demand-forecast
      - release-mlops-training
      - release-mlflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name || 'develop' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: bash scripts/install-yq.sh v4.44.3

      - name: Synchronize Helm Values via yq
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.release-tag }}
        run: |
          TAG="$RELEASE_TAG"
          echo "Synchronizing GitOps manifests to release tag: $TAG"
          for f in helm/values/values-*.yaml; do
            yq -i "(.. | select(has(\"image\")) | select((.image.repository == \"georgegxx/*\" or .image.repository == \"*/*-service\" or .image.repository == \"*/frontend\" or .image.repository == \"*/mlflow\" or .image.repository == \"*/mlops-training\" or .image.repository == \"*/demand-forecast\") and .image.repository != \"*cosmo/router*\") | .image.tag) = \"$TAG\"" "$f"
          done

      - name: Enforce 2-Version Docker Hub Retention Across Fleet (Active + Rollback)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'georgegxx' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          for repo in products-service orders-service inventory-service notification-service payments-service fulfillment-service analytics-service frontend demand-forecast mlops-training mlflow; do
            bash scripts/prune-dockerhub-tags.sh "georgegxx" "$repo" 2
          done

      - name: Commit & Push GitOps Release State
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.release-tag }}
          GH_REF_NAME: ${{ github.ref_name || 'develop' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet helm/values/; then
            echo "No values changes to commit; values are already synchronized."
          else
            git commit -am "chore(release): synchronize GitOps values to version ${RELEASE_TAG} [skip ci]"
            git push origin "HEAD:${GH_REF_NAME}"
          fi
