name: Fulfillment Service CI/CD

on:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'fulfillment-service/**'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-fulfillment.yml'
  pull_request:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'fulfillment-service/**'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-fulfillment.yml'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Explicit SemVer release tag to publish (e.g. 1.1.0; required when publish-to-registry is true)'
        required: false
        type: string
        default: ''
      publish-to-registry:
        description: 'Publish release image to Docker Registry (requires explicit SemVer image-tag)'
        required: false
        type: boolean
        default: false

concurrency:
  group: fulfillment-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: fulfillment-service
      service-type: nestjs
      service-dir: fulfillment-service
      context-dir: fulfillment-service
      dockerfile-path: fulfillment-service/Dockerfile
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry == true && inputs.image-tag != '' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
