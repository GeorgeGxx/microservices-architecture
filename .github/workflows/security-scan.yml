name: Microservices Architecture Security & Vulnerability Scan

on:
  workflow_call:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - '**/pom.xml'
      - '**/go.mod'
      - '**/go.sum'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/requirements*.txt'
      - '**/poetry.lock'
      - '**/uv.lock'
      - '**/Dockerfile*'
      - '.snyk'
      - '.trivyignore'
      - '.gitleaksignore'
      - 'devsecops/**'
      - 'deploy/helm/**'
      - 'deploy/kubernetes/**'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 0 * * 0' # Weekly scan every Sunday
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================================
  # JOB 1: Trivy Vulnerability & Secret Scan (Filesystem / Dependencies)
  # ==========================================================
  trivy-scan:
    name: 🛡️ 1. Trivy Vulnerability & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21 and cache Maven dependencies
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve Maven dependencies before Trivy analysis
        run: mvn -B -ntp -DskipTests org.apache.maven.plugins:maven-dependency-plugin:3.11.0:resolve

      - name: Run Trivy Vulnerability Scanner (SARIF output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          trivy-config: 'devsecops/compliance/trivy/trivy-sarif.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Report dependency vulnerabilities (all severities)
        run: |
          trivy fs --config devsecops/compliance/trivy/trivy.yaml \
            --ignorefile devsecops/compliance/trivy/.trivyignore \
            --scanners vuln --include-dev-deps \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false --exit-code 0 .

      - name: Block fixable high and critical dependency vulnerabilities
        run: |
          trivy fs --config devsecops/compliance/trivy/trivy.yaml \
            --ignorefile devsecops/compliance/trivy/.trivyignore \
            --scanners vuln --include-dev-deps \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  # ==========================================================
  # JOB 2: Gitleaks Repository-wide Secret Detection (Parallel)
  # ==========================================================
  gitleaks-scan:
    name: 🔑 2. Gitleaks Secret Scanning Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: devsecops/sast/gitleaks/.gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  # ==========================================================
  # JOB 3: Trivy Repository-wide IaC Misconfiguration Scan (Parallel)
  # ==========================================================
  trivy-config-scan:
    name: 🏗️ 3. Trivy IaC Misconfiguration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan Terraform, Kubernetes, Helm and Dockerfile configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: 'v0.76.1'
          scan-ref: .
          trivy-config: devsecops/compliance/trivy/trivy-sarif.yaml
          format: sarif
          output: trivy-config-results.sarif
          exit-code: '0'

      - name: Upload Trivy IaC Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

  # ==========================================================
  # JOB 4: Supply Chain Cryptographic Provenance Verification
  # ==========================================================
  cosign-verify:
    name: 🔏 4. Sigstore Cosign Supply-Chain Provenance Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Cosign
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 -o cosign
          sudo install cosign /usr/local/bin/cosign
          cosign version

      - name: Verify Cryptographic Supply-Chain Provenance Manifest
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-blob \
            --key devsecops/compliance/cosign/cosign.pub \
            --bundle devsecops/compliance/cosign/supply-chain-manifest.sigstore.json \
            --insecure-ignore-tlog=true \
            devsecops/compliance/cosign/supply-chain-manifest.json

  # ==========================================================
  # JOB 5: Semgrep Repository-Wide Static Application Security Testing (SAST)
  # ==========================================================
  semgrep-scan:
    name: 🔍 5. Semgrep Repository-Wide SAST Audit (Pinned v1.110.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep SAST with Centralized Policy Ruleset
        env:
          SEMGREP_VERSION: "1.110.0"
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "returntocorp/semgrep:${SEMGREP_VERSION}" \
            semgrep scan \
            --config devsecops/sast/semgrep/semgrep-rules.yaml \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep-results.sarif

      - name: Upload Semgrep Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'
