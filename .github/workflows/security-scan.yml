name: Microservices Architecture Security & Vulnerability Scan

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan every Sunday
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================================
  # JOB 1: Trivy Vulnerability & Secret Scan (Filesystem / Dependencies)
  # ==========================================================
  trivy-scan:
    name: 🛡️ 1. Trivy Vulnerability & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Trivy Vulnerability Scanner (SARIF output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          trivy-config: 'devsecops/compliance/trivy/trivy.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Block on fixed CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          trivy-config: 'devsecops/compliance/trivy/trivy.yaml'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Report HIGH vulnerability findings (advisory mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          version: 'v0.76.1'
          scan-ref: '.'
          trivy-config: 'devsecops/compliance/trivy/trivy.yaml'
          format: 'table'
          severity: 'HIGH'
          ignore-unfixed: true
          exit-code: '0'

  # ==========================================================
  # JOB 2: Gitleaks Repository-wide Secret Detection (Parallel)
  # ==========================================================
  gitleaks-scan:
    name: 🔑 2. Gitleaks Secret Scanning Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: devsecops/sast/gitleaks/.gitleaks.toml

  # ==========================================================
  # JOB 3: Trivy Repository-wide IaC Misconfiguration Scan (Parallel)
  # ==========================================================
  trivy-config-scan:
    name: 🏗️ 3. Trivy IaC Misconfiguration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scan Terraform, Kubernetes, Helm and Dockerfile configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: 'v0.76.1'
          scan-ref: .
          trivy-config: devsecops/compliance/trivy/trivy.yaml
          format: sarif
          output: trivy-config-results.sarif
          exit-code: '0'

      - name: Upload Trivy IaC Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'
