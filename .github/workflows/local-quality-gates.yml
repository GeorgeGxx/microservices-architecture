on:
  workflow_dispatch:
  # pull_request:
  #   branches: [develop, staging, main, master]
  #   paths:
  #     - 'terraform/**'
  #     - 'compose.yaml'
  #     - 'scripts/testing/**'
  #     - 'observability/**'
