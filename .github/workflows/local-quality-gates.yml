name: Local Stack and Infrastructure Quality Gates

on:
  push:
    branches: [develop, staging, master]
  pull_request:
    branches: [develop, staging, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static:
    name: Terraform format and validation (no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - terraform/environments/local-minikube
          - terraform/environments/aws
          - terraform/environments/azure
          - terraform/environments/gcp
          - terraform/examples/lifecycle
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
      - name: Check formatting
        run: terraform fmt -check -recursive terraform/
      - name: Initialize without remote backend
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate -no-color

  iac-security:
    name: Trivy IaC configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: 'v0.76.1'
          scan-ref: terraform/
          trivy-config: devsecops/compliance/trivy/trivy.yaml
          format: table
          exit-code: '0'

  helm-policy:
    name: Helm lint, workload policy and policy regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm 4
        run: bash scripts/install-helm4.sh v4.3.1
      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest
          conftest --version
      - name: Lint umbrella and service charts
        shell: bash
        run: |
          set -euo pipefail
          helm lint helm/microservices-umbrella --values helm/values/values-minikube.yaml
          helm lint helm/microservices-umbrella --values helm/values/values-eks-staging.yaml
          helm lint helm/microservices-umbrella --values helm/values/values-eks-prod.yaml
          helm lint helm/microservices-umbrella --values helm/values/values-aks-staging.yaml
          helm lint helm/microservices-umbrella --values helm/values/values-aks-prod.yaml
          helm lint helm/microservices-umbrella --values helm/values/values-gke-staging.yaml
          helm lint helm/microservices-umbrella --values helm/values/values-gke-prod.yaml
          for chart in helm/charts/*/; do helm lint "$chart"; done
      - name: Test policy fixtures
        shell: bash
        run: |
          set -euo pipefail
          conftest test devsecops/policies/conftest/tests/valid-workloads.yaml --policy devsecops/policies/conftest
          if conftest test devsecops/policies/conftest/tests/invalid-workloads.yaml --policy devsecops/policies/conftest > "$RUNNER_TEMP/expected-denials.txt" 2>&1; then
            echo "::error::Invalid workload fixtures unexpectedly passed the Kubernetes policy."
            exit 1
          fi
          grep -q "is privileged" "$RUNNER_TEMP/expected-denials.txt"
          grep -q "mutable latest" "$RUNNER_TEMP/expected-denials.txt"
          grep -q "default ServiceAccount" "$RUNNER_TEMP/expected-denials.txt"
          cat "$RUNNER_TEMP/expected-denials.txt"
      - name: Render and enforce policies for Minikube, staging and production
        shell: bash
        run: |
          set -euo pipefail
          for environment in minikube staging prod; do
            args=(--namespace dev)
            case "$environment" in
              minikube) args+=(--values helm/values/values-minikube.yaml) ;;
              staging) args+=(--namespace staging --values helm/values/values-eks-staging.yaml) ;;
              prod) args+=(--namespace production --values helm/values/values-eks-prod.yaml) ;;
            esac
            helm template microservices helm/microservices-umbrella "${args[@]}" > "$RUNNER_TEMP/${environment}-manifests.yaml"
            conftest test "$RUNNER_TEMP/${environment}-manifests.yaml" --policy devsecops/policies/conftest
          done
          conftest test k8s/common/bcdr/database-backup-cronjob.yaml --policy devsecops/policies/conftest

  local-config-and-tests:
    name: Compose config, Python checks and observability assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Compile Python testing tools
        run: python -m compileall -q scripts/testing
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = $null
          $scripts = @(
            'platform-minikube.ps1',
            'platform-multicloud.ps1',
            'scripts/bootstrap-keycloak.ps1',
            'scripts/manage-cloudflare-tunnels.ps1',
            'scripts/bcdr-simulation.ps1',
            'mlops/training.ps1'
          )
          foreach ($path in $scripts) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List *; exit 1 }
          }
      - name: Validate Grafana dashboard JSON
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('observability/grafana/dashboards').glob('*.json')]"
      - name: Validate Draw.io architecture diagram XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('docs/Diagrams.drawio')"
      - name: Validate Prometheus config and rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml --lint=all
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/prometheus-rules.yml
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
