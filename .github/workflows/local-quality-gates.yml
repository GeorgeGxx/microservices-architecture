name: Local Stack and Infrastructure Quality Gates

on:
  workflow_call:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'terraform/**'
      - 'deploy/helm/**'
      - 'deploy/kubernetes/**'
      - 'argocd/**'
      - 'devsecops/policies/conftest/**'
      - 'scripts/install-helm4.sh'
      - '.github/workflows/_service-ci-cd-template.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static:
    name: Terraform format and validation (no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - terraform/environments/local-minikube
          - terraform/environments/aws
          - terraform/examples/lifecycle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.2
      - name: Check formatting
        run: terraform fmt -check -recursive terraform/
      - name: Initialize without remote backend
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate -no-color

  iac-security:
    name: Trivy IaC configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan Terraform configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          version: 'v0.76.1'
          scan-ref: terraform/
          trivy-config: devsecops/compliance/trivy/trivy.yaml
          format: table
          exit-code: '0'

  helm-policy:
    name: Helm lint, workload policy and policy regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Helm 4
        run: bash scripts/install-helm4.sh v4.3.1
      - name: Install Conftest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo install conftest /usr/local/bin/conftest
          conftest --version
      - name: Lint umbrella and service charts
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/microservices-umbrella --values deploy/helm/values/values-minikube.yaml
          helm lint deploy/helm/microservices-umbrella --values deploy/helm/values/values-eks-staging.yaml
          helm lint deploy/helm/microservices-umbrella --values deploy/helm/values/values-eks-prod.yaml
          for chart in deploy/helm/charts/*/; do helm lint "$chart"; done
      - name: Test policy fixtures
        shell: bash
        run: |
          set -euo pipefail
          conftest test devsecops/policies/conftest/tests/valid-workloads.yaml --policy devsecops/policies/conftest
          if conftest test devsecops/policies/conftest/tests/invalid-workloads.yaml --policy devsecops/policies/conftest > "$RUNNER_TEMP/expected-denials.txt" 2>&1; then
            echo "::error::Invalid workload fixtures unexpectedly passed the Kubernetes policy."
            exit 1
          fi
          grep -q "is privileged" "$RUNNER_TEMP/expected-denials.txt"
          grep -q "mutable latest" "$RUNNER_TEMP/expected-denials.txt"
          grep -q "default ServiceAccount" "$RUNNER_TEMP/expected-denials.txt"
          cat "$RUNNER_TEMP/expected-denials.txt"
      - name: Render and enforce policies for Minikube, staging and production
        shell: bash
        run: |
          set -euo pipefail
          for environment in minikube staging prod; do
            args=(--namespace dev)
            case "$environment" in
              minikube) args+=(--values deploy/helm/values/values-minikube.yaml) ;;
              staging) args+=(--namespace staging --values deploy/helm/values/values-eks-staging.yaml) ;;
              prod) args+=(--namespace production --values deploy/helm/values/values-eks-prod.yaml) ;;
            esac
            helm template microservices deploy/helm/microservices-umbrella "${args[@]}" > "$RUNNER_TEMP/${environment}-manifests.yaml"
            conftest test "$RUNNER_TEMP/${environment}-manifests.yaml" --policy devsecops/policies/conftest
          done
          conftest test deploy/kubernetes/common/bcdr/database-backup-cronjob.yaml --policy devsecops/policies/conftest
          conftest test deploy/kubernetes/minikube/infra/backstage.yaml --policy devsecops/policies/conftest
      - name: Validate Argo CD 3.6.1 Helm values rendering (Chart 10.14.0)
        shell: bash
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm template argocd argo/argo-cd --version 10.14.0 -n argocd -f deploy/helm/values/argocd-minikube.yaml > /dev/null
          helm template argocd argo/argo-cd --version 10.14.0 -n argocd -f deploy/helm/values/argocd-prod.yaml > /dev/null

  local-config-and-tests:
    name: Compose config, Python checks and observability assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe

          env_file = Path(".env")
          lines = env_file.read_text(encoding="utf-8").splitlines()
          required = {
              "KEYCLOAK_ADMIN_PASSWORD",
              "POSTGRES_PASSWORD",
              "REDIS_PASSWORD",
              "GF_SECURITY_ADMIN_PASSWORD",
              "JWT_SECRET",
              "VAULT_TOKEN",
              "GLITCHTIP_DB_PASSWORD",
              "GLITCHTIP_SECRET_KEY",
              "GLITCHTIP_ADMIN_PASSWORD",
          }
          for index, line in enumerate(lines):
              key, separator, _ = line.partition("=")
              if separator and key in required:
                  lines[index] = f"{key}={token_urlsafe(32)}"
          env_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          docker compose config --quiet
      - name: Compile Python testing tools
        run: python -m compileall -q scripts/testing
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = $null
          $scripts = @(
            'platform-minikube.ps1',
            'scripts/bootstrap-keycloak.ps1',
            'scripts/manage-cloudflare-tunnels.ps1',
            'scripts/bcdr-simulation.ps1'
          )
          foreach ($path in $scripts) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List *; exit 1 }
          }
      - name: Validate Grafana dashboard JSON
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('observability/grafana/dashboards').glob('*.json')]"
      - name: Validate Backstage IDP Catalog, Templates and Semgrep Rules YAML
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml, glob; files = ['catalog-info.yaml', 'mkdocs.yml', 'devsecops/sast/semgrep/semgrep-rules.yaml'] + glob.glob('backstage/**/*.yaml', recursive=True); [list(yaml.safe_load_all(open(f, encoding='utf-8'))) for f in files]; print(f'Verified {len(files)} Backstage & Semgrep YAML files')"
      - name: Validate Draw.io architecture diagram XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('docs/Diagrams.drawio')"
      - name: Validate Prometheus config and rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml --lint=all
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/prometheus-rules.yml
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
