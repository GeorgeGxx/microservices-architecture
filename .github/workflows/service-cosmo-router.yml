name: Cosmo Router Federation CI

on:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'cosmo-router/**'
      - 'deploy/helm/charts/cosmo-router/**'
      - 'deploy/helm/microservices-umbrella/**'
  workflow_dispatch:

concurrency:
  group: cosmo-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compose Federation v2 and lint Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Compose static Cosmo execution config
        run: |
          npx --yes wgc@0.133.3 router compose --input cosmo-router/supergraph.yaml --out cosmo-router/execution-config.json
          mkdir -p deploy/helm/charts/cosmo-router/files
          cp cosmo-router/execution-config.json deploy/helm/charts/cosmo-router/files/execution-config.json

      - name: Install Helm 4
        run: bash scripts/install-helm4.sh v4.3.1

      - name: Resolve local Helm dependencies and lint
        run: |
          helm dependency update deploy/helm/microservices-umbrella
          helm lint deploy/helm/charts/cosmo-router
          helm lint deploy/helm/microservices-umbrella --values deploy/helm/values/values-minikube.yaml
