name: Notification Service CI/CD

on:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'notification-service/**'
      - 'pom.xml'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-notifications.yml'
  pull_request:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'notification-service/**'
      - 'pom.xml'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-notifications.yml'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Explicit image tag to publish (leave empty for git sha or semver from tag)'
        required: false
        type: string
        default: ''
      publish-to-registry:
        description: 'Publish image to Docker Registry'
        required: false
        type: boolean
        default: true

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: notification-service
      service-type: spring-boot
      service-dir: notification-service
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry != false }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
