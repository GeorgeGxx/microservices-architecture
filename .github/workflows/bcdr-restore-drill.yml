name: Isolated PostgreSQL BCDR Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 1 * *'

permissions:
  contents: read

concurrency:
  group: bcdr-restore-drill
  cancel-in-progress: false

jobs:
  postgres-restore-drill:
    name: Backup and restore synthetic PostgreSQL data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start isolated PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name bcdr-restore-drill \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=drill-only-password \
            postgres:18
          attempts_remaining=60
          while [ "$attempts_remaining" -gt 0 ]; do
            if docker exec bcdr-restore-drill pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            attempts_remaining=$((attempts_remaining - 1))
            sleep 2
          done
          docker logs bcdr-restore-drill
          exit 1
      - name: Verify backup and real restore
        shell: bash
        run: |
          set -euo pipefail
          docker exec bcdr-restore-drill mkdir -p /workspace/scripts/prod
          docker cp scripts/prod/. bcdr-restore-drill:/workspace/scripts/prod/
          docker exec --env PGPASSWORD=drill-only-password --workdir /workspace/scripts/prod \
            bcdr-restore-drill bash bcdr-restore-drill.sh
      - name: Remove isolated database container
        if: always()
        run: docker rm --force bcdr-restore-drill 2>/dev/null || true
