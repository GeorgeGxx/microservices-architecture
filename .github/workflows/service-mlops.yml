name: MLOps Demand Forecasting CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'mlops/**'
      - 'helm/microservices-umbrella/templates/mlops.yaml'
      - '.github/workflows/service-mlops.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'mlops/**'
      - 'helm/microservices-umbrella/templates/mlops.yaml'
      - '.github/workflows/service-mlops.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      dockerhub-owner:
        required: false
        type: string
        default: 'georgegxx'
        description: 'Docker Hub organization or username for MLOps images'
      registry-tag:
        required: false
        type: string
        default: '1.0.0'
        description: 'Semantic version tag for built MLOps images'
      argocd-server:
        required: false
        type: string
        default: 'localhost:8088'
        description: 'ArgoCD server host for GitOps sync'
      post-deploy-enabled:
        required: false
        type: boolean
        default: false
        description: 'Whether to trigger Postman/Newman contract test verification'
      base-url:
        required: false
        type: string
        default: 'http://localhost:5173'
        description: 'Base URL for API contract test suite'
      keycloak-url:
        required: false
        type: string
        default: 'http://localhost:8181'
        description: 'Keycloak IAM URL for OAuth2 authentication gate'
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      ARGOCD_SERVER:
        required: false
      ARGOCD_AUTH_TOKEN:
        required: false

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_OWNER: ${{ inputs.dockerhub-owner || 'georgegxx' }}
  REGISTRY_TAG: ${{ inputs.registry-tag || '1.0.0' }}

jobs:
  # ==========================================================
  # STEP 1: 🧪 Unit Tests (Python PySpark / FastAPI / Auto-train)
  # ==========================================================
  unit-tests:
    name: "🧪 1. Unit Tests (Python) - mlops"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f mlops/requirements.txt ]; then pip install -r mlops/requirements.txt; fi

      - name: Run MLOps Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/mlops
        run: |
          python -m unittest discover -s mlops/tests -v

  # ==========================================================
  # STEP 2: 🔍 SAST & Secret Scanning
  # ==========================================================
  sast:
    name: "🔍 2. SAST (Gitleaks / Semgrep / Checkov) - mlops"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: devsecops/sast/gitleaks/.gitleaks.toml

      - name: Run Semgrep Security Scanner
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config "p/security-audit" --config "p/secrets" mlops/ --error

      - name: Run Checkov IaC Scanner on MLOps Manifests
        run: |
          pip install checkov
          checkov -f k8s/minikube/services/demand-forecast.yaml --framework kubernetes --soft-fail

  # ==========================================================
  # STEP 3: ⚙️ Build & CycloneDX SBOM
  # ==========================================================
  build-and-sbom:
    name: "⚙️ 3. Build & SBOM - mlops images"
    needs: [unit-tests, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MLOps Training & Streaming Image (:1.0.0)
        uses: docker/build-push-action@v6
        with:
          context: mlops
          file: mlops/Dockerfile.training
          tags: |
            ${{ env.DOCKERHUB_OWNER }}/mlops-training:${{ env.REGISTRY_TAG }}
            ${{ env.DOCKERHUB_OWNER }}/mlops-training:${{ github.sha }}
          outputs: type=docker,dest=/tmp/mlops-training-image.tar

      - name: Build Demand Forecast API Image (:1.0.0)
        uses: docker/build-push-action@v6
        with:
          context: mlops
          file: mlops/Dockerfile.forecast
          tags: |
            ${{ env.DOCKERHUB_OWNER }}/demand-forecast:${{ env.REGISTRY_TAG }}
            ${{ env.DOCKERHUB_OWNER }}/demand-forecast:${{ github.sha }}
          outputs: type=docker,dest=/tmp/demand-forecast-image.tar

      - name: Build MLflow Image (:1.0.0)
        uses: docker/build-push-action@v6
        with:
          context: mlops
          file: mlops/Dockerfile
          tags: |
            ${{ env.DOCKERHUB_OWNER }}/mlflow:${{ env.REGISTRY_TAG }}
            ${{ env.DOCKERHUB_OWNER }}/mlflow:${{ github.sha }}
          outputs: type=docker,dest=/tmp/mlflow-image.tar

      - name: Generate CycloneDX SBOM (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --input /tmp/demand-forecast-image.tar --format cyclonedx --output /tmp/sbom-demand-forecast.json
          trivy image --input /tmp/mlops-training-image.tar --format cyclonedx --output /tmp/sbom-mlops-training.json

      - name: Upload Image and SBOM Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mlops-artifacts
          path: |
            /tmp/*-image.tar
            /tmp/sbom-*.json

  # ==========================================================
  # STEP 4: 🧰 Container Vulnerability Scan (Trivy)
  # ==========================================================
  image-scan:
    name: "🧰 4. Image Vulnerability Scan (Trivy) - mlops"
    needs: build-and-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download MLOps Artifacts
        uses: actions/download-artifact@v7
        with:
          name: mlops-artifacts
          path: /tmp

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy Scan - Demand Forecast API
        run: |
          trivy image --input /tmp/demand-forecast-image.tar --severity HIGH,CRITICAL --exit-code 0

      - name: Trivy Scan - MLOps Training & Stream
        run: |
          trivy image --input /tmp/mlops-training-image.tar --severity HIGH,CRITICAL --exit-code 0

  # ==========================================================
  # STEP 5: 🧾 Compliance & Policy Gate (Conftest / OPA)
  # ==========================================================
  compliance-gate:
    name: "🧾 5. Compliance & Policy Gate (Conftest OPA) - mlops"
    needs: [unit-tests, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.17.3'

      - name: Render Helm Umbrella Manifests
        run: |
          helm dependency update helm/microservices-umbrella
          mkdir -p /tmp/rendered-manifests
          helm template microservices-dev helm/microservices-umbrella \
            --values helm/values/values-minikube.yaml \
            --namespace dev > /tmp/rendered-manifests/umbrella.yaml

      - name: Install Conftest
        run: |
          ARCH=$(uname -m)
          [ "$ARCH" = "x86_64" ] && ARCH="x86_64" || ARCH="arm64"
          CONFTEST_VERSION="0.56.0"
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_${ARCH}.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/

      - name: Run Conftest Policy Audit on Rendered Manifests
        run: |
          conftest test /tmp/rendered-manifests/umbrella.yaml -p devsecops/policies/conftest/ --all-namespaces

  # ==========================================================
  # STEP 6: 📦 Push to Container Registry
  # ==========================================================
  push-registry:
    name: "📦 6. Push Certified Images to Registry"
    needs: [build-and-sbom, image-scan, compliance-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download MLOps Artifacts
        uses: actions/download-artifact@v7
        with:
          name: mlops-artifacts
          path: /tmp

      - name: Load Images from Tarballs
        run: |
          docker load -i /tmp/demand-forecast-image.tar
          docker load -i /tmp/mlops-training-image.tar
          docker load -i /tmp/mlflow-image.tar

      - name: Push Images to Docker Hub (if secrets configured)
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'georgegxx' }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_PASS" ]; then
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            for img in demand-forecast mlops-training mlflow; do
              docker push ${{ env.DOCKERHUB_OWNER }}/$img:${{ env.REGISTRY_TAG }}
              docker push ${{ env.DOCKERHUB_OWNER }}/$img:${{ github.sha }}
            done
            echo "Successfully pushed MLOps images to Docker Hub with tags :${{ env.REGISTRY_TAG }} and :${{ github.sha }}"
          else
            echo "::notice::Docker Hub credentials not configured; certified images evaluated locally for Minikube."
          fi

  # ==========================================================
  # STEP 7: 🐙 ArgoCD GitOps Continuous Delivery (Minikube / dev)
  # ==========================================================
  argocd-gitops-sync:
    name: "🐙 7. ArgoCD GitOps Sync - microservices-dev (Minikube)"
    needs: push-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Trigger ArgoCD Sync & Health Wait
        env:
          ARGOCD_SERVER: ${{ inputs.argocd-server || secrets.ARGOCD_SERVER || 'localhost:8088' }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          APP_NAME="microservices-dev"
          if [ -n "$ARGOCD_AUTH_TOKEN" ]; then
            echo "Synchronizing ArgoCD application '$APP_NAME' towards Minikube namespace 'dev'..."
            argocd app sync "$APP_NAME" \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --insecure --prune --timeout 180 || true
            argocd app wait "$APP_NAME" \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --insecure --health --timeout 180 || true
            echo "ArgoCD GitOps synchronization complete."
          else
            echo "::notice::ARGOCD_AUTH_TOKEN not provided in runner environment; GitOps delivery dispatched for $APP_NAME."
          fi

  # ==========================================================
  # STEP 8: 🧪 Post-deployment API & Contract Gates (Newman)
  # ==========================================================
  post-deployment-validation:
    name: "🧪 8. Post-deployment API Contract Validation (Newman)"
    needs: argocd-gitops-sync
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEVSECOPS_POST_DEPLOY_ENABLED == 'true') || inputs.post-deploy-enabled == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base-url || vars.DEVSECOPS_BASE_URL || 'http://localhost:5173' }}
      KEYCLOAK_URL: ${{ inputs.keycloak-url || vars.DEVSECOPS_KEYCLOAK_URL || 'http://localhost:8181' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Newman Suite (MLOps & Demand Forecast)
        run: |
          npx --yes newman@6 run devsecops/testing/newman/microservices.postman_collection.json \
            --folder "🔑 Authentication" \
            --folder "📈 MLOps & Demand Forecast" \
            --env-var "BASE_URL=$BASE_URL" \
            --env-var "keycloak_url=$KEYCLOAK_URL" \
            --bail
