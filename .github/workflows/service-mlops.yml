name: MLOps Demand Forecasting CI/CD

on:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'mlops/**'
  pull_request:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'mlops/**'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Explicit SemVer release tag to publish (e.g. 1.1.0; required when publish-to-registry is true)'
        required: false
        type: string
        default: ''
      publish-to-registry:
        description: 'Publish release image to Docker Registry (requires explicit SemVer image-tag)'
        required: false
        type: boolean
        default: false
      workload:
        description: 'Run one MLOps workload or all three; code pushes select by changed files'
        required: true
        type: choice
        options:
          - all
          - demand-forecast
          - mlops-training
          - mlflow
        default: all

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed MLOps workloads
    runs-on: ubuntu-latest
    outputs:
      demand-forecast: ${{ contains(fromJSON(steps.workloads.outputs.services), 'demand-forecast') }}
      mlops-training: ${{ contains(fromJSON(steps.workloads.outputs.services), 'mlops-training') }}
      mlflow: ${{ contains(fromJSON(steps.workloads.outputs.services), 'mlflow') }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Select only affected workloads
        id: workloads
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_WORKLOAD: ${{ inputs.workload || 'all' }}
        run: |
          services="$(bash scripts/detect-mlops-workloads.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" "$REQUESTED_WORKLOAD")"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Selected MLOps workloads: $services"

  # ==========================================================
  # 📈 Service Pipeline 1: Demand Forecast API
  # ==========================================================
  demand-forecast:
    name: "📈 Demand Forecast API Pipeline"
    needs: detect-changes
    if: needs.detect-changes.outputs.demand-forecast == 'true'
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: demand-forecast
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.forecast
      context-dir: mlops
      helm-values-key: mlops.forecast
      post-deploy-enabled: false
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry == true && inputs.image-tag != '' }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🧪 Service Pipeline 2: MLOps Training & Streaming Engine
  # ==========================================================
  mlops-training:
    name: "🧪 MLOps Training Engine Pipeline"
    needs: detect-changes
    if: needs.detect-changes.outputs.mlops-training == 'true'
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlops-training
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.training
      context-dir: mlops
      helm-values-key: mlops.training
      post-deploy-enabled: false
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry == true && inputs.image-tag != '' }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit

  # ==========================================================
  # 🧪 Service Pipeline 3: MLflow Tracking Server
  # ==========================================================
  mlflow:
    name: "🧪 MLflow Tracking Server Pipeline"
    needs: detect-changes
    if: needs.detect-changes.outputs.mlflow == 'true'
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlflow
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile
      context-dir: mlops
      helm-values-key: mlops.mlflow
      post-deploy-enabled: false
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry == true && inputs.image-tag != '' }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit
