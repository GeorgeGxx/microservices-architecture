name: MLOps Demand Forecasting CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'mlops/**'
      - '.github/workflows/service-mlops.yml'
      - '.github/workflows/_service-ci-cd-template.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'mlops/**'
      - '.github/workflows/service-mlops.yml'
      - '.github/workflows/_service-ci-cd-template.yml'
  workflow_dispatch:

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 📈 Service Pipeline 1: Demand Forecast API
  # ==========================================================
  demand-forecast:
    name: "📈 Demand Forecast API Pipeline"
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: demand-forecast
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.forecast
      context-dir: mlops
      helm-values-key: mlops.forecast
      post-deploy-enabled: true
      base-url: 'http://localhost:5173'
      keycloak-url: 'http://localhost:8181'
    secrets: inherit

  # ==========================================================
  # 🧪 Service Pipeline 2: MLOps Training & Streaming Engine
  # ==========================================================
  mlops-training:
    name: "🧪 MLOps Training Engine Pipeline"
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlops-training
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.training
      context-dir: mlops
      helm-values-key: mlops.training
      post-deploy-enabled: false
    secrets: inherit
