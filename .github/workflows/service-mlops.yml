name: MLOps Demand Forecasting CI/CD

on:
  push:
    branches: [ develop, staging, prod ]
    paths:
      - 'mlops/**'
      - '.github/workflows/service-mlops.yml'
      - '.github/workflows/_service-ci-cd-template.yml'
  pull_request:
    branches: [ develop, staging, prod ]
    paths:
      - 'mlops/**'
      - '.github/workflows/service-mlops.yml'
      - '.github/workflows/_service-ci-cd-template.yml'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Explicit image tag to publish (leave empty for git sha or semver from tag)'
        required: false
        type: string
        default: ''
      publish-to-registry:
        description: 'Publish image to Docker Registry'
        required: false
        type: boolean
        default: true

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 📈 Service Pipeline 1: Demand Forecast API
  # ==========================================================
  demand-forecast:
    name: "📈 Demand Forecast API Pipeline"
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: demand-forecast
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.forecast
      context-dir: mlops
      helm-values-key: mlops.forecast
      post-deploy-enabled: false
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry != false }}
    secrets: inherit

  # ==========================================================
  # 🧪 Service Pipeline 2: MLOps Training & Streaming Engine
  # ==========================================================
  mlops-training:
    name: "🧪 MLOps Training Engine Pipeline"
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlops-training
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile.training
      context-dir: mlops
      helm-values-key: mlops.training
      post-deploy-enabled: false
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry != false }}
    secrets: inherit

  # ==========================================================
  # 🧪 Service Pipeline 3: MLflow Tracking Server
  # ==========================================================
  mlflow:
    name: "🧪 MLflow Tracking Server Pipeline"
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: mlflow
      service-type: python
      service-dir: mlops
      dockerfile-path: mlops/Dockerfile
      context-dir: mlops
      helm-values-key: mlops.mlflow
      post-deploy-enabled: false
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry != false }}
    secrets: inherit
