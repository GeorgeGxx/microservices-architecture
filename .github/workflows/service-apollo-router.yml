name: Apollo Router CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'apollo-router/**'
      - 'helm/charts/apollo-router/**'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apollo-router/**'
      - 'helm/charts/apollo-router/**'
  workflow_dispatch:

concurrency:
  group: apollo-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🛡️ Validate Apollo Router Supergraph & Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Router Configuration and Supergraph
        run: |
          docker run --rm -v "${{ github.workspace }}/apollo-router:/dist/config" \
            ghcr.io/apollographql/router:v2.16.3 \
            --config /dist/config/router.yaml \
            --supergraph /dist/config/supergraph.graphql \
            config validate

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Apollo Router Helm Chart
        run: |
          helm lint helm/charts/apollo-router
