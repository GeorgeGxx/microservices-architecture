name: Inventory Service CI/CD

on:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'inventory-service/**'
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Select the only supported Docker Hub release tag: 1.0.0 or 1.1.0'
        required: false
        type: choice
        default: '1.1.0'
        options: ['1.0.0', '1.1.0']
      publish-to-registry:
        description: 'Publish release image to Docker Registry (requires explicit SemVer image-tag)'
        required: false
        type: boolean
        default: false

concurrency:
  group: inventory-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: inventory-service
      service-type: spring-boot
      service-dir: inventory-service
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry == true && inputs.image-tag != '' }}
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit
