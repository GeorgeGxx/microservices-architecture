name: Inventory Service CI/CD

on:
  push:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'inventory-service/**'
      - 'pom.xml'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-inventory.yml'
  pull_request:
    branches: [develop] # Paused until AWS cloud deployment is enabled: staging, master
    paths:
      - 'inventory-service/**'
      - 'pom.xml'
      - '.github/workflows/_service-ci-cd-template.yml'
      - '.github/workflows/service-inventory.yml'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Explicit image tag to publish (leave empty for git sha or semver from tag)'
        required: false
        type: string
        default: ''
      publish-to-registry:
        description: 'Publish image to Docker Registry'
        required: false
        type: boolean
        default: true

concurrency:
  group: inventory-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: inventory-service
      service-type: spring-boot
      service-dir: inventory-service
      image-tag: ${{ inputs.image-tag || '' }}
      publish-to-registry: ${{ inputs.publish-to-registry != false }}
    secrets: inherit
