name: Inventory Service CI/CD

on:
  push:
    branches: [ master, main, staging, develop, 'release/*' ]
    paths:
      - 'inventory-service/**'
      - 'pom.xml'
  pull_request:
    branches: [ master, main, staging, develop ]
    paths:
      - 'inventory-service/**'
      - 'pom.xml'
  workflow_dispatch:

concurrency:
  group: inventory-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_service-ci-cd-template.yml
    with:
      service-name: inventory-service
      service-type: spring-boot
      service-dir: inventory-service
    secrets: inherit
